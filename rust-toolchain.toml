# Rust toolchain descriptor for the zlib Rust workspace.
#
# rustup finds this file by walking up from the current directory, so it must stay
# at the repository root beside Cargo.toml.  Every cargo, rustc, rustfmt and clippy
# invocation inside the tree then resolves to the toolchain selected below.
#
# The requirement for this port is "Rust 1.80+ stable, edition 2021".  That is
# a LOWER BOUND, and the C tree carried no Rust version contract of any kind
# before this port: nothing in it named a channel, a release or an MSRV, so
# there was no existing signal to honour.  Tracking the `stable` channel is
# therefore the faithful reading -- it always clears the floor while picking up
# compiler and library fixes for free.
#
# Note what `configure` now does and does not do.  It PROBES for cargo
# (`configure` L82-L107: `CARGO=${CARGO-"cargo"}`, then a `--version` test that
# empties CARGO when the tool is unusable) so that the `rust`, `rust-test` and
# `rust-clean` targets can skip cleanly on a machine with no Rust toolchain.  It
# deliberately does NOT check a version: which Rust release is required is stated
# once, here and in the `rust-version` fields of the crate manifests, and is
# enforced by cargo itself.  Keep it that way -- a second version check in a
# shell script is a second thing to keep in step.
#
# The MSRV is a different contract and is NOT declared here: `rust-version` in
# Cargo.toml's [workspace.package] declares the oldest compiler a consumer may
# need, clippy.toml mirrors it as `msrv`, and `rust-version` is not a valid key in
# a toolchain file.  The floor is exercised through an explicit override such as
# `cargo +1.80 check`, which this file does not obstruct.
#
# `profile = "minimal"` installs only rustc, cargo and the standard library.
# `components` is additive to it, and both entries are mandatory rather than
# convenient: `cargo fmt --check` and `cargo clippy -- -D warnings` are quality
# gates, and a toolchain missing either component cannot run them.
#
# `miri` and `rust-src` are deliberately absent.  Miri and `-Zsanitizer=address`
# are nightly-only and are selected per invocation (`cargo +nightly miri test -p
# zlib-rs`), which overrides this file.  Naming those components here would break
# every build in the tree, because they are not published for the stable channel.
#
# No `targets` list: the host target ships with the toolchain, and cross-compiled
# targets belong to the CI job that needs them.
#
# `minimal` installs only rustc, cargo, and the standard library -- no offline
# docs, no extra targets -- which keeps first-use downloads small in CI.
# `components` is ADDITIVE to the profile, so the two entries below do not
# conflict with it; together they are exactly equivalent to the provisioning
# command this project is built with:
#
#     rustup toolchain install stable --profile minimal \
#         --component rustfmt,clippy
#
# Both components are mandatory rather than convenient.  `cargo fmt --check`
# and `cargo clippy -- -D warnings` are quality gates for this workspace, and a
# toolchain missing either component fails those gates simply by being unable
# to run them.
#
# Miri and `-Zsanitizer=address` are nightly-only, and this port must be
# Miri-clean over the safe core (crates/zlib-rs) and sanitizer-clean over the
# C-ABI boundary layer (crates/libz-rs-sys).  Those jobs run as
# `cargo +nightly miri test -p zlib-rs` and friends: an explicit `+toolchain`
# argument on the command line OVERRIDES this file, and that override is
# precisely the mechanism they depend on.  Nothing added here may fight it.
#
# The extra components that work needs -- `miri` and `rust-src` -- are
# provisioned separately, against the nightly toolchain, and are deliberately
# absent from the list below.  Naming them here would be actively harmful
# rather than merely untidy: they are not published for the stable channel, so
# rustup would fail to provision this toolchain and every build in the tree
# would break.
#
# The host target is installed with the toolchain already.  Cross-compilation
# belongs in a CI matrix, where a job can add exactly the target it needs;
# hard-coding a target list here would force every developer to download
# standard libraries they never build against.
#
# THE SUPPORTED TARGET MATRIX IS THIS, and it is stated here because "Tier-1"
# on its own names a rustc platform tier rather than a commitment by this port:
#
#   VERIFIED        x86_64-unknown-linux-gnu.  The only target the port is
#                   built, tested and measured on today.  Every measured claim
#                   anywhere in this workspace -- struct sizes and offsets, the
#                   95-function / 111-global symbol surface, `zlibCompileFlags`
#                   returning 0xa9, the ELF soname and version-script handling --
#                   was established on it and on no other.
#
#   INTENDED        The remaining 64-bit ELF Tier-1 GNU/Linux targets
#                   (aarch64-unknown-linux-gnu) plus the Tier-1 macOS targets.
#                   The source is written to build there: the soname/version
#                   script logic in `crates/libz-rs-sys/build.rs` has an explicit
#                   Mach-O branch, and nothing in the core is x86-specific.  None
#                   of it is exercised yet, so treat any platform-specific number
#                   as unverified there until a CI job produces it.
#
#   OUT OF SCOPE    Windows (`*-pc-windows-msvc`, `*-pc-windows-gnu`) and every
#                   non-ELF, non-Mach-O target.  `build.rs` emits neither a
#                   soname nor a version script for PE/COFF; the PE analogue of
#                   `zlib.map` is `win32/zlib.def`, which this port does not wire
#                   up.  Windows-only ITEMS still exist in the source --
#                   `gzopen_w` behind `#[cfg(windows)]`, and the `_WIN32` entries
#                   in `cbindgen.toml`'s `[defines]` -- so that the port stays
#                   coherent if Windows is brought in scope later.  Their
#                   presence is forward compatibility, NOT a claim that a Windows
#                   build works or has been tried.
#
# Nothing in this file enforces the matrix; a `targets` list here could not, and
# rustup would happily install any triple on request.  Enforcement is a CI
# concern, and the matrix above is the contract a CI job should encode.
#
# This file takes effect only once cargo is invoked.  The C library keeps
# building with `./configure && make` or with CMake on a machine that has no
# Rust toolchain at all, which is what keeps the in-tree C sources usable as
# the differential oracle for the Rust implementation.

[toolchain]
channel = "stable"
profile = "minimal"
components = ["rustfmt", "clippy"]
