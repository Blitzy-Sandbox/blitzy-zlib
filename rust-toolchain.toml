# Rust toolchain descriptor for the zlib Rust workspace.
#
# rustup finds this file by walking up from the current directory, so it must stay
# at the repository root beside Cargo.toml.  Every cargo, rustc, rustfmt and clippy
# invocation inside the tree then resolves to the toolchain selected below.
#
# The requirement for this port is "Rust 1.80+ stable, edition 2021".  That is
# a LOWER BOUND, and the C tree carried no Rust version contract of any kind
# before this port: nothing in it named a channel, a release or an MSRV, so
# there was no existing signal to honour.  Tracking the `stable` channel is
# therefore the faithful reading -- it always clears the floor while picking up
# compiler and library fixes for free.
#
# Note what `configure` now does and does not do.  It PROBES for cargo
# (`configure` L82-L107: `CARGO=${CARGO-"cargo"}`, then a `--version` test that
# empties CARGO when the tool is unusable) so that the `rust`, `rust-test` and
# `rust-clean` targets can skip cleanly on a machine with no Rust toolchain.  It
# deliberately does NOT check a version: which Rust release is required is stated
# once, here and in the `rust-version` fields of the crate manifests, and is
# enforced by cargo itself.  Keep it that way -- a second version check in a
# shell script is a second thing to keep in step.
#
# The MSRV is a different contract and is NOT declared here: `rust-version` in
# Cargo.toml's [workspace.package] declares the oldest compiler a consumer may
# need -- and is the only declaration of it, since clippy.toml deliberately
# carries no `msrv` key and reads that one instead -- while `rust-version` is not
# a valid key in a toolchain file.  The floor is exercised through an explicit
# override such as `cargo +1.80 check`, which this file does not obstruct.
#
# `profile = "minimal"` installs only rustc, cargo and the standard library.
# `components` is additive to it, and both entries are mandatory rather than
# convenient: `cargo fmt --check` and `cargo clippy -- -D warnings` are quality
# gates, and a toolchain missing either component cannot run them.
#
# `miri` and `rust-src` are deliberately absent.  Miri and `-Zsanitizer=address`
# are nightly-only and are selected per invocation (`cargo +nightly miri test -p
# zlib-rs`), which overrides this file.  Naming those components here would break
# every build in the tree, because they are not published for the stable channel.
#
# No `targets` list: the host target ships with the toolchain, and cross-compiled
# targets belong to the CI job that needs them.
#
# `minimal` installs only rustc, cargo, and the standard library -- no offline
# docs, no extra targets -- which keeps first-use downloads small in CI.
# `components` is ADDITIVE to the profile, so the two entries below do not
# conflict with it; together they are exactly equivalent to the provisioning
# command this project is built with:
#
#     rustup toolchain install stable --profile minimal \
#         --component rustfmt,clippy
#
# Both components are mandatory rather than convenient.  `cargo fmt --check`
# and `cargo clippy -- -D warnings` are quality gates for this workspace, and a
# toolchain missing either component fails those gates simply by being unable
# to run them.
#
# Miri and `-Zsanitizer=address` are nightly-only, and this port must be
# Miri-clean over the safe core (crates/zlib-rs) and sanitizer-clean over the
# C-ABI boundary layer (crates/libz-rs-sys).  Those jobs run as
# `cargo +nightly miri test -p zlib-rs` and friends: an explicit `+toolchain`
# argument on the command line OVERRIDES this file, and that override is
# precisely the mechanism they depend on.  Nothing added here may fight it.
#
# The extra components that work needs -- `miri` and `rust-src` -- are
# provisioned separately, against the nightly toolchain, and are deliberately
# absent from the list below.  Naming them here would be actively harmful
# rather than merely untidy: they are not published for the stable channel, so
# rustup would fail to provision this toolchain and every build in the tree
# would break.
#
# The host target is installed with the toolchain already.  Cross-compilation
# belongs in a CI matrix, where a job can add exactly the target it needs;
# hard-coding a target list here would force every developer to download
# standard libraries they never build against.
#
# THE SUPPORTED TARGET MATRIX IS THIS, and it is stated here because "Tier-1"
# on its own names a rustc platform tier rather than a commitment by this port:
#
#   FULLY VERIFIED  x86_64-unknown-linux-gnu.  The only target the port is
#                   built, tested, packaged, MEASURED and benchmarked on, and the
#                   only one where every gate runs.  EIGHTEEN of the TWENTY-TWO
#                   jobs in `.github/workflows/rust.yml` run `ubuntu-latest` and
#                   nothing else; the four that do not are `build-test`, whose
#                   matrix adds a macOS and a Windows row, `platform-abi-macos`
#                   and `platform-abi-windows`, which are those two platforms'
#                   packaged-artifact gates, and `bench`, which runs on
#                   `ubuntu-latest` unless the `ZLIB_RS_BENCH_RUNNER` repository
#                   variable redirects it to a machine that already carries the
#                   Silesia corpus.  The eighteen
#                   are the ones that
#                   establish the measured claims made across this workspace:
#                   struct sizes and offsets, the 95-function / 111-global symbol
#                   surface, `zlibCompileFlags` returning 0xa9, the ELF soname and
#                   version-script handling, the cbindgen header comparison, the
#                   drop-in relink, Miri, ASan, the differential sweeps and the
#                   benchmarks.
#
#   BUILT, TESTED   macOS and Windows, on the host triple each GitHub runner image
#   AND ABI-GATED   provides -- `rustup toolchain install stable` fetches the host
#                   target and no other, so no cross-compilation is involved.  The
#                   `build-test` job's matrix carries a `macos-latest` and a
#                   `windows-latest` row beside the Ubuntu one, and all three run
#                   the same three commands: `cargo build --locked --release`, the
#                   same with `--features libz-compat`, and `cargo test --locked
#                   --workspace --release`.  That is the whole of what those ROWS
#                   establish -- with one addition on macOS:
#                   `.github/workflows/cmake.yml`'s `macOS Clang Rust' row
#                   configures `-DZLIB_BUILD_RUST=ON -DZLIB_BUILD_SHARED=OFF' on
#                   `macos-latest' and runs the CTest suite, so the CMake STATIC
#                   Rust path -- cargo producing `libz.a', the derived install name,
#                   the exported static target -- is executed off ELF.  CMake's
#                   SHARED half is not: CMakeLists refuses that configuration on
#                   Apple rather than attempting it, because its relink needs
#                   -soname and --version-script.
#
#                   The packaged ABI on each of those two formats is gated by its
#                   own job, and this entry used to say it was not gated at all:
#                   `platform-abi-macos` measures the `-install_name` build.rs
#                   emits, stages the dylib from the complete archive with an
#                   exported-symbols list DERIVED from zlib.h, compares the export
#                   table against the contract, and relinks and runs the three
#                   unmodified C drivers with an `otool -L` proof that no system
#                   zlib is bound.  `platform-abi-windows` reads the PE export
#                   table, requires `gzopen_w` (which no Linux job can see), and
#                   has MSVC compile a C consumer plus the unmodified
#                   test/minigzip.c against cargo's import library and run them --
#                   which also exercises the `gzgetc` MACRO, whose field
#                   arithmetic a second compiler expands against a library rustc
#                   built.
#
#                   STILL UNVERIFIED off Linux: the header comparison, the
#                   sanitizers, Miri, the differential sweeps and the benchmarks.
#                   Treat any performance number as unverified off Linux.
#
#   NOT INSTALLED   Windows specifically, and only the INSTALL half.  A consumer
#                   can link cargo's `z.dll.lib` and load `z.dll` without
#                   recompiling, and `platform-abi-windows` proves exactly that
#                   with an MSVC C consumer.  What is not wired is the packaged,
#                   versioned, export-controlled install: `build.rs` emits neither
#                   a soname nor a version script for PE/COFF, because the PE
#                   analogue of `zlib.map` is `win32/zlib.def`, which AAP 0.2.2.3
#                   places out of scope.  The visible consequence is that `z.dll`
#                   does not export `gzprintf` or `gzvprintf` -- both live in the C
#                   shim, and a rustc-linked cdylib cannot re-export a
#                   native-archive symbol -- so a Windows consumer that CALLS
#                   either of those two functions cannot link against `z.dll` and
#                   has to keep using a C zlib.  State it that way round: the
#                   Windows ABI is a documented SUBSET of the contract, not a
#                   complete drop-in.
#
#                   `.github/scripts/platform_abi_gate.py` now says so mechanically
#                   rather than tolerantly.  It distinguishes an absence that is a
#                   property of the PLATFORM -- `gzopen_w` on Linux and macOS,
#                   which `zlib.h` declares only under `_WIN32`, so no consumer
#                   there can reference it and the library is complete -- from one
#                   that is a property of this port's PACKAGING, which is what
#                   these two are.  It then classifies the artifact `complete' or
#                   `subset', prints the consumer consequence, and requires the
#                   caller to declare which it expects: `platform-abi-windows`
#                   passes `--expect-abi subset` and `platform-abi-macos` passes
#                   `--expect-abi complete`, since that job stages its dylib with
#                   `-force_load` and therefore does export the shim's two.  A
#                   mismatch fails in BOTH directions, so closing the PE gap fails
#                   the job until this paragraph is rewritten.  The Mach-O branch of that build script IS now
#                   exercised, by `platform-abi-macos`, which stages that format's
#                   shared library outside Make and CMake -- both of which refuse
#                   it, since their packaging rules are ELF-only.
#
#   COMPILED, NOT   i686-unknown-linux-gnu (ILP32) and x86_64-pc-windows-gnu
#   RUN             (LLP64).  The `integer-models` job cross-compiles
#                   `-p zlib-rs -p libz-rs-sys --all-targets` for both from
#                   ubuntu-latest, with gcc-multilib and mingw-w64 respectively.
#                   It runs nothing.  What it establishes is the one thing that
#                   cannot be established on LP64 alone: that the layout
#                   assertions and every `c_ulong`/`z_size_t`/`z_off_t` use still
#                   hold where `unsigned long` is 4 bytes, which is exactly the
#                   hazard AAP 0.6.3.3 records.  A compile failure there is a real
#                   ABI defect; a pass is not a claim that anything was executed.
#
#   NOT BUILT       Every other triple, including aarch64-unknown-linux-gnu.  The
#                   source is written to be portable and nothing in the core is
#                   x86-specific, but no job compiles them, so nothing about them
#                   is established.
#
# Nothing in this file enforces the matrix; a `targets` list here could not, and
# rustup would happily install any triple on request.  Enforcement is a CI
# concern, and `.github/workflows/rust.yml` is where the matrix above is encoded --
# the `build-test` job's three rows for the first two categories, and the absence of
# any row for the last.
#
# This file takes effect only once cargo is invoked.  The C library keeps
# building with `./configure && make` or with CMake on a machine that has no
# Rust toolchain at all, which is what keeps the in-tree C sources usable as
# the differential oracle for the Rust implementation.

[toolchain]
channel = "stable"
profile = "minimal"
components = ["rustfmt", "clippy"]
