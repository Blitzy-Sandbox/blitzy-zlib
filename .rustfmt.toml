# Formatting policy for the Rust workspace, stated explicitly so that it is
# machine-enforced and version-controlled rather than conventional.  The four
# settings .cmake-format.yaml states outright for the C tree (line width, tab size,
# tab characters, line ending) have counterparts here; rustfmt's remaining defaults
# are already the community standard and are left alone.
#
# Applied by `cargo fmt`, and made a gate by the `format` job of
# .github/workflows/rust.yml, which runs `cargo fmt --all -- --check`.  That
# command selects the root workspace's members, so the gate covers the three
# crates and `benches/`; `fuzz/` declares its own [workspace] and is listed under
# `exclude`, so the gate does not reach it, though this file still GOVERNS it --
# rustfmt searches upward for its configuration and `fuzz/` carries none of its
# own, so `cargo fmt` run inside that directory formats to exactly the settings
# below. ONLY STABLE OPTIONS MAY BE
# ADDED -- rust-toolchain.toml pins channel = "stable", so a nightly-gated key (wrap_comments,
# imports_granularity, group_imports, unstable_features, ...) makes rustfmt warn "unstable
# features are only available in nightly channel" on every run and fail the zero-warnings gate;
# check `rustfmt --help=config` first. `ignore` is absent too, so no .rs file drifts out of the
# gate: the tables generated from crc32.h, trees.h and inffixed.h are reflowed like any other
# array literal, and a module needing bespoke layout uses #[rustfmt::skip] in its own source.

edition = "2021"                # must equal [workspace.package].edition in Cargo.toml
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"          # the repository is pure LF; "Auto" would follow the input
use_field_init_shorthand = true
use_try_shorthand = true
