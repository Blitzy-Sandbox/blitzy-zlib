# `zlib-rs-differential` -- the DEV-ONLY differential oracle harness, and workspace
# member 3 of 3.
#
# WHAT THIS CRATE IS FOR
# Its `build.rs` compiles the fifteen in-tree C translation units (the authoritative
# set is `Makefile.in`'s `OBJZ` + `OBJG` object lists: adler32, crc32, deflate,
# infback, inffast, inflate, inftrees, trees, zutil, compress, uncompr, gzclose,
# gzlib, gzread, gzwrite) into a test-only static archive. `src/oracle.rs` declares
# those symbols under a `c_` prefix so a single process can run the Rust port and the
# C reference implementation side by side and compare their output bytes, and
# `src/port.rs` puts the facade's own `unsafe extern "C"` surface behind gates of the
# same shape so a comparison reads as one safe call against another.
#
# The comparison itself lives in `tests/`: `byte_identical.rs` compares emitted bytes
# across the configuration matrix, `roundtrip_interop.rs` crosses streams in both
# directions, and `table_equality.rs` compares the ported constant tables against the
# C arrays element for element. So "compressed output is byte-identical to the
# reference" is a measured result here rather than an unmeasured requirement, with the
# one qualification that decides what a green run means: the DEFAULT run covers a
# sampled matrix in seconds, and the exhaustive sweeps are `#[ignore]`d and armed by
# `ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE` and `ZLIB_RS_INTEROP_EXHAUSTIVE`, which
# `.github/workflows/rust.yml` sets in steps of its own. Read a bare `cargo test`
# as the sample, and those steps as the sweep.
#
# THE ONE-WAY DEPENDENCY EDGE IS THE WHOLE POINT
# This crate depends on the two shipped crates; NEITHER shipped crate may ever
# depend on it. `crates/zlib-rs` has an empty `[dependencies]` table and
# `crates/libz-rs-sys` depends on nothing but `zlib-rs`, so
# `cargo build --release` for `libz.so`/`libz.a` never compiles a line of the reference
# implementation and never links the oracle. (It does compile two C translation units of
# its own, in `crates/libz-rs-sys/csrc/`, for three declarations stable Rust cannot
# express; those are not the reference sources and take no crate dependency.) That is the
# mechanical proof that the reference implementation is an ORACLE and not a build
# dependency. Verify with:
#
#     cargo tree -p zlib-rs     -e normal   # must not mention cc or this crate
#     cargo tree -p libz-rs-sys -e normal   # must not mention cc or this crate
#
# VERIFICATION POSTURE -- DO NOT "FIX" THE MIRI EXCLUSION
# This crate sits outside BOTH sanitizer gates, and the two exclusions have different
# causes. Miri cannot execute the compiled C oracle at all -- it interprets Rust MIR --
# so the Miri job is scoped to the safe core (`cargo +nightly miri test -p zlib-rs`)
# and widening it to `--workspace` would fail for a reason that has nothing to do with
# undefined behaviour. The nightly AddressSanitizer job is scoped to
# `cargo +nightly test -p libz-rs-sys` plus the three relinked C drivers, which is the
# split AAP 0.6.4.5 specifies; it does not select this crate, so neither this crate's
# tests nor the three benches attached to it run under a sanitizer. What this crate's
# `unsafe` gets instead is review, the `// SAFETY:` comment on every block, and the
# fact that a mistake here fails a differential comparison loudly rather than silently.
# Neither posture is expressible as a manifest key; both are CI job scopes, recorded
# here so that the exclusions read as intentional rather than as oversights to be
# "corrected" -- and stated accurately, so that nobody cites a sanitizer this crate is
# not run under.
#
# UNSAFE (AAP 0.7.1(a))
# No key below enables or excuses `unsafe`. All `unsafe` in this crate lives in
# `src/oracle.rs`'s `extern "C"` declarations and their call sites, each carrying its
# own `// SAFETY:` comment. Do NOT add `[lints.rust] unsafe_code = "forbid"` here --
# it would make `src/oracle.rs` uncompilable. `#![forbid(unsafe_code)]` is a
# crate-root attribute of `crates/zlib-rs` alone, and the facade's counterpart
# `#![deny(unsafe_op_in_unsafe_fn)]` is a crate-root attribute of
# `crates/libz-rs-sys`.
#
# BENCHMARK HOSTING
# The repository-root `Cargo.toml` is a virtual manifest and therefore cannot own
# bench targets, so the three suites in `benches/` attach HERE, through the three
# `[[bench]]` entries near the bottom of this file -- `checksum_bench`,
# `inflate_bench` and `deflate_bench`, each with an explicit `path` up to
# `../../benches/` and `harness = false`. This crate is the correct host because
# all three measure the port against the C oracle that it builds.
#
# A bench entry naming a file that is absent makes every Cargo invocation that
# enumerates targets (`--all-targets`, `cargo fmt --all`) fail while resolving it,
# which is why the entries and the files belong in one change; they are in one
# change, so nothing here is withheld any more.
#
# `tests/` holds `byte_identical.rs`, `roundtrip_interop.rs` and
# `table_equality.rs`, and they run: `cargo test -p zlib-rs-differential` compares
# the two implementations through the oracle archive that `build.rs` produces. So
# the claims below are observations of what these suites do, not a contract they
# were still to be written against. Both are worth stating plainly, because a
# reader who cannot tell an intention from a result cannot tell what this crate
# has actually established.

[package]
name = "zlib-rs-differential"
# Shared metadata is inherited from the root `[workspace.package]` so that it exists
# in exactly one place. Only the four keys the root contractually supplies are
# inherited: a `field.workspace = true` reference to a key the root does not declare
# is a hard manifest error that would break the entire workspace, and `publish =
# false` makes `repository`/`homepage` optional metadata here. `description` is
# deliberately crate-local because a dev-only harness needs its own, not the
# library's.
version.workspace = true
edition.workspace = true      # 2021 -- see rust-version

# NOT `rust-version.workspace = true`, and the departure from the other two
# members is deliberate rather than an oversight.  The benchmark suites at
# `benches/` are attached to THIS package by the `[[bench]]` entries at the foot
# of this file, so criterion is in this package's dev graph -- and criterion 0.8.2
# declares `rust-version = "1.86"` and reaches clap 4.6.5, whose
# clap_builder/clap_lex declare `edition = "2024"`, which cargo 1.80.1 cannot
# parse at all.  A package cannot claim a 1.80 floor and then require a dev graph
# 1.80 cannot resolve, so the floor stated here is criterion's own.  Edition stays
# 2021: edition 2024 requires rustc >= 1.85, which 1.86 satisfies, but the
# workspace is uniformly 2021 and there is no reason for one member to diverge.
#
# This is shape 1 of the two the root `[workspace.dependencies]` criterion note
# names as correct.  Shape 2 -- a package in the root `exclude` list with its own
# lock, as `fuzz/` has -- is equally correct and remains available; shape 1 is used
# because this is the one crate that builds the C oracle every suite measures
# against, and a separate package would have to duplicate that build.
#
# THE SHIPPED CRATES ARE UNAFFECTED and the MSRV gate still holds, because it
# names them explicitly rather than the workspace:
#   cargo +1.80 check --locked -p zlib-rs -p libz-rs-sys --all-features --all-targets
#   cargo +1.80 rustc --locked -p libz-rs-sys --all-features -- -D warnings
# criterion reaches neither of them -- `cargo tree -p zlib-rs -e normal` and
# `cargo tree -p libz-rs-sys -e normal` show it -- because it is a dev-dependency
# of a crate neither of them depends on.  What this line does NOT rescue is
# `cargo +1.80 metadata --locked` or `cargo +1.80 check --locked --workspace
# --all-targets`: both resolve the entire workspace dev graph and therefore still
# fail on clap's edition-2024 manifests.  That is a property of criterion, and
# `rust-version` is a declaration rather than a resolver directive, so no manifest
# key can change it.  Do not "fix" it by removing the criterion edge -- that would
# delete the throughput gates of AAP §0.6.4.6.
rust-version = "1.86"        # criterion 0.8.2's own floor -- see the note above.
license.workspace = true      # Zlib -- the SPDX id for the in-tree LICENSE, and an
                              # allowed identifier in deny.toml.
description = "Dev-only differential harness comparing the Rust zlib implementation against the in-tree C oracle"
# Never publishable: this crate's build script compiles C, and its entire reason to
# exist is local verification. `publish = false` also stops anyone from shipping it
# by accident.
publish = false
# `build.rs` is picked up by Cargo's automatic detection, which is the standard and
# preferred form; no explicit `build = "build.rs"` key is required. The script renames
# every externally visible symbol of the oracle to `c_<name>` -- with 95
# `-D<name>=c_<name>` macros where the preprocessor can reach the name and with an
# `objcopy --redefine-syms` pass over the objects for the 19 it cannot, `gzgetc` chief
# among them -- so the oracle cannot collide with the Rust facade's unprefixed
# `#[no_mangle]` exports when both are linked into one test binary. It deliberately does
# NOT use `-DZ_PREFIX`: the prefix this harness is specified to expose is `c_`, not
# `z_`, and `zconf.h` states that standard zlib is built *without* `Z_PREFIX`, which
# would put the oracle at odds with the requirement that it be the default
# configuration. See the `build.rs` crate docs for the full derivation of both counts.

[features]
# `gz` only: the differential matrix and the benchmarks must otherwise exercise the same
# configuration the shipped artifacts are built with, and `gz` IS part of that configuration --
# `libz-rs-sys` has it on by default, so a default build of this crate that left it off would be
# comparing against a facade nobody ships.
default = ["gz"]

# `simd` forwards to the checksum vectorization of both crates under test. It is
# default-OFF and OUTPUT-NEUTRAL: AAP 0.8.2 ambiguity 9 confines SIMD to CRC-32 and
# Adler-32 precisely because a checksum yields one scalar regardless of computation
# order, so vectorizing it cannot perturb the bitstream. Re-running the differential
# matrices with `--features simd` is how that neutrality is verified rather than
# assumed, and both have been run: `tests/byte_identical.rs`'s exhaustive shards --
# ten `#[ignore]`d tests whose products are the whole 9,922,500-cell matrix, sliced
# by `ZLIB_RS_DIFFERENTIAL_SHARD` and accounted for cell by cell -- and
# `tests/roundtrip_interop.rs`'s exhaustive product (16,380 crossings, 3.6 s) are
# both green with the feature on, and the latter compares the check value on every
# crossing as well as the bytes. `.github/workflows/rust.yml` runs both the scalar
# and the `simd` form of each, which is what keeps the neutrality claim current
# rather than a one-off observation. Two reasons the switch is declared here and not
# only on the dependencies:
#   1. `benches/checksum_bench.rs` compares the scalar and SIMD
#      backends (AAP 0.4.1.5). The two-run procedure is:
#          cargo bench -p zlib-rs-differential -- --save-baseline scalar
#          cargo bench -p zlib-rs-differential --features simd -- --baseline scalar
#      CI additionally runs `cargo test -p zlib-rs-differential --release --features
#      simd`, so the neutrality claim is re-established on every push rather than only
#      when somebody remembers to pass the flag.
#   2. Since Rust 1.80 the `unexpected_cfgs` lint validates `cfg!(feature = "...")`
#      against the manifest of the crate being compiled. Test and bench targets are
#      compiled as part of THIS package, so `cfg!(feature = "simd")` inside them
#      would warn -- and therefore fail under `cargo clippy --all-targets -- -D
#      warnings` -- unless the feature is declared here.
# The reference is `libz_rs_sys/simd`, not `libz-rs-sys/simd`: feature paths name the
# dependency by its key in this manifest, which is the rename introduced below.
simd = ["zlib-rs/simd", "libz_rs_sys/simd"]

# The `gzFile` half of the harness, and of this crate's own oracle table.
#
# ON BY DEFAULT via `default` above, because `libz-rs-sys` itself has `gz` on by default and the
# interoperability suite crosses the two implementations through a real file. It is a feature rather
# than unconditional for one reason: `--no-default-features` is a supported configuration of the
# facade, and a suite that could not be built without the gz layer would make that configuration
# untestable from here.
#
# The reference always provides these symbols -- `gzlib.c`, `gzread.c`, `gzwrite.c` and `gzclose.c`
# are four of the fifteen translation units `build.rs` compiles -- so this flag gates only what the
# Rust side compiles against.
gz = ["libz_rs_sys/gz"]

# Two path edges and nothing else. No THIRD-PARTY dependency appears here, which is
# the property that keeps this crate's non-test build trivial and keeps every
# third-party crate the harness needs -- criterion above all -- out of any graph a
# shipped artifact is resolved from.
# Third-party pins live in the root `[workspace.dependencies]` so that each version
# is stated in exactly one place; `{ workspace = true }` inherits them. Should a root
# entry ever be removed, fall back to the exact pin -- `zlib-rs = { path =
# "../zlib-rs" }`, `cc = "1.4.0"` and `criterion = "0.8.2"` -- and never to a
# wildcard: `deny.toml` sets `[bans] wildcards = "deny"`.
#
# ★ WHY THESE TWO ARE NOT DEV-DEPENDENCIES.  They were, until `src/port.rs` arrived.
# A dev-dependency is resolved for test, example and bench targets but NOT for the
# crate's own `lib` target, and `src/port.rs` is part of the lib: it is the port half
# of this crate's FFI boundary, where every `unsafe` call into the facade's
# `unsafe extern "C"` surface is confined so that `tests/`, `benches/` and the five
# `fuzz_targets/` can each carry `#![forbid(unsafe_code)]`.  Moving the two edges
# here is what makes the facade nameable from `src/`.  The edge DIRECTION is
# unchanged and is the thing that matters: this dev-only harness depends on the two
# shipped crates, neither ever depends on it, and this crate is not a
# `default-member`, so `cargo build` still does not reach it.  `criterion` stays a
# dev-dependency, because only the bench targets use it and it is what pins this
# crate's `rust-version` to 1.86.
[dependencies]
# The safe core, for tests and benchmarks that drive the typed Rust surface directly:
# `rust-api` exposes the typed configuration surface used to enumerate the
# differential matrix (level x windowBits x memLevel x strategy x flush), and `std`
# is the feature the gz file-I/O paths are gated on. NOTE: the core has NO `gz`
# feature -- its features are exactly `default`, `rust-api`, `simd`, `std` -- so
# `zlib-rs/gz` would fail to resolve.
zlib-rs = { workspace = true, features = ["rust-api", "std"] }

# The C ABI facade: the artifact whose byte-identity actually matters. Its `rlib`
# crate type exists precisely so this crate can import it, because both
# implementations have to live in ONE process for a buffer-to-buffer comparison.
#
# IMPORT NAME -- DECIDED HERE, ADOPT IT EVERYWHERE. `crates/libz-rs-sys` sets
# `[lib] name = "z"` so Cargo emits `libz.so`/`libz.a`; with a plain dependency key
# Cargo would pass `--extern z=...` and the Rust path would be `z`. The
# dependency-rename form below makes Cargo pass `--extern libz_rs_sys=...`, so every
# module, test and attached bench in this crate writes `use libz_rs_sys::...`.
# `libz-rs-sys` is a workspace member and is not listed in the root
# `[workspace.dependencies]`, hence the path form rather than `workspace = true`.
#
# The committed `Cargo.lock` must carry this edge. Measured with `cargo
# generate-lockfile`: adding it changes the lock by exactly one line -- an extra
# `"libz-rs-sys"` entry under this package -- because `libz-rs-sys` is already a
# workspace member that already depends on `zlib-rs`. No external package is added.
#
# `version` is REQUIRED here, not decorative. A path dependency with no version
# requirement surfaces in the dependency graph as `*`, and `deny.toml` sets
# `[bans] wildcards = "deny"`. Carrying the version on this edge -- exactly as
# the root `[workspace.dependencies] zlib-rs` entry and `libz-rs-sys`'s own
# `zlib-rs` entry already do -- is what lets that gate stay unconditional
# instead of being weakened by a blanket `allow-wildcard-paths` exemption that
# would also excuse every future version-less path edge. `1.3.2` is the
# three-component semver derivation of the CMake `PROJECT_VERSION 1.3.2.1` and
# matches `[workspace.package] version`; the `path` key still wins for
# resolution, so nothing is ever fetched from crates.io.
#
# No feature is requested beyond the facade's default set: the safe boundary this crate's tests,
# benches and the fuzz targets drive both implementations through is `src/port.rs` and `src/oracle.rs`
# HERE, not in the facade, so that a shipped `libz.so` contains none of that plumbing and the
# facade's own `unsafe` surface stays at the six unavoidable C-ABI site categories and no wider.
libz_rs_sys = { package = "libz-rs-sys", path = "../libz-rs-sys", version = "1.3.2" }

# Third-party pins live in the root `[workspace.dependencies]` so that each version
# is stated in exactly one place; `{ workspace = true }` inherits them. Should a root
# entry ever be removed, fall back to the exact pin -- `zlib-rs = { path =
# "../zlib-rs" }`, `cc = "1.4.0"` and `criterion = "0.8.2"` -- and never to a
# wildcard: `deny.toml` sets `[bans] wildcards = "deny"`.
[dev-dependencies]

# The benchmark harness, for the suites the `[[bench]]` entries at the foot of this
# file attach. It is THE dependency decision in this workspace that the declared
# MSRV turns on, which is why the `rust-version` line above is an explicit `1.86`
# rather than an inheritance -- read that note before touching either.
#
# Licensed "Apache-2.0 OR MIT", which deny.toml allows. The version is pinned once,
# in the root `[workspace.dependencies]`, and inherited here; the note beside that
# entry carries the full MSRV derivation. Default features are taken as published
# (`rayon`, `plotters`, `cargo_bench_support`); `cargo_bench_support` in particular
# is what lets `cargo bench` drive the harness at all, so do not switch to
# `default-features = false` without restoring it.
#
# ★ USE `std::hint::black_box`, NEVER `criterion::black_box`. criterion 0.8.2 marks
# its own re-export `#[deprecated(note = "use std::hint::black_box() instead")]`
# (vendored `criterion-0.8.2/src/lib.rs` L164), and a deprecation warning fails
# `cargo clippy --all-targets -- -D warnings`. `std::hint::black_box` has been
# stable since 1.66, so it is available on every toolchain this workspace supports.
#
# ★ A `harness = false` bench compiles WITHOUT `--test`. So `cfg(test)` is false in
# a bench target and its functions are not `#[test]`, which means clippy.toml's
# `allow-unwrap-in-tests` / `allow-expect-in-tests` / `allow-panic-in-tests` do NOT
# apply there: the workspace's denied panic family is fully in force. A bench
# handles a missing fixture or a mismatched value by logging to stderr and skipping,
# never by unwrapping.
criterion = { workspace = true }

# CLIPPY IS DELIBERATELY NOT PART OF THE MSRV GATE, and this is measured rather than
# assumed: `cargo +1.80 clippy -p zlib-rs -p libz-rs-sys --all-features
# --all-targets` reports 28 denials that current clippy does not, all of them
# version drift in lints rather than anything about the code --
# `clippy::assertions_on_constants` on the `assert!(A == B)` constant-parity checks
# (23 of them), `clippy::const_is_empty` on `assert!(corpus::EMPTY.is_empty())`, and
# `clippy::module_name_repetitions` (4). The same code is clean under clippy 1.97:
# `cargo clippy --locked -p zlib-rs -p libz-rs-sys --all-features --all-targets --
# -D warnings` exits 0. Silencing a lint that only an old linter emits would put
# `#[allow]` attributes in the source for the benefit of a tool nobody runs, so the
# lint gate stays on current stable and the MSRV gate stays on the compiler.

[build-dependencies]
# The ONLY build dependency: `cc` compiles the in-tree C sources into the test-only
# oracle archive. Pinned to 1.4.0 in the root `[workspace.dependencies]`; licensed
# "MIT OR Apache-2.0", which deny.toml allows.
cc = { workspace = true }

# ---------------------------------------------------------------------------------
# Benchmark suites (AAP 0.3.1, 0.4.1.5) -- DECLARED ONLY ALONGSIDE THE FILES
#
# The suites live at the REPOSITORY ROOT in `benches/`, outside any crate, and are
# attached here by explicit path. All three AAP 0.3.1 names are declared below:
# `checksum_bench.rs`, `inflate_bench.rs` and `deflate_bench.rs`. An entry is added in
# the SAME change as the file it names and never ahead of it -- a `[[bench]]` entry
# whose `path` is absent is a hard resolution error for `--all-targets` and for
# `cargo fmt --all` -- and the same rule governs a fourth, should one ever be added.
#
# Paths are relative to THIS manifest's directory: `crates/zlib-rs-differential`
# -> `..` -> `../..` is the repository root. `harness = false` is mandatory --
# criterion supplies its own `main` through `criterion_main!`, so libtest's harness
# must not also be linked.
#
# Do NOT create, move, or delete `benches/*.rs`: those files are owned elsewhere and
# are only attached from here. Cargo's `bench` profile inherits the root
# `[profile.release]`, so the suites are measured against fat-LTO, single-codegen-unit,
# opt-level-3 code (`panic = "abort"` is ignored for bench targets, which is
# expected and harmless).
#
# A NOTE ON `CARGO_MANIFEST_DIR`, because it surprises people: for a bench target
# it expands to the HOST PACKAGE's directory -- this one -- and not to the directory
# the source file sits in. So a suite reads the committed corpus from
# `<CARGO_MANIFEST_DIR>/corpus/minimal` and reaches the repository root as
# `<CARGO_MANIFEST_DIR>/../..`, regardless of living under `benches/`.
# ---------------------------------------------------------------------------------

# Adler-32 and CRC-32 throughput: the port against the in-process C oracle, and the
# scalar backends against the `simd` ones (AAP 0.4.1.5, source `crc32.c`). The
# scalar-versus-SIMD comparison runs in ONE binary because `crates/zlib-rs` exposes
# `Adler32Generic` / `crc32::Generic` / `crc32::Braid` unconditionally and
# `Adler32Simd` / `crc32::Simd` under the `simd` feature, all through the
# `Adler32Backend` / `Crc32Backend` traits; the `simd` feature of THIS package
# forwards to both dependencies, so:
#
#     cargo bench -p zlib-rs-differential --bench checksum_bench
#     cargo bench -p zlib-rs-differential --bench checksum_bench --features simd
#
# and the two-run form, for comparing whole configurations rather than backends.
# `--baseline-lenient` rather than `--baseline`, because the feature ADDS the vectorized
# rows: `--baseline` treats a row with no counterpart in the saved baseline as a hard
# error, while `--baseline-lenient` compares the rows that do have one and reports the
# rest as new.
#
#     cargo bench -p zlib-rs-differential --bench checksum_bench -- --save-baseline scalar
#     cargo bench -p zlib-rs-differential --bench checksum_bench --features simd -- --baseline-lenient scalar
[[bench]]
name = "checksum_bench"
path = "../../benches/checksum_bench.rs"
harness = false

# Decompression throughput: the port against the in-process C oracle, enforcing the AAP 0.8.4
# gate of "decompression throughput within 10% of C zlib" (AAP 0.4.1.5, source
# `contrib/testzlib/testzlib.c` by way of `inflate.c` and `uncompr.c`). Six groups:
# `inflate_steady_state` -- the group the gate is read from, since `inflateReset2` keeps the
# window allocation and so times the decode rather than the allocator -- plus
# `inflate_lifecycle` (init and end inside the timed region), `inflate_container` (zlib, raw and
# gzip), `inflate_feeding` (single-shot against chunked at 32768/1024/16), `uncompress_oneshot`
# and the opt-in `inflate_silesia`.
#
# The suite writes one greppable `inflate_bench: RATIO ...` line per case and one
# `RATIO-SUMMARY` line per group to STDERR -- stdout belongs to criterion's machine-readable
# output -- and reports rather than enforces: the pass/fail decision belongs to the criterion
# regression job of AAP 0.4.1.6. It reads the committed tier-1 corpus and, when
# `ZLIB_RS_SILESIA_DIR` or `<repo-root>/target/silesia` holds one, the opt-in tier-2 corpus; it
# never fetches either, and `corpus/fetch_silesia.sh` stays referenced by no manifest, build
# script, test or workflow.
#
#     cargo bench -p zlib-rs-differential --bench inflate_bench
#     cargo bench -p zlib-rs-differential --bench inflate_bench -- --test   # one iteration each
#
# `--features simd` is meaningful here and not only for the checksum suite: `inflate` verifies an
# Adler-32 or a CRC-32 over everything it produces, so the checksum backend sits on the decoder's
# hot path -- while remaining unable to change a single emitted byte.
[[bench]]
name = "inflate_bench"
path = "../../benches/inflate_bench.rs"
harness = false

# Compression throughput AND per-stream memory: the port against the in-process C oracle, enforcing
# BOTH AAP 0.8.4 gates -- "compression throughput within 10% of C zlib" at levels 1, 6 and 9, and
# "per-stream memory within 15% of C zlib" (AAP 0.4.1.5, source `contrib/testzlib/testzlib.c` by way
# of `deflate.c`, `trees.c` and `compress.c`; the allocator technique from `test/infcover.c`
# L56-L200). Twelve group functions:
#
#   * `deflate_steady_state` -- the group the THROUGHPUT gate is read from, since `deflateReset` keeps
#     the window, `prev`, `head` and pending allocations and so times the encode rather than the
#     allocator. Levels 1/6/9 are not a sample: `deflate.c`'s `configuration_table[10]` (L112-L124)
#     puts level 1 on `deflate_fast` with `max_chain` 4 and levels 6 and 9 on `deflate_slow` with
#     `max_chain` 128 and 4096, so the three span both algorithm families and the chain extremes.
#   * `deflate_memory` -- the group the MEMORY gate is read from. It registers NO criterion row on
#     purpose: it installs an instrumented `zalloc`/`zfree` pair that mirrors `test/infcover.c`'s
#     `mem_zone`, including the `0xa5` fill at L87, and runs its nine level x memLevel encodes
#     entirely OUTSIDE any timed region, because the counter's bookkeeping would otherwise contaminate
#     a rate.
#   * `deflate_lifecycle` (init and end inside the timed region), `deflate_container` (zlib, raw and
#     gzip), `deflate_feeding` (single-shot against chunked at 32768/1024/16), `compress_oneshot`
#     (`compress2` and `compress2_z`), and the informational `deflate_mem_level`,
#     `deflate_strategy`, `deflate_stored_floor` (level 0), `deflate_bound` (the four bound entry
#     points, per call) and `deflate_degenerate` (the zero- and single-byte fixtures as latency, since
#     `Throughput::Bytes(0)` has no rate), plus the opt-in `deflate_silesia`.
#
# The suite writes one greppable `deflate_bench: RATIO ...` line per throughput case, one
# `RATIO-SUMMARY` line per group, one `MEMORY ...` line per memory case, one `MEMORY-SUMMARY` line and
# one `ALLOC-BALANCE ...` leak-check line per side per memory case -- all to STDERR, since stdout
# belongs to criterion's machine-readable output. It reports rather than enforces: the pass/fail
# decision belongs to the criterion regression job of AAP 0.4.1.6. It reads the committed tier-1
# corpus and, when `ZLIB_RS_SILESIA_DIR` or `<repo-root>/target/silesia` holds one, the opt-in tier-2
# corpus; it never fetches either, and `corpus/fetch_silesia.sh` stays referenced by no manifest,
# build script, test or workflow.
#
#     cargo bench -p zlib-rs-differential --bench deflate_bench
#     cargo bench -p zlib-rs-differential --bench deflate_bench -- --test   # one iteration each
#
# ★ It must never motivate an encoder change. AAP 0.7.1(c) forbids tuning `configuration_table`,
# enabling a non-default compile-time knob (`FASTEST`, `LIT_MEM`, `UNALIGNED_OK`, `FORCE_STATIC`,
# `FORCE_STORED`) or adopting a zlib-ng-style improvement, however much faster it would be, because
# each changes emitted bytes and breaks the byte identity `tests/byte_identical.rs` gates. Admissible
# optimization is output-neutral only.
[[bench]]
name = "deflate_bench"
path = "../../benches/deflate_bench.rs"
harness = false

# Opt into the root `[workspace.lints]` policy: `deny(clippy::all, clippy::pedantic)`
# plus the panic-prone lint set. This key is the ONLY mechanism by which that policy
# reaches this crate's build script, sources, tests and attached bench targets;
# omitting it would silently exempt the whole crate from the lint gate. Requires
# cargo >= 1.74, which the 1.80 MSRV satisfies.
[lints]
workspace = true

# DELIBERATELY ABSENT, all four for concrete reasons:
#   * `[profile.*]` -- profiles are honoured only in the workspace root and Cargo
#     warns "profiles for the non root package will be ignored" if a member declares
#     one; a warning is a failure under the zero-warnings bar. `lto = "fat"`,
#     `codegen-units = 1`, `opt-level = 3` and `panic = "abort"` all come from the
#     root.
#   * `[lib]` -- the default rlib target is exactly right. `cdylib`/`staticlib`
#     belong to `crates/libz-rs-sys` alone, which is the single place the exported C
#     surface is defined.
#   * `[[bin]]` / `[[example]]` -- this crate is a library plus tests plus the
#     attached benches.
#   * `[patch]` / `[replace]` / `[target.*]` / git or alternate-registry sources --
#     submodules and vendoring are forbidden, and the C oracle is already in-tree.
