# libz-rs-sys -- the C ABI facade crate (workspace member 2 of 3).
#
# This crate is INTENDED to be the drop-in replacement for the C `libz`, and it is
# the ONLY crate in the workspace permitted to use `unsafe`: every raw pointer
# that crosses the C boundary is validated here and converted into a safe Rust
# slice exactly once, before any call into the dependency-free `zlib-rs` core.
#
# STATE AT THIS CHECKPOINT, MEASURED.  The crate is complete and builds: the
# crate root and every export module exist, `cargo build --release` produces
# `target/release/libz.so` with `SONAME libz.so.1` and `target/release/libz.a`,
# and `nm -D --defined-only --extern-only` on the shared object reports 96
# unmangled function symbols.
#
# WHAT THAT ARTIFACT IS NOT, because the difference is the whole subject of the
# packaging layer and must not be glossed over here:
#
#   * It carries ZERO symbol-version nodes, against the reference library's 16.
#     rustc supplies its own anonymous version script when it links a cdylib and
#     `zlib.map` cannot be layered on top of it (four measured failure modes are
#     catalogued in `build.rs`), so a consumer resolving `deflate@ZLIB_1.2.0`
#     cannot bind to the cargo output.
#   * It has neither `gzprintf` nor `gzvprintf`.  Both are C-variadic, stable
#     Rust can define neither, and this crate is forbidden from compiling C (see
#     the `[build-dependencies]` note below).  `test/example.c` calls `gzprintf`.
#   * `inflate_table` and the two `_zlib_rs_gzprintf_*` shim helpers are visible
#     in its dynamic table; `zlib.map`'s `local:` blocks are what hide them in
#     the reference library.
#
# So `cargo build --release` yields a real, usable Rust-built `libz` for a Rust
# consumer and for a static link, and `make rust` yields the drop-in: it relinks
# `libz.a` through `zlib.map`, archives the gzprintf shim into it, and stages the
# versioned chain.  Every claim below is written to that distinction.
#
# Five separate things resolve against this manifest by exact name, so none of
# the names below are cosmetic:
#
#   1. `cbindgen --config cbindgen.toml --crate libz-rs-sys` — the crate name is
#      written verbatim into the committed `cbindgen.toml`.
#   2. `cargo build --release -p libz-rs-sys --features libz-compat` — the
#      feature name.  Keep the `-p`: with several packages selected cargo applies
#      a bare `--features libz-compat` only to the ones that declare it and
#      silently ignores it elsewhere, and with a single package selected that does
#      not declare it the flag is a hard error.  Naming the package says what is
#      meant in both cases.
#   3. the artifact names, which the root `CMakeLists.txt` will consume once a
#      `ZLIB_BUILD_RUST` path is added to it.  No such option exists in
#      `CMakeLists.txt` or `README-cmake.md` today; that update is still to come.
#   4. `Makefile.in`'s `rust`, `rust-test`, `rust-symbols`, `rust-header` and
#      `rust-clean` targets, all of which do exist.
#   5. `zlib.pc`'s `Libs: ... -lz` — which requires `libz.so` / `libz.a`.
#
# Related files, and the boundary of this manifest's responsibility:
#   * `build.rs`    — five jobs: it validates the `ZLIB_RS_SIMD` request against
#                     the resolved `simd` feature, publishes
#                     `cfg(zlib_rs_gzprintf)` from `ZLIB_RS_GZPRINTF_SHIM` so the
#                     compiled-in flags word describes the library the packaging
#                     layer will stage, emits `-Wl,-soname,libz.so.1`, locates and
#                     validates `zlib.map` (refusing the request to hand it to
#                     rustc), and stages `libz.so.1` and `libz.so.1.3.2.1-motley`
#                     beside cargo's `libz.so` as relative symlinks.  Those two links are the
#                     only things it creates, and the only thing it deletes is a
#                     symlink of its own it would otherwise replace.  It is
#                     picked up by Cargo's automatic sibling-`build.rs`
#                     detection, so no explicit `build = "build.rs"` key is
#                     needed (and omitting it degrades gracefully).
#   * `Makefile.in` — owns the COMPLETE drop-in, and that is a structural
#                     division rather than a preference.  Two of the three gaps
#                     listed above can only be closed by a step that runs AFTER
#                     the link and MAY run a C compiler: relinking `libz.a`
#                     through `zlib.map` (which is the only way the 16 version
#                     nodes can be applied at all) and compiling
#                     `csrc/gzprintf_shim.c` into it.  The `rust` target does
#                     both, then stages the whole chain in an isolated
#                     directory.  `build.rs`'s aliases are a different, smaller
#                     job: they stop a consumer of the CARGO output from
#                     silently binding the system zlib, which was reproduced
#                     with `ldd` during planning.  Neither substitutes for the
#                     other.
#   * `src/lib.rs`  — carries `#![deny(unsafe_op_in_unsafe_fn)]` and
#                     `#![allow(non_camel_case_types)]`.  Those are source
#                     attributes and deliberately do NOT appear here.

[package]
name = "libz-rs-sys"

# Inherited from the root `[workspace.package]`.  Only the four keys the
# workspace is contracted to provide are inherited: inheriting a key the root
# does not declare is a hard manifest-parse error, not a fallback.
#
# `version` is plain three-component semver.  The library's *self-reported*
# version string is `ZLIB_VERSION "1.3.2.1-motley"` (zlib.h), which has four
# components and is therefore not valid Cargo semver — it lives as a literal in
# `src/util.rs`, and must never be derived from `env!("CARGO_PKG_VERSION")`.
#
# `edition` is 2021 and `rust-version` is 1.80.  This pairing is mandatory, not
# stylistic: edition 2024 requires rustc >= 1.85, and Cargo rejects the
# combination outright with "rust-version 1.80 is incompatible with the version
# (1.85.0) required by the specified edition (2024)".  Do not raise either one.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `publish = false` at the root is NOT inherited implicitly -- nothing about
# `[workspace.package]` applies to a member unless the member asks for it by
# name.  Without this line the crate is publishable by default, which matters
# more here than for the core: this crate emits `libz.so` and claims the `-lz`
# link name, so a stray `cargo publish` would offer a partial snapshot of a
# system library's ABI to the world.  It is inherited rather than restated as a
# local `publish = false` so that the policy has one home.
publish.workspace = true

# Set locally rather than inherited, so this manifest does not depend on the
# root declaring optional `[workspace.package]` keys.  Both values trace to
# `CMakeLists.txt` (`DESCRIPTION` and `HOMEPAGE_URL` on the `zlib` project).
description = "C ABI compatible facade over zlib-rs: a drop-in libz replacement built on a safe-Rust core"
homepage = "https://zlib.net/"

# `name = "z"` is what makes Cargo emit `libz.so` and `libz.a` instead of
# `liblibz_rs_sys.so`.  It mirrors the C build exactly: `CMakeLists.txt` sets
# `OUTPUT_NAME z` on both the shared and static targets, and `zlib.pc.in`
# advertises `Libs: -L${libdir} -L${sharedlibdir} -lz`.  Consumers that link
# `-lz` therefore keep working unchanged, which is the whole point.
#
# Note the asymmetry: the *linker* artifact is `libz`, but the *Rust* import
# path is `libz_rs_sys` (Cargo replaces hyphens with underscores in the package
# name, and `[lib] name` only governs the emitted file name).  Integration
# tests, the differential harness and the fuzz targets all `use libz_rs_sys::…`.
#
# All three crate types come from this one crate rather than from two or three
# separate crates, so the exported C surface is defined in exactly one place:
#   * `cdylib`    -> `libz.so`.  The shared library, and the base the packaged
#                    drop-in is built from -- not itself the finished drop-in:
#                    see the measured list of what it lacks at the top of this
#                    file.
#   * `staticlib` -> `libz.a`.  Two consumers: `test/CMakeLists.txt` links
#                    `infcover` against a static zlib via `ZLIB::ZLIBSTATIC`,
#                    and — the reason this crate type is mandatory rather than
#                    convenient — it is the artifact the shared library must be
#                    *relinked* from with `gcc` in order to apply the `zlib.map`
#                    version script at all, because a version script cannot be
#                    attached to a rustc-built cdylib.  `Makefile.in`'s `rust`
#                    target performs that relink.
#   * `rlib`      -> required so `zlib-rs-differential`, the `fuzz/` targets and
#                    this crate's own `tests/*.rs` can depend on it as a normal
#                    Rust library.  Omitting `rlib` would silently break every
#                    integration test in `tests/` — a directory that does not
#                    exist yet.
[lib]
name = "z"
crate-type = ["cdylib", "staticlib", "rlib"]

# `--no-default-features` is a SUPPORTED configuration: it compiles cleanly and
# yields a library whose `extern "C"` surface and gz layer are simply gated out.
# It exists for feature-matrix checking, not for shipping, so the crate root must
# keep every export behind `libz-compat` rather than raising a `compile_error!`.
[features]
# Both are on by default so that a plain `cargo build --release` compiles the
# whole C surface this crate can express in Rust -- the 96 exported functions,
# gzFile layer included.  It is deliberately NOT claimed that the result is a
# finished drop-in: `gzprintf`, `gzvprintf` and the 16 symbol-version nodes come
# from the packaging relink, for the structural reasons set out at the top of
# this file.  `make rust` is the command that produces a drop-in.
default = ["libz-compat", "gz"]

# Gates the exported `extern "C"` surface.  The target it exists to reach is the
# 95 unmangled function symbols that make this library ABI-compatible with the C
# original — those 95 plus zlib.map's 16 symbol-version nodes are the 111 dynamic
# globals the reference `libz.so.1.3.2.1-motley` publishes, measured with
# `nm -D --defined-only --extern-only`.  All 96 are implemented and the same
# command on `target/release/libz.so` now reports 96 `T` symbols, so this feature
# gates the entire exported surface: `--no-default-features` compiles the crate
# with none of it.  (96 rather than 95 because `inflate_table` is exported for
# `test/infcover.c` and is hidden again by `zlib.map` in the packaged library.)
# Named exactly as the documented build command requires:
#   cargo build --release -p libz-rs-sys --features libz-compat
libz-compat = []

# Gates the `gzFile` layer (`gzopen`, `gzread`, `gzwrite`, `gzprintf`, …).  File
# I/O is the only part of the library that needs `std`, so this forwards into the
# core's `std` feature; the core is otherwise `no_std` + `alloc`.
#
# This feature and `libz-compat` together are also what make `csrc/gzprintf_shim.c`
# linkable: the two Rust adapters the shim calls live behind those same gates, so
# a `--no-default-features` build must not have the shim linked in or the library
# would carry two unresolved symbols.  The packaging layer that compiles the shim
# builds with both features on, which is what keeps the pair consistent.
#
# ★ It also pulls in `libc`, and that edge is REQUIRED rather than convenient.
# `gzdopen` adopts a caller's descriptor, and `gzlib.c` L253-L262 applies two
# descriptor flags to an adopted descriptor: `F_SETFL | O_NONBLOCK` when the mode
# string contained `N`, and `F_SETFD` when it contained `e`.  `zlib.h` L1377-L1378
# and L1398-L1402 both promise those effects to a caller.  `std` exposes no
# `fcntl` — `File` has no flag accessor, and `set_nonblocking` exists only on
# sockets — so without `libc` the two flags are silently dropped and a descriptor
# stays inheritable across `execve` and stays blocking.  The AAP's dependency
# inventory sanctions exactly this: `libc` is listed as optional for this crate
# "only if a platform type or a raw file syscall is unavoidable in the gz layer".
# It is, and the syscall sites are the two `#[cfg(unix)]` `libc::fcntl` calls in
# `src/gz.rs` and nothing else.
#
# Dependency minimalism is preserved by the gating rather than by the default:
# `--no-default-features`, `--features libz-compat` and every `zlib-rs`-only build
# still resolve without `libc`, and the safe core keeps its empty `[dependencies]`.
gz = ["zlib-rs/std", "dep:libc"]

# Vectorised CRC-32 / Adler-32 backends, off by default.  A single pass-through
# switch to `zlib-rs/simd`, and THE ONLY WAY THE VECTORISED CODE IS COMPILED.
#
# Do not read `ZLIB_RS_SIMD=0|1` in `build.rs` as an alternative to it: a build
# script cannot turn a Cargo feature on, so that variable only publishes a
# `cfg(zlib_rs_simd)` that this crate's source can key off.  Selecting the
# vectorised backends is this feature's job and nothing else's.
#
# SIMD is deliberately confined to the two checksums and is OUTPUT-NEUTRAL: a
# checksum yields one scalar however it is computed, so vectorising it cannot
# perturb the bitstream.  It may change speed only, never emitted bytes.
# Vectorising match-finding would change the compressed output and is therefore
# prohibited outright — byte-identical output is a hard requirement.
simd = ["zlib-rs/simd"]

# Deliberate — not accidental — opt-in for the optional `libc` dependency below.
# Cargo would synthesise this exact feature implicitly for any optional
# dependency that is never named with `dep:` syntax; declaring it explicitly
# makes it intentional, documented and reviewable instead.
#
# It is retained even though `gz` now implies it, so that the feature name stays a
# stable part of this crate's surface and so that a downstream `--features libc`
# keeps resolving.  Enabling it alone changes nothing observable: every `libc`
# call site in this crate is inside the `gz`-gated `src/gz.rs`, so with `gz` off
# the dependency is resolved and linked but never called.  The one configuration
# that matters is the reverse — `gz` on — and that one now cannot be built
# without `libc`, which is the point.
libc = ["dep:libc"]

# This is the manifest the committed `deny.toml` `[bans]` rules are evaluated
# against, and it sets `wildcards = "deny"` without `allow-wildcard-paths`.
# A path dependency with no version requirement surfaces as `*` in the
# dependency graph and is rejected by that gate, so both entries below carry an
# explicit, non-wildcard version requirement.
[dependencies]
# The safe core: `#![forbid(unsafe_code)]`, `no_std` + `alloc`, zero third-party
# dependencies.  Declared by path (the two crates always travel together in this
# repository) plus an explicit version so the `wildcards = "deny"` gate is
# satisfied.  `1.3.2` is the three-component semver derivation of the CMake
# `PROJECT_VERSION 1.3.2.1`.  A bare version requirement is never acceptable
# here: it would resolve against crates.io and pull in a foreign crate.
zlib-rs = { path = "../zlib-rs", version = "1.3.2" }

# Optional, and pinned to the 0.2 line on purpose.  `libc`'s newest published
# release is a `1.0.0-alpha.4` pre-release, so an unpinned or `1`-style
# requirement would resolve to something unintended; `deny.toml` independently
# forbids wildcard requirements.
#
# ★ REQUIRED by the `gz` feature, not merely available to it.  `gzdopen` adopts a
# caller's descriptor and `gzlib.c` L253-L262 applies two descriptor flags to an
# adopted one -- `F_SETFL | O_NONBLOCK` for mode `N`, `F_SETFD` for mode `e` --
# effects `zlib.h` L1377-L1378 and L1398-L1402 promise the caller.  `std` cannot
# express either: `File` has no flag accessor and `set_nonblocking` exists only on
# sockets.  The call sites are the `#[cfg(unix)]` `libc::fcntl` uses in `src/gz.rs`
# and nothing else, which is exactly the "platform type or raw file syscall
# unavoidable in the gz layer" the AAP's dependency inventory sanctions.
#
# It stays `optional` so the gating, not the default, is what preserves dependency
# minimalism: `--no-default-features`, `--features libz-compat` and every
# `zlib-rs`-only build still resolve without it, and the safe core keeps its empty
# `[dependencies]`.  `std::fs` / `std::io` remain preferred everywhere they suffice,
# which is very nearly everywhere.
libc = { version = "0.2.189", optional = true }

# ============================================================================
# No [build-dependencies] — and no C compiler in a cargo build at all
# ============================================================================
#
# `build.rs` emits link arguments, stages symlinks and publishes one `cfg`.  It
# never runs a C compiler, so this manifest needs neither `cc` nor any other build
# dependency, and `cargo build --release` for the shipped artifacts works on a
# machine that has no C toolchain installed.  Two things follow, and both are
# deliberate:
#
#   * The AAP freezes the dependency inventory and records `cc` as a
#     build-dependency of `crates/zlib-rs-differential` ONLY, "never a dependency
#     of `zlib-rs` or `libz-rs-sys`", and requires that a shipped `cargo build`
#     never touch a C compiler.  Keeping the one C translation unit this port
#     owns — `csrc/gzprintf_shim.c` — out of `build.rs` is what makes that
#     structural rather than a promise.
#
#   * The shim is compiled instead by the packaging layer, which already runs a
#     C compiler to relink the static archive through `zlib.map` (a version
#     script cannot be attached to a rustc-built cdylib).  It therefore rides
#     along with a step that exists anyway, and `make rust-symbols` is what
#     proves both symbols reached the staged library.  That layer passes
#     `ZLIB_RS_GZPRINTF_SHIM=1` so the compiled-in `zlibCompileFlags()` word
#     describes the library it is about to produce; see `build.rs` job 5.
#
# `links` is likewise absent.  That key exists so two packages cannot claim the
# same *system* library and so dependents can read `DEP_<LINKS>_*` metadata.
# The shim is neither: it is this crate's own translation unit, bundled into this
# crate's own artifacts, and no other package could link it.

# ============================================================================
# [lints]
# ============================================================================
#
# Opts this crate into the root's lint policy: `deny(clippy::all,
# clippy::pedantic)` plus the panic-prone lint set that keeps `unwrap()`,
# `expect()` and panicking indexing out of library paths.  Without this table
# none of that reaches this crate's sources and the CI lint gate is vacuous, so
# it is required rather than optional.
#
# Note what is deliberately absent: nothing here forbids `unsafe`.  This is the
# one crate allowed to use it, which is exactly why the workspace declines to
# blanket-forbid `unsafe_code`; `#![forbid(unsafe_code)]` belongs to `zlib-rs`
# alone.
[lints]
workspace = true

# * [profile.*]        — Cargo ignores profiles in non-root manifests and warns
#                        "profiles for the non root package will be ignored,
#                        specify profiles at the workspace root", which would
#                        break the zero-warnings bar.  `lto = "fat"`,
#                        `codegen-units = 1`, `opt-level = 3` and
#                        `panic = "abort"` all come from the root, and
#                        `panic = "abort"` in particular is what turns a panic
#                        crossing the FFI edge into an abort instead of
#                        undefined behaviour.  Restating it here would be
#                        ignored *and* would falsely imply local control.
# * [[bench]]          — the repo-root `benches/*.rs` are to attach to
#                        `zlib-rs-differential`, which owns the C oracle they
#                        measure against.  That directory does not exist yet.
# * [[bin]]            — this crate is a library only.
# * [dev-dependencies] — the planned integration tests (`abi_layout.rs`,
#                        `symbol_parity.rs`, `c_api_parity.rs`, none of them
#                        written yet) are to run on `std` alone, with
#                        `symbol_parity.rs` shelling out to `nm` through
#                        `std::process::Command`.  Nothing to add.
# * links              — `csrc/gzprintf_shim.c` is this crate's own translation
#                        unit, bundled by the packaging layer into the staged
#                        copies of this crate's own artifacts.  It is not a
#                        system library another package could also claim, and
#                        nothing downstream reads `DEP_*` metadata from it.  See
#                        the note above `[lints]` for the full reasoning.
# * [build-dependencies]
#                      — see the note above `[lints]`: `build.rs` does not
#                        compile the shim, or any other C, at all.  It emits link
#                        arguments and stages two symlinks, so it needs `cc`
#                        neither directly nor through `std::process::Command`,
#                        and `cargo build --release` works on a machine with no C
#                        toolchain.  The shim is compiled by the packaging layer,
#                        which keeps the AAP's frozen dependency inventory
#                        exactly as written.
# * rust-api           — that feature belongs to `zlib-rs`, which owns the
#                        idiomatic Rust surface.  This crate exposes the C ABI.
