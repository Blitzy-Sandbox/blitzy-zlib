# cargo-deny supply-chain policy for the Rust reimplementation of zlib.
#
#   cargo deny check                 run every gate
#   cargo deny check licenses        one gate at a time, so a failure is
#   cargo deny check advisories      attributable
#   cargo deny check bans
#   cargo deny check sources
#   cargo deny list                  what licences the current graph resolves to
#
# WHY THIS FILE EXISTS
#
# zlib is a system library: effectively every consumer of compressed data links
# it, so whatever reaches this dependency graph reaches everything downstream.
#
# The graph divides in two, and the division is the thing this file protects.
# What SHIPS is three crates deep and no deeper: crates/zlib-rs has an empty
# [dependencies] table, and crates/libz-rs-sys adds exactly one third-party edge --
# `libc`, optional, enabled by the default-on `gz` feature for the two
# `#[cfg(unix)] libc::fcntl` calls `gzdopen` needs.  `cargo tree -p zlib-rs
# -e normal` and `cargo tree -p libz-rs-sys -e normal --all-features` are the
# authority on that.  Everything ELSE cargo-deny can see is dev and build tooling
# that never reaches libz.so or libz.a: `cc` (plus `shlex` and `find-msvc-tools`)
# compiling the in-tree C oracle for crates/zlib-rs-differential, and `criterion`
# with its own substantial closure -- clap, plotters, rayon, serde, regex, walkdir,
# wasm-bindgen -- behind the benchmark suites.  77 packages resolve in total;
# `cargo deny --all-features list` enumerates them with their licences.  This file
# is the mechanical half of keeping the division true: a regression fails the gate
# instead of passing unnoticed in a diff.
#
# LICENSING
#
# The project's own licence is the zlib licence, SPDX `Zlib`: the text in LICENSE,
# the identifier BUILD.bazel declares through rules_license, the value of `license`
# in Cargo.toml's [workspace.package], and the allow list below all state it.
# Copyleft licences are excluded the only way this schema permits -- by not
# appearing in that list, which turns any crate carrying one into a hard error.
# There is deliberately no GPL, LGPL, AGPL or MPL entry anywhere in this file.
#
# One graph is deliberately not covered: fuzz/ declares its own [workspace] and
# is listed under `exclude` in the root Cargo.toml, so nothing it pulls in
# reaches the audit below.  It is audited separately, by its own configuration,
# against its own committed lockfile:
#
#     cargo deny --locked check                                  # this file
#     cargo deny --locked --manifest-path fuzz/Cargo.toml \
#                --config fuzz/deny.toml check                   # fuzz/deny.toml
#
# `--locked` on both runs is required rather than tidy: cargo-deny resolves
# through cargo, so without it an absent or stale lockfile is re-resolved
# silently and the audit reports on versions nobody builds.
#
# That second configuration exists because this one cannot serve both graphs, in
# both directions.  It needs two allowances this file must not grant, each an
# SPDX `AND` that cannot be satisfied by any alternative:
#
#   * `NCSA` -- libfuzzer-sys 0.4.13 is "(MIT OR Apache-2.0) AND NCSA"; it
#     vendors LLVM's NCSA-licensed libFuzzer.  It reaches the fuzz graph and only
#     the fuzz graph.
#
# NCSA is therefore deliberately absent from the allow list below: it appears
# nowhere in this workspace's graph, and cargo-deny reports an allowance that never
# matches as a warning.  Granting it here would also be the wrong shape -- it would
# permit an NCSA-licensed crate to enter the SHIPPED graph, which is precisely
# what this file is for preventing.
#
# `Unicode-3.0` is a different case and IS granted below, because it is genuinely
# in this graph.  unicode-ident 1.0.24 is "(MIT OR Apache-2.0) AND Unicode-3.0" and
# it arrives through criterion 0.8.2, which
# `crates/zlib-rs-differential/Cargo.toml` declares in `[dev-dependencies]` to host
# the three `benches/` suites: criterion -> serde/ciborium -> serde_derive and
# zerocopy-derive -> syn -> unicode-ident, plus proc-macro2 -> unicode-ident.  It
# reaches no shipped crate: `cargo tree -p zlib-rs -e normal` and
# `cargo tree -p libz-rs-sys -e normal` do not mention it.
#
# SCHEMA
#
# Written against cargo-deny 0.20.2, and only that schema's keys appear here.
# 0.20.2 has removed the older spellings outright -- [licenses] unlicensed,
# copyleft, deny and allow-osi-fsf-free, and [advisories] vulnerability,
# unsound and severity-threshold are all hard errors now -- and "deny anything
# not explicitly allowed" is its built-in behaviour rather than something to
# configure.  The legacy `version = 2` shims are omitted for the same reason.
# Every key below was checked against that schema, so none of them is a stale
# spelling.
#
# WHAT HAS BEEN CHECKED, AND HOW
#
# `cargo deny check` resolves through cargo, so it needs a graph that loads: every
# member's crate root has to exist and every manifest has to parse before a single
# rule here is evaluated.  Against the current tree the gate reports:
#
#   cargo deny --all-features check   ->  advisories ok, bans ok, licenses ok,
#                                         sources ok
#
# with no diagnostics of any kind.  The requirement is zero errors AND zero
# warnings across all four gates, because an allowance that never matches is
# reported as a diagnostic and would break the project's zero-warning bar just as
# a real violation would.  `Unicode-3.0` is the entry that demonstrates this in both
# directions: it reaches the graph only through the criterion harness, so it was
# unmatched and reported while that edge was absent and is matched and required now
# that the benchmark suites are attached.  The one third-party edge the shipped
# crates keep, `libc` behind the facade's `gz` feature, needs no new allowance: it
# is "MIT OR Apache-2.0", both of which are already listed for the tooling graph.
# Measured on the current graph with `--all-features`, criterion and libc both
# resolved: advisories ok, bans ok, licenses ok, sources ok, no warnings.
# Re-run the command above after any dependency change and keep this block truthful.

[graph]
# No `targets` filter, on purpose.  Narrowing the graph to a single triple would
# stop cargo-deny from ever looking at the crates that only build elsewhere --
# `find-msvc-tools`, which arrives through `cc`, is one today, and a benchmark or
# fuzz harness would add more -- and a licence or advisory problem in one of those
# is still a problem for whoever builds this workspace on that platform.  Which targets are supported is a
# separate question, answered by the build documentation rather than by the audit
# configuration.
#
# Optional features are switched on so that feature-gated dependencies are audited
# too, and one of them now needs it: `gz` expands to `dep:libc`, so `libc` enters
# the graph through a feature rather than through a plain dependency line.  With
# `all-features = true` it is audited like anything else; without it, a
# `--no-default-features` view of the workspace would hide that edge entirely.
# `libz-compat`, `simd`, `std` and `rust-api` remain pure switches over in-tree
# code, and the same setting is what keeps the day one of THEM grows a `dep:` entry
# from being a silent addition.
all-features = true

[advisories]
# Vulnerability, unsoundness and notice advisories are errors in cargo-deny 0.20.2
# and have no per-category switch left to turn them down -- the only escape hatch is
# the `ignore` list, which is empty and stays empty.  The two settings below are the
# ones whose defaults are weaker than this workspace wants.
#
# Widen the unmaintained check from the workspace's own dependencies to the whole
# graph, transitive tooling included.
unmaintained = "all"
# A yanked crate is only a warning by default.  For a library whose builds have to
# be reproducible from a committed Cargo.lock, it is an error.
yanked = "deny"
# Empty, and it should stay that way.  With no third-party code in the shipped
# crates there is very little surface for an advisory to land on, so an advisory
# that does fire is signal rather than noise: fix or drop the dependency instead of
# parking a RUSTSEC identifier here.
ignore = []

[licenses]
# Well above the 0.8 default.  Nothing in this graph depends on cargo-deny
# inferring a licence from the text of a LICENSE file -- every crate declares an
# SPDX expression in its metadata -- so a low-confidence textual match would itself
# be worth investigating rather than worth accepting.
confidence-threshold = 0.93
# Audit development and build dependencies as well.  cargo-deny skips
# dev-dependencies by default, which would leave the benchmark and
# differential-test trees -- by far the largest part of this graph -- unchecked, and
# would let a copyleft dev-dependency through without a word.
include-dev = true
include-build = true
# Exactly the identifiers this workspace resolves to, and nothing more.  An
# allowance that is never encountered is reported as a warning, so speculative
# entries are not free: run `cargo deny list` and add an identifier only once that
# output shows a crate which genuinely needs it.
allow = [
    # The project's own licence, carried by LICENSE and by all three crates.
    "Zlib",
    # Covers the dual-licensed tooling graph: cc, find-msvc-tools and shlex are all
    # offered as "MIT OR Apache-2.0".  It is also what would satisfy an
    # "Unlicense OR MIT" or "BSD-2-Clause OR Apache-2.0 OR MIT" crate, which is why
    # neither of those alternatives is listed: allowing an alternative that nothing
    # ends up needing is itself a warning.
    "MIT",
    # The other half of every "MIT OR Apache-2.0" expression above.
    "Apache-2.0",
    # Required by unicode-ident 1.0.24, whose expression is
    # "(MIT OR Apache-2.0) AND Unicode-3.0" -- an AND, so the MIT entry above cannot
    # satisfy it on its own.  It reaches this graph only as a dev-dependency, through
    # the criterion benchmark harness, which `include-dev = true` above brings into
    # scope.  The paths, read off `cargo tree -p zlib-rs-differential -e normal,dev`:
    # criterion -> ciborium -> ciborium-ll -> half -> zerocopy -> zerocopy-derive ->
    # {proc-macro2, syn 2.0.119} -> unicode-ident, and criterion -> serde ->
    # serde_derive -> syn 3.0.3 -> unicode-ident.  (Not through clap: criterion does
    # depend on clap 4.6.5, but that edge stops at clap_builder/clap_lex and pulls in
    # no derive crate.)  If the benchmark suites are ever detached from this
    # workspace, remove this entry in the same change -- an allowance that matches
    # nothing is itself reported as a warning, and `cargo deny check licenses` names
    # it either way.
    "Unicode-3.0",
]

[bans]
# A duplicate version in this graph means something went wrong: the shipped crates
# have no third-party dependencies to disagree about in the first place.
#
# `multiple-versions-include-dev` is left at its default of false on purpose, and
# the reason is current rather than precautionary: the dev graph DOES carry a
# duplicate today.  criterion 0.8.2 resolves two major versions of syn -- 2.0.119
# under zerocopy-derive and 3.0.3 under serde_derive, both reported by
# `cargo tree -p zlib-rs-differential --duplicates` -- and turning the key on would
# fail this workspace over somebody else's tree.  The alternative, a `skip` entry
# for syn, would blunt the check permanently and for every future duplicate of that
# name.  So the key stays off, and what it costs is bounded: the shipped crates
# have no third-party dependencies at all to disagree about, which is the property
# `multiple-versions = "deny"` below actually protects.  Note that a bare
# `cargo tree --duplicates` from the repository root reports nothing, because the
# root selects only the default members; the duplicate is visible only when the
# differential crate is selected, which is exactly why this key is documented here
# instead of being rediscovered later.
multiple-versions = "deny"
# Every version in this workspace was pinned against the registry deliberately,
# so a `*` requirement is a mistake rather than a shortcut.
#
# This check is deliberately unconditional: there is no `allow-wildcard-paths`
# exemption here, and none is needed.  A path dependency with no version
# requirement registers in the dependency graph as `*`, and every internal path
# edge in this workspace therefore carries an explicit version:
#
#   * root `[workspace.dependencies]`  -> zlib-rs   { path = …, version = "1.3.2" }
#   * crates/libz-rs-sys               -> zlib-rs   { path = …, version = "1.3.2" }
#   * crates/zlib-rs-differential      -> zlib-rs   via `workspace = true`
#   * crates/zlib-rs-differential      -> libz_rs_sys { path = …, version = "1.3.2" }
#
# `allow-wildcard-paths` would have covered the last of those, but it is a
# blanket rule rather than a targeted one: it excuses EVERY version-less path
# edge of an unpublished crate, including ones nobody has written yet.  Pinning
# the single edge that needed it keeps the gate at full strength and makes the
# next omission a build failure instead of a silent pass.  Verified both ways --
# with the version present, `cargo deny check bans` reports no wildcard; with it
# removed, it fails with error[wildcard] on exactly that edge.
wildcards = "deny"
# Crates that must never appear in this graph.
#
# Not banned, deliberately: `cc` is a build-dependency of
# crates/zlib-rs-differential, which compiles the in-tree C sources into the
# test-only differential oracle, and it brings `shlex` and `find-msvc-tools` with
# it.  Those three are the whole third-party graph, none of them reaches the
# shipped libz.so or libz.a, and `cc` in particular must never move into
# crates/zlib-rs or crates/libz-rs-sys: a shipped `cargo build --release` may not
# invoke a C compiler (AAP 0.6.4.1).  `criterion` is a dev-dependency of the same
# crate, for the three benchmark suites, and brings the largest part of the dev
# graph with it -- clap, serde, plotters, rayon and the two majors of syn above.
# It is not banned either, for the same dev-only reason: none of it reaches a
# shipped artifact.
deny = [
    # Bindings to a native compression library.  The C zlib in this tree is a
    # differential-test oracle, never a build dependency: the shipped library
    # contains no C compression or decompression code at all -- only the two
    # variadic/prototype shims in crates/libz-rs-sys/csrc/ , which implement no
    # algorithm -- and linking any of these would quietly put a C codec back.
    { crate = "libz-sys", use-instead = "libz-rs-sys", reason = "links the C zlib; the in-tree C sources are a test oracle, not a dependency" },
    { crate = "libz-ng-sys", use-instead = "libz-rs-sys", reason = "links zlib-ng, whose encoder does not emit byte-identical output" },
    { crate = "cloudflare-zlib-sys", use-instead = "libz-rs-sys", reason = "links a forked C zlib" },
    { crate = "libdeflate-sys", use-instead = "libz-rs-sys", reason = "links libdeflate, a separate C compressor" },
    { crate = "libdeflater", use-instead = "libz-rs-sys", reason = "wraps libdeflate, a separate C compressor" },

    # Third-party DEFLATE implementations.  This workspace is the DEFLATE
    # implementation; a second one in the graph would either shadow it or silently
    # answer for it in a test that was meant to exercise this one.
    { crate = "flate2", use-instead = "libz-rs-sys", reason = "third-party DEFLATE front end; this workspace is the implementation, not a consumer of one" },
    { crate = "miniz_oxide", use-instead = "zlib-rs", reason = "third-party Rust DEFLATE implementation" },
    { crate = "deflate", use-instead = "zlib-rs", reason = "third-party Rust DEFLATE encoder" },
    { crate = "inflate", use-instead = "zlib-rs", reason = "third-party Rust DEFLATE decoder" },
    { crate = "zopfli", use-instead = "zlib-rs", reason = "alternative DEFLATE encoder; its output is not byte-identical to zlib's" },

    # Other compression formats.  The capability surface is frozen at zlib, gzip
    # and raw DEFLATE, so pulling in another codec is a scope change rather than a
    # dependency bump -- including in a benchmark.
    { crate = "zstd", reason = "no new compression formats" },
    { crate = "zstd-sys", reason = "no new compression formats" },
    { crate = "brotli", reason = "no new compression formats" },
    { crate = "brotli-decompressor", reason = "no new compression formats" },
    { crate = "bzip2", reason = "no new compression formats" },
    { crate = "bzip2-sys", reason = "no new compression formats" },
    { crate = "lzma-sys", reason = "no new compression formats" },
    { crate = "xz2", reason = "no new compression formats" },
    { crate = "snap", reason = "no new compression formats" },
]

[sources]
# crates.io, and nothing else.
unknown-registry = "deny"
# No git dependencies.  The reference implementation is already in this repository,
# so there is nothing to vendor and no submodule to track, and a git dependency
# would also defeat the reproducibility the committed Cargo.lock buys.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Empty on purpose -- see unknown-git above.
allow-git = []
