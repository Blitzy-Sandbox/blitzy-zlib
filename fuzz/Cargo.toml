# zlib-rs-fuzz -- cargo-fuzz (libFuzzer) harness for the Rust zlib implementation.
#
# 1. PURPOSE
#    This crate is the manifest for the port's cargo-fuzz coverage of the
#    deflate/inflate entry points, whose requirement is zero crashes across a
#    defined corpus and time budget.  It is a harness only: it ships nothing, it
#    is never published, and it is not a member of the library workspace.  The
#    five binaries declared at the bottom of this file are the whole of its
#    intended surface.
#
#    STATE AT THIS CHECKPOINT: this manifest exists and the five target NAMES are
#    fixed here, but `fuzz_targets/` is empty -- none of the five `.rs` files has
#    been written yet -- so no `cargo fuzz` command in this file can run and the
#    requirement above is not yet met by anything.  Nothing here should be read as
#    a record of a completed fuzzing run.
#
# 2. HOW TO RUN IT, AND THE GATE
#
#      cd fuzz
#      cargo +nightly fuzz run <target> -- -max_total_time=300
#
#    `cargo fuzz` locates this directory by walking up from the working
#    directory, so its subcommands work equally from here or from the repository
#    root.  Plain cargo commands are the ones that care: `cargo build`,
#    `cargo clippy` and `cargo fmt` must be run FROM THIS DIRECTORY (or with
#    `--manifest-path fuzz/Cargo.toml`), because this directory is excluded from
#    the library workspace and is its own workspace root (see 4) — a root-level
#    `cargo clippy --workspace` will never see this crate.
#
#    The gate is to be >= 300 seconds per target across all five targets, with
#    zero crashes and zero hangs.  That budget is not arbitrary: it matches
#    `fuzz-seconds: 300` in ../.github/workflows/fuzz.yml, so the Rust harness is
#    to be held to exactly the budget this repository already applies to the C
#    implementation.  Enumerate the targets with `cargo +nightly fuzz list` —
#    cargo-fuzz sorts the names, so its output is alphabetical rather than the
#    reading order used below.
#
# 3. WHY `+nightly` IS EXPLICIT
#    ../rust-toolchain.toml pins `channel = "stable"`, and rustup honours that
#    pin for cargo invocations in this subdirectory too.  cargo-fuzz's
#    instrumentation (`-Zsanitizer=address` and the SanitizerCoverage passes) is
#    nightly-only, so the toolchain has to be overridden per invocation with
#    `+nightly`.  A `fuzz/rust-toolchain.toml` is deliberately NOT added: the
#    stable pin is correct for the shipped library and must remain the default
#    everywhere, including here.
#
# 4. WHY THIS IS A SEPARATE WORKSPACE
#    See the commentary on the `[workspace]` table below.  In short: it is what
#    keeps the fuzzing tooling out of the shipped dependency graph, and it is a
#    correctness requirement rather than a preference.
#
# 5. RELATIONSHIP TO THE EXISTING OSS-Fuzz WORKFLOW
#    ../.github/workflows/fuzz.yml continues to run Google CIFuzz against the
#    OSS-Fuzz project `zlib` — that is, against the C implementation —
#    completely unchanged.  The two fuzzing surfaces are complementary and
#    neither supersedes the other: CIFuzz fuzzes the C oracle, this crate fuzzes
#    the Rust implementation, and fuzz_checksum additionally fuzzes the two
#    against each other in one process.
#
# 6. WHAT IS NEVER COMMITTED, AND WHAT IS
#    Crash reproducers (fuzz/artifacts/) and evolved corpora (fuzz/corpus/) are
#    runtime output, not source.  They are CI upload material — fuzz.yml uploads
#    ./out/artifacts with `if: failure()` — and the repository-root .gitignore
#    already excludes `fuzz/artifacts/`, `fuzz/corpus/` and `fuzz/target/`.
#
#    fuzz/Cargo.lock IS committed, exactly like the repository-root Cargo.lock.
#    Because this manifest is its own workspace root it gets its own lockfile,
#    and there are only two coherent things to do with it: track it, or ignore
#    it.  Leaving it untracked and unignored is the one option that does not
#    work, because the first `cargo fuzz` invocation then writes an untracked
#    file into the tree and every later run has to choose between `--locked`
#    failing and the tree being dirty.
#
#    Tracking is the right choice of the two.  The five targets here are a CI
#    gate with a time budget, and a gate whose dependency versions can move
#    underneath it reports on a different program each run: a crash that
#    reproduces today has to still reproduce tomorrow for the artifact upload to
#    be worth anything.  libfuzzer-sys additionally links a compiler-runtime
#    component, so an unplanned minor bump is a real risk rather than a
#    hypothetical one.  Refreshing it is a deliberate maintainer action
#    (`cargo update --manifest-path fuzz/Cargo.toml`) reviewed like any other
#    dependency change.

[package]
# Follows the cargo-fuzz convention of naming the harness `<project>-fuzz`.
name = "zlib-rs-fuzz"
# `0.0.0` is the cargo-fuzz template convention for a harness that is never
# published and therefore carries no semantic version of its own.
version = "0.0.0"
# Written literally, never inherited.  This package is its own workspace root
# (see `[workspace]`), so there is no parent `[workspace.package]` table to
# inherit from and `field.workspace = true` would be a hard error anywhere in
# this file.
edition = "2021"
# MSRV floor for the whole workspace.  Edition 2024 would require rustc >= 1.85
# and Cargo rejects that combination at this MSRV, so 2021 is the only valid
# choice.
rust-version = "1.80"
# Matches ../LICENSE (the zlib licence) and every other crate manifest in the
# tree.
license = "Zlib"
publish = false

[package.metadata]
# REQUIRED, not decorative.  cargo-fuzz refuses to treat a directory as a fuzz
# project unless `package.metadata.cargo-fuzz` is the boolean `true`; without it
# every `cargo fuzz` subcommand bails out with "manifest ... does not look like
# a cargo-fuzz manifest".
cargo-fuzz = true

# An intentionally EMPTY table.  Making this manifest a workspace root in its own
# right is load-bearing rather than cosmetic:
#
#   * It makes this manifest SELF-SUFFICIENT.  The repository-root Cargo.toml
#     additionally carries `exclude = ["fuzz"]`, and either mechanism alone is
#     enough to keep this directory out of the library workspace; Cargo's own
#     diagnostic offers them as alternatives ("add the package to the
#     `workspace.exclude` array, or add an empty `[workspace]` table to the
#     package's manifest").  Carrying both is deliberate defence in depth: the
#     isolation still holds if that `exclude` entry is ever dropped, and this
#     manifest stays valid even when the root manifest is absent.  Delete this
#     table and the correctness of this crate starts depending on a single line
#     in a different file.
#   * The isolation is what keeps `libfuzzer-sys` and `arbitrary` out of the
#     shipped dependency graph and out of the committed root Cargo.lock.  The
#     core crate `zlib-rs` has an empty `[dependencies]` table by design and
#     test tooling must not ship; this table is the mechanism that enforces it,
#     so it must not be removed as "redundant".
#   * It also gives this directory its own `fuzz/target/` and its own lockfile,
#     so instrumented, sanitized fuzz builds never share build artifacts with —
#     or needlessly invalidate — the shipped release build.
#   * Finally, `[profile.release]` below is honoured ONLY because this package is
#     a workspace root.  Were `fuzz` made a workspace member instead, Cargo would
#     warn "profiles for the non root package will be ignored" and silently drop
#     the `debug = 1` that symbolises crash reports.
[workspace]

[dependencies]
# --- Fuzzing tooling ----------------------------------------------------------
# Declared HERE AND NOWHERE ELSE in the repository.  Both requirements are exact;
# do not loosen them (the upstream cargo-fuzz template would write the vaguer
# "0.4").  The cargo-fuzz tool itself is 0.13.2, installed with
# `cargo install cargo-fuzz --locked`; it is a tool, not a manifest entry.
#
# The `=` is deliberate and is the stricter of two mechanisms that back each
# other up.  fuzz/Cargo.lock is committed, so an ordinary build already gets one
# exact version; but a lockfile only binds commands that read it, and cargo
# rewrites it without complaint the moment anything asks it to re-resolve --
# `cargo update`, a manifest edit, or any invocation that simply omits
# `--locked`.  A caret requirement would let that re-resolution pick up code
# published after this was reviewed: "0.4.13" means ">=0.4.13, <0.5.0", so a
# future 0.4.14 satisfies it silently.  `=` removes the range, which means a
# version bump has to be an edit to this line that a reviewer can see.  It is
# also what makes `wildcards = "deny"` in fuzz/deny.toml meaningful for registry
# edges.  The cost is the usual one and is acceptable here: exact pins cannot
# co-resolve if some future dependency demands a different version in the same
# range, and this graph is small, flat and tool-only, so that trade is cheap.
libfuzzer-sys = "=0.4.13"
# `derive` is required, not optional polish: the targets import
# `arbitrary::Arbitrary` and fuzz_deflate derives it to draw *structured* input
# across the deflate configuration space (level, windowBits, memLevel, strategy)
# instead of reinterpreting raw bytes.  Enabling a feature is not a version
# change — the pin stays 1.4.2.
#
# Note that libfuzzer-sys depends on arbitrary too, so both edges have to agree.
# They do: `=1.4.2` satisfies libfuzzer-sys 0.4.13's own requirement, and the
# committed lockfile records the single resolved copy (verified: no duplicate
# arbitrary entry, which `multiple-versions = "deny"` would otherwise catch).
arbitrary = { version = "=1.4.2", features = ["derive"] }

# --- Crates under test --------------------------------------------------------
# `rust-api` is off by default in zlib-rs; it is what exposes the idiomatic
# typed surface the targets drive.
zlib-rs = { path = "../crates/zlib-rs", features = ["rust-api"] }

# DEPENDENCY RENAME — PLEASE DO NOT "SIMPLIFY" THIS LINE.
#
# crates/libz-rs-sys sets `[lib] name = "z"`, because that is what makes Cargo
# emit the drop-in `libz.so` / `libz.a`.  Cargo derives a dependency's default
# `--extern` name from the LIB TARGET name rather than the package name, so a
# plain `libz-rs-sys = { path = ... }` line would make the facade importable as
# `z`.  The `package = "libz-rs-sys"` rename restores `libz_rs_sys` as the
# import path.
#
# Every target added under fuzz_targets/ must therefore import the facade as
# `libz_rs_sys::...`, and only one convention may be in force at a time.  The
# fallback, should a future Cargo stop honouring the rename, is to depend on the
# facade plainly and write `use z as libz_rs_sys;` in each target -- a coordinated
# change to this line and to every target file.
#
# Default features are left ON deliberately.  They are ["libz-compat", "gz"] and
# fuzz_gz_roundtrip needs `gz` for the gzFile layer, so `default-features =
# false` must not be added here.
libz_rs_sys = { package = "libz-rs-sys", path = "../crates/libz-rs-sys" }

# --- Differential oracle ------------------------------------------------------
# DECISION, recorded deliberately: fuzz_checksum compares against the C oracle
# THROUGH this crate rather than reimplementing the comparison locally.
#
#   1. The oracle is the in-tree C implementation compiled by
#      crates/zlib-rs-differential/build.rs, and checksum fuzzing is specified
#      against it.  This dependency is that oracle.
#   2. Co-hosting the C reference with libz-rs-sys's `#[no_mangle]` exports in a
#      single binary would collide on `crc32`, `adler32`, `deflate`, `inflate`
#      and the rest of the exported surface.  That problem is already solved
#      exactly once, in that crate's build.rs, via `-D<name>=c_<name>`
#      compile-time renames plus an `objcopy --redefine-syms` pass.  Re-solving
#      it inside fuzz/ would duplicate roughly a hundred lines of build logic
#      that could silently drift out of sync with the copy next door.
#   3. Its lib target is to compile with zero regular dependencies — `src/lib.rs`
#      is to be just `pub mod oracle;`, with `src/oracle.rs` declaring its own
#      local `#[repr(C)]` mirrors — so a plain `[dependencies]` entry suffices
#      even though zlib-rs, libz-rs-sys and criterion appear in its
#      dev-dependencies.  Neither of those two source files has been written yet.
#   4. `exclude = ["fuzz"]` in the root manifest removes workspace MEMBERSHIP
#      only; cross-workspace PATH dependencies remain perfectly legal in Cargo.
#   5. It is intentionally NOT optional and NOT feature-gated, because the
#      documented CI invocation is a bare
#      `cargo fuzz run <target> -- -max_total_time=300`.  Requiring `--features`
#      just to build a target would break that command.
#
# Accepted costs, stated plainly rather than discovered later: the 15 in-tree C
# translation units are compiled by `cc` on every build of this package, so a C
# compiler and objcopy/binutils are fuzz-build prerequisites; and the oracle is
# built without sanitizer instrumentation.  Both are fine — the C implementation
# is fuzzed separately and continuously by OSS-Fuzz (see 5 in the header), so
# leaving it uninstrumented here costs no coverage.
zlib-rs-differential = { path = "../crates/zlib-rs-differential" }

[features]
# A single non-default passthrough.  It forwards ONLY to features that already
# exist on the shipped crates, so it adds no fuzz-only behaviour and cannot
# change what the library does for anyone else.
#
# Its purpose is to let fuzz_checksum verify the hard requirement that SIMD is
# OUTPUT-NEUTRAL: the vectorized Adler-32/CRC-32 backends may change
# speed only, never a single emitted byte.  Running the checksum target both
# ways and comparing each against the oracle is that check:
#
#   cargo +nightly fuzz run fuzz_checksum --features simd -- -max_total_time=300
#
# Deliberately absent from any `default` list, so the default fuzz build
# exercises the scalar reference paths.
#
# COUPLING NOTE: the second entry requires crates/libz-rs-sys to expose a `simd`
# feature forwarding to `zlib-rs/simd`.  That is the documented design — that
# crate's build.rs owns the `ZLIB_RS_SIMD=0/1` build-time toggle — but Cargo
# validates feature references at resolve time, for every invocation and not
# merely when the feature is enabled.  So if the facade ever drops the feature,
# this list must drop the second entry in the same change.
simd = ["zlib-rs/simd", "libz_rs_sys/simd"]

# Because `fuzz` is excluded from the library workspace this crate inherits
# NOTHING: `[lints] workspace = true` is unavailable (there is no parent
# workspace to inherit from) and a root-level `cargo clippy --workspace` will
# never see this crate.  The gate is therefore declared locally, so that
# `cargo +nightly clippy --all-targets -- -D warnings` run from this directory
# enforces the same standard as the rest of the workspace.
#
# Nothing here may DEPEND on the repository-root clippy.toml being discovered:
# Clippy's ancestor search usually finds it, but this crate is not a member of
# that workspace, so every lint decision that matters is spelled out below.
[lints.rust]
# Mirrors the facade crate's posture.  The targets legitimately handle raw
# pointers when driving the C ABI, so `unsafe` is permitted here — but each
# unsafe operation must be scoped individually instead of being blanket-permitted
# by an `unsafe fn` signature.  `forbid(unsafe_code)` binds the safe core crate
# only and must NOT be applied to this harness.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# `priority = -1` makes these group denials evaluate BEFORE the individual allows
# below, so the narrow exceptions can override the group rather than conflicting
# with it.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Fuzzer input arrives as bytes and has to be narrowed into the C API's integer
# domains (a level in 0..=9, a signed windowBits, a memLevel in 1..=9), so these
# three casts are inherent to a fuzz harness rather than a code smell.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Allowed only because this crate cannot rely on the root clippy.toml
# `doc-valid-idents` list being discovered from outside that workspace; without
# it, ordinary domain words (zlib, DEFLATE, libFuzzer) in the targets' doc
# comments would be flagged as needing backticks.
doc_markdown = "allow"

[profile.release]
# The ONLY key set here, and it is the cargo-fuzz template's own setting:
# line-table debug info, so libFuzzer crash reports come back symbolised.
# cargo-fuzz passes `--release` unless `--dev` is given, so this is the profile
# fuzzing actually uses.
#
# The shipped workspace's `[profile.release]` — lto = "fat", codegen-units = 1,
# opt-level = 3, panic = "abort" — is DELIBERATELY NOT REPLICATED here.  Those
# settings serve the shipped ABI (notably `panic = "abort"`, so that a panic can
# never unwind out of an `extern "C"` function into a C caller); these binaries
# are not the shipped artifact.  cargo-fuzz owns the sanitizer and profile
# configuration for them and must not be fought: pinning fat LTO and a single
# codegen unit here would only slow instrumented rebuilds and risk interfering
# with the coverage instrumentation, for no benefit to the fuzzing gate.
debug = 1

# Fuzz targets
#
# These five names are a CI-VISIBLE CONTRACT ONCE CI EXISTS.  The planned
# `.github/workflows/rust.yml` is to run `cargo fuzz run <name> --
# -max_total_time=300` over exactly this set, and is to cross-reference it from
# `.github/workflows/fuzz.yml`; neither is true today -- `rust.yml` has not been
# added, and the in-tree `fuzz.yml` is the unchanged OSS-Fuzz/CIFuzz workflow that
# mentions no Rust target.  So renaming one of these five breaks nothing yet and
# will break CI later.  Each name must match the corresponding file in
# `fuzz_targets/`, a directory that is still empty; the `path` values below are
# therefore the files to create, not files that exist.  They are listed in the
# project plan's reading order; `cargo fuzz list` sorts them alphabetically, so
# the two orders differ by design and that is not a discrepancy.

# From deflate.c — structured input over the configuration space (level,
# windowBits, memLevel, strategy) via `arbitrary`, exercising the per-level
# configuration_table[10] at deflate.c:112.
[[bin]]
name = "fuzz_deflate"
path = "fuzz_targets/fuzz_deflate.rs"
test = false
doc = false
bench = false

# From test/infcover.c — arbitrary bytes fed straight into `inflate`.  This is
# the PRIMARY UNTRUSTED-INPUT ATTACK SURFACE of the whole library: whatever the
# input, it must never panic, hang, or over-read.
[[bin]]
name = "fuzz_inflate"
path = "fuzz_targets/fuzz_inflate.rs"
test = false
doc = false
bench = false

# From infback.c — the inflateBack in/out callback path (inflateBack() at
# infback.c:191), following the approach of cover_back() at test/infcover.c:471.
[[bin]]
name = "fuzz_inflate_back"
path = "fuzz_targets/fuzz_inflate_back.rs"
test = false
doc = false
bench = false

# From gzwrite.c — gz write-then-read round trip across the gzFile layer; relies
# on the `gz` default feature of libz-rs-sys being left enabled above.
[[bin]]
name = "fuzz_gz_roundtrip"
path = "fuzz_targets/fuzz_gz_roundtrip.rs"
test = false
doc = false
bench = false

# From crc32.c (with adler32.c) — differential Adler-32/CRC-32 against the C
# oracle; the one target that runs both implementations in a single process.
[[bin]]
name = "fuzz_checksum"
path = "fuzz_targets/fuzz_checksum.rs"
test = false
doc = false
bench = false
