name: OSS-Fuzz

# CIFuzz against the C implementation, which is retained in this tree as the
# differential oracle for the Rust port (AAP 0.8.2 ambiguity 3).  This workflow is
# NOT superseded by the Rust port and must not be deleted in favour of it: the
# cargo-fuzz targets in `.github/workflows/rust.yml` (job `fuzz`, five targets --
# deflate, inflate, inflateBack, gz round-trip and checksums) fuzz the RUST
# implementation.  Two implementations, two fuzzers, and they can disagree.
#
# The 300-second budget below is shared with that job deliberately, so the two
# results are comparable rather than merely both present (AAP 0.8.4).
#
# Those five targets, by the exact names that are the CI-visible contract:
# `fuzz_deflate`, `fuzz_inflate`, `fuzz_inflate_back`, `fuzz_gz_roundtrip` and
# `fuzz_checksum`.  BOTH SURFACES ARE REQUIRED AND NEITHER REPLACES THE OTHER --
# this file covers the C oracle, that job covers the Rust port.  The budget is
# matched there as `-max_total_time=300` per target, so CHANGING IT HERE MEANS
# CHANGING IT THERE TOO.
#
# PR-only ON PURPOSE -- CIFuzz derives the fuzzers to build and run from the
# pull-request diff, so broader triggers would leave it nothing to work from.
on: [pull_request]

# LEAST PRIVILEGE, STATED RATHER THAN INHERITED.  With no `permissions:` block a
# workflow receives the repository's DEFAULT token scope, which on many
# repositories is read/write across contents, issues, packages, deployments and
# more.  That default is the wrong one here for a specific reason rather than a
# general one: this job builds and RUNS a fuzzer over the pull request's own tree,
# so it deliberately executes unreviewed contributor code, and it does so inside
# Docker actions whose base image is upstream-tracked (see the note below).
# Handing that combination a writable token means a crash in an untrusted target,
# or a change in an image nobody here controls, would be holding credentials that
# can modify the repository.
#
# `contents: read` is the whole requirement, and each step was checked against it:
# the two CIFuzz actions clone and build, and `actions/upload-artifact` v4 and
# later upload through the Actions runtime service using ACTIONS_RUNTIME_TOKEN
# rather than GITHUB_TOKEN, so it needs no additional scope.  Nothing here
# comments on a pull request, opens an issue, pushes a tag or publishes a package.
#
# A GITHUB_TOKEN on a `pull_request` event is read-only for forks regardless, but
# it is NOT read-only for a branch pushed inside this repository, which is the case
# this block actually constrains.
permissions:
  contents: read

# WHY THE TWO CIFUZZ ACTIONS CARRY A COMMIT SHA RATHER THAN `@master`.  A tag or a
# branch is a mutable pointer: whoever can move it decides what code runs in this
# job, and CIFuzz runs with the pull request's tree already checked out.  A full
# commit SHA is immutable, so the action definition this workflow executes is the
# one that was reviewed here.
#
# google/oss-fuzz publishes NO tags and NO releases -- the repository is the
# infrastructure, continuously deployed -- so there is no version to name in the
# comment beside the pin, and the SHA below is a master commit with its date.  That
# is also why refreshing it is a deliberate maintenance step: read
# https://github.com/google/oss-fuzz/commits/master for what changed under
# infra/cifuzz/, then update both pins together, because the two actions share the
# same infra/ tree and a split pin would run two revisions of it.
#
# WHAT THE PIN DOES NOT FREEZE, stated precisely because a reassuring version of
# this paragraph would be the actual risk.  Both are Docker actions
# (`runs.using: docker`) built from infra/build_fuzzers.Dockerfile and
# infra/run_fuzzers.Dockerfile, which derive from an OSS-Fuzz base image BY TAG.
# Pinning the SHA freezes the action definition and its Dockerfile; the base image
# that Dockerfile pulls remains upstream-tracked, as it must be for CIFuzz to keep
# working against the live OSS-Fuzz project.
#
# So the executable boundary of this job is pinned in three of its four layers and
# unpinnable in the fourth, and it is worth naming them individually:
#
#   1. the action source                   PINNED, by full commit SHA, both actions
#   2. the artifact-upload action          PINNED, by full commit SHA
#   3. the Dockerfiles built from that SHA PINNED, they travel with the source
#   4. the OSS-Fuzz base image they FROM   NOT PINNED -- upstream, by tag
#
# Layer 4 cannot be closed from this repository: the `FROM` line lives in upstream's
# Dockerfile, `uses:` offers no digest override for a Docker action's base, and
# rewriting it would mean vendoring OSS-Fuzz's infrastructure and losing the thing
# CIFuzz is for.  What bounds it instead is the `permissions:` block above --
# `contents: read` and nothing else -- so a compromised or merely changed base image
# runs with a token that cannot modify this repository.  That is a mitigation of the
# consequence, not a closure of the hole, and it is recorded as such rather than
# counted as one.
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@1671dec36453cdf32bbde283fab9dc005ac2bf2d # master, 2026-08-12
      with:
        oss-fuzz-project-name: 'zlib'
        dry-run: false

    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@1671dec36453cdf32bbde283fab9dc005ac2bf2d # master, 2026-08-12
      with:
        oss-fuzz-project-name: 'zlib'
        # THE BUDGET ANCHOR -- rust.yml's `fuzz` job matches this per target.
        fuzz-seconds: 300
        dry-run: false

    - name: Upload Crash
      # SHA-pinned like everything else that executes here.  `@v6` is a mutable major
      # tag: whoever can move it decides what code runs in a job that has just fuzzed
      # unreviewed contributor code and is about to handle its crash artifacts.  This
      # was the one `uses:` in this file still naming a tag while the two CIFuzz
      # actions above were already pinned, so the file's own stated policy -- "a tag
      # or a branch is a mutable pointer" -- did not hold for all three.  The SHA is
      # the same v6.0.0 commit the other fifteen upload steps in this repository use,
      # so there is one artifact-upload revision across the whole tree.
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: artifacts
        path: ./out/artifacts
