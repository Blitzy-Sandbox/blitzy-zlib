# ============================================================================
# Rust / Cargo Continuous Integration for the `zlib-rs` crate
# ============================================================================
#
# This workflow validates the memory-safe Rust rewrite of zlib (crate
# `zlib-rs`, library name `zlib_rs`). It is a NEW, standalone pipeline that
# runs ALONGSIDE — and never replaces — the seven existing C workflows in this
# directory (c-std.yml, cmake.yml, configure.yml, contribs.yml, fuzz.yml,
# msys-cygwin.yml, others.yml). The crate manifest (Cargo.toml) and lockfile
# (Cargo.lock) live at the repository ROOT, so every `cargo` command runs from
# the default working directory.
#
# Structure (triggers, `fail-fast: false` matrices, action versions, the
# `if: failure()` artifact upload) mirrors the C workflows so this file reads
# as a natural sibling. The cargo command set is derived from Cargo.toml /
# Cargo.lock and the `doc/project-guide.md` runbook.
#
# Conventions enforced here:
#   * `--locked` on every cargo build/fetch/test/clippy/bench invocation,
#     because Cargo.lock is committed; a `--locked` run must NOT need to update
#     the lockfile. (`cargo fmt` takes no `--locked` — it does not read or
#     write the lockfile.)
#   * The MSRV (Rust 1.85.0, the edition-2024 floor) is exercised explicitly,
#     since there is no rust-toolchain.toml in the repo.
#   * Feature names match Cargo.toml `[features]` EXACTLY:
#     std, gzip, gz-io, no-std, simd.
#
# Dev-only interop oracle: `tests/interop.rs` uses the dev-dependency `flate2`
# with its `zlib` feature, which links canonical C zlib via `libz-sys`/`cc` for
# byte-for-byte validation. GitHub-hosted runners already ship a C toolchain
# (gcc/clang + make on Linux/macOS, MSVC on Windows), so no extra install step
# is needed. `flate2` / C zlib are DEV-ONLY — the shipped crate has zero C
# dependencies.
#
# `capi` note: Cargo.toml declares an OPTIONAL `capi` feature that gates the
# `#[no_mangle] extern "C"` C-ABI exports (`src/ffi.rs`, delivered with the
# compression engine). This workflow deliberately keeps `capi` OFF in its
# default build/test steps: enabling it exports the canonical zlib symbol names
# (`deflate`, `inflate`, `crc32`, …), which collide at test-link time with the
# C zlib that the `flate2` dev-dependency bundles via `libz-sys`. The libz
# drop-in is produced by enabling `capi` for the cdylib/staticlib (a release
# `--features capi` build over the delivered `src/ffi.rs`); `cargo build` /
# `cargo test` here keep it off so the suite links cleanly.
# ============================================================================

name: CI

# Mirror the dominant trigger of the C workflows (push + pull_request), plus
# the manual `workflow_dispatch` used by c-std.yml. `on:` is intentionally left
# unquoted to match the repo's existing workflow style; GitHub's YAML 1.2
# parser handles the bare `on:` key correctly.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege token: this pipeline only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Lint — format + clippy gates. Run ONCE on ubuntu/stable so these checks do
  # not run redundantly across the OS/toolchain matrix below.
  # --------------------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      # Format gate — must be clean (no `--locked`; fmt does not use the lockfile).
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Lint gate (default features) — deny ALL warnings across every target.
      - name: Clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

      # No-std compile + lint gate (rlib only). The `lib` target also emits
      # `cdylib`/`staticlib` for the libz C drop-in, and those final link
      # artifacts require a global allocator + `#[panic_handler]` that a
      # `#![no_std]` *library* must not provide — so `cargo build`/`check`/
      # `clippy` on the lib all fail under `no-std`. We therefore override to the
      # single `rlib` artifact via `cargo rustc --crate-type rlib` and deny all
      # rustc warnings. Full clippy lint coverage of the shared source comes from
      # the default-features clippy gate above (the no-std-only code is just cfg
      # branches over that same source).
      - name: Lint/compile (no-std rlib)
        run: cargo rustc --lib --crate-type rlib --locked --no-default-features --features no-std -- -D warnings

      # Doc-link gate — the generated rustdoc API docs (AAP §0.7.2: idiomatic,
      # well-documented public API) MUST build clean with no broken, private,
      # ambiguous, or redundant intra-doc-link warnings. `RUSTDOCFLAGS=-D warnings`
      # promotes every rustdoc warning to a hard error so dead doc links cannot
      # regress. Both doc-clean configurations are covered: the default surface
      # and the `capi` FFI surface. `--all-features` is intentionally NOT built
      # here because `std` and `no-std` are mutually exclusive and that build
      # fails by design (a `compile_error!`), which is verified by the no-std
      # rlib step above and the dedicated `features` job below.
      - name: Doc links (default features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Doc links (capi FFI surface)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --features capi

  # --------------------------------------------------------------------------
  # Build + Test — OS x toolchain matrix. Mirrors the cmake.yml/configure.yml
  # `fail-fast: false` + `matrix.include` pattern. MUST cover stable AND the
  # 1.85.0 MSRV; spans Linux/macOS/Windows like the C suite.
  # --------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu / stable"
            os: ubuntu-latest
            rust: stable
          - name: "Ubuntu / 1.85.0 (MSRV)"
            os: ubuntu-latest
            rust: "1.85.0"
          - name: "macOS / stable"
            os: macos-latest
            rust: stable
          - name: "Windows / stable"
            os: windows-latest
            rust: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Build (debug, default features)
        run: cargo build --locked

      # Release build validates the cdylib + staticlib drop-in artifacts
      # (libzlib_rs.{so,dylib,dll,a}) emitted by
      # crate-type = ["lib", "cdylib", "staticlib"].
      - name: Build (release)
        run: cargo build --release --locked

      # Default-feature test run: the six ported suites (regression,
      # inflate_coverage, round_trip, interop, gzip_compat, checksum) plus the
      # lib and doc tests.
      - name: Test (default features)
        run: cargo test --locked

      # Compile the criterion benches (deflate_bench, inflate_bench,
      # checksum_bench) WITHOUT running them on EVERY OS/toolchain matrix cell —
      # this keeps the cross-platform matrix fast while ensuring the bench
      # harnesses stay buildable on Linux/macOS/Windows and the MSRV. The
      # benches are actually EXECUTED and their AAP §0.3.3 throughput gates are
      # ENFORCED by the dedicated `perf` job below (Linux only).
      - name: Build benches (no run)
        run: cargo bench --no-run --locked

      # Diagnostics + artifact upload run ONLY on failure and never affect the
      # gates above (mirrors the cmake.yml/configure.yml diagnostic pattern).
      # `shell: bash` is isolated to this failure-only step so it cannot affect
      # the primary build steps on Windows (which use the default shell).
      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "### rustc"
            rustc -Vv || true
            echo "### cargo"
            cargo -Vv || true
            echo "### dependency tree (locked)"
            cargo tree --locked || true
          } > cargo-ci-diagnostics.log 2>&1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }} (cargo)
          path: cargo-ci-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Feature matrix — replaces the C `#ifdef` / C-standards matrix. Validates
  # each Cargo feature combination. Each cell carries `cmd` (build|test) +
  # `args`, so the single run step is `cargo <cmd> --locked <args>`.
  #
  # CRITICAL: `no-std` is COMPILE-ONLY, and only as an `rlib`. Two reasons:
  #   1. `cargo test --no-default-features` (with or without `no-std`) fails in
  #      TEST code that uses Vec/format!/String without `alloc` imports when
  #      `std` is off — the LIBRARY itself compiles cleanly. So there is
  #      deliberately NO `cargo test --no-default-features` here.
  #   2. The `lib` target's `crate-type` includes `cdylib`/`staticlib` for the
  #      libz C drop-in, and those FINAL link artifacts require a global
  #      allocator + `#[panic_handler]` that a `#![no_std]` *library* must not
  #      impose on its consumers. Hence plain `cargo build --lib` fails under
  #      `no-std`; we override to the single `rlib` via
  #      `cargo rustc --crate-type rlib` (the meaningful Z_SOLO artifact).
  # `no-std` is never combined with `std` (they are mutually exclusive, and the
  # crate enforces this with a compile_error! guard in src/lib.rs).
  # --------------------------------------------------------------------------
  features:
    name: "Features (${{ matrix.cmd }} ${{ matrix.args }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmd: test
            args: "--no-default-features --features std"
          - cmd: test
            args: "--no-default-features --features std,gzip"
          - cmd: test
            args: "--no-default-features --features std,gzip,gz-io"
          - cmd: test
            args: "--no-default-features --features std,gzip,gz-io,simd"
          # no-std cells compile the LIBRARY as an `rlib` only (see the CRITICAL
          # note above): `cargo rustc --crate-type rlib` overrides the manifest's
          # `cdylib`/`staticlib` crate-types, which cannot link under `#![no_std]`
          # without an allocator/panic_handler the library deliberately omits.
          # This matches the no-std rlib lint/compile gate in the Lint job.
          - cmd: rustc
            args: "--lib --crate-type rlib --no-default-features --features no-std"
          - cmd: rustc
            args: "--lib --crate-type rlib --no-default-features --features no-std,simd"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Run cargo ${{ matrix.cmd }} (${{ matrix.args }})
        run: cargo ${{ matrix.cmd }} --locked ${{ matrix.args }}

  # --------------------------------------------------------------------------
  # Performance gates (AAP §0.3.3) — RUN, REPORT, and ENFORCE the throughput
  # gates on every push / pull request (and on manual dispatch). The three
  # criterion benches are executed and the mean times in their
  # `target/criterion/**/new/estimates.json` are parsed into matched-pair
  # throughput ratios (each matched pair measures an identical byte count, so a
  # throughput ratio is simply the inverse of the criterion mean-time ratio):
  #   * CRC-32 SIMD       >= 3.0x scalar   (crc32: simd_public vs scalar_local)
  #   * DEFLATE compress  >= 0.80x C zlib  (deflate_levels: <c>_L<l> vs czlib_<c>_L<l>)
  #   * INFLATE decompress>= 1.0x C zlib   (inflate: zlibrs_<c> vs czlib_<c>)
  # The job FAILS the workflow if any gate is missed (beyond a small, documented
  # shared-runner noise tolerance) and ALWAYS uploads the full criterion report
  # as a build artifact for inspection. Runs on Linux only (one consistent
  # reference host); the cross-platform matrix above still compiles the benches.
  # --------------------------------------------------------------------------
  perf:
    name: Performance gates (run + enforce)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      # Execute the three criterion benches. `--noplot` skips gnuplot/plotters
      # (not installed on the runner); criterion still writes estimates.json.
      - name: Run benchmarks (criterion)
        run: |
          cargo bench --locked --bench checksum_bench -- --noplot
          cargo bench --locked --bench deflate_bench  -- --noplot
          cargo bench --locked --bench inflate_bench  -- --noplot

      # Parse the criterion estimates and ENFORCE the AAP §0.3.3 gates. The
      # inline parser pairs each zlib_rs benchmark with its C-zlib (or scalar)
      # baseline and exits non-zero on any gate miss.
      - name: Enforce performance gates
        run: |
          python3 - <<'PERF_GATES_EOF'
          import json, glob, os, sys

          def mean_ns(path):
              with open(path) as f:
                  return json.load(f)["mean"]["point_estimate"]

          def collect(group):
              out = {}
              for p in glob.glob(f"target/criterion/{group}/*/*/new/estimates.json"):
                  parts = p.split(os.sep)
                  gi = parts.index("criterion")
                  g, fid, param = parts[gi + 1], parts[gi + 2], parts[gi + 3]
                  if g != group:
                      continue
                  out.setdefault(fid, {})[param] = mean_ns(p)
              return out

          # Shared-runner measurement-noise tolerance: the GATE VALUE is the AAP value;
          # TOL only absorbs jitter on 2-core CI VMs. Locally measured worst-case margins
          # (CRC ~55x, deflate ~0.86x, inflate ~1.02x) clear the gates well inside it.
          TOL = 0.05
          failures = []
          print("== Performance gates (AAP 0.3.3): ratio = throughput(zlib_rs)/throughput(baseline) ==")

          # CRC-32 SIMD gate: simd_public >= 3.0x scalar_local.
          crc = collect("crc32")
          gate = 3.0
          worst = None
          simd = crc.get("simd_public", {})
          scal = crc.get("scalar_local", {})
          for param, t_simd in sorted(simd.items()):
              t_scal = scal.get(param)
              if t_scal is None:
                  continue
              ratio = t_scal / t_simd
              worst = ratio if worst is None else min(worst, ratio)
              print(f"  CRC32   {param:24s} ratio={ratio:8.2f}x")
          ok = worst is not None and worst >= gate * (1 - TOL)
          print(f"  CRC32   WORST={(worst or 0):.2f}x  gate>={gate}x  ->  {'PASS' if ok else 'FAIL'}")
          if worst is None:
              failures.append("CRC32: no matched simd_public/scalar_local pairs found")
          elif not ok:
              failures.append(f"CRC32 SIMD worst {worst:.2f}x < {gate}x")

          # DEFLATE compression gate: <c>_L<l> >= 0.80x czlib_<c>_L<l>.
          de = collect("deflate_levels")
          gate = 0.80
          worst = None
          for fid, params in de.items():
              if fid.startswith("czlib_"):
                  continue
              cz = de.get("czlib_" + fid, {})
              for param, t_rs in params.items():
                  t_cz = cz.get(param)
                  if t_cz is None:
                      continue
                  ratio = t_cz / t_rs
                  worst = ratio if worst is None else min(worst, ratio)
          ok = worst is not None and worst >= gate * (1 - TOL)
          print(f"  DEFLATE WORST={(worst or 0):.2f}x  gate>={gate}x  ->  {'PASS' if ok else 'FAIL'}")
          if worst is None:
              failures.append("DEFLATE: no matched <c>_L<l>/czlib_<c>_L<l> pairs found")
          elif not ok:
              failures.append(f"DEFLATE compress worst {worst:.2f}x < {gate}x")

          # INFLATE decompression gate: zlibrs_<c> >= 1.0x czlib_<c> (parity).
          inf = collect("inflate")
          gate = 1.0
          worst = None
          for fid, params in inf.items():
              if not fid.startswith("zlibrs_"):
                  continue
              cz = inf.get("czlib_" + fid[len("zlibrs_"):], {})
              for param, t_rs in params.items():
                  t_cz = cz.get(param)
                  if t_cz is None:
                      continue
                  ratio = t_cz / t_rs
                  worst = ratio if worst is None else min(worst, ratio)
          ok = worst is not None and worst >= gate * (1 - TOL)
          print(f"  INFLATE WORST={(worst or 0):.2f}x  gate>={gate}x  ->  {'PASS' if ok else 'FAIL'}")
          if worst is None:
              failures.append("INFLATE: no matched zlibrs_<c>/czlib_<c> pairs found")
          elif not ok:
              failures.append(f"INFLATE decompress worst {worst:.2f}x < {gate}x")

          if failures:
              print("")
              print("PERFORMANCE GATES FAILED:")
              for f in failures:
                  print("  - " + f)
              sys.exit(1)
          print("")
          print("All performance gates PASS.")
          PERF_GATES_EOF

      # Always publish the criterion report (HTML + raw estimates) so the
      # measured numbers behind the gate decision are auditable.
      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: warn
          retention-days: 7
