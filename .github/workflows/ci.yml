name: Rust CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Main build-and-test job across all supported platforms
  # ---------------------------------------------------------------------------
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pin to @master per dtolnay/rust-toolchain docs: when an explicit
        # toolchain input is provided, @master is the correct branch ref.
        # The actual Rust version is pinned by the toolchain input below.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Run tests (default features)
        run: cargo test

      - name: Run tests (no default features — no_std compatibility)
        run: cargo test --no-default-features

      - name: Run tests (gzip feature)
        run: cargo test --features gzip

      - name: Run tests (gz-io feature)
        run: cargo test --features gz-io

      - name: Run tests (simd feature)
        run: cargo test --features simd

      - name: Run tests (no-std feature only)
        run: cargo test --no-default-features --features no-std

  # ---------------------------------------------------------------------------
  # Benchmark compilation job — verifies benchmarks compile on Linux
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pin to @master per dtolnay/rust-toolchain docs: when an explicit
        # toolchain input is provided, @master is the correct branch ref.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Compile benchmarks
        run: cargo bench --no-run
