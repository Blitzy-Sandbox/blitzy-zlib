name: Configure

# The autotools build of the C library, across the cross-compilation matrix below.
# It is C-only on purpose and needs no Rust toolchain, which is itself one of the
# things it checks: ./configure probes for cargo and, when there is none, records
# an empty $(CARGO) and logs "Checking for cargo... No (Rust build targets will be
# unavailable)" -- and the C build then proceeds exactly as it always has.  Every
# green row here is evidence that adding the Rust workspace did not make a Rust
# toolchain a requirement of the C build (AAP 0.4.1.6).
#
# The rust* Makefile targets are therefore not exercised here; they refuse with a
# named remedy on these runners rather than half-running.  rust.yml owns them, and
# its `dropin` job runs `make rust' on both an unconfigured and a ./configure'd
# tree, because the two compose the shared-object link differently.
#
# The Rust library is built only for Tier-1 targets.  The cross-compiled rows in
# this matrix have no Rust counterpart and are not expected to grow one.
#
# None of that retires this workflow.  The C sources stay in the tree unmodified
# and remain the differential oracle the memory-safe Rust port is checked
# against, so a green row here is not legacy upkeep: it is the evidence that the
# oracle itself still configures, builds and passes `make test' on that platform
# -- test/example.c and test/minigzip.c, run through $QEMU_RUN on the emulated
# rows.  The 13 rows below are that coverage in full: native Ubuntu, the
# out-of-source variant, seven QEMU cross-compiled targets, four macOS
# compilers.  Rows may be added; none may be removed or weakened, because
# dropping one narrows the baseline the byte-identity and interoperability
# comparisons in `.github/workflows/rust.yml` are run against (AAP 0.2.2.4).
on: [push, pull_request]
jobs:
  ci-configure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc
            configure-args: --warn

          # Test out of source builds
          - name: Ubuntu GCC OSB
            os: ubuntu-latest
            compiler: gcc
            configure-args: --warn
            build-dir: ../build
            src-dir: ../zlib

          # Cross-compiled C oracle rows -- never Rust-built (Tier-1 only)
          - name: Ubuntu GCC ARM SF
            os: ubuntu-latest
            compiler: arm-linux-gnueabi-gcc
            configure-args: --warn
            chost: arm-linux-gnueabi
            packages: qemu-system qemu-user gcc-arm-linux-gnueabi libc-dev-armel-cross
            qemu-run: qemu-arm -L /usr/arm-linux-gnueabi

          - name: Ubuntu GCC ARM HF
            os: ubuntu-latest
            compiler: arm-linux-gnueabihf-gcc
            configure-args: --warn
            chost: arm-linux-gnueabihf
            packages: qemu-system qemu-user gcc-arm-linux-gnueabihf libc-dev-armhf-cross
            qemu-run: qemu-arm -L /usr/arm-linux-gnueabihf

          - name: Ubuntu GCC AARCH64
            os: ubuntu-latest
            compiler: aarch64-linux-gnu-gcc
            configure-args: --warn
            chost: aarch64-linux-gnu
            packages: qemu-system qemu-user gcc-aarch64-linux-gnu libc-dev-arm64-cross
            qemu-run: qemu-aarch64 -L /usr/aarch64-linux-gnu

          - name: Ubuntu GCC PPC
            os: ubuntu-latest
            compiler: powerpc-linux-gnu-gcc
            configure-args: --warn --static
            chost: powerpc-linux-gnu
            packages: qemu-system qemu-user gcc-powerpc-linux-gnu libc-dev-powerpc-cross
            qemu-run: qemu-ppc -L /usr/powerpc-linux-gnu
            cflags: -static
            ldflags: -static

          - name: Ubuntu GCC PPC64
            os: ubuntu-latest
            compiler: powerpc64-linux-gnu-gcc
            configure-args: --warn --static
            chost: powerpc-linux-gnu
            packages: qemu-system qemu-user gcc-powerpc64-linux-gnu libc-dev-ppc64-cross
            qemu-run: qemu-ppc64 -L /usr/powerpc64-linux-gnu
            cflags: -static
            ldflags: -static

          - name: Ubuntu GCC PPC64LE
            os: ubuntu-latest
            compiler: powerpc64le-linux-gnu-gcc
            configure-args: --warn
            chost: powerpc64le-linux-gnu
            packages: qemu-system qemu-user gcc-powerpc64le-linux-gnu libc-dev-ppc64el-cross
            qemu-run: qemu-ppc64le -L /usr/powerpc64le-linux-gnu

          - name: Ubuntu GCC S390X
            os: ubuntu-latest
            compiler: s390x-linux-gnu-gcc
            configure-args: --warn --static
            chost: s390x-linux-gnu
            packages: qemu-system qemu-user gcc-s390x-linux-gnu libc-dev-s390x-cross
            qemu-run: qemu-s390x -L /usr/s390x-linux-gnu
            cflags: -static
            ldflags: -static

          - name: macOS GCC 13
            os: macos-latest
            compiler: gcc-13
            configure-args: --warn

          - name: macOS GCC 14
            os: macos-latest
            compiler: gcc-14
            configure-args: --warn

          - name: macOS GCC 15
            os: macos-latest
            compiler: gcc-15
            configure-args: --warn

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            configure-args: --warn

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install packages (Ubuntu)
      if: runner.os == 'Linux' && matrix.packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}

    - name: Generate project files
      run: |
        [ -d ${{ matrix.build-dir || '.' }} ] || mkdir ${{ matrix.build-dir || '.' }}
        cd ${{ matrix.build-dir || '.' }}
        ${{ matrix.src-dir || '.' }}/configure ${{ matrix.configure-args }}
      env:
        CC: ${{ matrix.compiler }}
        CFLAGS: ${{ matrix.cflags }}
        LDFLAGS: ${{ matrix.ldflags }}
        CHOST: ${{ matrix.chost }}

    - name: Compile source code
      run: make -j2
      working-directory: ${{ matrix.build-dir }}

    - name: Run test cases
      run: |
        make test
        # make cover
      working-directory: ${{ matrix.build-dir }}
      env:
        QEMU_RUN: ${{ matrix.qemu-run }}

    - name: Upload build errors
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: ${{ matrix.name }} (configure)
        path: |
          ${{ matrix.build-dir || '.' }}/configure.log
        retention-days: 7
