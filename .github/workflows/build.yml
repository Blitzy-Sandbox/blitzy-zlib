# Build & Test — the primary Rust continuous-integration workflow for the
# zlib -> Rust migration workspace.
#
# History / consolidation
# -----------------------
# This workflow is the rename-successor of the former C build/test CI and also
# absorbs the cross-platform coverage that the C era spread across several
# separate pipelines (a native autotools matrix, a Windows emulation matrix and
# a BSD / Solaris virtual-machine matrix). All of that is collapsed into three
# first-class, native Cargo runners (Linux, macOS, Windows): the Rust toolchain
# ships native Windows and macOS support out of the box, so no third-party
# emulation layer is required.
#
# What it exercises
# -----------------
# The three-member Cargo workspace — zlib-rs (the safe core), libz-rs-sys (the
# FFI C-ABI shim) and libz-rs-sys-cdylib (the drop-in) — built with the default
# feature set (std, gzip, gz-io, simd). The preserved C sources are linked only
# indirectly, as an interop reference, through the flate2 dev-dependency that is
# pulled in by `cargo test` (the interop.rs suite); there is no C build step.
#
# Sibling workflows (kept deliberately separate)
# ----------------------------------------------
#   * lint.yml   — cargo clippy, cargo fmt and `cargo bench --no-run` gates.
#   * cdylib.yml — the cdylib drop-in (shared / static library) gate.
#   * fuzz.yml   — the preserved OSS-Fuzz integration.
name: Build & Test

on: [push, pull_request]

jobs:
  # ---------------------------------------------------------------------------
  # Primary gate: build (debug + release) and run the full test suite on each of
  # the three supported host operating systems using the workspace-pinned NIGHTLY
  # toolchain (rust-toolchain.toml). Nightly is REQUIRED for the default workspace
  # build because the `libz-rs-sys-cdylib` drop-in enables the `c-variadic`
  # feature for the variadic `gzprintf` export, whose definition needs the
  # unstable `#![feature(c_variadic)]`. Installing nightly here makes the CI
  # toolchain match the one cargo actually resolves to from rust-toolchain.toml.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Promote C-ABI header/signature parity to a HARD gate. The workspace build
    # compiles the cdylib drop-in (c-variadic on), so cbindgen emits all 73
    # symbols and libz-rs-sys/build.rs PANICS on any drift vs canonical zlib.h
    # instead of merely warning (LIBZ_RS_SYS_STRICT_HEADER). See build.rs.
    env:
      LIBZ_RS_SYS_STRICT_HEADER: "1"
    strategy:
      # A failure on one operating system must not cancel the others; we want
      # the complete cross-OS signal on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (nightly — matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (debug)
        run: cargo build --workspace --verbose

      - name: Build workspace (release)
        run: cargo build --workspace --release --verbose

      - name: Run workspace test suite
        run: cargo test --workspace --verbose

  # ---------------------------------------------------------------------------
  # Feature-matrix gate: the workspace must BUILD and TEST under each supported
  # non-default Cargo feature combination — not only the default set exercised by
  # the `build` job above. This guards the independent feature flags the AAP
  # declares (`std`, `gzip`, `gz-io`, `simd`, `no-std`) against regressions where
  # one feature's code path references another feature's API.
  #
  # The `--no-default-features --features std` variant is a first-class
  # acceptance requirement: a std-only build must NOT reference any gzip-gated
  # state (for example the FFI shim's inflate gz-header write-back, which is
  # gated on `all(feature = "std", feature = "gzip")`). It is pinned explicitly
  # in the matrix so the std-only regression that previously broke the build can
  # never silently return.
  #
  # NOTE: LIBZ_RS_SYS_STRICT_HEADER is deliberately NOT set here. These reduced
  # feature sets intentionally omit symbols (for example the gz file-I/O family
  # when `gz-io` is off), so the generated header legitimately differs from the
  # canonical zlib.h and the strict-parity panic would be a false failure. Strict
  # header parity remains gated by the full-feature `build` job above.
  feature-matrix:
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Surface every failing feature combination on a single run.
      fail-fast: false
      matrix:
        include:
          - name: "no-default (no_std core)"
            flags: "--no-default-features"
          - name: "std only"
            flags: "--no-default-features --features std"
          - name: "gzip only"
            flags: "--no-default-features --features gzip"
          - name: "std + gzip"
            flags: "--no-default-features --features std,gzip"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (nightly — matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (${{ matrix.name }})
        run: cargo build --workspace ${{ matrix.flags }} --verbose

      - name: Test workspace (${{ matrix.name }})
        run: cargo test --workspace ${{ matrix.flags }} --verbose

  # ---------------------------------------------------------------------------
  # Minimum-Supported-Rust-Version gate (stable 1.85). Build-only on purpose:
  # `cargo build` does not pull the dev-dependencies (criterion / flate2 /
  # quickcheck / rand) whose own minimum versions can exceed 1.85, so this
  # isolates the *library* MSRV guarantee from dev-tool requirements. Running the
  # test suite here would defeat that isolation, hence there is no `cargo test`
  # step below.
  #
  # Scope: only the members that compile on a STABLE toolchain — the `zlib-rs`
  # core and the 72-symbol `libz-rs-sys` shim (`c-variadic` is OFF by default).
  # The full 73-symbol drop-in (the cdylib's c-variadic `gzprintf`) needs the
  # unstable `#![feature(c_variadic)]` and is therefore covered by the nightly
  # `build` job above, not here. Because rust-toolchain.toml pins nightly, this
  # job sets RUSTUP_TOOLCHAIN=1.85.0 (which takes precedence over the
  # rust-toolchain.toml channel) so the gate genuinely runs on 1.85.0.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV (1.85, stable core + 72-symbol shim)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85.0 (workspace MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Build stable core (zlib-rs)
        run: cargo build -p zlib-rs --verbose

      - name: Build 72-symbol FFI shim (libz-rs-sys, c-variadic off)
        run: cargo build -p libz-rs-sys --verbose
