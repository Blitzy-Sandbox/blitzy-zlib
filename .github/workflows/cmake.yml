name: CMake

# This matrix is the C library's, and the four `rust: yes` rows at the end of it
# are the Rust library's, built through the same CMakeLists with
# -DZLIB_BUILD_RUST=ON.  Both are here because the CMake path is one contract with
# two backends, and a matrix that exercised only one of them would let the other's
# install rules, exported targets and CTest registrations rot.
#
# The C rows are unaffected by the addition.  `fail-fast: false` (below, and
# already there before) means a Rust row going red cancels nothing, and every step
# that touches a Rust toolchain is guarded on `matrix.rust`, so a C row neither
# installs one nor probes for one.
#
# WHY ONLY SINGLE-CONFIG GENERATORS CARRY A RUST ROW.  CMakeLists refuses
# -DZLIB_BUILD_RUST=ON under a multi-config generator, with a FATAL_ERROR that
# explains why: cargo has two profiles where CMake has four configurations, and
# add_custom_command's OUTPUT/BYPRODUCTS/DEPENDS take generator expressions only
# from CMake 3.20 while IMPORTED_LOCATION takes none at any version -- so Debug
# and Release would share one cargo output directory and one staged library,
# whichever was built last winning silently.  That rules out the MSVC rows, whose
# `-A Win32`/`-A x64`/`-A ARM64` select the Visual Studio generator.
#
# WHY NO WINDOWS ROW EVEN SO.  `Windows GCC` is single-config already -- it uses
# Ninja -- so the paragraph above does not exclude it, and two other things do.
# Its compiler is MinGW, while `rustup toolchain install stable` on that runner
# installs the MSVC host toolchain, and CMakeLists names cargo's archive with the
# platform's own conventions: that spelling is libz.a for a GNU toolchain and
# z.lib for an MSVC one, so the file CMake would look for is not the file cargo
# would write.  Staging a Windows drop-in INSTALL is not wired either -- build.rs
# emits neither a soname nor a version script for PE/COFF, and win32/zlib.def,
# the PE analogue of zlib.map, is out of scope for this port per AAP 0.2.2.3.  So
# Windows is covered where that coverage is real, and in rust.yml rather than
# here: `build-test` compiles the workspace and runs its tests on
# `windows-latest`, which is what would catch an LLP64 regression in the `uLong`
# mapping, and `platform-abi-windows` goes further without needing the excluded
# file -- it reads the PE export table, requires `gzopen_w` (declared only under
# _WIN32, so no Linux job can see it), and has MSVC compile a C consumer plus the
# UNMODIFIED test/minigzip.c against cargo's import library and run them.  A row
# HERE would still go red on every push, for the two reasons above, and would
# establish nothing those jobs do not.
#
# WHY THE macOS ROW IS STATIC-ONLY.  The Rust SHARED library is relinked through
# zlib.map with `-soname`, so CMakeLists refuses that combination on not-UNIX,
# Apple, AIX and SunOS -- the same platform set the C shared target hands
# zlib.map to, so the two agree by construction.  The Mach-O SHARED artifact is
# therefore staged outside CMake, by rust.yml's `platform-abi-macos` job, which
# uses that format's own analogues -- `-install_name`, and an exported-symbols
# list derived from zlib.h -- and relinks the three unmodified C drivers against
# it.  The static archive needs none
# of it: cargo emits a complete one wherever it runs, and CMakeLists copies it
# under the platform's own archive name.  `-DZLIB_BUILD_SHARED=OFF` on that row
# is therefore not a workaround but the supported mode, and configuring it is the
# point -- this is the only place in the repository that holds that support claim
# to an actual build, on the one platform whose shared half is refused.
#
# `-DZLIB_PREFIX=ON` is likewise refused with the Rust build and appears in no row
# here.
#
# The `rust.yml` workflow's own `cmake-rust` job is NOT made redundant by these
# rows and is not replaced by them: it goes further on one configuration --
# installing, then compiling and RUNNING C consumers against the installation
# through pkg-config, through the static archive and through find_package, with an
# `ldd` assertion that the Rust artifact is the one bound.  These rows are breadth
# across compilers and platforms; that job is depth on one.
on: [push, pull_request]

# ★ LEAST PRIVILEGE, declared once so that it covers the C rows and the four Rust
# rows alike.  Without this block the workflow receives whatever the repository's
# default token permissions happen to be -- `contents: write` on many
# repositories -- and every step here would run with a token able to rewrite the
# tree it just checked out, on a pull request, from a fork.  Nothing in this
# workflow writes to the repository: it configures, builds, runs CTest and packages.
# `contents: read` is what those need; `actions/upload-artifact` uses the runner's
# own artifact token rather than this one.  A job that later needs more must ask in
# its own `permissions:` block, which puts the request in the diff.  rust.yml
# carries the identical block for the same reason.
permissions:
  contents: read

jobs:
  ci-cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu GCC no shared
            os: ubuntu-latest
            compiler: gcc
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DZLIB_BUILD_SHARED=OFF -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu GCC no static
            os: ubuntu-latest
            compiler: gcc
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DZLIB_BUILD_STATIC=OFF -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu GCC -O3
            os: ubuntu-latest
            compiler: gcc
            cflags: -O3 -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu Clang Debug
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra
            build-config: Debug
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Windows MSVC Win32
            os: windows-latest
            compiler: cl
            cflags: /W3
            cmake-args: -A Win32
            pkgtgt: PACKAGE

          - name: Windows MSVC Win64
            os: windows-latest
            compiler: cl
            cflags: /W3
            cmake-args: -A x64 -DMINIZIP_ENABLE_BZIP2=OFF
            pkgtgt: PACKAGE

          - name: Windows MSVC ARM64
            os: windows-11-arm
            compiler: cl
            cflags: /W3
            cmake-args: -A ARM64 -DMINIZIP_ENABLE_BZIP2=OFF
            pkgtgt: PACKAGE

          - name: Windows GCC
            os: windows-latest
            compiler: gcc
            cflags: -Wall -Wextra
            cmake-args: -G Ninja -DMINIZIP_ENABLE_BZIP2=OFF
            pkgtgt: package

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 13
            os: macos-latest
            compiler: gcc-13
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 14
            os: macos-latest
            compiler: gcc-14
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 15
            os: macos-latest
            compiler: gcc-15
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          # ---- the same contract, Rust backend (AAP 0.4.1.6) ----------------
          # CFLAGS is deliberately left off these rows: with ZLIB_BUILD_RUST=ON
          # the library is compiled by cargo, so -Wall -Wextra would describe
          # only minizip and the test drivers and reading a green row as "the
          # library built warning-free" would be wrong.
          - name: Ubuntu GCC Rust
            os: ubuntu-latest
            compiler: gcc
            rust: yes
            pkgtgt: package package_source
            cmake-args: -DZLIB_BUILD_RUST=ON -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu GCC Rust no shared
            os: ubuntu-latest
            compiler: gcc
            rust: yes
            pkgtgt: package package_source
            cmake-args: -DZLIB_BUILD_RUST=ON -DZLIB_BUILD_SHARED=OFF -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu Clang Rust
            os: ubuntu-latest
            compiler: clang
            rust: yes
            pkgtgt: package package_source
            cmake-args: -DZLIB_BUILD_RUST=ON -DMINIZIP_ENABLE_BZIP2=ON

          # -DZLIB_BUILD_SHARED=OFF is required on this row rather than chosen:
          # with it ON, CMakeLists stops at configure time on Apple, because the
          # Rust shared library is relinked through zlib.map.  See the header.
          - name: macOS Clang Rust
            os: macos-latest
            compiler: clang
            rust: yes
            pkgtgt: package
            cmake-args: -DZLIB_BUILD_RUST=ON -DZLIB_BUILD_SHARED=OFF -DMINIZIP_ENABLE_BZIP2=ON

    steps:
    - name: Checkout repository
      # ★ PINNED TO A COMMIT, NOT A TAG, and the credential is not left behind.
      # `actions/checkout@v6` is a MUTABLE reference: the tag can be moved to any
      # commit at any time by anyone who can write to that repository, so the code
      # this workflow runs on every push and every pull request is not the code
      # anybody reviewed.  A digest cannot be moved.  The comment records which
      # release the digest is, so the pin stays legible and can be bumped
      # deliberately -- it is the same digest rust.yml and contribs.yml pin.
      #
      # `persist-credentials: false` stops the action writing an
      # `http.extraheader` with the job's token into ../build/../.git/config, where
      # it stays readable for the rest of the job.  This workflow only needs the
      # tree; nothing fetches, pushes or tags.  Together with the `permissions:`
      # block above, a step that tried to use the token would find neither the
      # credential nor the scope.
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Install packages (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install --no-progress nsis

    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt install libbz2-dev

    - name: Install Rust toolchain
      # Only the rust: yes rows.  A C row must not acquire a new requirement from
      # this file -- that is the whole reason the Rust build is opt-in in
      # CMakeLists too, where nothing is probed unless ZLIB_BUILD_RUST is ON.
      #
      # The two rustup components are named even though neither gate runs in this
      # workflow, because rust-toolchain.toml asks for them.  Omitting them does
      # not skip the download, it defers it to the first in-tree cargo invocation
      # -- which is the one CMake makes inside a custom command during `Compile
      # source code', where a failed component fetch reads as a build failure
      # instead of a provisioning one.  This spelling is the one that
      # rust-toolchain.toml names as the command its `profile` and `components`
      # are equivalent to.
      if: ${{ matrix.rust == 'yes' }}
      run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
    - name: Generate project files
      run: cmake -S . -B ../build ${{ matrix.cmake-args }} -D CMAKE_BUILD_TYPE=${{ matrix.build-config || 'Release' }} -DZLIB_BUILD_MINIZIP=ON
      env:
        CC: ${{ matrix.compiler }}
        CFLAGS: ${{ matrix.cflags }}

    - name: Compile source code
      run: cmake --build ../build --config ${{ matrix.build-config || 'Release' }}

    - name: Run test cases
      run: ctest -C Release --output-on-failure --max-width 120
      working-directory: ../build

    - name: create packages
      run: cmake --build ../build --config ${{ matrix.build-config || 'Release' }} -t ${{ matrix.pkgtgt }}

    - name: Upload build errors
      # Pinned for the same reason as the checkout above: a mutable tag is a
      # dependency somebody else can change after review.  Same digest as rust.yml.
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: ${{ matrix.name }} (cmake)
        path: |
          ../build/CMakeFiles/CMakeOutput.log
          ../build/CMakeFiles/CMakeError.log
        retention-days: 7
