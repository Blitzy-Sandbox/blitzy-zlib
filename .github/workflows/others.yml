  solaris:
    runs-on: ubuntu-latest
    name: Solaris
    steps:
    - uses: actions/checkout@v6
    - name: Solaris
      uses: vmactions/solaris-vm@v1
      with:
        copyback: false
        release: "11.4-gcc"
        prepare: |
          pkgutil -U
          pkgutil -y -i cmake bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure
