name: anyVM-OSes

# The C library on the exotic operating systems below, each inside its own VM.
# These jobs REMAIN C-ONLY, and that is a decision rather than an omission: the
# Rust library is built for Tier-1 targets, and DragonflyBSD, NetBSD, OpenBSD,
# Solaris and the rest are not among them.  Installing a Rust toolchain in these
# VMs would test rustup's platform support, not this port (AAP 0.4.1.6).
#
# What they do contribute to the port is the C oracle's portability: the
# implementation these rows build is the same one crates/zlib-rs-differential
# compiles as the differential baseline, so a C build that broke on one of these
# platforms would be a problem for the comparison as well as for the C library.
on: [push, pull_request]

jobs:

  dragonflybsd:
    runs-on: ubuntu-latest
    name: DragonflyBSD
    steps:
    - uses: actions/checkout@v6
    - name: DragonflyBSD
      uses: vmactions/dragonflybsd-vm@v1
      with:
        copyback: false
        prepare: |
          pkg install -y cmake gcc14 bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
          - name: x86_64
    steps:
    - uses: actions/checkout@v6
    - name: FreeBSD - ${{ matrix.name }}
      uses: vmactions/freebsd-vm@v1
      with:
        arch: ${{ matrix.name }}
        copyback: false
        release: "15.0"
        prepare: |
          pkg install -y cmake gcc14 bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure -E .*summary

  netbsd:
    runs-on: ubuntu-latest
    name: NetBSD - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
          - name: x86_64
    steps:
    - uses: actions/checkout@v6
    - name: NetBSD - ${{ matrix.name }}
      uses: vmactions/netbsd-vm@v1
      with:
        copyback: false
        prepare: |
          export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
          export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages"
          export PKG_PATH="$PKG_PATH/$(uname -s)/$(uname -m)/$(uname -r|cut -f '1 2' -d.)/All"
          /usr/sbin/pkg_add cmake
          /usr/sbin/pkg_add bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure

  omni-os:
    runs-on: ubuntu-latest
    name: OmniOS
    steps:
    - uses: actions/checkout@v6
    - name: OmniOS
      uses: vmactions/omnios-vm@v1
      with:
        copyback: false
        prepare: |
          pkg install cmake gcc14 make bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build --output-on-failure

  openbsd:
    runs-on: ubuntu-latest
    name: OpenBSD - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
          - name: x86_64
          - name: riscv64
    steps:
    - uses: actions/checkout@v6
    - name: OpenBSD - ${{ matrix.name }}
      uses: vmactions/openbsd-vm@v1
      with:
        arch: ${{ matrix.name }}
        copyback: false
        prepare: |
          pkg_add cmake
          bzip2

        run: |
          cmake . -B build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=ON
          cmake --build build/
          ctest --test-dir build

