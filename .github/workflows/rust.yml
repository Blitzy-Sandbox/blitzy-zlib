# =============================================================================
# Rust CI -- the enforcement point for the memory-safe Rust port of zlib.
#
# The Cargo workspace at the top of this tree reimplements the zlib engine in
# safe Rust and re-exports it through a thin `extern "C"` facade, so that a
# consumer already linked against `libz` keeps working with no edit and no
# recompilation.  Every claim in that sentence is checked by a job below.
#
# ★ THE JOB INVENTORY, and it is the whole of it -- TWENTY-TWO jobs, in the order
# they appear in this file.  Anything not on this list does not exist here, and
# every name here can be found as a `<name>:` key under `jobs:`:
#
#     build-test   format   lint     deny      msrv     integer-models
#     features     simd     differential       differential-exhaustive
#     symbols      header   dropin   platform-abi-macos platform-abi-windows
#     miri         miri-harness       miri-facade        asan
#     fuzz         cmake-rust         bench
#
# This list is CHECKED rather than maintained by hand: check 8 of
# .github/scripts/docs_consistency_gate.py compares it against the `jobs:` keys in
# BOTH directions and fails on either a job missing from it or a name on it that no
# longer exists.  It said EIGHTEEN while twenty-two were declared -- `miri-harness`,
# `miri-facade` and the two `platform-abi-*` jobs were absent from it -- which is
# exactly the drift a header inventory invites and the reason it is now gated.
#
# THE `make rust*` TARGETS.  Nine exist; SEVEN are named in this file, so those
# parts are reproducible by hand exactly as CI runs them:
#
#     make rust          `symbols`, `header`, `dropin`, `cmake-rust`
#     make rust-header   `header`
#     make rust-pc       `symbols`, `dropin`
#     make rust-test     named in prose as the local equivalent
#     make rust-symbols  likewise
#     make rust-msrv     likewise
#     make rust-clean    likewise
#
# The four named only in prose are NOT run as steps: the jobs covering the same
# ground -- `dropin`, `symbols` and `msrv` -- drive the compilers directly so that
# the CI transcript names each assertion individually.  `make rust-simd` and
# `make rust-inventory` are the two not named here at all; the `simd` and `dropin`
# jobs invoke their gate scripts -- simd_vector_gate.py and
# artifact_inventory_gate.py -- directly instead, for the same reason.  Run every
# target locally as well; they are the same checks with a different reporting
# surface, and Makefile.in's header comment states for each one what it does and
# does not establish.
#
# What each job enforces, by the quality-bar constraint it answers:
#
#   (a) unsafe containment .... `miri` (the safe core, which contains no FFI and
#                               is therefore Miri-COMPATIBLE: Miri interprets
#                               the test suite the job selects, and what is not
#                               executed is not analysed) and
#                               `asan` (the facade, where the raw pointers of
#                               the six unavoidable unsafe site categories are,
#                               instrumented both on its own and with
#                               `-Zbuild-std` so that faults inside `std`
#                               routines reached from the facade are attributed;
#                               it also instruments the three C drivers, the
#                               dev-only differential harness and a compile of
#                               the criterion suites -- see that job's own SCOPE
#                               note for the five items and the one exclusion)
#   (b) contract immutability . `header` (cbindgen signature/field/macro gate)
#                               and `symbols` (nm parity against the 111-symbol
#                               C baseline, the SONAME, and the hidden set)
#   (c) behavioral fidelity ... `differential` and `differential-exhaustive`.
#                               `differential` runs three tiers: the fast
#                               representative sweep, the armed exhaustive
#                               INTEROPERABILITY product (cheap -- seconds), and
#                               both suites again with `--features simd` to prove
#                               the vectorised checksum backends are
#                               output-neutral.  The exhaustive BYTE-IDENTITY
#                               matrix is the other job, because it needs
#                               sharding: sixteen rows, eight cell slices x both
#                               checksum backends, with a coverage gate that
#                               reads each level's own accounting line.  A push
#                               runs the armed product; the nightly `schedule`
#                               run lifts the one declared exclusion and
#                               enumerates all 9,922,500 cells
#   (d) verification clean .... `miri`, `asan`, `fuzz` (five targets, 300 s
#                               each, zero crashes, with the differential
#                               checksum target run once per backend) and
#                               `dropin` (the three UNMODIFIED C drivers,
#                               relinked and run)
#   (e) lint and format ....... `format` and `lint`, each over ALL THREE
#                               workspaces.  The root manifest excludes `benches`
#                               and `fuzz` and each of those carries its own
#                               [workspace] table, so `--all` from the root
#                               reaches neither: both jobs additionally invoke the
#                               two excluded manifests by `--manifest-path`.
#   (f) no panics in library .. `lint`.  The deny-level `unwrap_used`,
#                               `expect_used`, `indexing_slicing`, `panic` and
#                               `panic_in_result_fn` lints are declared in
#                               Cargo.toml's [workspace.lints], so running
#                               clippy with `-D warnings` IS the enforcement.
#                               There is deliberately no grep-for-unwrap job.
#   (h) MSRV honored .......... `msrv` (an all-features build on the declared
#                               1.80 floor, warnings denied)
#   (i) dependency minimalism . `deny` (cargo-deny over ALL THREE policy graphs:
#                               the root deny.toml, fuzz/deny.toml and
#                               benches/deny.toml, neither of the last two being
#                               reachable from the root command)
#
# `features` answers no single constraint and is required by all of them: it
# builds, tests and lints every feature configuration a consumer can select --
# core with no default, rust-api, std and simd; facade with no default,
# libz-compat alone, gz alone and default plus simd; and the whole workspace with
# --all-features -- because a cfg that nothing compiles is a cfg the other
# seventeen jobs never look at.  `simd` is the companion job that holds the
# DOCUMENTED ZLIB_RS_SIMD=0|1 toggle to its contract, which is a different
# property from compiling the feature.
#
# And the performance targets of AAP 0.8.4, which are the one set of claims no
# single job can settle:
#
#   `bench`         is ONE job, and it both measures and decides.  There is no
#                   separate `bench-gate` job and no separate `bench-silesia`
#                   job; prose here described both for a while, and neither has
#                   ever existed.  What the single job does, in step order:
#                     * measures across the matrix -- the shipped `bench`
#                       profile, the non-LTO `bench-parity` profile that is
#                       comparable to the way the C oracle is BUILT, and the
#                       shipped profile with the vectorised checksum backends;
#                     * self-tests the gate against a committed synthetic log
#                       before trusting it -- including deliberate failures,
#                       because a gate that cannot fail is not a gate.  The case
#                       count is deliberately not repeated here: it said 35 while
#                       the suite ran 49, and the suite prints its own total on
#                       every run, which is the figure to read;
#                     * GATES the measurements with `.github/scripts/bench_gate.py`
#                       -- a committed program, not a heredoc -- which validates
#                       each suite's own declared inventory, enforces the AAP
#                       0.8.4 limits only on the groups those suites publish as
#                       authoritative, and takes the ratio from criterion's
#                       `estimates.json` rather than from the log's own summary;
#                     * runs the Silesia tier when, and only when, a corpus is
#                       provisioned outside this workflow.  Nothing here fetches
#                       one: the cache step is restore-only and the only
#                       invocation of the fetch script is `--verify-only`.  When
#                       the tier is armed and no corpus is present the job FAILS
#                       and says what to configure; when it is not armed it warns
#                       and the minimal corpus never stands in for Silesia.
#
# EVERY JOB THAT COMPARES AGAINST THE C ORACLE RUNS BOTH CHECKSUM BACKENDS.
# `simd` is default-off and required to be output-neutral, so `differential`,
# `differential-exhaustive`, `bench` and `fuzz` each carry a scalar row and a
# `--features simd` row, and every artifact is labelled with which it was.
#
# (g), the documented-public-API constraint, is enforced in-crate by
# `#![deny(missing_docs)]` and is therefore covered by any warning-free build.
# It gets no job of its own on purpose.
#
# THE FEATURE SPACE IS ALSO A CONTRACT, and THREE jobs hold different halves of
# it.  `simd`, `libz-compat` and `gz` are declared supported in the manifests, and
# a default build compiles none of the vectorised checksum backends and never once
# compiles the core as the `no_std` + `alloc` crate its manifest describes.  So:
#
#   * `build-test` covers the two SHIPPING shapes on all three host triples -- a
#     default build, a `--features libz-compat` build, `cargo test --workspace`
#     and the same again with `--all-features`, which is what compiles `std`,
#     `rust-api` and the vectorised backends into a deterministic test run.
#   * `features` takes the configurations ONE AT A TIME, nine of them, building,
#     testing and linting each on its own -- because `--all-features` cannot show
#     that `--no-default-features` compiles.
#   * `simd` holds the documented `ZLIB_RS_SIMD=0|1` toggle to its contract: two
#     agreeing spellings must be accepted (`1` with the feature on, `0` with it
#     off) and two contradictions must be REFUSED by name (`1` with the feature
#     off, `0` with it on), because a build script that ignored the variable would
#     satisfy a gate that only checked the agreeing cases.  The build script
#     additionally rejects a malformed value, which is its own assertion and not
#     one this workflow exercises.  That job also runs the byte-identity sweep and
#     the checksum fuzz target with the feature on, which is where output
#     neutrality is measured rather than argued.
#
# DIVISION OF LABOUR -- none of the following is redundant with this file, and
# none of it may be deleted in favour of this file:
#
#   * fuzz.yml   keeps OSS-Fuzz/CIFuzz pointed at the C oracle.  The `fuzz` job
#                here is cargo-fuzz over the RUST targets.  Two implementations,
#                two fuzzers; the 300 s budget is shared so the two are
#                comparable.
#   * c-std.yml  keeps compiling the UNCHANGED zlib.h from C89 through gnu2x.
#                That is the other half of contract immutability: this file
#                proves the Rust library still matches the header, c-std.yml
#                proves the header itself still compiles everywhere.
#   * cmake.yml  exercises the CMake contract with BOTH backends.  Its C rows are
#                the C library's; its four `rust: yes` rows configure with
#                `-DZLIB_BUILD_RUST=ON` across gcc, clang, a no-shared build and
#                macOS -- breadth, on single-config generators only, because
#                CMakeLists refuses the Rust build under a multi-config one.  Every
#                Rust-toolchain step there is guarded on `matrix.rust` and
#                `fail-fast: false` was already set, so a Rust row cannot perturb a
#                C row.  The `cmake-rust` job in THIS file is not superseded by
#                them and is not redundant with them: it goes DEEP on one
#                configuration -- installing, then compiling and RUNNING C
#                consumers against the installation through pkg-config, the static
#                archive and find_package, with an `ldd` assertion that the Rust
#                artifact is the one bound, plus the ZLIB::ZLIB /
#                ZLIB::ZLIBSTATIC redirection and the installed layout.
#   * contribs.yml builds the out-of-scope contrib/ consumers against BOTH
#                libraries: its original jobs against the C one, and its
#                `ci-cmake-rust` job against a `-DZLIB_BUILD_RUST=ON`
#                installation.  That second one is the strongest drop-in evidence
#                in this repository and exists nowhere else, including here.  Its
#                five rows are ada, blast, iostream3, minizip and puff --
#                third-party code this port has never seen, written against zlib.h
#                alone and consuming the installed package through
#                `find_package(ZLIB CONFIG)`.  Ada earns its place in the list
#                rather than being elided as a fifth: it reaches the library
#                through a language binding that declares the entry points itself,
#                so it tests the ABI with no access to the header's macros at all.
#                Nothing in THIS file touches contrib/, and nothing edits it.
#   * configure.yml, msys-cygwin.yml and others.yml stay C-only, which is itself
#                evidence: ./configure degrades to an empty $(CARGO) when there is
#                no cargo and the C build proceeds unchanged, so those green rows
#                prove the Rust workspace added no requirement to the C build.
#                They also mark the Rust Tier-1 boundary -- cross-compiled,
#                MSYS2/Cygwin and exotic-OS rows have no Rust counterpart.
#
# Nothing in this file writes to zlib.h, zconf.h, zlib.map, any C translation
# unit, anything under contrib/, or any of the three test drivers.  zlib.h and
# zlib.map are CONSUMED -- as the header-diff target and as the linker version
# script -- and never modified.  Two steps are the stated exceptions and both
# assert their way back: the `header` job's last step runs `make distclean`, which
# REPLACES the tracked Makefile from Makefile.in's printf sequence and rewrites
# zconf.h from zconf.h.in, and then requires `git status --porcelain` to be empty
# -- the regeneration has to be byte-exact or the job fails; and the `dropin`
# job's last step runs ./configure in a COPY of the tree under RUNNER_TEMP,
# precisely so it does not run here.  No job downloads a benchmark corpus: the Silesia
# tier of `bench` reads one a runner already has -- restore-only cache, and the
# fetch script invoked only as `--verify-only` -- and every other job, benchmarks
# included, runs on the committed minimal corpus.
# =============================================================================

name: Rust

on:
  push:
  pull_request:
  # ★ THE UNABRIDGED BYTE-IDENTITY PRODUCT RUNS ON A SCHEDULE, and until this
  # trigger existed it ran only when a human asked for it by hand.  AAP 0.1.1.1
  # goal 3 makes byte-identical output a governing requirement, and the whole
  # 9,922,500-cell product is what substantiates it; a push and a pull request run
  # the armed 9,459,450 because `full` costs roughly four times the wall clock, so
  # without a scheduled run the remaining 463,050 cells -- the seven sub-64-byte
  # windows over window_boundary.bin's 66,560 incompressible bytes -- were never
  # continuously verified at all.  They are now, nightly, on the default branch,
  # and the coverage gate asserts that a scheduled run really is running `full`
  # rather than trusting the mapping below.
  schedule:
    - cron: '17 3 * * *'
  # ★ A PUBLISHED RELEASE IS AN ACCEPTANCE EVENT, and until this trigger existed
  # nothing distinguished one from an ordinary push.  AAP 0.8.4 states the <=10%
  # throughput and <=15% memory bars against the SILESIA corpus, and AAP 0.6.4.6
  # reads them from that corpus by name; the `bench` job below can only measure it
  # when a corpus has been provisioned, so on a push it announces the omission and
  # measures the committed minimal corpus instead.  That is right for a push and
  # wrong for a release: shipping is exactly when the named number must exist.  On
  # this event and on the schedule above, the corpus is MANDATORY -- see the
  # `acceptance` step of `bench`, which fails rather than warns on these two events.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      differential_mode:
        description: >-
          How much of the byte-identity product the exhaustive differential
          shards enumerate. `1` runs the armed product (9,459,450 cells, the
          46,305-per-level tiny-window-over-window_boundary.bin cells declared
          and counted as excluded); `full` lifts that one exclusion and runs the
          whole 9,922,500, which costs roughly four times the wall clock. The
          scheduled run above always uses `full`, so this input is for asking for
          it early rather than for reaching it at all.
        default: '1'
        required: false
        type: choice
        options:
          - '1'
          - 'full'

# Least privilege, declared once at the top so that it applies to every job and a
# new job cannot inherit more than it needs.  Nothing here writes to the
# repository: no job pushes a commit, opens a release, comments on a pull request
# or touches a package registry.  Without this block the workflow would receive
# whatever the repository's default token permissions happen to be -- which is
# `contents: write` on many repositories -- and every one of the twenty-odd
# third-party-free steps below would run with a token able to rewrite the tree it
# is checking.  A job that later needs more must ask for it in its own
# `permissions:` block, which makes the request reviewable in the diff.
permissions:
  contents: read

# One run of this workflow per ref at a time.
#
# The matrix here is wide -- three platforms, five fuzz targets, Miri, ASan and a
# multi-hour benchmark -- so two runs on the same branch compete for runners and
# the older one's result is worthless the moment it is superseded.  The group key
# is the pull request number when there is one and the ref otherwise, so a pull
# request and a branch push never cancel each other.
#
# Cancellation is deliberately limited to pull requests. A superseded pull-request
# run has no lasting value, but a push run IS the recorded status of that commit,
# and cancelling it would leave commits on a branch with no verdict at all --
# which matters for a library where "was this commit green?" is the question a
# bisect asks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ---------------------------------------------------------------------------
  # 1. The user-facing build and the whole test suite, on the Tier-1 targets.
  #
  # The three cargo lines are the project's own stated build commands, used
  # verbatim.  `--locked` is added to every invocation because Cargo.lock is
  # committed: this artifact ships as a system library, so a build that
  # silently re-resolved a dependency would not be reproducible.
  #
  # The macOS and Windows rows are not decoration.  `uLong` is C's
  # `unsigned long`, which is 8 bytes on LP64 and 4 on LLP64 Windows, so the
  # facade maps it to `core::ffi::c_ulong` rather than to a fixed-width
  # integer; the Windows row is what catches a regression to `u64`, and it is
  # the only place that can.  Fast-fail is switched off on the matrix so that
  # one platform's failure cannot hide the others'.
  #
  # WHAT THIS MATRIX DOES AND DOES NOT ESTABLISH.  It establishes that the
  # workspace COMPILES and its TESTS PASS on the three Tier-1 platforms, and that
  # is all it establishes -- it packages nothing, measures no export surface and
  # links no C consumer.  Do not cite THIS MATRIX as evidence of ABI
  # compatibility on macOS or Windows.
  #
  # The packaged claim is made elsewhere, once per format, and this comment used
  # to say it was made on Linux alone.  It no longer is:
  #
  #   * ELF     -- `symbols` and `dropin`, on ubuntu-latest.  `make rust` stages
  #                the versioned chain, relinked under `zlib.map` with `-soname`,
  #                and the three C drivers are relinked against it with an `ldd`
  #                assertion that the staged library is the one bound.
  #   * Mach-O  -- `platform-abi-macos`.  `CMakeLists.txt` refuses a Rust SHARED
  #                library when not (UNIX and not Apple/AIX/SunOS), so that job
  #                drives cargo directly, stages the dylib from the complete
  #                archive with an exported-symbols list derived from `zlib.h`,
  #                and relinks the same three unmodified drivers.
  #   * PE/COFF -- `platform-abi-windows`.  A full drop-in INSTALL stays out of
  #                scope there -- its mechanism is `win32/zlib.def`, which AAP
  #                0.2.2.3 excludes -- but the export table, `gzopen_w`, the
  #                `gzgetc` macro expanded by MSVC, and an import-library link
  #                are all measured.
  # ---------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu stable
            os: ubuntu-latest

          - name: macOS stable
            os: macos-latest

          - name: Windows stable
            os: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      # llvm-tools is requested for its `llvm-objcopy`, and it is a requirement
      # of this job rather than a convenience.  `cargo test --workspace` includes
      # zlib-rs-differential, whose build.rs performs an `objcopy
      # --redefine-syms` rename pass over the C oracle's objects so that both
      # implementations can be linked into one test binary without their
      # identically-named symbols colliding.  Stock macOS ships no objcopy at all
      # -- `gobjcopy` is Homebrew binutils, not a system tool -- and a Windows
      # MSVC host has none either, so on two of these three runners the build.rs
      # is relying entirely on its own fallback chain.  That chain does end at
      # `rust-objcopy` in the toolchain sysroot, but rust-objcopy links against
      # the toolchain's libLLVM, which is not on the default library search path,
      # so the fallback can fail for a reason that has nothing to do with this
      # repository.  Installing the component makes a working objcopy a stated,
      # provisioned dependency instead of a lucky one.
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools
        rustc --version
        cargo --version

    - name: Install packages (objcopy for the differential oracle)
      # Fails the job HERE, with a name, rather than inside a build script whose
      # diagnostic would be a link error in generated C.  Linux has binutils
      # already; the sysroot probe is what covers macOS and Windows.
      shell: bash
      run: |
        set -eu
        for candidate in objcopy llvm-objcopy gobjcopy; do
          if command -v "$candidate" > /dev/null 2>&1; then
            echo "OBJCOPY=$(command -v "$candidate")" >> "$GITHUB_ENV"
            "$candidate" --version | head -1
            exit 0
          fi
        done
        sysroot="$(rustc --print sysroot)"
        for candidate in llvm-objcopy rust-objcopy; do
          for found in "$sysroot"/lib/rustlib/*/bin/"$candidate"*; do
            if [ -x "$found" ]; then
              echo "OBJCOPY=$found" >> "$GITHUB_ENV"
              "$found" --version | head -1
              exit 0
            fi
          done
        done
        echo "::error::no usable objcopy was found on this runner, so"          \
             "crates/zlib-rs-differential/build.rs cannot perform its"         \
             "--redefine-syms rename pass and the workspace test run would"    \
             "fail inside a build script. Install binutils, or"                \
             "\`rustup component add llvm-tools\`, or set OBJCOPY explicitly."
        exit 1

    - name: Compile source code
      run: |
        cargo build --locked --release
        cargo build --locked --release --features libz-compat

    - name: Run test cases
      run: cargo test --locked --workspace --release

    - name: Run test cases (every feature enabled)
      # ★ THE DEFAULT FEATURE SET IS NOT THE WHOLE LIBRARY.  zlib-rs declares
      # `default = []`, so the line above compiles neither `std` -- which is what
      # `pub mod gz` and the whole `tests/gz.rs` binary sit behind -- nor `simd`,
      # nor `rust-api`.  Three of the four features the crate declares, and the
      # entire vectorised checksum surface, were therefore never compiled by any
      # deterministic test job: the only thing that exercised them was a fuzz run,
      # and only if it happened to pass the feature.
      #
      # This step is deliberately DETERMINISTIC coverage rather than more fuzzing.
      # The fuzz job's simd row explores inputs; this one runs the fixed
      # assertions -- the checksum vectors, the gz layer's suite, the differential
      # matrix -- with every backend compiled in, so a `simd` build that returns a
      # wrong checksum for a *known* vector fails here in seconds instead of
      # waiting for a fuzzer to stumble onto it.
      #
      # It is a second `cargo test` rather than a replacement for the first,
      # because the default set is what ships and has to be tested as such.
      run: cargo test --locked --workspace --release --all-features

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: ${{ matrix.name }} (build-test)
        path: |
          Cargo.lock
          target/release/build/*/output
          target/feature-matrix/release/build/*/output
          target/simd-toggle-refusal.log
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Formatting.  .rustfmt.toml exists at the root to be enforced here.
  #
  # THREE INVOCATIONS, BECAUSE THERE ARE THREE WORKSPACES.  The root Cargo.toml
  # declares `exclude = ["benches", "fuzz"]`, and each of those directories carries
  # its own [workspace] table and its own Cargo.lock, so `cargo fmt --all` from the
  # root sees neither the five fuzz targets nor the three benchmark suites -- it is
  # not that they are formatted and passing, it is that nothing looked at them.
  # `--manifest-path` is how the other two are reached, and .rustfmt.toml at the
  # root still governs all three because rustfmt searches upwards from each file.
  # ---------------------------------------------------------------------------
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt

    - name: Run test cases
      run: cargo fmt --all -- --check

    - name: Run test cases (the fuzz workspace)
      run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

    - name: Run test cases (the benchmark workspace)
      run: cargo fmt --manifest-path benches/Cargo.toml --all -- --check
    - name: Run test cases (whitespace hygiene)
      # `cargo fmt` has nothing to say about a YAML file, a TOML manifest, a
      # markdown document or a shell script, and this file itself had accumulated
      # a blank line at end of file -- which makes `git diff --check` exit
      # non-zero on any later diff that touches it, and the usual response to a
      # check that is always red is to stop running it.
      #
      # So the hygiene is gated rather than conventional, by a committed script a
      # contributor can run by hand.  It is scoped to the files this port
      # introduced, on purpose: the tree around them is upstream zlib and carries
      # whitespace this port has no business rewriting -- Makefile.in has had no
      # newline at end of file since long before the port existed.  The script
      # FAILS if its file list comes out empty, so a pattern that stopped matching
      # cannot leave it checking nothing and reporting success.
      #
      # `git diff --check` runs beside it over the checkout, which is a different
      # question -- whether anything in this job dirtied the tree -- and costs
      # nothing to answer here.
      run: |
        set -eu
        sh .github/scripts/whitespace_gate.sh

    - name: Run test cases (the developer guide still describes what exists)
      # rust/README.md is a second copy of facts whose first copy is executable, and the
      # second copy rots silently.  It had rotted in eleven places at once: cmake.yml called
      # a C-only matrix when four of its rows build the Rust library, two AddressSanitizer
      # stages described as differing when they had been the same command twice,
      # "no workflow references fetch_silesia.sh" when one already did, the raw cbindgen
      # diff presented as something a reviewer confirms by eye when it is now gated line by
      # line, a job count three changes had left behind, and a job (`integer-models`) the
      # guide never mentioned at all.  Every one of those was true when written.
      #
      # This gate checks only the claims with a machine-readable counterpart -- job names in
      # both directions, script paths, the job count and platform split, the documented
      # ZLIB_RS_* toggles, the CMake options -- and it is deliberately in the `format` job
      # rather than a job of its own, because it is prose hygiene and costs milliseconds.
      # It cannot check whether a sentence is TRUE; it catches the narrower rot where a
      # name, a path, a count or a toggle stops existing, which is what turns a guide from
      # dated into actively misleading.
      run: |
        set -eu
        python3 -m py_compile .github/scripts/docs_consistency_gate.py
        python3 .github/scripts/docs_consistency_gate.py
        git diff --check
        echo "git diff --check: clean"

  # ---------------------------------------------------------------------------
  # 3. Lints.  The LEVELS live in Cargo.toml's [workspace.lints] -- clippy::all
  # and clippy::pedantic at deny, plus unwrap_used, expect_used,
  # indexing_slicing, panic, panic_in_result_fn, todo, unimplemented,
  # unreachable, exit and undocumented_unsafe_blocks -- and the THRESHOLDS live
  # in clippy.toml, which declares no `msrv` key on purpose so that clippy reads
  # each package's own `rust-version`.  This job's whole contribution is to run
  # clippy with warnings denied, which is what turns all of that into a gate.
  #
  # `--all-targets` reaches the tests and the benches too, so a lint violation
  # cannot hide in a test module or in a bench that `cargo build` never
  # compiles.
  #
  # `--workspace` DOES NOT REACH `fuzz/`, which is why there is a second step.
  # The root Cargo.toml declares `exclude = ["fuzz"]`, so that directory is a
  # workspace of its own: the first command below cannot select it however it is
  # spelled, and the build cargo-fuzz performs in the `fuzz` job does not deny
  # warnings.  The second command re-runs clippy with `working-directory: fuzz`
  # so the five targets are held to the same deny-level policy.  A workspace
  # lint table does not cross a workspace boundary either, which is why
  # `fuzz/Cargo.toml` restates the policy in `[lints.rust]` and
  # `[lints.clippy]` tables of its own.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --component clippy
        rustup toolchain install nightly --profile minimal --component clippy
        cargo +nightly clippy --version

    - name: Run test cases
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

    - name: Run test cases (the fuzz workspace)
      # `--workspace` above CANNOT reach fuzz/.  The root Cargo.toml `exclude`s
      # it -- cargo-fuzz owns its profile and sanitizer configuration and must not
      # inherit `panic = "abort"` from the shipped release profile -- so it is a
      # separate workspace with its own [lints] table, and a clippy run from the
      # root does not lint one line of it.
      #
      # That gap matters more here than almost anywhere else: the five fuzz
      # targets have the highest raw-pointer density in the repository.  They
      # drive the C ABI directly, reconstruct slices from caller pointers and
      # install zalloc/zfree hooks the library calls back into.  fuzz/Cargo.toml
      # denies `undocumented_unsafe_blocks` for exactly that reason, and this step
      # is what makes the denial reachable by CI at all.
      #
      # Nightly, because the targets use `#![no_main]` with libfuzzer-sys.
      run: |
        set -eu
        rustup toolchain install nightly --profile minimal --component clippy
        cd fuzz
        cargo +nightly clippy --locked --all-targets -- -D warnings
        cargo +nightly clippy --locked --all-targets --all-features -- -D warnings

    - name: Run test cases (the benchmark workspace)
      # `--workspace` at the root cannot reach `benches/` either, and for a
      # different reason: it is excluded because criterion 0.8.2 declares
      # rust-version 1.86 and reaches edition-2024 clap manifests, which cargo
      # 1.80 -- this project's floor -- cannot parse, so hosting the suites inside
      # the workspace made `cargo +1.80 check --workspace` impossible.
      #
      # The consequence for linting is the same as for fuzz/: a workspace lint
      # table does not cross a workspace boundary, so `benches/Cargo.toml`
      # restates the policy in `[lints.rust]` and `[lints.clippy]` tables of its
      # own and this step is what makes those denials reachable by CI.  Both
      # feature configurations are linted, because `--features simd` compiles the
      # vectorised rows that the default build does not.
      run: |
        set -eu
        cargo clippy --locked --manifest-path benches/Cargo.toml --all-targets -- -D warnings
        cargo clippy --locked --manifest-path benches/Cargo.toml --all-targets \
          --features simd -- -D warnings

  # ---------------------------------------------------------------------------
  # 4. Dependency policy.  Reads the root deny.toml: the [licenses] allow-list
  # (Zlib for this project's own crates, plus the MIT / Apache-2.0 /
  # Unicode-3.0 expressions the dev and build tooling resolves to),
  # [advisories], and the [bans] rules that reject duplicate versions, wildcard
  # requirements and a named set of crates that would link a C compressor back
  # in.
  #
  # WHAT cargo-deny DOES NOT DO, and why the second command exists.  "The core
  # algorithm crate has zero third-party dependencies" is a stated constraint,
  # and no cargo-deny rule expresses it: the licence, advisory, source and bans
  # policies would all happily admit a new, permissively licensed, non-duplicate
  # dependency added to `crates/zlib-rs`.  Asserting the property therefore
  # takes a direct look at the manifest, which is what the metadata step does --
  # `cargo metadata --no-deps` reports each workspace member's own declared
  # dependencies, so an empty list for `zlib-rs` is the constraint itself rather
  # than a proxy for it.  It covers every kind: normal, dev and build.
  #
  # cargo-deny is pinned.  deny.toml is written against 0.20.2's schema -- which
  # renamed and removed keys earlier versions accepted -- so an unpinned install
  # would fail or, worse, silently ignore a section on a future release.  The
  # cbindgen and cargo-fuzz installs elsewhere in this file are pinned for the
  # same reason.
  # ---------------------------------------------------------------------------
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Install packages (Linux)
      run: |
        cargo install cargo-deny --locked --version 0.20.2
        cargo deny --version

    - name: Run test cases
      # `--locked` on the audit itself, not just on the installer: without it
      # cargo-deny is free to update Cargo.lock before reading the graph, and
      # the graph it then reports is not the one that ships.
      run: cargo deny --locked --all-features check

    - name: Run test cases (fuzz workspace)
      # THE SECOND GRAPH, and it is invisible from the root.  fuzz/ is excluded
      # from the workspace and carries its own Cargo.lock and its own
      # deny.toml, so the command above never sees `libfuzzer-sys`, `arbitrary`
      # or anything they pull in -- which would leave the one part of the tree
      # that links a C++ fuzzing runtime as the one part with no advisory,
      # license, source or bans enforcement at all.
      run: cargo deny --locked --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check

    - name: Run test cases (benchmark workspace)
      # THE THIRD GRAPH, and the largest one in the repository.  `benches/` is
      # excluded from the workspace for an MSRV reason -- criterion 0.8.2
      # declares rust-version 1.86 and reaches edition-2024 clap manifests that
      # cargo 1.80 cannot parse -- so the root command above cannot see criterion
      # or any of its closure (clap, plotters, rayon, serde, regex, walkdir,
      # wasm-bindgen).  Measured: 78 packages here against the library
      # workspace's seven.  Auditing it separately is what stops the exclusion
      # from becoming a coverage hole; `benches/deny.toml` carries the policy and
      # the one licence identifier this graph needs and the root one does not
      # (`Unicode-3.0`, through unicode-ident).
      run: cargo deny --locked --manifest-path benches/Cargo.toml --config benches/deny.toml check

    - name: Run test cases (the three lockfiles agree on the oracle provider)
      # ★ THE C ORACLE MUST BE COMPILED BY ONE PROVIDER, and until this step
      # existed it was not.  `cc` is what turns the fifteen in-tree C translation
      # units into the test-only oracle archive that every byte-identity,
      # interoperability and throughput number is measured against.  It is
      # declared once, in the root `[workspace.dependencies]`, but it is RESOLVED
      # three times: `benches/` and `fuzz/` are excluded packages that reach
      # `crates/zlib-rs-differential` by path and carry their own committed
      # lockfiles.  With the requirement written as a caret (`cc = "1.4.0"`) the
      # three resolutions diverged -- root and fuzz at 1.4.0, benches at 1.4.2 --
      # so correctness and fuzzing compared against an oracle built by one
      # provider and performance against an oracle built by another.  That is the
      # one variable a differential harness exists to remove.
      #
      # The requirement is now exact (`=1.4.0`, AAP 0.5.1.3's pin) and this step is
      # what keeps the three locks honest: it reads the version each lockfile
      # RECORDS -- not the requirement each manifest declares, because a lock is
      # what a build actually uses -- and fails on any disagreement or on any
      # value other than the pinned one.  Checksums are compared as well, so two
      # locks naming the same version from different sources also fail.
      run: |
        set -eu
        python3 - <<'ONE_PROVIDER'
        import sys

        PINNED = "1.4.0"
        LOCKS = ("Cargo.lock", "benches/Cargo.lock", "fuzz/Cargo.lock")

        def recorded(path, crate):
            """The (version, checksum) a lockfile records for `crate`, or None."""
            found, name, version, checksum = [], None, None, None
            with open(path, encoding="utf-8") as handle:
                for line in handle:
                    line = line.strip()
                    if line == "[[package]]":
                        if name == crate:
                            found.append((version, checksum))
                        name, version, checksum = None, None, None
                    elif line.startswith("name = "):
                        name = line.split("=", 1)[1].strip().strip('"')
                    elif line.startswith("version = "):
                        version = line.split("=", 1)[1].strip().strip('"')
                    elif line.startswith("checksum = "):
                        checksum = line.split("=", 1)[1].strip().strip('"')
            if name == crate:
                found.append((version, checksum))
            return found

        failed = False
        seen = {}
        for lock in LOCKS:
            entries = recorded(lock, "cc")
            if len(entries) != 1:
                print("::error::%s records %d `cc` entries; exactly one is expected, "
                      "because the oracle provider must be resolved once per lock"
                      % (lock, len(entries)))
                failed = True
                continue
            version, checksum = entries[0]
            seen[lock] = (version, checksum)
            if version != PINNED:
                print("::error::%s resolves cc %s; the reviewed pin is =%s.  Run "
                      "`cargo update --manifest-path <that manifest> -p cc --precise %s`."
                      % (lock, version, PINNED, PINNED))
                failed = True

        distinct = set(seen.values())
        if len(distinct) > 1:
            print("::error::the lockfiles disagree on the oracle provider, so the C "
                  "oracle is compiled differently depending on which lock a command "
                  "resolves through: %s"
                  % ", ".join("%s -> cc %s" % (lock, seen[lock][0]) for lock in seen))
            failed = True

        if failed:
            sys.exit(1)

        print("all %d lockfiles record cc %s with one checksum: the C oracle is "
              "compiled by a single reviewed provider everywhere"
              % (len(LOCKS), PINNED))
        ONE_PROVIDER

    - name: Run test cases (core dependency table is empty)
      run: |
        set -eu
        mkdir -p target
        cargo metadata --locked --format-version 1 --no-deps > target/metadata.json
        python3 - <<'CORE_DEPS'
        import json
        import sys

        with open("target/metadata.json", encoding="utf-8") as handle:
            metadata = json.load(handle)

        core = [p for p in metadata["packages"] if p["name"] == "zlib-rs"]
        if len(core) != 1:
            print("::error::expected exactly one zlib-rs package in the workspace "
                  "metadata, found %d" % len(core))
            sys.exit(1)

        declared = core[0]["dependencies"]
        if declared:
            for dependency in declared:
                print("::error::crates/zlib-rs declares a dependency on %s (%s, kind=%s); "
                      "the safe core's [dependencies], [dev-dependencies] and "
                      "[build-dependencies] must all stay empty"
                      % (dependency["name"], dependency["req"], dependency.get("kind")))
            sys.exit(1)

        print("crates/zlib-rs: 0 declared dependencies of any kind -- dependency "
              "minimalism holds")
        CORE_DEPS

    - name: Run test cases (the fuzz workspace)
      run: |
        cargo deny --all-features --locked --manifest-path fuzz/Cargo.toml \
          --config fuzz/deny.toml check

  # ---------------------------------------------------------------------------
  # 5. The MSRV floor.  A build, not the test matrix, so it stays cheap: the
  # point is that an accidentally-newer-than-1.80 construct fails here rather
  # than in a downstream distribution.
  #
  # SCOPE: THE WHOLE WORKSPACE, PLUS THE SHIPPED PAIR IN THREE CONFIGURATIONS.
  #
  # `--workspace` used to be impossible here.  While the three criterion suites
  # were attached to the dev-only zlib-rs-differential crate, that crate declared
  # `rust-version = "1.86"` -- criterion's own floor -- and reached clap manifests
  # written in edition 2024, so `cargo +1.80 build --workspace` failed before
  # compiling anything and `cargo +1.80 metadata --locked` could not even resolve.
  # A workspace that declares 1.80 and cannot be resolved by 1.80 is not honouring
  # the floor, so the suites moved to `benches/`, an excluded package with its own
  # lock.  Both commands now pass, and the workspace-wide pair below is what keeps
  # them passing:
  #
  #   cargo +1.80 metadata --locked
  #   cargo +1.80 check --locked --workspace --all-targets
  #
  # The three `build` lines that follow them are still scoped to the two crates
  # that SHIP -- the same pair Makefile.in's CARGO_MSRV_FLAGS names -- because the
  # feature matrix below is a promise about those two and codegen is what catches
  # the `arithmetic_overflow` class.  Adding a criterion edge to any member
  # re-breaks the two commands above; `benches/Cargo.toml` section 2 says so at
  # length.
  #
  # edition 2021 is likewise not a preference: edition 2024 requires rustc 1.85
  # and cargo rejects the combination outright, so 2021 is the only valid choice
  # at this floor.
  #
  # FEATURES, and this is the half that is easy to leave out: a default build
  # never compiles crates/zlib-rs/src/{crc32,adler32}/simd.rs and never compiles
  # the core without `std`, so an MSRV check of the default configuration alone
  # declares a floor for only part of the source.  `--all-features` is the
  # widest configuration and `--no-default-features` the narrowest, and between
  # them every line either crate can compile is put in front of the 1.80
  # compiler.  Both carry `--all-targets`, which is what puts the unit tests and
  # the integration tests over the same floor -- `&raw mut` is Rust 1.82 syntax
  # and reads so naturally that it lands in a test without anyone noticing;
  # `core::ptr::addr_of_mut!` is the spelling this tree uses instead.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV 1.80
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install 1.80 --profile minimal
        cargo +1.80 --version
        make --version | head -1

    - name: Compile source code
      # `--all-features` and warnings-as-errors are BOTH part of the gate, and
      # for the same reason: the floor has to hold for every configuration a
      # consumer can select, and a construct newer than 1.80 shows up as a
      # warning at least as often as it shows up as an error.  Cargo.toml's
      # MSRV note records this exact command shape, and `make rust-msrv` runs
      # it too -- if the three ever diverge the gate stops meaning anything.
      #
      # THREE CONFIGURATIONS, and an isolated target directory.  The floor has to hold for
      # the default set, for every feature at once and for `--no-default-features`, because
      # a consumer can select any of them.  The separate CARGO_TARGET_DIR is not tidiness:
      # the `--no-default-features` line produces a cdylib with the exported surface
      # compiled out and cargo writes it over `target/debug/libz.so`, so a developer who
      # runs these commands by hand and then runs `cargo test` gets a wall of missing-symbol
      # failures out of tests/symbol_parity.rs with nothing to connect them to.
      env:
        RUSTFLAGS: -D warnings
        CARGO_TARGET_DIR: target/msrv
      run: |
        set -eu
        # THE WORKSPACE-WIDE PAIR FIRST, because they are the two commands the
        # benchmark-hosting move exists to make possible.  Resolution comes before
        # compilation: `metadata` fails on an unparseable manifest anywhere in the
        # dev graph, which is exactly how a criterion edge would reappear.
        cargo +1.80 metadata --locked --format-version 1 > /dev/null
        cargo +1.80 check --locked --workspace --all-targets
        # Then the shipped pair, compiled rather than checked, in all three
        # configurations a consumer can select.
        cargo +1.80 build --locked -p zlib-rs -p libz-rs-sys --all-targets
        cargo +1.80 build --locked -p zlib-rs -p libz-rs-sys --all-features --all-targets
        cargo +1.80 build --locked -p zlib-rs -p libz-rs-sys --no-default-features --all-targets

  # ---------------------------------------------------------------------------
  # 5a. The other two integer models.
  #
  # `uLong` is `unsigned long` (`zconf.h` L406): 8 bytes on LP64, 4 on ILP32 and
  # 4 on LLP64 Windows.  Every job above this one runs on LP64 only, so a
  # constant, a shift or a cast that is fine at 64 bits and wrong at 32 has had
  # nowhere to be caught -- and this is not hypothetical.  Three
  # `uLong << 32` expressions and one `uInt::MAX as usize + 1` in the facade's
  # own tests were arithmetic overflows on a 32-bit target; the same literals
  # also broke the LLP64 target, where `c_ulong` is likewise 4 bytes.
  #
  # A BUILD OF THE TESTS, not a test run, and `build` NOT `check`.  The
  # distinction is the whole point: `arithmetic_overflow` is produced by a MIR
  # pass that runs during CODEGEN, so `cargo check --target i686-...` reports
  # success on code that `cargo build --target i686-...` rejects.  Measured.
  # Running the tests would need an emulator; compiling them is what catches this
  # class, and it is cheap.
  #
  # THE C SHIM MUST BE BUILT FOR THE SAME MODEL.  build.rs compiles
  # csrc/*.c through the `cc` crate, which takes its flags from
  # `CFLAGS_<target>` -> `TARGET_CFLAGS` -> `CFLAGS`.  Without `-m32` the shim
  # archive comes out ELF64 and the link fails with "i386 architecture of input
  # file ... is incompatible with i386:x86-64 output".  Measured, and the reason
  # the env block below is not optional.
  # ---------------------------------------------------------------------------
  integer-models:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ILP32 (i686-unknown-linux-gnu)"
            target: i686-unknown-linux-gnu
            packages: gcc-multilib libc6-dev-i386

          - name: "LLP64 (x86_64-pc-windows-gnu)"
            target: x86_64-pc-windows-gnu
            packages: mingw-w64

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC-10's companion half, applied to every checkout in this file: without it
        # actions/checkout leaves the job token in .git/config, where any later step --
        # a build script, a proc macro, a test -- can read it out of the working tree.
        # Nothing here pushes, so nothing needs the credential after the checkout.
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup target add ${{ matrix.target }}

    - name: Install packages (Linux)
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ${{ matrix.packages }}

    - name: Compile source code
      # The env is per-target and deliberately explicit rather than inherited.
      env:
        CFLAGS_i686_unknown_linux_gnu: "-m32"
        CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
        AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      run: |
        cargo build --locked -p zlib-rs -p libz-rs-sys --all-targets \
          --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # 5b. The feature matrix.
  #
  # Every other job in this file builds ONE configuration: the default feature
  # set, or `--all-features`.  Neither is what a consumer necessarily gets.
  # `zlib-rs` has `default = []` and `libz-rs-sys` has
  # `default = ["libz-compat", "gz"]` with `gz = ["libz-compat",
  # "zlib-rs/std", "dep:libc"]`, so the supported configurations differ from one
  # another in what they even COMPILE -- `pub mod gz` is `#[cfg(feature =
  # "std")]`, and the facade's one remaining C shim is needed only by `gz`.  A
  # partial configuration can therefore fail to compile or fail to LINK while the
  # default and all-features builds are both green, which is exactly what happened
  # while `inflate_table` came from a C translation unit: `--no-default-features
  # --features libz-compat` failed to link it, and no job in this file was capable
  # of noticing.  That symbol is Rust now, so the configuration compiles no C at
  # all -- which is a reason to keep the cell, not to drop it.
  #
  # So each supported configuration is its own cell, and each cell builds, tests
  # AND lints.  Linting per cell is not padding: `#[cfg]`-gated code is invisible
  # to clippy in the configurations that exclude it, so an unused import behind a
  # feature gate is only reachable this way.
  #
  # The cells are the supported configurations, not the power set.  Every one of
  # the nine below was verified to build on this tree; combinations that add no
  # distinct compilation (`libc` alone, for instance, which `gz` already implies)
  # are deliberately absent.
  # ---------------------------------------------------------------------------
  features:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The genuinely no_std + alloc engine: no features at all.
          - name: "Features: core, no default"
            args: "-p zlib-rs --no-default-features"

          # The idiomatic surface -- ~80 re-exports that only exist behind it.
          - name: "Features: core, rust-api"
            args: "-p zlib-rs --features rust-api"

          # Turns on `pub mod gz` and tests/gz.rs.  See the Miri job.
          - name: "Features: core, std"
            args: "-p zlib-rs --features std"

          # Output-neutral vectorised checksum backends.
          - name: "Features: core, simd"
            args: "-p zlib-rs --features simd"

          # The facade with NOTHING on: no exported C surface at all.
          - name: "Features: facade, no default"
            args: "-p libz-rs-sys --no-default-features"

          # The C ABI without the gz file layer.  This is the configuration that
          # was broken: it needs the inftrees shim but not the gzprintf one.
          - name: "Features: facade, libz-compat only"
            args: "-p libz-rs-sys --no-default-features --features libz-compat"

          # gz implies libz-compat, zlib-rs/std and libc, so this cell proves the
          # implication chain resolves from a bare start.
          - name: "Features: facade, gz only"
            args: "-p libz-rs-sys --no-default-features --features gz"

          - name: "Features: facade, default + simd"
            args: "-p libz-rs-sys --features simd"

          - name: "Features: workspace, all"
            args: "--workspace --all-features"

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC-10's companion half, applied to every checkout in this file: without it
        # actions/checkout leaves the job token in .git/config, where any later step --
        # a build script, a proc macro, a test -- can read it out of the working tree.
        # Nothing here pushes, so nothing needs the credential after the checkout.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal --component clippy,llvm-tools

    - name: Install packages (Linux)
      run: cc --version

    - name: Compile source code
      # WARNINGS DENIED HERE TOO, and a RELEASE build beside the debug one.  A
      # `#[cfg]`-gated item is only compiled in the configurations that select
      # it, so a warning behind a feature gate is reachable nowhere else; and the
      # release profile is a different compilation -- `panic = "abort"`, fat LTO
      # and one codegen unit -- which is where a genuine no-default-features
      # compile defect in this tree was actually found.  Debug alone would have
      # missed it.
      env:
        RUSTFLAGS: -D warnings
      run: |
        set -eu
        cargo build --locked ${{ matrix.args }} --all-targets
        cargo build --locked --release ${{ matrix.args }}

    - name: Run test cases
      env:
        RUSTFLAGS: -D warnings
      run: cargo test --locked ${{ matrix.args }}

    - name: Run test cases (lint this configuration)
      run: cargo clippy --locked ${{ matrix.args }} --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # 5c. The ZLIB_RS_SIMD build-time toggle, and the SIMD build's behaviour.
  #
  # Two separate claims, both unverified until now.
  #
  # FIRST, the toggle's contract.  A build script cannot enable or disable a
  # Cargo feature -- resolution happens before any script runs -- so
  # `crates/libz-rs-sys/build.rs` implements ZLIB_RS_SIMD as an ASSERTION about
  # the resolved feature set: `=1` with `simd` off is a hard error naming the
  # feature to pass, `=0` with it on is a hard error naming how to turn it off,
  # agreement is silent, and unset asserts nothing.  That is a real contract with
  # four outcomes, and a documented toggle that silently did nothing would be
  # worse than no toggle, so all four are exercised below -- including the two
  # that MUST fail.
  #
  # SECOND, and this is the load-bearing one: the `simd` feature must be
  # OUTPUT-NEUTRAL.  A checksum yields one scalar however it is computed, which
  # is the entire reason SIMD is confined to CRC-32 and Adler-32 -- vectorising
  # match finding would change the emitted bytes and break byte-identical output
  # outright.  "Output-neutral" is a claim about behaviour, so it is tested as
  # one: the differential suite and the checksum fuzz target are both run against
  # a SIMD build, and they compare against the same C oracle as always.  If a
  # vectorised backend ever disagreed with the scalar one, this is where it
  # surfaces.
  # ---------------------------------------------------------------------------
  simd:
    name: SIMD toggle and output neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC-10's companion half, applied to every checkout in this file: without it
        # actions/checkout leaves the job token in .git/config, where any later step --
        # a build script, a proc macro, a test -- can read it out of the working tree.
        # Nothing here pushes, so nothing needs the credential after the checkout.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal --component llvm-tools

    - name: Install packages (Linux)
      run: cc --version

    - name: Compile source code
      # The two agreeing combinations must build.
      run: |
        set -eu
        ZLIB_RS_SIMD=1 cargo build --locked -p libz-rs-sys --features simd
        ZLIB_RS_SIMD=0 cargo build --locked -p libz-rs-sys

    - name: Run test cases (the feature really vectorizes what it claims)
      # ★ WHAT THIS CLOSES.  AAP 0.5.1.4 describes this feature as enabling
      # "vectorized CRC-32 and Adler-32 backends", and until now nothing measured
      # whether either backend WAS vectorized.  One of them was not: the file, the
      # Cargo feature and the backend type were all called `simd' while the compiled
      # CRC-32 body contained ZERO vector instructions.  Naming is not evidence.
      #
      # `.github/scripts/simd_vector_gate.py' disassembles the release library built
      # with --features simd, counts instructions and vector instructions per backend
      # symbol, and fails when either disagrees with what the tree claims.  It fails in
      # BOTH directions deliberately: losing Adler-32's vectorization is a regression,
      # and GAINING it in CRC-32 means several sentences in
      # crates/zlib-rs/src/crc32/simd.rs, README and rust/README.md have become true and
      # must be rewritten.  Neither can now happen quietly.
      #
      # It does not measure throughput -- benches/checksum_bench.rs and
      # .github/scripts/bench_gate.py own that, and they own it the right way round: a
      # backend slower than the one it replaces fails there however many vector
      # instructions it contains.
      #
      # CARGO_TARGET_DIR is isolated because libz-rs-sys is `[lib] name = "z"', so cargo
      # writes an UNHASHED libz.so and a differently-featured build in the shared
      # directory would overwrite the one another step measured.
      shell: bash
      run: |
        set -eu
        CARGO_TARGET_DIR=target/simd cargo build --locked --release \
          -p libz-rs-sys --features simd
        python3 .github/scripts/simd_vector_gate.py \
          --library target/simd/release/libz.so \
          --expect adler32=vectorized --expect crc32=scalar

    - name: Run test cases (the toggle rejects a contradiction)
      # A toggle that accepts a contradiction is a toggle that does nothing, and
      # it would look exactly like a working one from the outside.  `if ... then
      # fail` rather than `!`, so an unexpected SUCCESS is the failure.
      #
      # ★ THE TWO TRANSCRIPTS GO IN A PRIVATE DIRECTORY (CWE-377).  They were
      # written to the fixed, world-known paths /tmp/simd1.log and /tmp/simd0.log
      # with plain shell redirection, and `>` follows an existing symlink: anything
      # that can create /tmp/simd1.log before this step runs decides where the
      # redirection lands, and the `grep` that reads it back then reads a file it
      # does not own.  The exposure is small on an ephemeral hosted runner and it is
      # not small on a self-hosted or containerised one, and the rest of this tree
      # already holds the opposite discipline -- `crates/libz-rs-sys/tests/
      # c_api_parity.rs`, `fuzz/fuzz_targets/fuzz_gz_roundtrip.rs` and the `symbols`
      # job all use a private directory -- so this step now does too:
      # `mktemp -d` under RUNNER_TEMP (which is per-run and owner-only), created
      # rather than adopted, and removed by a trap on every exit path including a
      # failing one, after the transcript has been printed.
      shell: bash
      run: |
        set -eu
        LOGS="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/zlib-rs-simd-XXXXXXXXXX")"
        trap 'rm -rf "$LOGS"' EXIT
        if ZLIB_RS_SIMD=1 cargo build --locked -p libz-rs-sys > "$LOGS/simd1.log" 2>&1; then
          echo "::error::ZLIB_RS_SIMD=1 was accepted with the simd feature OFF." \
               "The toggle is documented to reject that combination, so it is"   \
               "silently doing nothing and a SIMD build cannot be requested."
          exit 1
        fi
        grep -q 'ZLIB_RS_SIMD=1' "$LOGS/simd1.log" || {
          echo "::error::the rejection did not name ZLIB_RS_SIMD, so it failed for" \
               "some other reason."; cat "$LOGS/simd1.log"; exit 1; }

        if ZLIB_RS_SIMD=0 cargo build --locked -p libz-rs-sys --features simd \
             > "$LOGS/simd0.log" 2>&1; then
          echo "::error::ZLIB_RS_SIMD=0 was accepted with the simd feature ON."   \
               "The toggle cannot be used to turn the vectorised backends off."
          exit 1
        fi
        grep -q 'ZLIB_RS_SIMD=0' "$LOGS/simd0.log" || {
          echo "::error::the rejection did not name ZLIB_RS_SIMD."; cat "$LOGS/simd0.log"; exit 1; }
        echo "both contradictions were rejected, and both agreements build."

    - name: Run test cases (simd is output-neutral)
      # The differential suite under a SIMD build: byte-identical output and
      # checksum equality against the C oracle, with the vectorised backends in
      # play.  This is the assertion that makes `simd` safe to ship.
      run: |
        set -eu
        ZLIB_RS_SIMD=1 cargo test --locked -p zlib-rs-differential --release \
          --features simd

    - name: Run test cases (checksum fuzz under simd)
      # The one fuzz target whose whole job is differential checksum comparison,
      # run against a SIMD build for a bounded time.  Short by design: this is a
      # neutrality check, not the fuzzing budget, which the fuzz job owns.
      run: |
        set -eu
        rustup toolchain install nightly --profile minimal
        # ★ THE PIN IS ASSERTED, NOT ATTEMPTED.  This was
        # `cargo install ... --version 0.13.2 || cargo fuzz --version', and the
        # fallback made the pin advisory: `cargo install' fails when the runner
        # image already carries a DIFFERENT cargo-fuzz, the `||' branch then merely
        # printed whatever that was, and the step continued with an unpinned
        # fuzzer.  The pin exists because a fuzzer's harness ABI and its libFuzzer
        # arguments change between versions, so the version that ran has to be the
        # version this workflow says ran.
        #
        # `--force` makes the install authoritative rather than conditional, and the
        # check afterwards is what closes the case where even that cannot be done:
        # the version is read back and compared exactly, so an image-supplied
        # binary is either the pinned one or a failure with both numbers named.
        CARGO_FUZZ_PIN=0.13.2
        cargo install cargo-fuzz --locked --force --version "$CARGO_FUZZ_PIN" \
          || echo "cargo install failed; the version already present is checked below"
        CARGO_FUZZ_HAVE=$(cargo fuzz --version | awk 'NR==1{print $2}')
        if [ "$CARGO_FUZZ_HAVE" != "$CARGO_FUZZ_PIN" ]; then
          echo "::error::cargo-fuzz is ${CARGO_FUZZ_HAVE:-absent} but this workflow pins" \
               "$CARGO_FUZZ_PIN; a fuzz run under another version is not the run this" \
               "job reports"
          exit 1
        fi
        echo "cargo-fuzz $CARGO_FUZZ_HAVE (pinned)"
        cd fuzz
        ZLIB_RS_SIMD=1 cargo +nightly fuzz run fuzz_checksum \
          --features simd -- -max_total_time=120

    - name: Compile source code (benches under simd)
      # Builds only.  The bench job owns the measurement; what matters here is
      # that the SIMD configuration compiles the benches at all, since they are
      # the one consumer that links both implementations at once.
      #
      # `--manifest-path benches/Cargo.toml`, because the three suites live in
      # their own excluded package: criterion 0.8.2 declares rust-version 1.86 and
      # reaches edition-2024 clap manifests, which cargo 1.80 -- this project's
      # floor -- cannot parse, so hosting them inside the workspace broke
      # `cargo +1.80 check --workspace`.  The package forwards its own `simd`
      # feature to all three crates under measurement.
      run: cargo bench --locked --manifest-path benches/Cargo.toml --features simd --no-run

  # ---------------------------------------------------------------------------
  # 6. The differential suite: byte-identical output, and interoperability in
  # both directions.
  #
  # This is the behavioral-fidelity gate, and it is far stricter than RFC
  # conformance.  RFC 1951 constrains the FORMAT, not the CHOICES: which of
  # several equally valid matches to emit, when to abandon a lazy match, how to
  # break a Huffman frequency tie and when to switch block type are all
  # implementation-defined, and the port has to answer them exactly the way the
  # reference does.  A better DEFLATE encoder fails this job, which is the
  # point.
  #
  # TWO COMMANDS, AND BOTH ARE THE GATE.  The suites are split into a fast
  # default sweep and an exhaustive one held behind `#[ignore]` plus an
  # environment variable, because a bare `cargo test --workspace` in debug must
  # not pay for the full cross product.  The variable and `--ignored` are BOTH
  # required -- `#[ignore]` keeps the sweeps out of a default run, and the
  # variable is what makes them do their work rather than report that they were
  # not asked to -- so the second step below sets both and passes `--ignored`.
  # Running only the first step would leave the full matrix AAP 0.6.4.2
  # specifies unmeasured, and would make the `run by CI` phrasing in those
  # tests' own `#[ignore]` descriptions false.  Do not delete the second step to
  # save wall clock; shard it by test filter instead.
  #
  # --release for both, and --test-threads for the second: the exhaustive
  # configuration sweep is sharded one `#[test]` per level precisely so cargo's
  # own harness runs the shards concurrently, and a debug build of this suite is
  # roughly fifteen times slower.
  #
  # What crates/zlib-rs-differential's tests sweep across the two commands, so
  # that the scope of the gate is legible from here rather than only from the
  # test source:
  #
  #   level ........ 0-9, all ten
  #   windowBits ... 9..15 (zlib), -9..-15 (raw), 25..31 (gzip)
  #                  -- all three container formats
  #   memLevel ..... 1-9
  #   strategy ..... Z_DEFAULT_STRATEGY, Z_FILTERED, Z_RLE, Z_HUFFMAN_ONLY,
  #                  Z_FIXED
  #   flush ........ Z_NO_FLUSH, Z_PARTIAL_FLUSH, Z_SYNC_FLUSH, Z_FULL_FLUSH,
  #                  Z_BLOCK, Z_FINISH .. Z_TREES
  #   corpus ....... every fixture in the committed minimal corpus
  #   feeding ...... single-shot AND incrementally chunked, because chunk
  #                  boundaries interact with flush handling and with the
  #                  pending-buffer state
  #
  #   plus C->Rust and Rust->C stream interoperability asserted as its own test
  #   class rather than inferred from round-tripping, preset dictionaries in
  #   both directions, and a numeric comparison of deflateBound/compressBound
  #   (callers size their output buffers with those, so a bound that is too
  #   small is a buffer overflow in CALLER code).
  #
  # THE SWEEP IS SPLIT IN TWO AND BOTH HALVES RUN HERE.  A plain `cargo test`
  # runs only the default suites, because the full cross product is marked
  # `#[ignore]` -- 9,459,450 byte-identity cells and a 16,380-crossing interop
  # product are not what belongs in a developer's inner loop.  So the default
  # step below covers the representative 13,804 cells and the default interop
  # set, and the two steps after it lift the `#[ignore]` with the environment
  # variable each suite requires.  Both halves are needed for the matrix above
  # to be a description of what CI measured rather than of what the test file
  # is capable of measuring:
  #
  #   ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE=1  ... ten shards, one per compression
  #                                          level, each sweeping every chunking
  #                                          in CHUNKINGS_ALL: 9,459,450 of the
  #                                          9,922,500 cells, the balance being
  #                                          the one counted tiny-window
  #                                          exclusion that `full` lifts.  See
  #                                          the module docs of
  #                                          tests/byte_identical.rs, which carry
  #                                          both figures and why the split
  #                                          exists; `full` costs roughly four
  #                                          times the wall clock, which is what
  #                                          the job's timeout-minutes is sized
  #                                          for.
  #   ZLIB_RS_INTEROP_EXHAUSTIVE=1 ......... one shard, 16,380 crossings, a few
  #                                          seconds.  Cheap enough to run HERE,
  #                                          which is why it does.
  #
  # The variable and `-- --ignored` are BOTH required by design: neither alone
  # runs the sweep, and a suite that was asked for one way but not the other
  # says so rather than reporting a vacuous pass.  `--test-threads 4` matches
  # the standard runner's core count, which is what the per-level sharding
  # exists to exploit.  `timeout-minutes` on the job carries headroom over the
  # armed product; if it is ever exceeded the answer is a bigger runner or more
  # shards, NOT a narrower matrix.
  #
  # A C COMPILER IS REQUIRED on the runner, not just cargo: that crate's own
  # build.rs compiles the fifteen in-tree C translation units into a test-only
  # static oracle with the `cc` crate, so both implementations live in one
  # process and can be called alternately.  ubuntu-latest ships gcc; the
  # version print below makes that a stated requirement rather than luck.
  #
  # The oracle is a dev-only dependency: it appears in no [dependencies] table
  # of either shipped crate, so a shipped `cargo build --release` never compiles
  # any of those fifteen reference translation units.  It is not, however, free
  # of C altogether: crates/libz-rs-sys/build.rs compiles the one small unit in
  # its own csrc/ -- the variadic gzprintf/gzvprintf pair, which stable Rust cannot
  # declare -- so a C compiler and an archiver are prerequisites of the DEFAULT
  # facade build, which has `gz` on.  `cargo build -p zlib-rs` and
  # `cargo build -p libz-rs-sys --no-default-features --features libz-compat` are
  # both toolchain-free; the second became so when inflate_table moved into Rust.  What the dev-only
  # boundary buys is that the REFERENCE IMPLEMENTATION is an oracle rather than
  # a dependency.  Nothing is vendored and there are no submodules -- the
  # reference sources are already in this tree.
  #
  # SIMD IS EXERCISED HERE, and this is the only job that does it.  The `simd`
  # feature is output-neutral by construction (it reaches the two checksums and
  # nothing else, and a checksum is one scalar however it is computed), but
  # "by construction" is an argument, not a measurement.  The last step re-runs
  # the default suites with the feature on, against the same C oracle, so the
  # claim is machine-checked: the byte-identity cells compare the emitted bytes
  # AND the running check value, so a vectorised backend that computed a
  # different Adler-32 or CRC-32 would fail here.  The exhaustive sweeps are not
  # repeated under the feature; the checksum backends do not vary with level,
  # windowBits, memLevel or strategy, so the default suites are where the
  # feature's effect is visible.
  # ---------------------------------------------------------------------------
  # BOTH CHECKSUM BACKENDS ARE MANDATORY HERE, not one of them.  `simd` is
  # default-off and is required to be OUTPUT-NEUTRAL -- it may change speed and
  # never a single emitted byte (AAP 0.8.2 ambiguity 9) -- and the only way to
  # hold it to that is to run the comparison both ways against the same C oracle.
  # A single scalar-only run would leave the vectorized backends' output
  # unverified by this job entirely.
  #
  # BOTH RUNS ARE STEPS OF THIS ONE JOB, not cells of a matrix.  An earlier
  # revision made the feature set a matrix dimension; the steps below were then
  # rewritten to name both feature sets explicitly -- `Run test cases' takes the
  # default set and `Run test cases (simd checksum backends)' takes `--features
  # simd' -- which is the whole comparison in one runner, and it is cheap enough
  # (both suites are the fast tier) that a second runner would only duplicate the
  # interoperability product for no additional coverage.  The matrix was removed
  # and three references to it were left behind, so this job carried
  # `${{ matrix.label }}` and `${{ matrix.features }}` against an empty context:
  # actionlint failed the workflow on all three, the job name rendered as
  # `Differential ()', and the failure artifact's name was likewise incomplete.
  # If a matrix is ever wanted here again, add `strategy.matrix` FIRST and make
  # the two run steps take their feature set from it -- do not reintroduce the
  # expressions alone.
  differential:
    name: Differential (scalar and simd)
    runs-on: ubuntu-latest
    # The byte-identity shards do NOT run here -- `differential-exhaustive` below owns
    # them, sixteen ways.  What this job runs is the fast default sweep of both
    # suites, the whole interoperability product (4 seconds, measured), and both
    # suites again with `--features simd`.  The budget is generous rather than tight
    # because the right response to exceeding it is to move work into a sharded job
    # and never to narrow what is compared.
    #
    # ★ THIS JOB IS NOT A MATRIX, AND IT NO LONGER PRETENDS TO BE ONE.  It carried
    # `${{ matrix.label }}` in its name and artifact and `${{ matrix.features }}` in
    # its compile step without declaring a `strategy.matrix` at all, which
    # `actionlint` reports as three undefined properties and GitHub expands to the
    # empty string.  The name and the artifact therefore read `Differential ()` and
    # `differential-`, and the compile step silently compiled the default feature set
    # only.  The feature dimension the interpolation was reaching for is not missing:
    # the two `Run test cases` steps below run the suites with the default features
    # and then again with `--features simd`, in this one job, deliberately -- the
    # scalar and vectorised runs share the oracle archive, so splitting them across
    # two runners would rebuild the C sources twice to save nothing.  So the
    # references are gone rather than a matrix invented to justify them.
    timeout-minutes: 120
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Install packages (Linux)
      run: |
        cc --version
        make --version | head -1

    - name: Compile source code
      # BOTH feature sets, because both are run below.  Compiling them here keeps
      # the C oracle's build.rs and the two test binaries out of the timing of the
      # steps that are meant to be measuring comparisons.
      run: |
        set -eu
        cargo test --locked -p zlib-rs-differential --release --no-run
        cargo test --locked -p zlib-rs-differential --release --features simd --no-run

    - name: Run test cases (the retention obligations are compile-enforced)
      # ★ THE ONE GATE THAT PROVES A NEGATIVE, and the harness needs it.
      #
      # crates/zlib-rs-differential/src/retain.rs makes three retention obligations into
      # type-system facts: the tracking allocator's ledger, a `gz_header` and the
      # `inflateBack` window are addresses the library keeps AFTER the call that installed
      # them returns, so each is lent to a `retain::Session` for the session's whole life.
      # Every other gate in this file checks what the code DOES.  Nothing else checks that
      # the wrong arrangement is REFUSED -- and that refusal is the entire value of the
      # design, because the alternative is a use-after-free that only a sanitiser finds and
      # only sometimes.
      #
      # So there are six programs under
      # crates/zlib-rs-differential/tests/retention_compile_fail: five whose only defect is
      # one of those mistakes, each annotated with the diagnostic it must produce, and one
      # control that must compile.  The control is what stops the suite passing vacuously:
      # five cases failing because a method was renamed look exactly like five cases
      # failing for the right reason.  The driver builds the harness library itself, so it
      # can never type-check against stale metadata, and uses `rustc --emit=metadata`,
      # which stops before linking and so needs none of the C oracle archive.  About a
      # second, total.
      #
      # The cases are not Cargo targets -- Cargo discovers `tests/*.rs` and
      # `tests/*/main.rs`, and that directory has neither -- so nothing else in this
      # workflow compiles them and this step is the only place they run.
      run: python3 .github/scripts/retention_compile_fail.py --release

    - name: Run test cases (scalar checksum backends)
      # THE FAST TIER, and it is exactly that -- representative, not the full
      # matrix.  The eleven sweeps the two suites hold back are `#[ignore]`d and
      # armed by an environment variable -- ten `exhaustive_configuration_matrix_
      # level_N` shards in tests/byte_identical.rs, one per compression level, plus
      # `exhaustive_interoperability_matrix` in tests/roundtrip_interop.rs -- and
      # the `differential-exhaustive` job is what runs the ten, one shard per
      # runner, with a gate that fails when a shard runs disarmed; the eleventh
      # runs in the step below this one.  Do not read this step alone as the gate
      # the comment block above describes.
      #
      # It was twelve.  `exhaustive_chunking_matrix` was the twelfth, and it was
      # deleted rather than fixed: it was named and armed as a full chunking sweep
      # and its body performed no compression at all, only a copy of the shard
      # arithmetic that `cell_shards_partition_the_product` already asserts on
      # every default run.  The chunking dimension is not lost with it -- the ten
      # shards sweep CHUNKINGS_ALL, and `exhaustive_shards_enumerate_the_whole_
      # matrix` proves the configuration set the retired sweep would have used is a
      # subset of theirs.
      run: cargo test --locked -p zlib-rs-differential --release

    - name: Run test cases (the exhaustive interoperability product)
      # ARMED, and both halves are required: `#[ignore]` keeps the product out of a
      # default run and ZLIB_RS_INTEROP_EXHAUSTIVE is what makes it do its work
      # rather than report that it was not asked to.  With only one of the two set
      # the sweep prints a SKIP line and PASSES, which is exactly how this gate
      # would rot unnoticed, so the check below reads the log rather than trusting
      # the exit status.
      #
      # It lives here rather than in `differential-exhaustive` because it is cheap:
      # the whole C->Rust / Rust->C product runs in seconds, where the byte-identity
      # cross product needs the sharding that job exists to provide.
      env:
        ZLIB_RS_INTEROP_EXHAUSTIVE: "1"
      run: |
        set -eu
        set -o pipefail
        mkdir -p target/differential
        LOG=target/differential/exhaustive-interop.log
        cargo test --locked -p zlib-rs-differential --release \
          --test roundtrip_interop -- --ignored --nocapture 2>&1 | tee "$LOG"
        if grep -q 'SKIP:' "$LOG"; then
          echo "::error::the interoperability product ran DISARMED and compared nothing;" \
               "ZLIB_RS_INTEROP_EXHAUSTIVE did not reach the test process."
          grep -n 'SKIP:' "$LOG" || true
          exit 1
        fi
        crossings="$(grep -oE '[0-9]+ crossings' "$LOG" | grep -oE '^[0-9]+' \
                     | sort -rn | head -1 || true)"
        if [ -z "${crossings:-}" ]; then
          echo "::error::the interoperability product reported no crossing count, so it" \
               "never finished a sweep."
          tail -20 "$LOG" || true
          exit 1
        fi
        # ★ THE EXACT PRODUCT, NOT MERELY A POSITIVE ONE.  This used to accept any
        # count above zero, which meant a sweep that had quietly lost a level, a
        # container, six of the seven window sizes or a corpus fixture reported a
        # smaller number and still passed -- while the step's own message called it
        # "the interoperability product".  16,380 is 2 directions x 10 levels x 7
        # windowBits x 3 containers x 39 fixture-chunkings, derived independently of
        # the test and asserted inside it as well (EXHAUSTIVE_CROSSINGS in
        # crates/zlib-rs-differential/tests/roundtrip_interop.rs, which also names
        # the dimension that shrank).  Both halves are deliberate: the test fails
        # first and with the better diagnostic, and this check is what catches a test
        # whose own constant was lowered to match a narrowed sweep.
        expected=16380
        if [ "$crossings" -ne "$expected" ]; then
          echo "::error::the interoperability product compared $crossings crossings;" \
               "the specified product is $expected.  A smaller number means a dimension" \
               "was narrowed -- direction, level, windowBits, container, fixture or" \
               "chunking -- and a larger one means the product grew without this gate" \
               "being updated.  Neither is a pass."
          tail -20 "$LOG" || true
          exit 1
        fi
        echo "interoperability product: armed, and compared exactly $crossings crossings."

    - name: Run test cases (simd checksum backends)
      # THE OUTPUT-NEUTRALITY GATE for the `simd` feature, checked here against
      # the C reference.  The autovectorised Adler-32 and CRC-32 backends are
      # admissible precisely because a checksum yields one scalar however it is
      # computed, so they may change speed and never the emitted bytes -- a
      # claim that is worth nothing until a run with the feature on is compared
      # against the same reference as a run with it off.  Both suites are
      # re-run, because the checksums reach the zlib and gzip container trailers
      # as well as the standalone entry points.
      run: cargo test --locked -p zlib-rs-differential --release --features simd

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: differential
        path: |
          target/release/build/zlib-rs-differential-*/output
          target/release/build/zlib-rs-differential-*/stderr
          target/differential/
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 6b. The EXHAUSTIVE byte-identity product.  The job above runs the fast
  # default sweep -- 13,804 cells of a representative subset -- and that is not
  # the matrix AAP 0.6.4.2 specifies.  This job is where the specified matrix
  # actually runs.
  #
  # The product is 10 levels x 21 windowBits x 9 memLevels x 5 strategies x 7
  # flush values x 15 chunkings x 10 fixtures = 9,922,500 cells, and the ten
  # `exhaustive_configuration_matrix_level_N` tests each take one level's
  # 992,250.  They are `#[ignore]`d and additionally gated on
  # ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE, so BOTH `--ignored` and the variable are
  # required -- setting one without the other makes the tests report that they
  # were not asked to work rather than silently pass, and that report is what
  # this job would otherwise have been reading all along.
  #
  # Wall clock is why this is sharded twice over.  Measured on a 4-core machine
  # in --release: one level's 1/64 slice is 32.8 s, so a whole level is about 35
  # minutes single-threaded.  The ten levels are ten `#[test]`s that cargo's own
  # harness runs concurrently (`--test-threads 4`), and
  # ZLIB_RS_DIFFERENTIAL_SHARD=i/8 divides each of those across the eight matrix
  # rows below, which brings a row to roughly 10-15 minutes.  `1/8` through `8/8`
  # are a PARTITION of the product -- proved by the
  # cell_shards_partition_the_product unit test, not asserted here -- so the
  # union of the eight rows is exactly the product and nothing falls between
  # them.
  #
  # The gate is not merely the exit status.  Each level prints its own accounting
  # line, and the step below parses all ten: the product must be 992,250, every
  # cell must be accounted for as compared, declared-excluded or another shard's,
  # and the coverage must be what the mode promises (95.30% armed, 100.00% under
  # `full`).  A run that enumerated a quarter of its product and passed is
  # exactly the failure this job exists to make impossible.
  # ---------------------------------------------------------------------------
  differential-exhaustive:
    name: Differential exhaustive (${{ matrix.label }} shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Sized for the nightly `full` run, not for a push.  Lifting the one declared
    # exclusion multiplies the work by roughly four -- the seven sub-64-byte output
    # windows over a 66,560-byte incompressible fixture are tens of thousands of
    # `deflate` calls per cell -- so a 90-minute ceiling that fits the armed product
    # would cancel the very run that makes the product complete.  330 leaves margin
    # under GitHub's 360-minute per-job maximum.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # A true cross product: eight cell slices x both checksum backends.
        # `include` adds `features` to the combinations whose `label` it names,
        # which is the documented way to attach a derived value to a dimension
        # without it becoming a dimension of its own.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        label: [scalar, simd]
        include:
          - label: scalar
            features: ''

          - label: simd
            features: '--features simd'

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC-10's companion half, applied to every checkout in this file: without it
        # actions/checkout leaves the job token in .git/config, where any later step --
        # a build script, a proc macro, a test -- can read it out of the working tree.
        # Nothing here pushes, so nothing needs the credential after the checkout.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Install packages (Linux)
      run: cc --version

    - name: Compile source code
      run: >-
        cargo test --locked -p zlib-rs-differential --release
        ${{ matrix.features }} --test byte_identical --no-run

    - name: Run test cases
      env:
        # `1` runs the armed product; `full` additionally lifts the one declared
        # exclusion.  A push and a pull request get the armed product because the
        # unabridged one costs about four times the wall clock; the nightly
        # `schedule` run gets `full` unconditionally, which is what makes the whole
        # product a continuously verified gate rather than a manual choice, and
        # `workflow_dispatch` can ask for it early.  The gate step below asserts
        # the mapping held, so dropping it fails loudly instead of quietly
        # returning the job to the abridged product.
        # One line on purpose: a folded scalar whose continuation is more indented is
        # preserved literally by YAML, and a newline inside `${{ }}` is not something
        # to find out about at run time.
        ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE: ${{ github.event_name == 'schedule' && 'full' || inputs.differential_mode || '1' }}
        ZLIB_RS_DIFFERENTIAL_SHARD: ${{ matrix.shard }}/8
      run: |
        set -eu
        set -o pipefail
        mkdir -p target/differential
        cargo test --locked -p zlib-rs-differential --release ${{ matrix.features }} \
          --test byte_identical -- --ignored --test-threads 4 --nocapture 2>&1 \
          | tee target/differential/exhaustive.log

    - name: Run test cases (assert the product was enumerated)
      env:
        # One line on purpose: a folded scalar whose continuation is more indented is
        # preserved literally by YAML, and a newline inside `${{ }}` is not something
        # to find out about at run time.
        ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE: ${{ github.event_name == 'schedule' && 'full' || inputs.differential_mode || '1' }}
        ZLIB_RS_DIFFERENTIAL_SHARD: ${{ matrix.shard }}/8
        # Read by the gate so that the event and the mode can be checked against
        # each other rather than each being trusted on its own.
        ZLIB_RS_TRIGGERING_EVENT: ${{ github.event_name }}
      run: |
        set -eu
        python3 - <<'COVERAGE_GATE'
        import os
        import re
        import sys

        LOG = "target/differential/exhaustive.log"
        LEVELS = 10
        PER_LEVEL = 992_250
        # Read from the same variable the tests read, rather than hardcoded, so
        # that changing the matrix's width cannot leave the gate checking a share
        # nobody is running.
        SHARDS = int(os.environ.get("ZLIB_RS_DIFFERENTIAL_SHARD", "1/1").split("/")[1])
        # Anchored on the whole line shape so that the module documentation the
        # test prints cannot be parsed as data.
        LINE = re.compile(
            r"^exhaustive matrix, level (?P<level>\d): (?P<compared>\d+) cells .*"
            r"\[shard=(?P<shard>\d+/\d+) (?P<fields>product=\d+ .*)\]$")

        unabridged = os.environ.get("ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE", "1") == "full"
        event = os.environ.get("ZLIB_RS_TRIGGERING_EVENT", "")

        # The event and the mode, checked against each other.  A scheduled run is what
        # makes the unabridged product continuous, so a future edit that drops the
        # mapping -- or an expression that evaluates to something other than `full` --
        # has to fail here rather than quietly returning this job to the abridged
        # product with everything still green.
        mode_failures = []
        if event == "schedule" and not unabridged:
            mode_failures.append(
                "the scheduled run is meant to enumerate the whole 9,922,500-cell "
                "product, but ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE is %r rather than 'full'. "
                "That is the mapping in this job's `env:` block having stopped working, "
                "and it would leave 463,050 cells unverified with the job reporting "
                "success."
                % os.environ.get("ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE", "")
            )

        def pairs(text):
            out = {}
            for part in text.split():
                if "=" in part:
                    key, value = part.split("=", 1)
                    out[key] = value
            return out

        with open(LOG, encoding="utf-8", errors="replace") as handle:
            records = {}
            failures = []
            for line in handle:
                match = LINE.match(line.rstrip("\n"))
                if not match:
                    continue
                level = int(match.group("level"))
                if level in records:
                    failures.append("level %d printed two accounting lines; a level runs once"
                                    % level)
                records[level] = (match.group("shard"), pairs(match.group("fields")),
                                  int(match.group("compared")))

        missing = [level for level in range(LEVELS) if level not in records]
        if missing:
            failures.append(
                "levels %s produced no accounting line: the shards did not run. BOTH "
                "`--ignored` and ZLIB_RS_DIFFERENTIAL_EXHAUSTIVE are required, and the "
                "tests report rather than silently pass when the variable is unset."
                % missing)

        total_compared = 0
        total_excluded = 0
        print("%-6s %-8s %10s %10s %10s %10s %9s" %
              ("level", "shard", "product", "compared", "excluded", "in_shard", "coverage"))
        for level in sorted(records):
            shard, field, compared = records[level]
            print("%-6d %-8s %10s %10s %10s %10s %9s" %
                  (level, shard, field.get("product", "?"), field.get("compared", "?"),
                   field.get("excluded_tiny_window", "?"), field.get("in_shard", "?"),
                   field.get("coverage", "?")))

            product = int(field.get("product", "0"))
            excluded = int(field.get("excluded_tiny_window", "0"))
            other = int(field.get("other_shard", "0"))
            in_shard = int(field.get("in_shard", "0"))
            total_compared += compared
            total_excluded += excluded

            if product != PER_LEVEL:
                failures.append("level %d enumerated a product of %d cells, not the %d the "
                                "matrix specifies" % (level, product, PER_LEVEL))
            if compared + excluded + other != product:
                failures.append(
                    "level %d did not account for every cell of its product: "
                    "compared %d + excluded %d + other shards %d != product %d"
                    % (level, compared, excluded, other, product))
            if compared == 0:
                failures.append("level %d compared nothing at all" % level)
            if unabridged and excluded:
                failures.append("level %d excluded %d cell(s) with the fixture-size "
                                "constraint lifted; `full` must exclude nothing"
                                % (level, excluded))
            if not unabridged and excluded == 0:
                failures.append(
                    "level %d excluded nothing in the armed mode, where the seven "
                    "sub-64-byte windows are held back from window_boundary.bin; a zero "
                    "here means the shard selected a biased slice of the product"
                    % level)
            # The slices are near-even by construction (the ordinal is mixed before it
            # is divided), so a wildly lopsided share means the sharding is broken
            # rather than that this row was unlucky.
            even = product // SHARDS
            if in_shard and abs(in_shard - even) * 4 > even:
                failures.append("level %d was handed %d of the %d cells an eighth of the "
                                "product should be, which is more than 25%% off"
                                % (level, in_shard, even))

        expected_share = LEVELS * PER_LEVEL // SHARDS
        print()
        print("mode=%s shards=%d levels=%d compared=%d excluded=%d (1/%d of the "
              "%d-cell product is about %d cells)"
              % ("full" if unabridged else "armed", SHARDS, len(records),
                 total_compared, total_excluded, SHARDS, LEVELS * PER_LEVEL,
                 expected_share))

        failures = mode_failures + failures
        if failures:
            for failure in failures:
                print("::error::%s" % failure)
            sys.exit(1)

        print("exhaustive differential: PASS -- every cell of this shard's slice of all "
              "ten levels was compared or declared excluded, byte for byte against the "
              "C oracle (event=%s, mode=%s)"
              % (event or "unknown", "full" if unabridged else "armed"))
        COVERAGE_GATE

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: differential-exhaustive-${{ matrix.label }}-${{ matrix.shard }}
        path: |
          target/differential/exhaustive.log
          target/release/build/zlib-rs-differential-*/output
          target/release/build/zlib-rs-differential-*/stderr
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 7. Symbol parity: the exported surface of the Rust library, compared name
  # for name against the C library built from the same tree.
  #
  # Both libraries are built here, because the comparison is only meaningful
  # against a real baseline.  The measured baseline is 111 dynamic globals --
  # 95 functions (nm type T) plus 16 symbol version nodes (type A) -- with
  # SONAME libz.so.1.
  #
  # WHY `make rust` AND NOT JUST `cargo build`: cargo's own cdylib exports 93
  # symbols, not 111, and carries none of the 16 version nodes.  build.rs compiles
  # csrc/gzprintf_shim.c -- gzprintf is
  # variadic and gzvprintf takes a va_list, neither of which stable Rust can
  # define -- into the archive, and rustc gives a symbol that arrives from a
  # native archive no dynamic entry under a version script.  `make rust` relinks
  # the whole archive through zlib.map with the right SONAME and stages the
  # versioned symlink chain, and THAT staged library is the artifact a consumer
  # actually loads.  Comparing the raw cdylib here would report two missing
  # exports that the shipped library has, plus all 16 missing version nodes.
  # ---------------------------------------------------------------------------
  symbols:
    name: Symbol parity
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Generate project files
      # The versioned library name is derived from ZLIB_VERSION in the immutable
      # zlib.h -- the same expression Makefile.in uses -- so this gate keeps
      # working across a version bump instead of carrying a stale literal.
      run: |
        set -eu
        ZVER=$(sed -n 's/^.*define ZLIB_VERSION "\(.*\)".*$/\1/p' zlib.h)
        if [ -z "$ZVER" ]; then
          echo "::error::no ZLIB_VERSION in zlib.h; the versioned library name cannot be derived"
          exit 1
        fi
        echo "ZVER=$ZVER" >> "$GITHUB_ENV"
        echo "CLIB=libz.so.$ZVER" >> "$GITHUB_ENV"
        echo "deriving the baseline library name from zlib.h: libz.so.$ZVER"

    - name: Compile source code
      # ★ THE C BASELINE IS BUILT IN A COPY, NOT IN THE CHECKOUT.  `./configure`
      # OVERWRITES TRACKED FILES: it rewrites `Makefile` and generates `zconf.h`,
      # both of which are committed in this repository.  A runner checkout being
      # throwaway is not the point -- the point is that a workflow which mutates
      # tracked files cannot tell a real diff from its own, so it can neither
      # assert that a build leaves the tree clean nor be safely reused by anyone
      # running these steps locally.  configure.yml does it in the checkout
      # because that IS its subject; here the C library is only a measuring stick.
      #
      # So the tree is copied to $RUNNER_TEMP, configured and built there, and the
      # resulting library is copied back under target/ (which .gitignore covers)
      # to be compared.  The Rust side is built in the checkout with `make rust`,
      # which needs no configure because the committed Makefile forwards the rust*
      # targets, and ZLIBREF points it at the copied-back baseline so its own
      # C-versus-Rust comparison runs too.
      run: |
        set -eu
        C_TREE="$RUNNER_TEMP/c-oracle"
        rm -rf "$C_TREE"
        mkdir -p "$C_TREE"
        tar -cf - --exclude=./.git --exclude=./target . | (cd "$C_TREE" && tar -xf -)
        mkdir -p target/symbol-parity
        ( cd "$C_TREE" && ./configure && make -j2 ) || {
          cp "$C_TREE/configure.log" target/symbol-parity/ 2>/dev/null || true
          echo "::error::the C baseline could not be built; configure.log is in the uploaded artifact"
          exit 1
        }
        cp "$C_TREE/$CLIB" "target/symbol-parity/$CLIB"
        echo "CLIB=target/symbol-parity/$CLIB" >> "$GITHUB_ENV"
        make rust CARGO=cargo ZLIBREF="target/symbol-parity/$CLIB"

    - name: Verify the working tree is unmodified
      # The assertion that makes the copy above meaningful rather than decorative.
      # If anything in this job writes to a tracked file -- a stray ./configure, a
      # generated header at the root, a Makefile rewrite -- this fails and names
      # the file, instead of the mutation being discovered later by a developer
      # wondering why their checkout is dirty.
      run: |
        set -eu
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::the working tree was modified by this job"
          git status --porcelain
          exit 1
        fi
        echo "working tree clean: nothing tracked was written"

    - name: Run test cases (pkg-config descriptor, configured tree)
      # This tree HAS a configure-generated zlib.pc, which is what makes it the
      # right place for the other half of the packaging gate: `make rust-pc'
      # copies that descriptor, adds the one Libs.private line a Rust static
      # archive needs, and asserts that Name, Description, Version, License,
      # Requires, Libs and Cflags came through byte for byte -- the property
      # that keeps the two implementations answering a consumer identically
      # everywhere they do not genuinely differ.  It then links and runs a C
      # consumer built from nothing but the flags pkg-config answers.
      #
      # The drop-in job runs the same target unconfigured, where the descriptor
      # is substituted from zlib.pc.in instead.
      run: |
        set -eu
        make rust-pc CARGO=cargo

        # The C descriptor is the baseline this one is derived from, so the
        # difference between them has to be exactly the added key -- nothing
        # else, in either direction.
        #
        # ★ EVERY DIFFERING LINE IS CLASSIFIED, IN BOTH DIRECTIONS.  An earlier
        # revision counted the added lines into $ADDED and then never looked at
        # it -- shellcheck said so, SC2034, and it was right: the gate asserted
        # only that nothing was REMOVED and that a Libs.private line existed
        # somewhere, so a descriptor that also gained a `Requires.private:', a
        # second `Libs:' or a rewritten `Cflags:' passed.  For a file whose whole
        # purpose is to answer a consumer's link command that is the wrong thing
        # to leave unchecked.
        #
        # So each `+' line must match one of exactly three allowed forms, and
        # anything else fails and is printed:
        #
        #   `+++ '           the unified-diff header, exactly one
        #   `+#'             the generated comment header, any number
        #   `+Libs.private: -'  the one key this descriptor exists to add, exactly one
        #
        # and the three counts must add up to the total, so a line cannot be
        # counted by two rules or by none.  The removed side must be the `--- '
        # header and nothing else: not one line of the C descriptor's content may
        # disappear, because dynamic consumers of the two implementations have to
        # be answered identically.
        #
        # Measured shape of a clean run: 23 added -- 1 diff header, 21 comment
        # lines, 1 Libs.private -- and 1 removed.  The count is deliberately NOT
        # asserted as 23: the comment header is prose and may grow.  The
        # classification is what holds.
        diff -u zlib.pc target/dropin/zlib.pc > target/symbol-parity-pc.diff || true
        cat target/symbol-parity-pc.diff

        REMOVED=$(grep -c '^-' target/symbol-parity-pc.diff || true)
        if [ "$REMOVED" != 1 ] \
           || [ "$(grep -c '^--- ' target/symbol-parity-pc.diff || true)" != 1 ]; then
          echo "::error::the Rust descriptor removed $((REMOVED - 1)) line(s) of the C" \
               "descriptor's content; a dynamic consumer must be answered identically" \
               "by both implementations"
          grep '^-' target/symbol-parity-pc.diff | grep -v '^--- ' || true
          exit 1
        fi

        ADDED=$(grep -c '^+' target/symbol-parity-pc.diff || true)
        ADDED_HEADER=$(grep -c '^+++ ' target/symbol-parity-pc.diff || true)
        ADDED_COMMENT=$(grep -c '^+#' target/symbol-parity-pc.diff || true)
        ADDED_PRIVATE=$(grep -c '^+Libs\.private: -' target/symbol-parity-pc.diff || true)

        UNCLASSIFIED=$(grep '^+' target/symbol-parity-pc.diff \
                       | grep -cvE '^(\+\+\+ |\+#|\+Libs\.private: -)' || true)
        if [ "$UNCLASSIFIED" != 0 ]; then
          echo "::error::the Rust descriptor added $UNCLASSIFIED line(s) that are neither the" \
               "diff header, a generated comment, nor the Libs.private key:"
          grep '^+' target/symbol-parity-pc.diff \
            | grep -vE '^(\+\+\+ |\+#|\+Libs\.private: -)' || true
          exit 1
        fi

        if [ "$ADDED_PRIVATE" != 1 ]; then
          echo "::error::the Rust descriptor carries $ADDED_PRIVATE non-empty Libs.private" \
               "lines; a Rust staticlib needs exactly one, and pkg-config reads only the first"
          exit 1
        fi

        if [ "$ADDED_HEADER" != 1 ]; then
          echo "::error::the diff has $ADDED_HEADER '+++' header lines, so it is not the" \
               "single-file comparison this gate assumes"
          exit 1
        fi

        if [ "$ADDED" -ne "$((ADDED_HEADER + ADDED_COMMENT + ADDED_PRIVATE))" ]; then
          echo "::error::the $ADDED added lines do not add up as" \
               "$ADDED_HEADER header + $ADDED_COMMENT comment + $ADDED_PRIVATE key;" \
               "a line is being counted twice or not at all"
          exit 1
        fi

        echo "the two descriptors differ by exactly one added Libs.private key and" \
             "$ADDED_COMMENT generated comment lines; nothing was removed"

    - name: Run test cases
      run: |
        set -eu
        # CLIB is set by the two earlier steps through $GITHUB_ENV -- first the
        # versioned name derived from zlib.h, then the path the built baseline was
        # copied to -- so it is not assigned anywhere in THIS script.  The local is
        # spelled without an underscore-separated echo of that name on purpose:
        # `C_LIB="$CLIB"' reads to shellcheck as a misspelling of the variable it is
        # assigning (SC2153) and it cannot see a step environment, so the pair is
        # named apart instead of suppressing the check.
        C_BASELINE="${CLIB:?the C baseline library was not recorded by the earlier steps}"
        R_LIB=target/dropin/libz.so
        [ -f "$C_BASELINE" ] \
          || { echo "::error::the C baseline $C_BASELINE was not built"; exit 1; }
        [ -e "$R_LIB" ] || { echo "::error::the staged Rust library $R_LIB is missing"; exit 1; }

        # Every list this step writes goes under target/, which .gitignore
        # covers with an anchored rule, so a failing run cannot leave a
        # committable file behind.  The lists ARE the evidence, so they are kept
        # and uploaded rather than deleted.
        S=target/symbol-parity
        mkdir -p "$S"

        # --- the authoritative comparison ----------------------------------
        # `nm -D` prints a version tag on every versioned symbol, so field 3
        # arrives in three shapes: 41 plain names, 54 of the form
        # name@@ZLIB_x.y.z, and the 16 version node names themselves.  Diffing
        # field 3 RAW therefore checks the version-node bindings as well as the
        # name set, and zlib.map's bindings are part of the contract.
        nm -D --defined-only --extern-only "$C_BASELINE" | awk '{print $3}' | sort > "$S/c.syms"
        nm -D --defined-only --extern-only "$R_LIB" | awk '{print $3}' | sort > "$S/rust.syms"
        if diff -u "$S/c.syms" "$S/rust.syms" > "$S/syms.diff"; then
          echo "exported symbol sets are identical: $(wc -l < "$S/rust.syms" | tr -d ' ') symbols"
        else
          echo "::error::exported symbol sets differ"
          cat "$S/syms.diff"
          # A library that failed to apply --version-script=zlib.map differs
          # from the baseline on roughly 108 lines, which reads as noise rather
          # than as a diagnosis.  So compare the FUNCTION names alone -- nm type
          # T, with the @@ tag stripped, and therefore without the type-A node
          # names that would otherwise reappear as a difference of their own.
          # If THAT comparison is clean, every function is present and only the
          # version bindings are wrong, which points straight at the linker
          # argument instead of at the facade.
          echo "--- the same comparison over function names only, tags stripped ---"
          nm -D --defined-only --extern-only "$C_BASELINE" | awk '$2=="T"{print $3}' | sed 's/@@.*//' | sort -u > "$S/c.names"
          nm -D --defined-only --extern-only "$R_LIB" | awk '$2=="T"{print $3}' | sed 's/@@.*//' | sort -u > "$S/rust.names"
          if diff -u "$S/c.names" "$S/rust.names"; then
            echo "::error::the NAME sets are identical, so the difference is in the symbol version bindings: zlib.map was not applied to the Rust library"
          fi
          comm -23 "$S/c.names" "$S/rust.names" > "$S/missing.syms" || true
          comm -13 "$S/c.names" "$S/rust.names" > "$S/extra.syms" || true
          exit 1
        fi

        # --- the shape of the surface, on both sides -----------------------
        # 111 = 95 functions + 16 version nodes.  The node count is re-derived
        # from zlib.map rather than trusted, so a change to the version script
        # cannot quietly agree with a stale literal.  The three totals are also
        # recorded in Cargo.toml's [workspace.metadata.zlib].
        MAP_NODES=$(grep -cE '^[A-Za-z_][A-Za-z0-9_.]*[[:space:]]*\{' zlib.map)
        [ "$MAP_NODES" -eq 16 ] || { echo "::error::zlib.map declares $MAP_NODES version nodes, expected 16"; exit 1; }
        for lib in "$C_BASELINE" "$R_LIB"; do
          nm -D --defined-only --extern-only "$lib" > "$S/nm.out"
          total=$(wc -l < "$S/nm.out" | tr -d ' ')
          fns=$(awk '$2=="T"' "$S/nm.out" | wc -l | tr -d ' ')
          nodes=$(awk '$2=="A"' "$S/nm.out" | wc -l | tr -d ' ')
          echo "$lib: $total dynamic globals = $fns functions + $nodes version nodes"
          [ "$total" -eq 111 ] || { echo "::error::$lib exports $total symbols, expected 111"; exit 1; }
          [ "$fns"   -eq 95  ] || { echo "::error::$lib exports $fns functions, expected 95"; exit 1; }
          [ "$nodes" -eq "$MAP_NODES" ] || { echo "::error::$lib carries $nodes version nodes, expected $MAP_NODES"; exit 1; }
        done

        # --- the SONAME ----------------------------------------------------
        # The SONAME is what the loader searches for, so it is as much a part of
        # the ABI as the symbol names are.  Get it wrong and every consumer
        # silently binds a different library.
        for lib in "$C_BASELINE" "$R_LIB"; do
          readelf -d "$lib" | grep -i soname || true
          readelf -d "$lib" | grep -qE 'SONAME.*\[libz\.so\.1\]' || {
            echo "::error::$lib does not declare SONAME libz.so.1"; exit 1; }
        done
        echo "SONAME is libz.so.1 on both libraries"

        # --- the hidden set ------------------------------------------------
        # zlib.map's `local:` block names ten internals that must NOT be
        # exported, plus everything matching _*.  The port keeps them hidden
        # twice over -- they are never #[no_mangle], and the library is linked
        # with --version-script=zlib.map -- and this is what proves it.
        HIDDEN='deflate_copyright inflate_copyright inflate_fast inflate_table
                zcalloc zcfree z_errmsg gz_error gz_intmax inflate_fixed'
        for lib in "$C_BASELINE" "$R_LIB"; do
          nm -D --defined-only --extern-only "$lib" | awk '{print $3}' | sed 's/@@.*//' | sort -u > "$S/exported.names"
          for sym in $HIDDEN; do
            if grep -qx "$sym" "$S/exported.names"; then
              echo "::error::$lib exports $sym, which zlib.map lists under local:"
              exit 1
            fi
          done
          if grep -E '^_' "$S/exported.names"; then
            echo "::error::$lib exports a symbol matching zlib.map's local: _* pattern"
            exit 1
          fi
        done
        echo "all 10 zlib.map local: names hidden, nothing matching _* exported"

        # --- both large-file families, positively --------------------------
        # zconf.h redirects these names based on the CALLER's own
        # _FILE_OFFSET_BITS and _LARGEFILE64_SOURCE at the CALLER's own compile
        # time, so the library has to export both spellings.  The raw diff above
        # would already catch a missing one, but naming them makes the
        # requirement legible instead of implicit.
        nm -D --defined-only --extern-only "$R_LIB" | awk '{print $3}' | sed 's/@@.*//' | sort -u > "$S/exported.names"
        for sym in adler32_combine64 adler32_z compress2_z compressBound_z compress_z \
                   crc32_combine64 crc32_combine_gen64 crc32_z deflateBound_z \
                   gzoffset64 gzopen64 gzseek64 gztell64 uncompress2_z uncompress_z; do
          grep -qx "$sym" "$S/exported.names" || {
            echo "::error::the Rust library does not export $sym"; exit 1; }
        done
        gzcount=$(grep -c '^gz' "$S/exported.names")
        [ "$gzcount" -eq 32 ] || { echo "::error::$gzcount gz* symbols exported, expected 32"; exit 1; }
        echo "both large-file families present; $gzcount gz* symbols"
        echo "symbol parity: PASS"

    - name: Run test cases (the packaged gates, armed)
      # ★ THE RUST-SIDE HALF OF THIS JOB, AND WHY IT IS ARMED.
      #
      # Everything above is shell: `nm`, `readelf`, `diff`.  `symbol_parity.rs`
      # asserts the same contract from inside the workspace and adds what shell
      # cannot reach -- the baseline reconciled against zlib.map's own text, the
      # symlink TOPOLOGY read with `read_link` rather than dereferenced, the
      # `inflate_table` asymmetry between archive and shared library, and
      # `zlibCompileFlags()` bit 27 checked against the two artifacts that ship.
      #
      # Every one of those inspects a file `cargo test` never builds, so each
      # SKIPS by default.  That default is right for a developer and vacuous
      # here: before this step existed, no job in this workflow ran the suite at
      # all, so its nine packaged gates were green everywhere and had never
      # opened the library.  Two mechanisms close that, and both are needed --
      # `ZLIB_RS_REQUIRE_PACKAGED=1` turns a missing drop-in into a failure that
      # names what went unverified, and the `SKIP:` scan below catches the
      # remaining skip reasons (a missing cdylib, a missing staticlib, absent
      # binutils) which arming does not cover because they are not packaged
      # artifacts.
      #
      # `--release` is not incidental: `make rust` above built with
      # CARGO_BUILD_FLAGS='--locked --release', so the release directory already
      # holds the cdylib and the archive this suite compares, and the test binary
      # must land beside them for `profile_dir()` to find them.
      run: |
        set -eu
        S=target/symbol-parity
        mkdir -p "$S"
        ZLIB_RS_REQUIRE_PACKAGED=1 cargo test --locked --release \
          -p libz-rs-sys --test symbol_parity -- --nocapture 2>&1 | tee "$S/symbol_parity.log"
        if grep -n '^SKIP:' "$S/symbol_parity.log"; then
          echo "::error::symbol_parity.rs skipped an assertion in a job that staged every artifact it inspects; a skip here is an unverified gate, not a pass"
          exit 1
        fi
        RAN=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' "$S/symbol_parity.log")
        # An `if' rather than `A && B || C': with the latter the third clause also
        # runs when the first two succeed but the LAST one of them returns non-zero,
        # which is not what a two-part precondition means (shellcheck SC2015).  Here
        # the two parts are "the count was parsed at all" and "it is high enough",
        # and both have to hold.
        if [ -z "$RAN" ] || [ "$RAN" -lt 16 ]; then
          echo "::error::expected at least 16 passing symbol_parity gates, saw '${RAN:-none}'"
          exit 1
        fi
        echo "symbol_parity.rs: $RAN gates passed, zero skipped"

    - name: Run test cases (ZLIB_RS_SIMD=1 exports the same surface)
      # `ZLIB_RS_SIMD=1 make rust` is the DOCUMENTED user-facing spelling of the
      # toggle -- README and Makefile.in both give it that way -- and the
      # Makefile is where the translation from variable to Cargo feature happens,
      # because a build script cannot enable a feature.  Measured here: the
      # recipe turns it into `--features simd` for zlib-rs and
      # `--features libz-compat,gz,simd` for the facade.  Nothing else in this
      # workflow drives that path; `build-test` checks the variable against the
      # build script's reconciliation, which is the other half of the same
      # contract.
      #
      # The assertion is that the vectorised build's exported surface is
      # identical to the scalar one just compared against the C baseline --
      # version tags included, since field 3 of `nm -D` carries them.  SIMD is
      # confined to CRC-32 and Adler-32 and is output-neutral, so it must not
      # add, remove or rebind one symbol; a checksum feature that moved the ABI
      # would be a far worse defect than a slow checksum.  Verified locally:
      # 111 symbols, identical.
      run: |
        set -eu
        S=target/symbol-parity
        cp "$S/rust.syms" "$S/rust-scalar.syms"
        ZLIB_RS_SIMD=1 make rust CARGO=cargo ZLIBREF="$CLIB"
        nm -D --defined-only --extern-only target/dropin/libz.so \
          | awk '{print $3}' | sort > "$S/rust-simd.syms"
        if ! diff -u "$S/rust-scalar.syms" "$S/rust-simd.syms" > "$S/simd.diff"; then
          echo "::error::the ZLIB_RS_SIMD=1 build exports a different surface from the scalar build. SIMD is confined to the two checksums and must be ABI-neutral as well as output-neutral."
          cat "$S/simd.diff"
          exit 1
        fi
        echo "ZLIB_RS_SIMD=1 make rust: identical surface, $(wc -l < "$S/rust-simd.syms" | tr -d ' ') symbols"

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: symbol-parity
        path: |
          target/symbol-parity/
        retention-days: 7


  # ---------------------------------------------------------------------------
  # 8. Header conformance: the C header cbindgen derives from the facade,
  # compared against the immutable zlib.h.
  #
  # ★ THERE IS A LITERAL DIFF, IT IS REQUIRED TO BE EMPTY, AND IT IS PASS D.
  # AAP 0.8.6 freezes `diff -u zlib.h generated_zlib.h`; AAP 0.4.2.3 makes the
  # diff the gate.  Two things follow, and this job does both rather than
  # choosing between them.
  #
  # First, a diff of the two FILES cannot be the pass/fail check.  cbindgen
  # cannot emit the ZEXTERN/ZEXPORT declaration macros, cannot express zlib.h's
  # conditional `#include` of zconf.h, cannot reproduce the function-like macros
  # or the conditional large-file duplicate declaration blocks, and alphabetises
  # what zlib.h orders thematically -- so that diff is permanently non-empty
  # (thousands of lines here) and wiring its exit status up would give a gate that is
  # always red or quietly ignored.  It IS run, and written to
  # target/header-gate/aap-0.8.6-raw.diff with the job's artifacts.
  #
  # AND ITS CONTENT IS ASSERTED, which is pass E.  Publishing the diff so that "a
  # reviewer can confirm its content is only the reasons cbindgen.toml enumerates"
  # put the burden on a human re-reading six thousand lines, which is the same as
  # not checking it.  Pass E redoes the comparison on comment-stripped copies of
  # the two files -- D8 is most of the volume and doc prose has no syntax to
  # recognise -- and then requires EVERY remaining differing line to be
  # attributable to an enumerated reason, with a category printed for each and an
  # unattributable line failing the job.  It is what caught `wcstombs`: cbindgen
  # renders a C-runtime import exactly as it renders an export, so the artifact
  # was publishing `size_t wcstombs(char *, const wchar_t *, size_t)` inside a
  # header guarded by ZLIB_H.  Its full classification is published too, as
  # target/header-gate/aap-0.8.6-classified.diff.
  #
  # Second, and this is the part that used to be missing: the CONTRACT is
  # diffable literally, and its diff is required to be empty.  Pass D renders
  # each side's 95 contract signatures as one `name<TAB>type` line, where the
  # type is produced by the C++ compiler's own mangling of `decltype(&f)` -- so
  # the zconf.h typedef chain, the parameter names, bare `unsigned`, the
  # ZEXTERN/FAR/z_const decoration and declaration order are all resolved by the
  # compiler rather than by a regex guessing at those rules -- and requires
  # `diff -u` over the two renderings to produce NO OUTPUT.  It is empty today
  # with no allowance of any kind, which is why cbindgen.toml's D2 was CLOSED at
  # the source (the facade's structs carry the contract's tag names) instead of
  # being normalised away.
  #
  # The rest of the specification in cbindgen.toml under "NORMALISATION RULES THE
  # GATE MUST IMPLEMENT" is split across two mechanisms on purpose:
  #
  #   * `make rust-header` already implements rules A1, A2, A5 and A9 -- it
  #     regenerates the artifact, holds cbindgen's stderr to an enumerated
  #     allowance, compiles the result standalone as C89, C99, C17 and C++17
  #     with warnings fatal, and compares the DECLARED FUNCTION NAMES against
  #     zlib.h's ZEXTERN set in both directions.
  #   * rules A3, A4, A6, A7, A8, rule 10 and rule A11 -- the ones that need the
  #     typedef chain resolved and the macro values evaluated -- are assigned by
  #     name to this workflow, and the step below is where they run.  Until they
  #     run, no command anywhere may be described as having verified a signature.
  #     THEY DID NOT RUN UNTIL THIS WAS FIXED: the gate read its generated header
  #     from target/header-gate/, which nothing writes, so it died on its first
  #     preprocess and passes A, A', B and rule 10 had never executed once.
  #
  # HOW THE SHAPE COMPARISON WORKS, and why it is not a text normaliser: every
  # prototype taken from the generated header is RE-DECLARED in a translation
  # unit that has already included zlib.h.  A divergent return type, parameter
  # type or qualifier is then a "conflicting types" error from the C compiler
  # itself, which resolves the whole zconf.h typedef chain (A8), drops parameter
  # names unambiguously (A6), canonicalises bare `unsigned` (A7) and ignores the
  # ZEXTERN/ZEXPORT/FAR/z_const decoration (A4) for free.  A regex cannot do
  # this reliably: zlib.h omits parameter names throughout the large-file block,
  # so `adler32_combine(uLong, uLong, z_off_t)` gives a text pass no way to tell
  # a type from a name -- an earlier normaliser reported eleven false mismatches
  # for exactly that reason.
  # ---------------------------------------------------------------------------
  header:
    name: Header conformance
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Install packages (Linux)
      # cbindgen is pinned: 0.29.4 is the version every key in cbindgen.toml was
      # checked against, and a different release can change the incidental
      # formatting the accepted-divergence list describes.  g++ is needed twice
      # over: for the C++17 arm of the standalone compile sweep, and because rule
      # A11's literal diff renders both sides' signatures through C++ name
      # mangling, which is what resolves the zconf.h typedef chain.  `nm` comes
      # from binutils and reads that rendering back; the gate fails closed if
      # either is missing, because a literal diff that quietly did not run is the
      # failure it was added to end.
      run: |
        cargo install cbindgen --locked --version 0.29.4
        cbindgen --version
        g++ --version | head -1

    - name: Compile source code
      # Rules A1, A2, A5, A9 plus the standalone C89/C99/C17/C++17 compile
      # sweep, with and without _WIN32.
      #
      # RUSTHEADER is redirected under target/ rather than left at Makefile.in's
      # default of `generated_zlib.h` AT THE REPOSITORY ROOT.  The default is
      # right for a developer typing `make rust-header` -- the artifact lands
      # where they can read it -- but wrong for CI: this target and its scratch
      # siblings (.warn, .log, .probe.c, .ref, .gen) write five files into the
      # root of the tree, so the job cannot then assert that it left the tree
      # untouched, and a stray one is a file someone can commit.  .gitignore
      # covers `/target/` with an anchored rule, so nothing under it can be.
      run: |
        set -eu
        mkdir -p target/rust-header
        make rust-header CARGO=cargo RUSTHEADER=target/rust-header/generated_zlib.h

    - name: Run test cases
      run: |
        set -eu
        set -o pipefail
        # Regenerated explicitly so that this step stands on its own, and so
        # that the exact command a developer runs by hand is the command the
        # gate runs.  generated_zlib.h is a build artifact: .gitignore carries
        # an anchored rule for it, and it must never be committed.  zlib.h is
        # read-only and is never written by anything here.
        #
        # ★ THE FOUR SCRATCH FILES ARE (RE)PRODUCED HERE, and that is the point.
        # `make rust-header` above writes generated_zlib.h.{warn,log,probe.c,
        # ref,gen} -- Makefile.in's RUSTHEADERSCRATCH -- and keeps them only when
        # IT fails; a successful make removes them.  So in the failure mode where
        # THIS step's gate is what fails, the make has already swept them away
        # and an upload naming them would collect nothing at all.  Each is
        # therefore written again here with the same meaning the Makefile gives
        # it: `.warn` is cbindgen's stderr, `.log` this gate's whole transcript,
        # and `.ref`/`.gen` the contract function names each header declares
        # (written by the gate itself, right after it scans them).
        cbindgen --config cbindgen.toml --crate libz-rs-sys --output generated_zlib.h \
          2> generated_zlib.h.warn || {
            echo "::error::cbindgen could not generate the header"
            sed 's/^/    /' generated_zlib.h.warn >&2
            exit 1
          }
        if test -s generated_zlib.h.warn; then
          echo "cbindgen wrote diagnostics (kept in generated_zlib.h.warn):"
          sed 's/^/    /' generated_zlib.h.warn
        else
          echo "cbindgen produced no diagnostics" > generated_zlib.h.warn
        fi
        # `tee` plus `pipefail`: the transcript is captured for the upload and the
        # gate's exit status still decides the step.
        python3 - <<'SHAPE_GATE' 2>&1 | tee generated_zlib.h.log
        """cbindgen shape gate: rules A3, A4, A6, A7, A8, rule 10 and rule A11.

        Pass A  -- every generated prototype is re-declared against zlib.h, so
                   the C compiler decides whether the signatures are identical.
        Pass A' -- the four function-pointer typedefs are compared the same way.
                   A signature that reaches one of them BY NAME would otherwise
                   compare equal to itself and hide a divergence inside it.
        Pass D  -- the LITERAL diff AAP 0.8.6 freezes: both sides' signatures
                   rendered canonically by the C++ compiler's mangling, diffed,
                   and required to produce no output at all.
        Pass B  -- struct sizes and per-field offsets and widths, and the
                   integer object-like macros by value, compared by building one
                   probe program per side and diffing what they print.
        """
        import os
        import re
        import subprocess
        import sys

        REF = "zlib.h"
        # ★ THE ARTIFACT THIS STEP JUST GENERATED, at the repository root.  This
        # read `os.path.join("target", "header-gate", "generated_zlib.h")`, which
        # NOTHING writes: the `cbindgen` invocation above outputs
        # `generated_zlib.h` and the make step before it wrote
        # target/rust-header/generated_zlib.h, so the first `preprocess` call died
        # with "No such file or directory" and every pass below it -- A, A', B and
        # rule 10 -- had never once run.  Reproduced locally before the fix.  The
        # root path is also the one the `.ref`/`.gen` scratch siblings and the
        # failure upload are named for, so it is the value the rest of this step
        # was already written around.
        GEN = "generated_zlib.h"
        # Rule A2: preprocess each side under its own DECLARED configuration.
        # _LARGEFILE64_SOURCE=1 without _FILE_OFFSET_BITS=64 is the reference
        # build's own setting, and it is what makes the large-file duplicates
        # unambiguous: Z_LARGE64 defined, Z_WANT64 undefined, and each of the 14
        # large-file names declared exactly once.  ZLIB_CONST turns zconf.h's
        # `z_const` into `const`, which is where the generated header hard-codes
        # it; that is stricter than deleting the token, because every other
        # `const` stays meaningful.
        REF_DEFS = ["-D_LARGEFILE64_SOURCE=1", "-DZLIB_CONST"]
        GEN_DEFS = ["-DZLIB_RS_LIBZ_COMPAT", "-DZLIB_RS_GZ"]
        # The three structs whose layout is caller-visible, named by their CONTRACT
        # TAG rather than by a typedef.  gzFile_s is the one that cannot be got
        # wrong quietly: the gzgetc macro is expanded in CALLER object code and
        # loads have/next/pos at offsets 0, 8 and 16.
        #
        # The tag is the right key because both headers now declare all three of
        # them -- `zlib.h` L90/L118/L1956 always did, and the generated header does
        # since cbindgen.toml moved to `style = "both"` and the facade's structs
        # took the contract's tag names.  Keying on the typedef instead is what
        # this did, and it made the generated side silently contribute NOTHING for
        # z_stream and gz_header: `spelling()` looked for `} z_stream;`, the
        # artifact ends that struct `} z_stream_s;`, so both structs were skipped
        # and 27 of the 30 field comparisons below never happened.
        ABI_STRUCTS = ["z_stream_s", "gz_header_s", "gzFile_s"]
        # Function-like macros in the contract.  gzgetc is both a macro and a
        # real exported function, so it has to be undefined before the function
        # can be re-declared.
        MACRO_FN = ["deflateInit", "deflateInit2", "inflateInit", "inflateInit2",
                    "inflateBackInit", "gzgetc"]
        CC = os.environ.get("CC") or "cc"
        STRICT = ["-std=c99", "-Wall", "-Wextra", "-Werror"]
        # Every probe source and binary is written under target/, which
        # .gitignore covers with an anchored rule, so this gate cannot leave a
        # committable file behind however it exits.  The compiles keep `-I.`, so
        # they still resolve zlib.h and zconf.h from the repository root.
        SCRATCH = os.path.join("target", "header-gate")
        os.makedirs(SCRATCH, exist_ok=True)
        failures = []


        def run(cmd):
            return subprocess.run(cmd, capture_output=True, text=True, check=False)


        def nocomment(text):
            """Rule A1."""
            text = re.sub(r"/\*.*?\*/", " ", text, flags=re.S)
            return re.sub(r"//[^\n]*", " ", text)


        def preprocess(path, defs):
            result = run([CC, "-E", "-P", "-I.", *defs, path])
            if result.returncode != 0:
                sys.exit("cannot preprocess %s:\n%s" % (path, result.stderr))
            return result.stdout


        # Rule A9: the contract is exactly zlib.h's ZEXTERN/ZEXPORTVA set.
        contract = set()
        for match in re.finditer(r"\bZEXTERN(?:VA)?\b(.*?);", nocomment(open(REF).read()), re.S):
            named = re.findall(r"\b(\w+)\s*\(", match.group(1))
            if named:
                contract.add(named[0])
        if len(contract) < 90:
            sys.exit("only %d ZEXTERN declarations found in %s; the scan is wrong"
                     % (len(contract), REF))

        # Collect the generated prototypes and function-pointer typedefs.
        text = nocomment(preprocess(GEN, GEN_DEFS))
        text = re.sub(r"\b(?:struct|union|enum)\s*\w*\s*\{[^{}]*\}", "SBODY", text)
        text = re.sub(r'\bextern\s*"C"\s*\{|\}', " ", text)          # rule A3
        decls, typedefs = {}, {}
        for statement in text.split(";"):
            flat = " ".join(statement.split())
            if not flat or "(" not in flat or "SBODY" in flat:
                continue
            if flat.startswith("typedef"):
                pointer = re.match(r"typedef\s+(.*?)\(\s*\*\s*(\w+)\s*\)\s*\((.*)\)$", flat)
                if pointer:
                    typedefs[pointer.group(2)] = (pointer.group(1).strip(),
                                                  pointer.group(3).strip())
                continue
            prototype = re.match(r"^.*?\b(\w+)\s*\(.*\)$", flat)
            if prototype and prototype.group(1) in contract:
                decls[prototype.group(1)] = flat
        if not decls:
            sys.exit("no contract prototypes found in %s; the scan is wrong" % GEN)

        # The two name lists, written where `make rust-header` writes them and
        # meaning what they mean there, so the failure upload has them however
        # this gate exits -- see the note at the top of this step.  `.gen` is the
        # CONTRACT-FILTERED set, which is exactly what pass A goes on to compare:
        # `comm -23` of the two files answers "which contract functions did the
        # generated header not declare", the question a pass-A failure raises.
        for path, names in ((GEN + ".ref", sorted(contract)),
                            (GEN + ".gen", sorted(decls))):
            with open(path, "w") as handle:
                handle.write("\n".join(names) + "\n")
        print("wrote %s.ref (%d ZEXTERN names in %s) and %s.gen (%d of them "
              "declared by the generated header)"
              % (GEN, len(contract), REF, GEN, len(decls)))

        PREAMBLE = ["#define _LARGEFILE64_SOURCE 1", "#define ZLIB_CONST 1",
                    "#include <stdarg.h>", "#include <stddef.h>", "#include <stdint.h>",
                    '#include "zlib.h"'] + ["#undef %s" % name for name in MACRO_FN]


        def compile_probe(stem, body):
            stem = os.path.join(SCRATCH, stem)
            with open(stem + ".c", "w") as handle:
                handle.write("\n".join(PREAMBLE + body) + "\n")
            return run([CC, *STRICT, "-I.", "-fsyntax-only", stem + ".c"])

        # Pass A -- signatures.
        result = compile_probe("gate_signatures", ["%s;" % decls[n] for n in sorted(decls)])
        if result.returncode != 0:
            failures.append("signature identity")
            print("::error::a generated prototype does not match zlib.h")
            print(result.stderr[:8000])
        print("pass A: %d of %d contract signatures compared by the compiler"
              % (len(decls), len(contract)))

        # Pass A' -- the function-pointer typedefs.
        body = []
        for name, (ret, args) in sorted(typedefs.items()):
            body.append("extern %s zrs_probe_%s;" % (name, name))
            body.append("extern %s (*zrs_probe_%s)(%s);" % (ret, name, args))
        result = compile_probe("gate_typedefs", body)
        if result.returncode != 0:
            failures.append("function-pointer typedef identity")
            print("::error::a generated function-pointer typedef does not match zlib.h")
            print(result.stderr[:4000])
        print("pass A': typedefs compared: %s" % (", ".join(sorted(typedefs)) or "none"))

        # ---------------------------------------------------------------------
        # Pass D -- THE LITERAL DIFF, and it is required to be EMPTY.
        #
        # AAP 0.8.6 freezes `diff -u zlib.h generated_zlib.h` and AAP 0.4.2.3 makes
        # the diff the gate.  A diff of the two FILES cannot be the gate and this
        # step says so plainly at the top -- cbindgen cannot emit zlib.h's comments,
        # its ZEXTERN/ZEXPORT declaration macros, its function-like macros or its
        # conditional include of zconf.h -- but "the files differ" was never the
        # requirement.  The requirement is that the CONTRACT does not differ, and
        # that IS diffable, literally, if both sides are rendered by one tool
        # applied identically to each.
        #
        # The tool is the C++ compiler and the renderer is Itanium name mangling.
        # For every contract function, one explicit instantiation of
        # `zrs_sig<zrs_tag_NAME, decltype(&NAME)>` is emitted; the mangled symbol
        # encodes the FULLY RESOLVED function type, and `nm -C` prints it back.
        # That resolution is the whole point: it walks the entire zconf.h typedef
        # chain (A8), drops parameter names (A6), canonicalises bare `unsigned`
        # (A7), discards the ZEXTERN/ZEXPORT/FAR/z_const decoration (A4, D1) and
        # normalises declaration order (D7) -- not by a regex that guesses at
        # those rules, but because the compiler has already applied them to reach a
        # type.  The tag parameter carries the function's NAME into the symbol, so
        # two functions with the same signature stay distinguishable and the
        # projection is keyed rather than merely sorted.
        #
        # WHAT MAKES IT NON-VACUOUS.  The line count is asserted against the number
        # of names pass A compared, so a projection that silently lost a function
        # fails rather than diffing a shorter file against a shorter file; the
        # count is floored at 90 so an empty projection cannot pass; and the two
        # sides are produced by the SAME generator function differing only in the
        # header and its `-D` set, so there is no per-side normalisation to drift.
        #
        # WHAT IT DOES NOT COVER, and where that is covered instead: struct layout
        # and macro values are pass B, which is also a literal comparison of two
        # probe outputs; the two-way NAME set is rule A9 and `make rust-header`;
        # export status is `make rust` with nm.  Between them nothing in the
        # contract is checked by prose alone.
        # ---------------------------------------------------------------------
        CXX = os.environ.get("CXX") or "g++"
        compared_names = sorted(decls)


        def signature_projection(header, defs, stem):
            """One `name<TAB>fully-resolved-type` line per contract function."""
            source = ["#define _LARGEFILE64_SOURCE 1", "#define ZLIB_CONST 1",
                      "#include <stdarg.h>", "#include <stddef.h>",
                      '#include "%s"' % header]
            source += ["#undef %s" % name for name in MACRO_FN]
            source.append("template <class Tag, class T> void zrs_sig() {}")
            for name in compared_names:
                source.append("struct zrs_tag_%s {};" % name)
                source.append("template void zrs_sig<zrs_tag_%s, decltype(&%s)>();"
                              % (name, name))
            stem = os.path.join(SCRATCH, stem)
            with open(stem + ".cpp", "w") as handle:
                handle.write("\n".join(source) + "\n")
            built = run([CXX, "-std=c++17", "-I.", *defs, "-c", "-o", stem + ".o",
                         stem + ".cpp"])
            if built.returncode != 0:
                return None, "%s: %s" % (CXX, built.stderr)
            listed = run(["nm", "-C", "--defined-only", stem + ".o"])
            if listed.returncode != 0:
                return None, "nm: %s" % listed.stderr
            found = {}
            for line in listed.stdout.splitlines():
                match = re.search(r"void zrs_sig<zrs_tag_(\w+), (.*)>\(\)", line)
                if match:
                    found[match.group(1)] = match.group(2)
            return found, ""

        # Fail closed rather than skipping: a literal diff that quietly did not run
        # is the exact failure this pass was added to end.
        for tool in (CXX, "nm"):
            if run(["sh", "-c", "command -v %s" % tool]).returncode != 0:
                sys.exit("pass D needs %s, which is not on PATH.  It is the tool "
                         "that resolves the typedef chain, so there is no reduced "
                         "form of this check to fall back to." % tool)

        projections, sides = {}, (("ref", REF, REF_DEFS), ("gen", GEN, GEN_DEFS))
        for side, path, defs in sides:
            found, error = signature_projection(path, defs, "gate_sig_" + side)
            if found is None:
                failures.append("signature projection (%s)" % side)
                print("::error::the canonical signature projection of %s could not "
                      "be built, so the literal diff could not run" % path)
                print(error[:4000])
                projections[side] = None
                continue
            missing = [n for n in compared_names if n not in found]
            if missing:
                failures.append("signature projection (%s) is incomplete" % side)
                print("::error::%s projected %d of %d contract functions; missing: %s"
                      % (path, len(found), len(compared_names), ", ".join(missing)))
            projections[side] = found

        if all(projections.get(side) is not None for side, _, _ in sides):
            written = {}
            for side, path, _ in sides:
                out = os.path.join(SCRATCH, "signatures.%s" % side)
                with open(out, "w") as handle:
                    for name in compared_names:
                        handle.write("%s\t%s\n" % (name, projections[side][name]))
                written[side] = out
            if len(compared_names) < 90:
                sys.exit("the projection carries only %d signatures; the contract has "
                         "96 and this gate must not pass on a near-empty one"
                         % len(compared_names))
            literal = run(["diff", "-u", written["ref"], written["gen"]])
            with open(os.path.join(SCRATCH, "signatures.diff"), "w") as handle:
                handle.write(literal.stdout)
            if literal.returncode != 0 or literal.stdout:
                failures.append("literal signature diff")
                print("::error::the generated header's resolved signatures are not "
                      "identical to zlib.h's.  The diff below is authoritative: the "
                      "left side is the frozen contract.")
                print(literal.stdout[:8000])
            else:
                print("pass D: literal diff of %d resolved contract signatures is "
                      "EMPTY (%s vs %s, rendered by %s + nm -C)"
                      % (len(compared_names), REF, GEN, CXX))

        # AAP 0.8.6's command itself.  Written out here so the artifact exists however
        # this gate exits; the step AFTER this one is what turns it into a gate, by
        # requiring every line of it to belong to a category some named mechanism
        # covers exhaustively.  This step no longer claims anything about the content.
        # A `diff` exit status above 1 means diff itself failed, which is not the same
        # thing as a difference.
        raw = run(["diff", "-u", REF, GEN])
        if raw.returncode > 1:
            sys.exit("`diff -u %s %s` failed to run: %s" % (REF, GEN, raw.stderr[:2000]))
        raw_path = os.path.join(SCRATCH, "aap-0.8.6-raw.diff")
        with open(raw_path, "w") as handle:
            handle.write(raw.stdout)
        print("AAP 0.8.6 `diff -u %s %s`: %d lines, written to %s.  Non-empty by "
              "construction (D1, D3, D5, D7, D8, D9, D10); pass D above is the "
              "diff that has to be empty, and the next step accounts for every line "
              "of THIS one."
              % (REF, GEN, len(raw.stdout.splitlines()), raw_path))

        # ★ PASS E -- AND THE RAW DIFF IS GATED, NOT MERELY PUBLISHED.
        #
        # The claim printed above -- "its content is only the reasons cbindgen.toml
        # enumerates" -- was, until this pass existed, a claim: the diff was written
        # to disk and nothing checked it, so a NEW divergence of any kind became one
        # more line in a six-thousand-line artifact nobody could re-read.
        # This turns the claim into an assertion.
        #
        # It cannot classify the raw diff directly, because D8 (comment text) is most
        # of it and doc prose has no syntax to recognise -- a line reading `# Safety`
        # or "Declared at zlib.h L254" is indistinguishable from anything else.  So
        # the comparison is redone on COMMENT-STRIPPED, blank-collapsed copies of the
        # same two files: D8 then disappears by construction, thousands of lines become 740,
        # and what is left is classifiable line by line.  The raw diff itself is still
        # produced and published exactly as AAP 0.8.6 spells it; this is an ADDITIONAL
        # artifact, aap-0.8.6-classified.diff, with a category for every line.
        #
        # THE CATEGORIES, and each is one of cbindgen.toml's enumerated reasons:
        #
        #   blank                     D7   declaration order and formatting
        #   `#include`                D3   zlib.h includes zconf.h; the artifact
        #                                  cannot, so it inlines what zconf.h declares
        #   any other directive       D4   macros, D6 feature gating, D9 endif labels
        #   `extern "C" {` and `}`    D10  linkage scaffolding
        #   a declaration all of      D1   ZEXTERN/ZEXPORT/FAR/z_const decoration,
        #   whose identifiers the     D2   struct tag spelling, D3 the inlined zconf.h
        #   OTHER side also knows     D5   large-file duplicate declarations,
        #                             D7   order
        #
        # The last category is the load-bearing one, and it is deliberately about
        # NAMES rather than types: an added line may use only identifiers zlib.h (with
        # zconf.h preprocessed in) already knows, and a removed line may use only
        # identifiers the generated header knows.  Types, qualifiers and parameter
        # lists are pass D's business -- it resolves them through the C++ compiler --
        # so this pass answers the one question pass D cannot: does either file
        # mention a NAME the other has never heard of.  That is what caught
        # `wcstombs`: cbindgen renders an imported C-runtime declaration exactly as it
        # renders an exported one, so `size_t wcstombs(char *, const wchar_t *,
        # size_t)` was being published inside a header guarded by ZLIB_H.  It is now
        # in cbindgen.toml's `[export] exclude`, beside `malloc` and `free`, which
        # were already there for that reason.
        #
        # THE THREE EXPLICIT ALLOWANCES, each enumerated rather than inferred:
        #
        #   * the A4 decoration tokens, on the removed side only -- they are macros
        #     from zconf.h and no artifact can carry them;
        #   * parameter and macro-parameter names, per side -- A6 drops parameter
        #     names, and the two headers name them differently or not at all (zlib.h's
        #     large-file block declares `adler32_combine(uLong, uLong, z_off_t)` with
        #     no names at all, while the artifact names them from the Rust signature);
        #   * the fixed-width integer spellings, both sides -- cbindgen writes
        #     `typedef uint8_t Byte` where zconf.h writes `unsigned char`.  These are
        #     the same type on every supported target and pass B is what proves the
        #     resulting struct layouts identical.
        #
        # Anything outside all of that fails the job and is printed with the
        # identifiers that could not be accounted for.
        def rd_words(text):
            return set(re.findall(r"[A-Za-z_]\w*", text))


        def rd_squeeze(path):
            """The file with comments removed (A1) and blank lines dropped (D7)."""
            return [line.strip()
                    for line in nocomment(open(path).read()).splitlines()
                    if line.strip()]


        def rd_bound_names(text):
            """Parameter names and function-like-macro parameter names.

            A parameter contributes a name only when it has at least two identifiers
            -- a type and a name -- so `adler32_combine(uLong, uLong, z_off_t)`
            contributes none, which is exactly right: it declares no names.
            """
            names = set()
            for inner in re.findall(r"\(([^()]*)\)", text):
                for param in inner.split(","):
                    identifiers = re.findall(r"[A-Za-z_]\w*", param)
                    if len(identifiers) >= 2:
                        names.add(identifiers[-1])
            for macro in re.finditer(r"^[ \t]*#[ \t]*define[ \t]+\w+\(([^)]*)\)",
                                     text, re.M):
                names |= rd_words(macro.group(1))
            return names


        RD_KEYWORDS = set("""auto break case char const continue default do double else
            enum extern float for goto if inline int long register restrict return short
            signed sizeof static struct switch typedef union unsigned void volatile while
            _Bool""".split())
        # cbindgen's spelling of the widths zconf.h spells with the native types.
        RD_STDINT = {"uint8_t", "uint16_t", "uint32_t", "uint64_t", "int8_t", "int16_t",
                     "int32_t", "int64_t", "size_t", "intptr_t", "uintptr_t",
                     "ptrdiff_t", "stdint", "stddef", "stdarg", "h"}
        # A4/D1: zconf.h's declaration decoration, which no artifact can carry.
        RD_DECORATION = {"ZEXTERN", "ZEXPORTVA", "ZEXPORT", "FAR", "z_const"}
        # The artifact's own guards, plus the one prototype zlib.h does not declare
        # and `zlib.map` hides -- see cbindgen.toml's note on `inflate_table`.
        RD_GEN_EXTRA = {"ZLIB_RS_LIBZ_COMPAT", "ZLIB_RS_GZ", "cplusplus", "C",
                        "inflate_table"}

        rd_ref_text = nocomment(open(REF).read())
        rd_gen_text = nocomment(open(GEN).read())
        rd_ref_names = (rd_words(rd_ref_text)
                        | rd_words(nocomment(preprocess(REF, REF_DEFS)))
                        | rd_bound_names(rd_gen_text))
        if os.path.exists("zconf.h"):
            rd_ref_names |= rd_words(nocomment(open("zconf.h").read()))
        rd_gen_names = (rd_words(rd_gen_text)
                        | rd_words(nocomment(preprocess(GEN, GEN_DEFS)))
                        | RD_DECORATION
                        | rd_bound_names(rd_ref_text))

        rd_ref_path = os.path.join(SCRATCH, "aap-0.8.6-nocomments.ref")
        rd_gen_path = os.path.join(SCRATCH, "aap-0.8.6-nocomments.gen")
        with open(rd_ref_path, "w") as handle:
            handle.write("\n".join(rd_squeeze(REF)) + "\n")
        with open(rd_gen_path, "w") as handle:
            handle.write("\n".join(rd_squeeze(GEN)) + "\n")
        rd_diff = run(["diff", "-u", rd_ref_path, rd_gen_path])
        if rd_diff.returncode > 1:
            sys.exit("`diff -u` over the comment-stripped headers failed to run: %s"
                     % rd_diff.stderr[:2000])

        rd_report, rd_tally, rd_unclassified = [], {}, []
        for line in rd_diff.stdout.splitlines():
            if not line or line[0] not in "+-" or line.startswith(("+++", "---")):
                continue
            body = line[1:].strip()
            if not body:
                category = "D7 blank"
            elif body.startswith("#include"):
                category = "D3 include"
            elif body.startswith("#"):
                category = "D4/D6/D9 preprocessor"
            elif re.match(r'^extern\s*"C"\s*\{?$', body) or body in ("}", "};"):
                category = "D10 linkage"
            else:
                known = (rd_gen_names if line[0] == "-" else
                         rd_ref_names | RD_GEN_EXTRA) | RD_STDINT | RD_KEYWORDS
                unknown = sorted(rd_words(body) - known)
                if unknown:
                    category = "UNCLASSIFIED: %s" % ", ".join(unknown)
                    rd_unclassified.append((line, unknown))
                else:
                    category = "D1/D2/D3/D5/D7 declaration of known names"
            rd_tally[category.split(":")[0]] = \
                rd_tally.get(category.split(":")[0], 0) + 1
            rd_report.append("%-46s %s" % (category, line))

        rd_report_path = os.path.join(SCRATCH, "aap-0.8.6-classified.diff")
        with open(rd_report_path, "w") as handle:
            handle.write("\n".join(rd_report) + "\n")
        for category in sorted(rd_tally, key=lambda key: -rd_tally[key]):
            print("  %6d  %s" % (rd_tally[category], category))
        if rd_unclassified:
            failures.append("raw diff classification")
            print("::error::%d line(s) of `diff -u %s %s` (comments stripped) cannot "
                  "be attributed to any divergence cbindgen.toml enumerates.  Each "
                  "mentions a name the other header does not declare, which means the "
                  "two files no longer describe the same contract.  Either the item "
                  "belongs in zlib.h -- which is immutable, so it does not -- or it "
                  "must not be in the generated artifact: add it to cbindgen.toml's "
                  "[export] exclude if it is an imported or hidden symbol, following "
                  "the rule stated there."
                  % (len(rd_unclassified), REF, GEN))
            for line, unknown in rd_unclassified[:40]:
                print("  %s\n      unaccounted identifiers: %s"
                      % (line, ", ".join(unknown)))
        else:
            print("pass E: every line of the comment-stripped AAP 0.8.6 diff (%d of "
                  "them) is attributable to an enumerated divergence; the full "
                  "classification is in %s"
                  % (len(rd_report), rd_report_path))


        def struct_body(text, name):
            """The balanced body of `typedef struct {...} name;` or `struct name {...};`."""
            for match in re.finditer(r"\}\s*%s\s*;" % name, text):
                depth, index = 1, match.start()
                while index > 0 and depth:
                    index -= 1
                    if text[index] == "}":
                        depth += 1
                    elif text[index] == "{":
                        depth -= 1
                if depth == 0:
                    return text[index + 1:match.start()]
            match = re.search(r"\bstruct\s+%s\s*\{" % name, text)
            if not match:
                return None
            depth, index = 1, match.end()
            while index < len(text) and depth:
                if text[index] == "{":
                    depth += 1
                elif text[index] == "}":
                    depth -= 1
                index += 1
            return text[match.end():index - 1]


        def spelling(path, name):
            """How to name an ABI struct in a probe: always by its tag.

            Both headers declare the tag, so `struct <tag>` is valid C on both
            sides and needs no per-side special case.  A tag that is NOT declared
            is a divergence in the contract's type surface, so it is reported here
            rather than skipped -- skipping is how the generated side came to
            contribute no z_stream fields at all while the gate printed success.
            """
            text = nocomment(open(path).read())
            if re.search(r"\bstruct\s+%s\b" % name, text):
                return "struct " + name
            failures.append("struct tag %s absent from %s" % (name, path))
            print("::error::%s does not declare `struct %s`, which %s publishes as "
                  "part of the type surface a caller may name" % (path, name, REF))
            return None


        def field_names(path, name):
            body = struct_body(nocomment(open(path).read()), name)
            if body is None:
                return []
            names = []
            for field in body.split(";"):
                flat = " ".join(field.split())
                if not flat:
                    continue
                trailing = re.findall(r"\b(\w+)\s*(?:\[[^\]]*\])?$", flat)
                if trailing:
                    names.append(trailing[0])
            return names

        # Rule 10 -- collect the object-like macros each side defines.  A
        # function-like macro never matches, because `-dM` emits its parameter
        # list with no space before the `(`; a string-valued macro is dropped
        # here, which is what excludes ZLIB_VERSION per D4.
        #
        # EVERY RETURN CODE IS CHECKED, and this is not defensive tidiness.  `run`
        # is `check=False`, so a preprocessor that failed -- a missing include, a
        # syntax error the generator introduced, a `cc` that is not there --
        # returned an EMPTY stdout, `defined[side]` came out empty, and the whole
        # macro half of this gate then compared nothing against nothing and
        # reported success.  A silent pass is the worst outcome available to a
        # conformance gate, so a non-zero status is fatal here and says what it
        # was doing when it happened.
        def object_macros(text):
            """`-dM` output reduced to object-like macros with non-string values."""
            found = {}
            for line in text.splitlines():
                macro = re.match(r"#define\s+(\w+)\s+(\S.*)$", line)
                if macro and not macro.group(1).startswith("_") and '"' not in macro.group(2):
                    found[macro.group(1)] = macro.group(2)
            return found

        defined = {}
        for side, path, defs in (("ref", REF, REF_DEFS), ("gen", GEN, GEN_DEFS)):
            command = [CC, "-dM", "-E", "-P", "-I.", *defs, path]
            result = run(command)
            if result.returncode != 0:
                sys.exit("cannot enumerate the macros %s defines: `%s` exited %d\n%s"
                         % (path, " ".join(command), result.returncode,
                            result.stderr[:4000]))
            defined[side] = object_macros(result.stdout)
            if not defined[side]:
                sys.exit("`%s` succeeded but named no object-like macro at all in %s; "
                         "the scan is wrong" % (" ".join(command), path))


        # `-dM` reports every macro in scope, not only the ones the header under
        # test defines, so two kinds of name have to come out before the two sides
        # can be compared as sets.  Both are COMPUTED rather than listed, so that
        # a change to REF_DEFS, to GEN_DEFS or to either header's `#include` set
        # does not silently start hiding or exposing names.
        #
        #   1. The probe's own `-D` flags.  `-DZLIB_CONST` is passed to the
        #      reference side only and `-DZLIB_RS_LIBZ_COMPAT`/`-DZLIB_RS_GZ` to
        #      the generated side only, so all three would read as one-sided
        #      differences that are entirely this gate's own doing.
        #   2. Whatever the SYSTEM headers define.  zconf.h includes <limits.h>,
        #      which defines MAX_CANON and MAX_INPUT -- names that match the
        #      contract's MAX_* shape and have nothing to do with zlib.  The
        #      generated header includes a different, smaller set, so the leakage
        #      is one-sided too.
        def baseline(defs, headers):
            """Macros in scope for `defs` before the header under test is read."""
            got = {}
            builtins = run([CC, "-dM", "-E", "-P", "-x", "c", *defs, "/dev/null"])
            if builtins.returncode != 0:
                sys.exit("cannot enumerate the compiler's own macros: %s"
                         % builtins.stderr[:2000])
            got.update(object_macros(builtins.stdout))
            for header in headers:
                probe = os.path.join(SCRATCH, "gate_include_probe.c")
                with open(probe, "w") as handle:
                    handle.write("#include <%s>\n" % header)
                # A header this platform does not have -- <windows.h>, <unixio.h> --
                # simply contributes nothing, which is correct: it defined nothing
                # on this side either.
                result = run([CC, "-dM", "-E", "-P", *defs, probe])
                if result.returncode == 0:
                    got.update(object_macros(result.stdout))
            return got


        def system_includes(*paths):
            """The `#include <...>` names a header pulls in, itself included."""
            names = set()
            for path in paths:
                names |= set(re.findall(r"#\s*include\s*<([^>]+)>", open(path).read()))
            return sorted(n for n in names if not n.endswith("zconf.h"))

        # Z_U4 is the one contract-shaped name zconf.h defines that the generated
        # header legitimately does not.  It is a portability HELPER, not a
        # constant: zconf.h L429-L434 picks `unsigned` or `unsigned long` with it
        # and then spells z_crc_t in terms of it, whereas cbindgen emits z_crc_t
        # as a fixed-width type directly and has no use for the helper.  Listed
        # with its reason, exactly as the function-level allowance
        # (RUSTHEADERNOGEN: gzopen_w) is, so that the allowance is reviewable
        # rather than an unexplained hole in an intersection.
        MACRO_NOGEN = {"Z_U4": "a zconf.h portability helper for spelling z_crc_t, "
                               "not a published constant"}

        SHAPE = re.compile(r"^(Z_|ZLIB_|MAX_|DEF_)")
        noise = {"ref": baseline(REF_DEFS, system_includes(REF, "zconf.h")),
                 "gen": baseline(GEN_DEFS, system_includes(GEN))}


        def relevant(side):
            """The contract-shaped macro names this side's header itself defines.

            The prefix set is the contract's own: every constant zlib.h publishes
            is Z_*, ZLIB_*, MAX_* or DEF_*.  ZLIB_H is the include guard rather
            than a constant, and cbindgen.toml gives the generated header the same
            guard name, so it is excluded on both sides.
            """
            return {n for n in defined[side]
                    if SHAPE.match(n) and n != "ZLIB_H" and n not in noise[side]}

        # ★ SET EQUALITY, NOT INTERSECTION.  Comparing `own & defined["gen"]` --
        # which is what this did -- silently excused every name that only one side
        # defines: a generated header that dropped Z_BLOCK, MAX_WBITS or
        # DEF_MEM_LEVEL entirely was compared on the names it DID define and
        # passed, and a generated header inventing a contract-shaped constant of
        # its own was never noticed either.  Both directions are reported, both
        # fail, and the names are listed so the diff is actionable.
        own, theirs = relevant("ref"), relevant("gen")
        missing = sorted(n for n in own - theirs if n not in MACRO_NOGEN)
        surplus = sorted(theirs - own)
        allowed = sorted(n for n in own - theirs if n in MACRO_NOGEN)
        if missing or surplus:
            failures.append("macro name set")
            print("::error::the generated header's contract-shaped macro set "
                  "differs from zlib.h's")
            for name in missing:
                print("MISSING from %s:  %s = %s" % (GEN, name, defined["ref"][name]))
            for name in surplus:
                print("SURPLUS in %s:   %s = %s" % (GEN, name, defined["gen"][name]))
        print("rule 10: %d contract-shaped names in %s, %d in %s"
              % (len(own), REF, len(theirs), GEN))
        for name in allowed:
            print("rule 10 allowance: %s absent from %s -- %s"
                  % (name, GEN, MACRO_NOGEN[name]))
        # Values are then compared for the names both sides agree on.  When the
        # sets differ the run has already failed above, so this narrows what is
        # reported rather than what is enforced.
        shared = sorted(own & theirs)


        def probe_values(path, defs, names, stem):
            source = ["#define _LARGEFILE64_SOURCE 1", "#define ZLIB_CONST 1",
                      "#include <stdio.h>", "#include <stddef.h>", "#include <stdint.h>",
                      '#include "%s"' % path, "int main(void){"]
            for name in names:
                source.append('  printf("macro %s = %%lld\\n", (long long)(%s));'
                              % (name, name))
            for struct in ABI_STRUCTS:
                spelled = spelling(path, struct)
                if spelled is None:
                    continue
                source.append('  printf("size %s = %%lu\\n", (unsigned long)sizeof(%s));'
                              % (struct, spelled))
                for field in field_names(path, struct):
                    source.append('  printf("field %s.%s = %%lu %%lu\\n",'
                                  ' (unsigned long)offsetof(%s,%s),'
                                  ' (unsigned long)sizeof(((%s*)0)->%s));'
                                  % (struct, field, spelled, field, spelled, field))
            source += ["  return 0;", "}"]
            stem = os.path.join(SCRATCH, stem)
            with open(stem + ".c", "w") as handle:
                handle.write("\n".join(source) + "\n")
            built = run([CC, "-std=c99", "-I.", *defs, "-o", stem, stem + ".c"])
            if built.returncode != 0:
                return None, built.stderr
            return run([os.path.join(".", stem)]).stdout, ""

        # Rule 10 keeps only the names defined to an INTEGER CONSTANT
        # EXPRESSION.  Rather than guess which those are, build the reference
        # probe and drop whatever the compiler rejects, then retry.
        candidates = list(shared)
        while True:
            ref_out, error = probe_values(REF, REF_DEFS, candidates, "gate_ref")
            if ref_out is not None:
                break
            rejected = {n for n in candidates if re.search(r"\b%s\b" % n, error)}
            if not rejected:
                sys.exit("the reference probe will not build:\n" + error[:4000])
            candidates = [n for n in candidates if n not in rejected]
        gen_out, error = probe_values(GEN, GEN_DEFS, candidates, "gate_gen")
        if gen_out is None:
            failures.append("generated probe build")
            print("::error::the generated header cannot express something zlib.h can")
            print(error[:4000])
            gen_out = ""

        ref_lines, gen_lines = ref_out.splitlines(), gen_out.splitlines()
        if ref_lines != gen_lines:
            failures.append("struct fields / macro values")
            print("::error::a struct field or an integer constant differs")
            for left, right in zip(ref_lines, gen_lines):
                if left != right:
                    print("MISMATCH  zlib.h: %-44s generated: %s" % (left, right))
            for only in sorted(set(ref_lines) ^ set(gen_lines)):
                print("ONE SIDE ONLY: %s" % only)
        print("pass B: %d integer macros, %d struct sizes and %d struct fields compared"
              % (sum(l.startswith("macro") for l in ref_lines),
                 sum(l.startswith("size") for l in ref_lines),
                 sum(l.startswith("field") for l in ref_lines)))
        excluded = sorted(set(shared) - set(candidates))
        print("pass B excluded, not an integer constant expression (D4): %s"
              % (", ".join(excluded) or "none"))

        if failures:
            print("::error::header conformance FAILED: %s" % "; ".join(failures))
            sys.exit(1)
        print("header conformance: PASS")
        SHAPE_GATE

    - name: Run test cases (every line of AAP 0.8.6's diff is accounted for)
      # WHAT THIS CLOSES.  The step above ran AAP 0.8.6's `diff -u zlib.h
      # generated_zlib.h` and PUBLISHED it, on the reasoning that the diff is
      # non-empty by construction (D1, D3, D5, D7, D8, D9, D10) and so cannot be
      # asserted empty.  That reasoning is sound and the conclusion did not follow:
      # "this diff is allowed to be non-empty" is not "no line of it needs
      # checking".  A reader was left to confirm by eye that its six thousand lines
      # contained only accepted divergence, which is not a gate.
      #
      # HOW IT IS GATED INSTEAD.  Every changed line is classified against the
      # divergence rules cbindgen.toml enumerates, and each rule names the OTHER
      # mechanism in this job that checks that class exhaustively -- the standalone
      # C89/C99/C17/C++17 compiles for the include and typedef lines, pass B's
      # by-value macro comparison for the #defines, layout_assertions.rs and
      # tests/abi_layout.rs for the struct members, passes A and D for the
      # declarations.  A line matching no rule is residue and fails the job, so a
      # divergence of a NEW kind cannot arrive unnoticed: it has to be given a rule
      # in cbindgen.toml and a mechanism that checks it.  The script also re-derives
      # both headers' declared-name sets independently of pass A and compares them
      # IN BOTH DIRECTIONS, because an added declaration is how a header grows a
      # surface AAP 0.8.1 never promised.
      #
      # --signature-evidence IS THE POINT OF THE DEFERRAL BEING HONEST.  The DECL
      # class accounts for a declaration line without reading the types in it:
      # `int deflate(z_streamp, int)` and `int deflate(z_streamp, long)` are both
      # "a declaration line", so a changed parameter type reaches that classifier
      # and passes it.  Pass D is the mechanism for that class, and naming its
      # product here makes the gate REQUIRE that pass D ran and produced an empty
      # diff rather than assume it.  Pass A and pass D therefore remain in force
      # above as the substance of the check; this step is what makes the raw diff
      # AAP 0.8.6 freezes fail closed, and defence in depth for the name sets.
      #
      # The two allowances are the two the Makefile already declares: gzopen_w is
      # RUSTHEADERNOGEN (_WIN32-only, absent from a Linux generation) and wcstombs
      # is the one extra declaration the generated header carries, both recorded in
      # cbindgen.toml. Anything else has to be added HERE, in the open.
      run: |
        set -eu
        python3 .github/scripts/header_raw_diff_gate.py \
          --reference zlib.h \
          --generated generated_zlib.h \
          --allow-missing gzopen_w \
          --allow-extra wcstombs \
          --signature-evidence target/header-gate/signatures.diff \
          --write-diff target/header-gate/aap-0.8.6-raw.diff

    - name: Run test cases (AAP 0.8.6's comparison, post-processed to an EXACTLY EMPTY diff)
      # WHAT THIS ADDS OVER THE STEP ABOVE, which is the whole reason it exists.
      # That step proves every one of the raw diff's lines belongs to a class
      # some named mechanism checks, with zero residue.  This one proves the
      # stronger statement AAP 0.8.6 actually invites a reader to look for: a
      # comparison that is EMPTY.  "Non-empty, but every line is explained" leans
      # on the classifier's rules being complete; "empty" does not lean on
      # anything, so both are worth having and neither replaces the other.
      #
      # HOW IT IS EMPTY WITHOUT WEAKENING ANYTHING.  Not by filtering the diff and
      # not by touching zlib.h, which is immutable under AAP 0.8.1 directive 2 and
      # is opened read-only.  Both sides are PROJECTED through cc and c++ into one
      # canonical rendering of what the contract promises, and the two renderings
      # are diffed: 95 function types via decltype(&f) mangled and demangled, 19
      # public typedef widths, 3 caller-visible structs, their 30 fields' offsets
      # and widths, and 38 integer macros by value -- 185 records, every one a
      # value a compiler produced rather than text a header happens to contain.
      #
      # That is what removes the noise honestly.  Comment prose, blank lines,
      # declaration ORDER, typedef SPELLING (uLong vs unsigned long) and macro
      # spelling (0x1321 vs 4897, (-5) vs -5) are dropped because a C consumer
      # cannot observe any of them; the scaffolding dropped with them -- #include,
      # extern "C", the #if blocks -- is exactly what the eight standalone dialect
      # compiles above already cover.  A difference in how a type is SPELLED
      # therefore cannot create a false failure, and a difference in what a type IS
      # cannot hide behind a matching spelling.  A textual diff of two headers has
      # neither property.
      #
      # THE RAW DIFF IS STILL PUBLISHED, by --write-raw-diff, so this gate adds a
      # measurement instead of concealing the difference it normalises.
      #
      # THE ALLOWANCES ARE THE MEASURED ONES AND EACH CARRIES ITS REASON: gzopen_w
      # is declared only under _WIN32, and charf/intf/uIntf are public typedefs
      # cbindgen prunes because no prototype references them -- tests/abi_layout.rs
      # pins all three by size instead, so nothing is lost.  A reason is mandatory,
      # and an allowance that is no longer needed FAILS: the gate preprocesses the
      # generated side and rejects an allowance for a name that side now declares,
      # so an allowance cannot outlive its cause and quietly shrink the comparison.
      run: |
        set -eu
        mkdir -p target/header-gate
        python3 .github/scripts/header_contract_projection_gate.py \
          --reference zlib.h \
          --generated generated_zlib.h \
          --out-dir target/header-gate \
          --allow-absent-function 'gzopen_w=declared only under _WIN32 (zlib.h L2041), so no consumer off Windows can reference it' \
          --allow-absent-type 'charf=cbindgen prunes public typedefs that no prototype references; pinned by tests/abi_layout.rs instead' \
          --allow-absent-type 'intf=the same pruning; pinned by tests/abi_layout.rs instead' \
          --allow-absent-type 'uIntf=the same pruning; pinned by tests/abi_layout.rs instead' \
          --write-raw-diff target/header-gate/aap-0.8.6-raw.diff

    - name: Run test cases (the projection gate rejects a perturbed contract)
      # An empty diff is only evidence if a real divergence would break it, and
      # that is a property of the gate rather than of the tree -- so it is proven
      # rather than argued.  --self-test edits a scratch COPY of the generated
      # header four times over (a changed parameter type, a changed macro value, a
      # narrowed struct field, a narrowed public typedef) and requires the gate to
      # FAIL on each; a perturbation that matches nothing is itself a failure, so
      # the negative control cannot rot into a no-op when a spelling changes.
      # zlib.h and the real artifact are never written.
      run: |
        set -eu
        python3 .github/scripts/header_contract_projection_gate.py \
          --self-test \
          --generated generated_zlib.h \
          --allow-absent-function 'gzopen_w=declared only under _WIN32' \
          --allow-absent-type 'charf=pruned by cbindgen' \
          --allow-absent-type 'intf=pruned by cbindgen' \
          --allow-absent-type 'uIntf=pruned by cbindgen'

    - name: Verify the working tree is unmodified
      # The assertion that makes the target/ redirection above meaningful.  Six
      # files used to be written into the root of the tree by this job -- the
      # generated header and its five scratch siblings -- and a job that dirties
      # the tree it is inspecting cannot tell its own writes from a real change.
      # zlib.h, zconf.h and zlib.map are the immutable contract; if any of them is
      # touched here, this is where it surfaces.
      run: |
        set -eu
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::the working tree was modified by this job"
          git status --porcelain
          exit 1
        fi
        echo "working tree clean: the contract headers are untouched"

    - name: Run test cases (distclean regenerates the placeholder Makefile exactly)
      # `make distclean' REPLACES the tracked, committed Makefile wholesale, from a
      # printf sequence inside Makefile.in.  The two had drifted by one reworded
      # comment paragraph, so distclean left a clean checkout with a modified
      # tracked file -- 1589 bytes committed against 1430 emitted.  Nothing caught
      # it because nothing ran distclean and then looked, which is what this step
      # does.  It belongs in THIS job because the step above already establishes
      # that the tree was clean beforehand, so a failure here can only be
      # distclean's doing.
      #
      # The drift is not cosmetic: that file is the ONLY way the seven rust*
      # targets are reachable in a post-distclean tree, and its .NOTPARALLEL line
      # is what stops `make -jN' with two Rust goals from starting two sub-makes
      # that race on target/dropin.  Losing either by drift is losing a
      # guarantee, silently.
      #
      # Ordered last because it is destructive: distclean removes the build
      # products the steps above produced.
      run: |
        set -eu
        make distclean
        git diff --exit-code -- Makefile || {
          echo "::error::make distclean did not regenerate the committed Makefile"
          echo "::error::byte for byte.  Regenerate the printf sequence in"
          echo "::error::Makefile.in's distclean recipe from the committed file."
          git diff -- Makefile
          exit 1
        }
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::make distclean left the tree dirty"
          git status --porcelain
          exit 1
        fi
        grep -q '^\.NOTPARALLEL:$' Makefile || {
          echo "::error::the regenerated Makefile has no .NOTPARALLEL line"
          exit 1
        }
        for t in rust rust-pc rust-test rust-symbols rust-header rust-msrv rust-clean; do
          grep -q "^$t:\$" Makefile || {
            echo "::error::the regenerated Makefile has no $t rule, so that target"
            echo "::error::is unreachable in a post-distclean tree"
            exit 1
          }
        done
        echo "distclean regenerated the Makefile byte for byte, with .NOTPARALLEL"
        echo "and all seven rust* forwarding rules intact"

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: header-conformance
        # EVERY PATH NAMED HERE HAS A PRODUCER.  The four `generated_zlib.h.*`
        # scratch files come from `make rust-header` when the make is what failed,
        # and are written again by the step above when the gate is what failed --
        # which is the mode they used to be missing in, because a successful make
        # deletes them.  target/header-gate/ holds the probe sources and binaries
        # the gate compiles; the whole directory rather than `*.c`, because a
        # probe that fails to LINK is diagnosed from what sits beside it.  It also
        # carries rule A11's three products -- signatures.ref, signatures.gen and
        # the signatures.diff that has to be empty -- aap-0.8.6-raw.diff, the
        # two-file diff AAP 0.8.6 names, and pass E's three products:
        # aap-0.8.6-nocomments.{ref,gen}, the comment-stripped copies it compares,
        # and aap-0.8.6-classified.diff, which carries a category for every
        # differing line and is where an unattributable one is read.  That raw diff
        # is gated twice over and by two independent classifiers -- pass E here, and
        # .github/scripts/header_raw_diff_gate.py in its own step -- so an
        # unexplained line fails the job whichever of them attributes the rest.
        # generated_zlib.h itself is the one path that can legitimately be
        # absent, in the single mode where cbindgen produced nothing -- and there
        # its absence is the diagnosis, with the reason in `.warn`.
        #
        # ★ target/rust-header/ IS THE OTHER PRODUCER, and it was missing.  The
        # `Compile source code' step runs `make rust-header' with
        # RUSTHEADER=target/rust-header/generated_zlib.h, so when THE MAKE is what
        # fails its scratch siblings are kept -- Makefile.in deletes them only on
        # success -- and they are kept THERE, not at the root.  The root-level names
        # above are written by the gate step, which is the other failure mode.
        # Naming only one of the two directories meant the make-failure mode
        # uploaded the probe tree and none of cbindgen's own diagnostics.
        path: |
          generated_zlib.h
          generated_zlib.h.warn
          generated_zlib.h.log
          generated_zlib.h.ref
          generated_zlib.h.gen
          target/rust-header/
          target/header-gate/
        retention-days: 7


  # ---------------------------------------------------------------------------
  # 9. Drop-in replacement: the three C drivers already in this tree, compiled
  # WITH ZERO EDITS and linked against the Rust library.
  #
  # Their `#include "zlib.h"` stays byte for byte as written.  That invariance
  # is the operational definition of drop-in compatibility, so this job never
  # patches, wraps or regenerates them, and it never passes an extra -D to make
  # them agree.
  #
  # THE ldd ASSERTION IS THE WHOLE JOB.  Without it this is theatre, and that is
  # not a figure of speech -- it was reproduced.  The library declares SONAME
  # libz.so.1, so the loader searches for a file literally called libz.so.1; if
  # the link directory holds only libz.so, the loader falls through to
  # /lib/x86_64-linux-gnu/libz.so.1 and the driver runs happily against the
  # SYSTEM zlib, printing the system library's version, while -L and -rpath both
  # point at the Rust build.  Every test passes and nothing under test was
  # exercised.  So: PROVE with ldd which library got bound, and fail hard if it
  # is the wrong one -- an ldd line echoed into the log is exactly how this gate
  # rots.
  #
  # ★ THE CHAIN IS THE PRODUCER'S, AND THIS JOB NEVER REPAIRS IT.  `make rust'
  # stages the Makefile idiom: the REAL file is the versioned name
  # libz.so.<version>, and libz.so and libz.so.1 are relative symlinks to it,
  # with the three names recorded in target/dropin/soname.stage.  This job used
  # to `cp -L' the staged libz.so -- dereferencing it -- and then `ln -sf' fresh
  # aliases beside the copy, which made the gate blind to the very failure it
  # exists to detect: a producer that staged a dangling alias, an absolute link
  # target, a flattened regular file or no alias at all still went green,
  # because CI rebuilt the chain before testing it.  Nothing below creates,
  # retargets or dereferences a link.  crates/libz-rs-sys/tests/dropin_chain.rs
  # reads the producer's descriptor, asserts every link by its literal target text
  # AND its canonicalised destination, requires an ELF inspector and asserts the
  # SONAME the loader will search for against the alias that was staged, and is
  # itself self-tested against eleven deliberately broken copies of the staged tree
  # plus one good one -- because a gate that cannot fail is not a gate.  The staging directory is then an ARCHIVE copy (`cp -a', which implies
  # --no-dereference --preserve=links) and the identical assertions run again in
  # the copy, so a copy that flattened the chain fails too.
  #
  # WHICH LIBRARY EACH DRIVER LINKS.  example.c and minigzip.c link the shared
  # object.  infcover.c CANNOT: it calls inflate_table, which zlib.map lists
  # under `local:` and which is therefore hidden in both implementations, so it
  # links the static archive -- exactly what the C build does for its own
  # `cover` target.  Its assertion is the mirror image: it must have NO dynamic
  # libz at all.
  # ---------------------------------------------------------------------------
  dropin:
    name: Drop-in C drivers
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Compile source code
      # The first line is the project's own stated C-ABI build command.  The
      # second is the packaging step, and it is required rather than belt and
      # braces: cargo's cdylib gives no dynamic entry to the three symbols that
      # arrive from the C shim archive, and example.c calls gzprintf, which is
      # one of them.  `make rust` relinks the archive through zlib.map with the
      # right SONAME, so the staged library is the one that can actually satisfy
      # these drivers.  It needs no ./configure -- the checked-in Makefile
      # forwards the rust* targets to Makefile.in.
      run: |
        set -eu
        cargo build --locked --release --features libz-compat
        make rust CARGO=cargo

    - name: Generate project files
      # Stage the artifact the way an installation would -- by carrying the
      # producer's chain across unchanged, never by rebuilding it.  Three things
      # happen here, in this order, and the order is the point:
      #
      #   1. VERIFY the producer's tree AS STAGED, cross-checked against
      #      ZLIB_VERSION from the immutable zlib.h so that the producer's name
      #      and the header's cannot drift apart.  First, so that a broken chain
      #      is diagnosed by the assertion it broke.
      #   2. SELF-TEST the verifier.  It runs against twelve copies of the staged
      #      tree, one good and eleven broken one way each -- a removed alias, an
      #      alias flattened by the `cp -L' this step used to do, an absolute
      #      target, a dangling target, a missing or symlinked real file, a missing
      #      archive, a truncated descriptor, a descriptor contradicting the
      #      SONAME, a descriptor naming a path, a descriptor recording a
      #      static-only build -- and must reject every broken one while accepting
      #      the good copy.  A verifier that silently stopped verifying would
      #      otherwise sit here passing forever.
      #   3. ARCHIVE-COPY it and verify the copy.  `cp -a' preserves links as
      #      links; the second verification is what proves it did.
      #
      # The names come from the producer's descriptor rather than from a `sed' of
      # zlib.h, so a rename in Makefile.in cannot leave this job asserting a name
      # nobody staged.
      #
      # ★ THE VERIFIER IS crates/libz-rs-sys/tests/dropin_chain.rs, A TEST OF THE
      # CRATE, and it used to be a shell script under .github/scripts/.  Moving it
      # is not a refactor for its own sake: the chain is a property of the artifact
      # this crate produces, so it belongs with the crate's other artifact gates --
      # beside symbol_parity.rs, sharing its `ZLIB_RS_REQUIRE_PACKAGED` arming
      # switch and its skip-with-a-reason convention -- where `cargo test` runs it,
      # `cargo clippy -D warnings` lints it and `cargo fmt --check` formats it.  A
      # script in .github/ was reachable only from CI and checked by nothing.
      # ZLIB_RS_DROPIN_DIR names the tree to verify, which is what lets step 3
      # point it at the copy; all three steps run the ONE test binary, built once.
      run: |
        set -eu
        ZVER=$(sed -n 's/^.*define ZLIB_VERSION "\(.*\)".*$/\1/p' zlib.h)
        [ -n "$ZVER" ] || { echo "::error::no ZLIB_VERSION in zlib.h"; exit 1; }

        # Steps 1 and 2: the staged tree, and the verifier's self-test against
        # mutated copies of it.  `--nocapture` so the evidence block and the
        # twelve case lines reach the log; ZLIB_RS_REQUIRE_PACKAGED=1 because this
        # job HAS staged the tree, so a skip would be an unverified gate.
        ZLIB_RS_REQUIRE_PACKAGED=1 \
          cargo test --locked --release -p libz-rs-sys --test dropin_chain \
          -- --nocapture

        SOV=$(sed -n 1p target/dropin/soname.stage)
        SOM=$(sed -n 2p target/dropin/soname.stage)

        D="$PWD/target/dropin-stage"
        rm -rf "$D"
        mkdir -p "$D"
        # No -L, no ln: the two aliases arrive as the symlinks the producer made.
        cp -a "target/dropin/$SOV" "target/dropin/$SOM" target/dropin/libz.so \
              target/dropin/libz.a target/dropin/soname.stage "$D/"
        ls -l "$D"
        # Step 3: the same assertions against the copy, pointed there by
        # ZLIB_RS_DROPIN_DIR.  The test binary is already built, so this re-runs it
        # rather than rebuilding anything.
        ZLIB_RS_REQUIRE_PACKAGED=1 ZLIB_RS_DROPIN_DIR="$D" \
          cargo test --locked --release -p libz-rs-sys --test dropin_chain \
          -- --nocapture

        # One redirection for the four writes rather than four (shellcheck SC2129):
        # the file is opened once, so a partially written step environment is not a
        # state this can reach.
        {
          echo "ZVER=$ZVER"
          echo "DROPIN=$D"
          echo "DROPIN_SOV=$SOV"
          echo "DROPIN_SOM=$SOM"
        } >> "$GITHUB_ENV"

    - name: Run test cases
      run: |
        set -eu
        D="$DROPIN"
        SOV="$DROPIN_SOV"
        SOM="$DROPIN_SOM"
        REAL=$(readlink -e "$D/$SOV")

        # The SONAME, the link targets and the canonical destinations were all
        # asserted by dropin_chain.rs in the step above -- against the producer's
        # tree and again against this copy -- so they are not re-checked here.
        # What IS checked here is the thing only a linked binary can show: that
        # the loader, searching for the SONAME, landed on the producer's own
        # alias inside this directory and through it on the producer's own object.
        echo "staged chain: $SOM -> $SOV (real file $REAL)"

        # --- compile the three drivers, unmodified --------------------------
        cc -I. -O2 -o "$D/example_rust"  test/example.c  -L"$D" -lz -Wl,-rpath,"$D"
        cc -I. -O2 -o "$D/minigzip_rust" test/minigzip.c -L"$D" -lz -Wl,-rpath,"$D"
        cc -I. -O2 -o "$D/infcover_rust" test/infcover.c "$D/libz.a"
        echo "example.c, minigzip.c and infcover.c all compiled with zero edits"

        # --- PROVE which libz is bound, before running anything ------------
        # Not `grep libz': the resolved path is extracted by name and compared
        # exactly, then canonicalised, so that binding some OTHER file whose path
        # merely contains the staged directory cannot read as success.
        for driver in example_rust minigzip_rust; do
          ldd "$D/$driver" > "$D/$driver.ldd" 2>&1
          grep -i libz "$D/$driver.ldd" || true
          resolved=$(awk -v want="$SOM" \
            '$1 == want && $2 == "=>" { print $3; exit }' "$D/$driver.ldd")
          if [ -z "${resolved:-}" ]; then
            echo "::error::$driver has no dynamic dependency on $SOM at all, so the loader was never asked for the staged library"
            cat "$D/$driver.ldd"
            exit 1
          fi
          if [ "$resolved" != "$D/$SOM" ]; then
            echo "::error::$driver resolved $SOM to $resolved rather than to the staged $D/$SOM (most likely the system zlib, which is what happens when the producer's versioned aliases are not where the loader looks)"
            cat "$D/$driver.ldd"
            exit 1
          fi
          bound=$(readlink -e "$resolved") || {
            echo "::error::$driver bound $resolved, which does not resolve to a file"; exit 1; }
          if [ "$bound" != "$REAL" ]; then
            echo "::error::$driver bound $resolved, which canonicalises to $bound rather than to the producer's object $REAL"
            exit 1
          fi
        done
        echo "ldd: example_rust and minigzip_rust both bind $D/$SOM, which is the producer's $SOV"
        # infcover links the archive because inflate_table is hidden, so the
        # inverse has to hold: no dynamic libz may be involved at all.
        ldd "$D/infcover_rust" > "$D/infcover_rust.ldd" 2>&1 || true
        if grep -qi libz "$D/infcover_rust.ldd"; then
          echo "::error::infcover_rust has a dynamic libz dependency; it must link the static archive"
          cat "$D/infcover_rust.ldd"
          exit 1
        fi
        echo "ldd: infcover_rust has no dynamic libz, so it exercised the Rust archive"

        # --- run them -------------------------------------------------------
        # example.c compares ITS OWN compile-time ZLIB_VERSION against what the
        # library reports and prints zlibCompileFlags().  The version string is
        # asserted because deflateInit_ and inflateInit_ reject a major
        # mismatch, so it has to come back verbatim.  The compile flags are NOT
        # asserted against a literal: the value is computed from this target's
        # own type sizes and build configuration, so a literal would be wrong on
        # the next target along.
        "$D/example_rust" "$D/tmp.gz" | tee "$D/example.out"
        rm -f "$D/tmp.gz"
        grep -q "zlib version $ZVER = " "$D/example.out" || {
          echo "::error::example.c did not report zlibVersion() as $ZVER"; exit 1; }
        echo "zlibVersion() reported $ZVER verbatim"

        echo 'hello world' > "$D/plain.txt"
        "$D/minigzip_rust" < "$D/plain.txt" > "$D/plain.gz"
        "$D/minigzip_rust" -d < "$D/plain.gz" > "$D/roundtrip.txt"
        cmp "$D/plain.txt" "$D/roundtrip.txt" || {
          echo "::error::minigzip did not round-trip"; exit 1; }
        echo "minigzip round-trip byte-for-byte identical"

        # infcover is the most demanding of the three.  Its instrumented
        # allocator fills every block with 0xa5 rather than zero, so any path
        # that assumed zero-initialised memory shows up here; its mem_done()
        # detects leaks, non-LIFO frees and rogue frees through the injected
        # zalloc/zfree hooks, which is a direct test of the caller-allocator
        # contract; and its mem_limit() forces Z_MEM_ERROR at chosen points,
        # reaching error paths fuzzing finds only by luck.
        "$D/infcover_rust"
        echo "drop-in replacement: PASS"

    # The audit of the artifact this job has just staged and just proved a
    # consumer binds.  It belongs here rather than in a job of its own because
    # the thing under audit is precisely what the steps above produced: the
    # relinked, version-scripted library with the gzprintf shim, not cargo's own
    # cdylib.
    #
    # WHY IT EXISTS.  deny.toml bans miniz_oxide by name, and the packaged
    # library contained it anyway -- a whole second DEFLATE decoder inside zlib
    # -- because a relinked Rust staticlib carries members of the precompiled
    # std sysroot, those members appear in no lock file, and cargo-deny reads
    # lock files.  Only the finished artifact can be asked what it holds.  The
    # same blind spot let the library declare 183 dynamic imports, among them
    # posix_spawnp, execvp, fork, socket, connect, chroot, setuid and dlsym.
    # ★ THE HAZARD, DEMONSTRATED RATHER THAN DESCRIBED.  crates/libz-rs-sys emits
    # -Wl,-soname,libz.so.1, so cargo's own libz.so records that SONAME while no
    # file of that name sits beside it; a consumer linked -L against cargo's
    # directory therefore builds and then binds the SYSTEM libz.  That is CWE-426,
    # and the tree warns about it in three places -- but a warning nobody executes
    # is a warning that stops being true without anyone noticing.
    #
    # This step runs all three cases and asserts each outcome.  The discriminator is
    # the version string, which is decisive: the port answers ZLIB_VERSION from
    # zlib.h and the system library answers its own, so `1.3.1' against
    # `1.3.2.1-motley' names which library actually ran.  AAP 0.8.6's `ln -sf' is
    # case B, and this is the only place that documented command is executed.
    - name: Run test cases (cargo's raw output binds the WRONG library, on purpose)
      run: |
        set -eu
        ZVER=$(sed -n 's/^.*define ZLIB_VERSION "\(.*\)".*$/\1/p' zlib.h)
        [ -n "$ZVER" ] || { echo "::error::no ZLIB_VERSION in zlib.h"; exit 1; }

        W="$RUNNER_TEMP/m10"
        rm -rf "$W"
        mkdir -p "$W"
        cat > "$W/ver.c" <<'EOF'
        #include <stdio.h>
        #include "zlib.h"
        int main(void) { printf("%s\n", zlibVersion()); return 0; }
        EOF

        # A minimal consumer on purpose: test/example.c calls gzprintf, which the
        # cdylib cannot export, so it fails to LINK and never reaches the loader --
        # which would hide the hazard behind an unrelated error.
        build() {
          gcc -O2 -I. -o "$W/$1" "$W/ver.c" -L "$2" -lz -Wl,-rpath,"$PWD/$2"
        }

        SYS=0

        echo "--- A: cargo's directory, no versioned alias (the hazard) ---"
        build a target/release
        ldd "$W/a" | grep libz || true
        GOT=$("$W/a")
        echo "reports: $GOT"
        if [ "$GOT" = "$ZVER" ]; then
          echo "::error::A consumer linked against cargo's raw output reported $GOT,"
          echo "::error::the port's own version.  That means a versioned alias has"
          echo "::error::appeared in cargo's directory -- which is what"
          echo "::error::dropin_chain.rs::cargo_s_own_directory_is_not_mistakable_for_a_drop_in"
          echo "::error::forbids, and for measured reasons: read its doc comment."
          exit 1
        fi
        SYS=1

        echo "--- B: same directory, with AAP 0.8.6's ln -sf (the documented fix) ---"
        ln -sf libz.so target/release/libz.so.1
        build b target/release
        ldd "$W/b" | grep libz || true
        GOT=$("$W/b")
        echo "reports: $GOT"
        rm -f target/release/libz.so.1
        [ "$GOT" = "$ZVER" ] || {
          echo "::error::with the alias staged the consumer still reported $GOT rather"
          echo "::error::than $ZVER, so the documented mitigation no longer works."
          exit 1
        }

        echo "--- C: what make rust staged (what consumers should use) ---"
        build c target/dropin
        ldd "$W/c" | grep libz || true
        GOT=$("$W/c")
        echo "reports: $GOT"
        [ "$GOT" = "$ZVER" ] || {
          echo "::error::a consumer of the STAGED drop-in reported $GOT rather than"
          echo "::error::$ZVER.  The staged tree is not being bound; check the chain."
          exit 1
        }

        [ "$SYS" = 1 ]
        echo "provider integrity: hazard reproduced, both mitigations effective"

    - name: Run test cases (the packaged artifact holds only declared code)
      run: |
        set -eu
        SOV="$DROPIN_SOV"
        python3 .github/scripts/artifact_inventory_gate.py \
          --library "target/dropin/$SOV"

        # Independent of the gate's own verdict: the selection change that made
        # the artifact auditable has to still be in force.  A library importing
        # more than a hundred symbols has gone back to whole-archive even if
        # every crate inside it happens to be declared.
        N=$(nm -D --undefined-only "target/dropin/$SOV" | wc -l)
        echo "dynamic imports: $N"
        [ "$N" -lt 100 ] || {
          echo "::error::target/dropin/$SOV imports $N symbols.  Demand-driven"
          echo "::error::member selection plus --gc-sections yields about 54; a"
          echo "::error::count this high means the relink pulls all of std again."
          exit 1
        }

    - name: Run test cases (static pkg-config consumer)
      # The drivers above are linked by hand.  A real consumer asks pkg-config,
      # and that is where the two implementations genuinely differ: a Rust
      # static archive carries the Rust runtime and needs its native libraries
      # on the link line, while the C libz.a needs none, so one descriptor
      # cannot serve both and the Rust packaging step emits its own.
      #
      # `make rust-pc' generates it -- the C descriptor plus one Libs.private
      # line, derived for this target with `rustc --print native-static-libs' --
      # and then proves it: a C program compiled with the -I flags
      # `pkg-config --cflags' answers, linked with the -L and -l flags
      # `pkg-config --static --libs' answers against a directory holding the
      # staged libz.a and no shared library, and run.  It fails the build on a
      # missing or empty private list, on a private library leaking into the
      # public `--libs' answer, and on a consumer that links but misbehaves.
      #
      # This job runs it WITHOUT ./configure, so the generation path exercised
      # here is the one that substitutes zlib.pc.in from Makefile.in's own
      # variables.  The symbol-parity job runs the same target in a configured
      # tree, which is where the other path -- copying the configure-generated
      # zlib.pc and asserting every other field came through unchanged -- and
      # its field-by-field comparison run.
      run: |
        set -eu
        make rust-pc CARGO=cargo

        PC=target/dropin/zlib.pc
        [ -f "$PC" ] || { echo "::error::$PC was not generated"; exit 1; }
        echo "--- $PC ---"
        grep -v '^#' "$PC" | grep -v '^$'

        # Independent of what the target already asserted: the key exists
        # exactly once, it is not empty, and the descriptor is not simply the
        # C one under a new name.
        N=$(grep -c '^Libs\.private: ' "$PC" || true)
        [ "$N" = 1 ] || { echo "::error::$PC has $N Libs.private lines, not 1"; exit 1; }
        PRIV=$(sed -n 's/^Libs\.private: *//p' "$PC")
        [ -n "$PRIV" ] || { echo "::error::$PC advertises an empty Libs.private"; exit 1; }
        case "$PRIV" in
          *-l*) ;;
          *) echo "::error::Libs.private carries no library flag: $PRIV"; exit 1;;
        esac
        echo "the staged archive advertises its native dependencies: $PRIV"

        # And the C build's own descriptor still carries none, because adding
        # one there would be wrong: the C libz.a needs no companion libraries.
        if grep -q '^Libs\.private' zlib.pc.in; then
          echo "::error::zlib.pc.in carries a Libs.private key; the C descriptor must not"
          exit 1
        fi
        echo "zlib.pc.in still advertises no private libraries, as the C build requires"

    - name: Run test cases (the same chain gate on a CONFIGURED tree)
      # WHY THIS EXISTS AS A SEPARATE STEP.  Everything above ran on an
      # UNCONFIGURED tree, which is a real and supported path -- `make rust' needs
      # no ./configure -- but it is only one of the two, and the two do not stage
      # the same descriptor.  Makefile.in composes the shared-object link itself
      # and passes --version-script on that command line; when the script is
      # ALREADY inside $(LDSHARED), which is exactly what ./configure writes, it
      # has nothing to add and links with the script it was handed.  Both are the
      # same fact -- a version script WAS applied -- and both record `required' on
      # line 3 of soname.stage, because every reader of that line only ever asks
      # whether the mode is `none' or `static'; the PRODUCER is reported separately,
      # in the note `make rust' prints, and that is what is asserted below.  The two
      # used to record DIFFERENT modes, and the chain verifier accepted only one of
      # them, so the project's own verifier rejected the project's own documented
      # `./configure; make; make rust' path -- and this job passed anyway, because it
      # never configured.  A gate that only ever sees one of two producers is how
      # that stayed invisible, so both are exercised now, and the verifier itself is
      # crates/libz-rs-sys/tests/dropin_chain.rs, which `cargo test` runs.
      #
      # IN A COPY, NOT HERE.  ./configure overwrites the TRACKED Makefile and
      # zconf.h in whatever directory it runs in, and the step above asserts this
      # tree is clean.  The copy excludes target/ and .git so it is cheap and so
      # cargo cannot be confused about which workspace it is in.
      run: |
        set -eu
        ZVER=$(sed -n 's/^.*define ZLIB_VERSION "\(.*\)".*$/\1/p' zlib.h)
        [ -n "$ZVER" ] || { echo "::error::no ZLIB_VERSION in zlib.h"; exit 1; }

        T="$RUNNER_TEMP/configured-tree"
        rm -rf "$T"
        mkdir -p "$T"
        tar -cf - --exclude=./target --exclude=./.git \
                  --exclude=./benches/target --exclude=./fuzz/target . \
          | tar -xf - -C "$T"

        cd "$T"
        ./configure
        grep -E '^(LDSHARED|SHAREDLIBV|CARGO) *=' Makefile

        # Redirected rather than piped through `tee': this shell has no
        # `pipefail', so a pipeline would report tee's success and hide a failing
        # `make rust' from `set -e'.
        make rust > configured-rust.log 2>&1 || {
          cat configured-rust.log
          echo "::error::make rust failed on the configured tree"
          exit 1
        }
        cat configured-rust.log
        MODE=$(sed -n 3p target/dropin/soname.stage)
        echo "version-script mode recorded on the configured path: $MODE"
        [ "$MODE" = required ] || {
          echo "::error::expected soname.stage line 3 to be 'required' on a"
          echo "::error::configured tree, got '$MODE'.  Either ./configure no"
          echo "::error::longer puts a version script in LDSHARED, or Makefile.in"
          echo "::error::no longer records that one was applied."
          exit 1
        }
        # The mode alone cannot tell the two producers apart -- deliberately, see
        # above -- so the PRODUCER is what is asserted here.  Without this line the
        # step would pass just as happily on the unconfigured path it exists to be
        # different from, and the second producer would go untested again.
        # -F and single quotes, both deliberate: the text `make rust' prints contains
        # the literal characters `$(LDSHARED)', so the pattern must be taken as a fixed
        # string and must NOT be expanded by this shell.  Single quotes are what stop
        # the expansion and -F is what stops `$', `(' and `)' being read as regex, so
        # between them the line looks for exactly the bytes Makefile.in emits.
        #
        # shellcheck disable=SC2016
        # SC2016 fires on any `$(' inside single quotes, on the assumption that a
        # reader wanted expansion.  Here expansion is the thing being prevented -- an
        # expanded pattern would search for whatever `$(LDSHARED)' evaluated to in
        # THIS shell, which is nothing, and the gate would then match every log and
        # assert nothing.  Scoped to this one line for that reason.
        grep -qF 'version script reaches the link from $(LDSHARED)' configured-rust.log || {
          echo "::error::make rust did not report that the version script came from"
          echo "::error::\$(LDSHARED) on a configured tree, so this step is exercising"
          echo "::error::the same producer as the unconfigured job above.  Check what"
          echo "::error::./configure now writes into LDSHARED."
          exit 1
        }
        echo "the configured path linked with the version script ./configure put in LDSHARED"

        # The same verifier as the step above, run inside the COPIED tree so that
        # what it inspects is the chain ./configure's LDSHARED produced.  A copy
        # has its own target/, hence its own target/dropin, and the test resolves
        # that from CARGO_MANIFEST_DIR -- so no path has to be passed.
        ZLIB_RS_REQUIRE_PACKAGED=1 \
          cargo test --locked --release -p libz-rs-sys --test dropin_chain \
          -- --nocapture
        echo "the configured path stages a chain this repository's own verifier accepts"

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: dropin-c-drivers
        path: |
          target/dropin-stage/*.ldd
          target/dropin-stage/example.out
          target/dropin/soname.stage
          target/dropin/zlib.pc
          target/dropin/pc-gate/consumer.c
          target/dropin/pc-gate/pkgconfig/zlib.pc
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 9b. The PACKAGED artifact on Mach-O: install name, versioned chain, export
  # table, and the UNMODIFIED C drivers linked against it and run.
  #
  # WHY THIS EXISTS.  `build-test` compiles the workspace and runs its tests on
  # macOS, and that was the whole of the non-Linux coverage: no packaged artifact,
  # no export table, no C consumer, no proof of which library the loader binds.
  # `symbols` and `dropin` establish all of that on ubuntu-latest alone, so the
  # Mach-O half of `crates/libz-rs-sys/build.rs` -- the `-install_name` it emits,
  # which is the format's analogue of a soname -- was written and never once
  # measured.  AAP 0.8.3 requires the packaged library to be consumable and AAP
  # 0.6.3.4 requires both large-file symbol families to be exported; this job is
  # where either becomes true off ELF.
  #
  # WHY IT STAGES ITS OWN DYLIB RATHER THAN MEASURING cargo's.  The cdylib cargo
  # produces is deliberately not the shipped artifact, on any platform: rustc
  # hands its own anonymous version script to every cdylib link, so a symbol that
  # arrives from a native archive gets no dynamic entry, and gzprintf/gzvprintf
  # live in csrc/gzprintf_shim.c because stable Rust can define neither a variadic
  # function nor one taking a va_list.  Measured on Linux, that cdylib exports 96
  # names, MISSING those two and ADDING three `_zlib_rs_*` internals.  test/example.c
  # calls gzprintf at L109, so it cannot link against it at all.  On ELF `make rust`
  # relinks the whole archive through zlib.map; the Mach-O equivalent is what this
  # job does -- `-force_load` the complete archive, then hand ld64 an
  # exported-symbols list, which is that format's analogue of a version script.
  #
  # THE EXPORTED-SYMBOLS LIST IS DERIVED, NOT WRITTEN.  It is the intersection of
  # zlib.h's ZEXTERN declarations with the symbols the archive actually defines,
  # produced by .github/scripts/platform_abi_gate.py.  Intersecting is what keeps
  # the list from naming a symbol that does not exist, and deriving is what keeps
  # it in step with the contract: a name added to zlib.h cannot be silently left
  # unexported here, and the same script then fails if the result omits one.
  # ---------------------------------------------------------------------------
  platform-abi-macos:
    name: Packaged ABI (macOS, Mach-O)
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Compile source code
      # `--features libz-compat` is the C ABI facade, which is the whole subject
      # of this job.  `--locked` because Cargo.lock is committed.
      run: |
        set -eu
        cargo build --release --locked -p libz-rs-sys --features libz-compat
        ls -l target/release/libz.dylib target/release/libz.a

    - name: Run test cases (the install name build.rs emits, measured)
      # The Mach-O analogue of a soname, and the one thing about this platform
      # that build.rs has always emitted and nothing has ever read back.  The
      # expected value is DERIVED from zlib.h rather than written here, so the
      # assertion cannot drift from the contract.
      run: |
        set -eu
        ZVER=$(sed -n 's/^#define ZLIB_VERSION "\(.*\)"$/\1/p' zlib.h)
        [ -n "$ZVER" ] || { echo "::error::could not read ZLIB_VERSION from zlib.h"; exit 1; }
        MAJOR=${ZVER%%.*}
        echo "contract version $ZVER, major $MAJOR"
        otool -D target/release/libz.dylib | tee /tmp/install_name.txt
        NAME=$(sed -n '2p' /tmp/install_name.txt | tr -d '[:space:]')
        if [ "$NAME" != "libz.$MAJOR.dylib" ]; then
          echo "::error::the cdylib's install name is '$NAME', not libz.$MAJOR.dylib.  On Mach-O that name is what the loader searches for, so a wrong one silently binds the system zlib -- the same failure AAP 0.3.1.2 records for the ELF symlink chain."
          exit 1
        fi
        echo "install name: $NAME, which is what build.rs's MachO branch emits"

    - name: Run test cases (stage the packaged dylib and gate its export table)
      run: |
        set -eu
        ZVER=$(sed -n 's/^#define ZLIB_VERSION "\(.*\)"$/\1/p' zlib.h)
        MAJOR=${ZVER%%.*}
        D=target/dropin-macos
        rm -rf "$D"; mkdir -p "$D"
        cp target/release/libz.a "$D/libz.a"

        # The native libraries a Rust staticlib must be linked against, asked of
        # rustc itself -- the same mechanism CMakeLists.txt uses to populate
        # ZLIB_RUST_NATIVE_STATIC_LIBS, rather than a list guessed here.
        printf '#[no_mangle]\npub extern "C" fn zlib_rs_native_static_libs_probe() -> i32 { 0 }\n' > "$D/probe.rs"
        rustc --print native-static-libs --crate-type staticlib \
          -o "$D/libprobe.a" "$D/probe.rs" > /dev/null 2> "$D/probe.err"
        NATIVE=$(sed -n 's/.*native-static-libs:[[:space:]]*//p' "$D/probe.err" | head -1)
        if [ -z "$NATIVE" ]; then
          echo "::error::rustc printed no native-static-libs line, so the link requirements of the archive are unknown"
          cat "$D/probe.err"
          exit 1
        fi
        echo "native libraries: $NATIVE"
        rm -f "$D/probe.rs" "$D/libprobe.a"

        # ld64's exported-symbols list, derived from zlib.h intersected with what
        # the archive defines.  Underscore-prefixed, because that is the Mach-O
        # spelling of a C identifier.
        # One leading underscore is the Mach-O spelling of a C identifier and is
        # stripped; a symbol whose C name genuinely begins with one (the
        # `_zlib_rs_*` internals) therefore keeps it, which is what lets zlib.map's
        # `_*` wildcard still classify it.  The grep drops nm's archive-member
        # header lines and anything that is not an identifier.
        nm -gU "$D/libz.a" | awk 'NF>=3 {print $3}' | sed 's/^_//' \
          | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' | sort -u > "$D/defined.syms"
        echo "archive defines $(wc -l < "$D/defined.syms" | tr -d ' ') external symbol(s)"
        python3 .github/scripts/platform_abi_gate.py \
          --platform macos \
          --emit-exported-symbols-list "$D/exported_symbols.list" \
          --defined-symbols "$D/defined.syms"

        # -force_load pulls in EVERY archive member, including the C shim's, which
        # is what gives this artifact gzprintf and gzvprintf.  The exported-symbols
        # list then narrows the surface back to the contract, so the thousands of
        # Rust internals the archive also defines stay unreachable.
        # shellcheck disable=SC2086 # $NATIVE is a flag list from rustc and must word-split, exactly as CMake passes it
        cc -dynamiclib -o "$D/libz.$ZVER.dylib" \
          -Wl,-force_load,"$D/libz.a" \
          -Wl,-exported_symbols_list,"$D/exported_symbols.list" \
          -install_name "@rpath/libz.$MAJOR.dylib" \
          $NATIVE
        # The Mach-O versioned chain: the version goes BEFORE the extension, so
        # these names cannot be formed by suffixing, and the loader looks for the
        # middle one by name.
        ln -sf "libz.$ZVER.dylib" "$D/libz.$MAJOR.dylib"
        ln -sf "libz.$MAJOR.dylib" "$D/libz.dylib"
        ls -l "$D"

        nm -gU "$D/libz.$ZVER.dylib" | awk 'NF>=3 {print $3}' | sed 's/^_//' \
          | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' | sort -u > "$D/exports.syms"
        # --expect-abi complete: this job stages the dylib with -force_load, which
        # pulls in EVERY archive member including the C shim's, so gzprintf and
        # gzvprintf ARE exported here.  Declaring it is what makes losing them a
        # failure rather than a line in a log.
        python3 .github/scripts/platform_abi_gate.py \
          --platform macos \
          --exports "$D/exports.syms" \
          --artifact "$D/libz.$ZVER.dylib" \
          --expect-abi complete

    - name: Run test cases (the unmodified C drivers, linked and run)
      # test/example.c, test/minigzip.c and test/infcover.c compiled with ZERO
      # edits and ZERO extra -D, exactly as the Linux `dropin` job does.  Their
      # `#include "zlib.h"` stays byte for byte as written; that invariance is the
      # operational definition of drop-in compatibility.  infcover links the
      # ARCHIVE because it calls inflate_table, which the exported-symbols list
      # hides -- the same split the ELF job makes for the same reason.
      run: |
        set -eu
        ZVER=$(sed -n 's/^#define ZLIB_VERSION "\(.*\)"$/\1/p' zlib.h)
        MAJOR=${ZVER%%.*}
        D=target/dropin-macos
        NATIVE=$(cat "$D/native.libs" 2>/dev/null || true)
        if [ -z "$NATIVE" ]; then
          printf '#[no_mangle]\npub extern "C" fn zlib_rs_native_static_libs_probe() -> i32 { 0 }\n' > "$D/probe.rs"
          rustc --print native-static-libs --crate-type staticlib \
            -o "$D/libprobe.a" "$D/probe.rs" > /dev/null 2> "$D/probe.err"
          NATIVE=$(sed -n 's/.*native-static-libs:[[:space:]]*//p' "$D/probe.err" | head -1)
          rm -f "$D/probe.rs" "$D/libprobe.a"
        fi
        [ -n "$NATIVE" ] || { echo "::error::native-static-libs unknown"; exit 1; }

        cc -I. -O2 -o "$D/example_rust"  test/example.c  -L"$D" -lz -Wl,-rpath,"$PWD/$D"
        cc -I. -O2 -o "$D/minigzip_rust" test/minigzip.c -L"$D" -lz -Wl,-rpath,"$PWD/$D"
        # shellcheck disable=SC2086 # $NATIVE is a flag list from rustc and must word-split
        cc -I. -O2 -o "$D/infcover_rust" test/infcover.c "$D/libz.a" $NATIVE
        echo "example.c, minigzip.c and infcover.c all compiled with zero edits"

        # --- PROVE which libz is bound, before running anything --------------
        # The dynamic side must name the staged install name and must NOT name
        # the system zlib.  macOS ships its own libz.1.dylib in the shared cache,
        # so a wrong install name here does not fail to load -- it silently binds
        # Apple's library, which is the exact failure mode AAP 0.3.1.2 records.
        for driver in example_rust minigzip_rust; do
          otool -L "$D/$driver" > "$D/$driver.otool"
          cat "$D/$driver.otool"
          grep -q "libz.$MAJOR.dylib" "$D/$driver.otool" || {
            echo "::error::$driver has no dependency on libz.$MAJOR.dylib, so the loader was never asked for the staged library"
            exit 1; }
          if grep -q "/usr/lib/libz" "$D/$driver.otool"; then
            echo "::error::$driver depends on the SYSTEM zlib at /usr/lib, not on the staged Rust library"
            exit 1
          fi
        done
        echo "otool -L: both drivers depend on libz.$MAJOR.dylib and on no system zlib"
        # infcover must have no dynamic libz at all: it linked the archive.
        otool -L "$D/infcover_rust" > "$D/infcover_rust.otool"
        if grep -q "libz" "$D/infcover_rust.otool"; then
          echo "::error::infcover_rust has a dynamic libz dependency; it must link the static archive"
          cat "$D/infcover_rust.otool"
          exit 1
        fi
        echo "otool -L: infcover_rust has no dynamic libz, so it exercised the Rust archive"

        # --- run them --------------------------------------------------------
        # example.c compares its OWN compile-time ZLIB_VERSION against what the
        # library reports, so the string coming back verbatim is also a runtime
        # proof of ORIGIN: macOS's own libz reports a 1.2.x version and could not
        # produce this line.  DYLD_PRINT_LIBRARIES is published as corroborating
        # evidence rather than asserted, because the loader strips DYLD_* under
        # some hardening configurations and an assertion on absent output would
        # pass vacuously.
        DYLD_PRINT_LIBRARIES=1 "$D/example_rust" "$D/tmp.gz" > "$D/example.out" 2> "$D/example.dyld" || {
          echo "::error::example.c failed against the staged dylib"; cat "$D/example.out" "$D/example.dyld"; exit 1; }
        rm -f "$D/tmp.gz"
        cat "$D/example.out"
        grep -i "libz" "$D/example.dyld" || true
        grep -q "zlib version $ZVER = " "$D/example.out" || {
          echo "::error::example.c did not report zlibVersion() as $ZVER, so the library that answered was not this one"; exit 1; }
        echo "zlibVersion() reported $ZVER verbatim, which macOS's own libz cannot"

        # minigzip in FILE mode rather than through pipes: SET_BINARY_MODE is a
        # no-op unless WIN32 is defined, and this job passes no extra -D to any
        # driver, so a pipe would be the one place a platform difference could
        # corrupt the stream.  file_compress unlinks its input, hence the copy.
        echo 'hello world' > "$D/plain.txt"
        cp "$D/plain.txt" "$D/expected.txt"
        "$D/minigzip_rust" "$D/plain.txt"
        [ -f "$D/plain.txt.gz" ] || { echo "::error::minigzip produced no .gz"; exit 1; }
        "$D/minigzip_rust" -d "$D/plain.txt.gz"
        cmp "$D/expected.txt" "$D/plain.txt" || {
          echo "::error::minigzip did not round-trip"; exit 1; }
        echo "minigzip round-trip byte-for-byte identical"

        # infcover's allocator fills every block with 0xa5 rather than zero, its
        # mem_done() detects leaks, non-LIFO frees and rogue frees through the
        # injected zalloc/zfree hooks, and its mem_limit() forces Z_MEM_ERROR at
        # chosen points.  None of that had ever run on this platform.
        "$D/infcover_rust"
        echo "packaged Mach-O drop-in: PASS"

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: platform-abi-macos
        # Every path has a producer in the steps above: the staged library and its
        # chain, the derived exported-symbols list, both measured symbol lists, the
        # otool records and the drivers' own output.
        path: |
          target/dropin-macos/
        retention-days: 7


  # ---------------------------------------------------------------------------
  # 9c. The PACKAGED artifact on PE/COFF: export table, the Windows-only entry
  # points, and an MSVC C consumer linked against the import library.
  #
  # WHAT IS IN SCOPE HERE, AND WHAT IS NOT.  A full Windows drop-in INSTALL is
  # not: the PE analogue of zlib.map is win32/zlib.def, which AAP 0.2.2.3 places
  # out of scope, and build.rs emits no export list for PE in consequence.  What
  # IS in scope, and is what this job establishes, needs none of that file --
  # cargo produces z.dll and its import library z.dll.lib, and a C consumer that
  # does not call gzprintf or gzvprintf can link against them without recompiling
  # the library.
  #
  # THE ABI CLASS, STATED RATHER THAN IMPLIED.  z.dll does not export gzprintf or
  # gzvprintf, so the Windows ABI is a documented SUBSET of the contract, not a
  # complete drop-in: zlib.h declares both unconditionally, so a Windows consumer
  # that calls either FAILS TO LINK.  The mechanism is not PE-specific, and saying
  # "cannot cross a PE boundary" would hide the actual fix -- csrc/gzprintf_shim.c
  # is compiled and archived on every target, but a cdylib link retains only what
  # something reaches and nothing in Rust calls either name.  The same thing is
  # measurable on ELF: cargo's libz.a defines both, cargo's libz.so exports
  # neither, and `make rust` closes it by naming them in the relink.  PE has no
  # such packaging step only because win32/zlib.def is out of scope.  So
  # .github/scripts/platform_abi_gate.py classifies this as a PACKAGING_GAP,
  # distinct from gzopen_w's NOT_ON_PLATFORM absence on Linux, and this job passes
  # --expect-abi subset.  That flag fails in BOTH directions, so closing the gap
  # fails the job until the sentences claiming a subset are rewritten.
  #
  # WHY IT IS WORTH A JOB ANYWAY.  Two things about this platform can be checked
  # NOWHERE else in the workspace.  `gzopen_w` is declared only under _WIN32 and
  # implemented `#[cfg(windows)]`, so every Linux gate is obliged to allow it to
  # be missing -- this is the only place its existence can be proved.  And the
  # `gzgetc` MACRO expands into CALLER object code, loading have/next/pos at
  # offsets 0, 8 and 16 of `struct gzFile_s` (AAP 0.6.3.2); compiling that
  # expansion with a DIFFERENT compiler, against a library built by rustc, is a
  # test of that layout agreement that a single-toolchain platform cannot give.
  # ---------------------------------------------------------------------------
  platform-abi-windows:
    name: Packaged ABI (Windows, PE/COFF)
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      # llvm-tools carries llvm-readobj, which is how the PE export and import
      # tables are read.  It is a rustup component rather than a download, so the
      # version always matches the toolchain that produced the DLL.
      run: |
        rustup toolchain install stable --profile minimal
        rustup component add llvm-tools

    - name: Compile source code
      shell: bash
      run: |
        set -eu
        cargo build --release --locked -p libz-rs-sys --features libz-compat
        ls -l target/release/z.dll target/release/z.dll.lib

    - name: Run test cases (the PE export table, gated against the contract)
      shell: bash
      run: |
        set -eu
        SYSROOT=$(rustc --print sysroot)
        HOST=$(rustc -vV | sed -n 's/^host: //p')
        READOBJ="$SYSROOT/lib/rustlib/$HOST/bin/llvm-readobj.exe"
        if [ ! -f "$READOBJ" ]; then
          echo "::error::llvm-readobj is not at $READOBJ, so the PE export table cannot be read.  A gate that cannot see the export table must not pass."
          exit 1
        fi
        D=target/winabi
        rm -rf "$D"; mkdir -p "$D"
        "$READOBJ" --coff-exports target/release/z.dll > "$D/coff-exports.txt"
        # llvm-readobj prints one `Name: <symbol>` line per export.  The RVA and
        # ordinal lines are discarded; only the names are compared.  The grep keeps
        # C IDENTIFIERS only: some llvm-readobj releases also print the module's
        # own name in a `Name:` line, and `z.dll` arriving in this list would be
        # reported as an export accounted for by nothing -- a gate failing on the
        # spelling of its own input rather than on the library.
        sed -n 's/^[[:space:]]*Name:[[:space:]]*//p' "$D/coff-exports.txt" \
          | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' | sort -u > "$D/exports.syms"
        echo "z.dll exports $(wc -l < "$D/exports.syms" | tr -d ' ') name(s)"
        # ★ --expect-abi subset, and the word is load-bearing.  This is cargo's own
        # cdylib, and a rustc-linked cdylib cannot re-export a symbol arriving from a
        # native archive -- so z.dll does NOT export gzprintf or gzvprintf, and a
        # Windows consumer that calls either CANNOT LINK against it.  The gate used to
        # list those two as expected absences and pass, which read as "fine".  It now
        # classifies: SUBSET is printed with the consumer consequence spelled out, the
        # declaration below is what pins it, and closing the PE packaging gap makes
        # this step FAIL until the prose that records the gap is corrected.
        python3 .github/scripts/platform_abi_gate.py \
          --platform windows \
          --exports "$D/exports.syms" \
          --artifact target/release/z.dll \
          --expect-abi subset

        # gzopen_w explicitly and by itself, because this is the ONLY job in the
        # workspace that can assert it: it is declared under _WIN32 (zlib.h
        # L2042) and implemented `#[cfg(windows)]`, so every Linux gate has to
        # allow it to be absent.
        if ! grep -qx "gzopen_w" "$D/exports.syms"; then
          echo "::error::z.dll does not export gzopen_w.  It is the wide-path counterpart of gzopen, declared under _WIN32 and implemented #[cfg(windows)]; a Windows consumer that opens a non-ASCII path needs it and no other job in this workspace can see whether it exists."
          exit 1
        fi
        echo "gzopen_w is exported, which no Linux job can establish"

    - name: Run test cases (write the C consumer that exercises the Windows-only surface)
      shell: bash
      # Written under target/ rather than committed: it is a probe, not a fixture,
      # and .gitignore covers /target/ with an anchored rule so it cannot be
      # committed by accident.  What it exercises is chosen for what only this
      # platform can show -- gzopen_w with a wide path, and the gzgetc MACRO,
      # whose field arithmetic MSVC compiles into this object file against a
      # library rustc built.
      run: |
        set -eu
        D=target/winabi
        mkdir -p "$D"
        cat > "$D/consumer.c" <<'CONSUMER'
        /* A Windows C consumer of the Rust libz.  Compiled by MSVC, linked
           against cargo's import library, and run with cargo's DLL beside it. */
        #include <stdio.h>
        #include <string.h>
        #include "zlib.h"

        int main(void) {
            static const char payload[] = "hello, hello!";
            unsigned char packed[128];
            unsigned char plain[128];
            uLong packed_len = (uLong)sizeof(packed);
            uLong plain_len = (uLong)sizeof(plain);
            gzFile handle;
            int first;
            uLong sum;

            printf("zlibVersion() = %s\n", zlibVersion());

            if (compress(packed, &packed_len, (const Bytef *)payload,
                         (uLong)sizeof(payload)) != Z_OK) {
                fprintf(stderr, "compress failed\n");
                return 1;
            }
            if (uncompress(plain, &plain_len, packed, packed_len) != Z_OK) {
                fprintf(stderr, "uncompress failed\n");
                return 1;
            }
            if (plain_len != (uLong)sizeof(payload) ||
                memcmp(plain, payload, sizeof(payload)) != 0) {
                fprintf(stderr, "round trip mismatch\n");
                return 1;
            }
            printf("compress/uncompress round trip OK, %lu -> %lu bytes\n",
                   (unsigned long)sizeof(payload), (unsigned long)packed_len);

            sum = adler32(0L, Z_NULL, 0);
            sum = adler32(sum, (const Bytef *)payload, (uInt)sizeof(payload));
            printf("adler32 = %08lx, crc32 = %08lx\n", (unsigned long)sum,
                   (unsigned long)crc32(crc32(0L, Z_NULL, 0),
                                        (const Bytef *)payload,
                                        (uInt)sizeof(payload)));

            /* gzopen_w: declared only under _WIN32, implemented #[cfg(windows)].
               No Linux job can reach this entry point at all. */
            handle = gzopen_w(L"wide.gz", "wb");
            if (handle == NULL) {
                fprintf(stderr, "gzopen_w(wb) failed\n");
                return 1;
            }
            if (gzputs(handle, payload) != (int)strlen(payload)) {
                fprintf(stderr, "gzputs failed\n");
                return 1;
            }
            if (gzclose(handle) != Z_OK) {
                fprintf(stderr, "gzclose(w) failed\n");
                return 1;
            }
            handle = gzopen_w(L"wide.gz", "rb");
            if (handle == NULL) {
                fprintf(stderr, "gzopen_w(rb) failed\n");
                return 1;
            }
            /* gzgetc is a MACRO here: this reads g->have, g->next and g->pos
               directly out of struct gzFile_s, compiled by MSVC against a
               library rustc built.  A layout disagreement corrupts memory
               silently, so this call is the test. */
            first = gzgetc(handle);
            if (first != (int)(unsigned char)payload[0]) {
                fprintf(stderr, "gzgetc returned %d, expected %d\n", first,
                        (int)(unsigned char)payload[0]);
                return 1;
            }
            if (gzclose(handle) != Z_OK) {
                fprintf(stderr, "gzclose(r) failed\n");
                return 1;
            }
            printf("gzopen_w + gzputs + gzgetc macro + gzclose OK, first byte %d\n",
                   first);
            printf("CONSUMER OK\n");
            return 0;
        }
        CONSUMER
        # The heredoc above is indented for YAML; strip that indent so the C file
        # is a plain source file.
        sed -i 's/^        //' "$D/consumer.c"
        head -5 "$D/consumer.c"

    - name: Run test cases (MSVC compiles and links it, then it runs)
      shell: cmd
      # vcvars64.bat is located with vswhere rather than assumed, and the compile
      # passes NO -D beyond what win32/Makefile.msc itself uses -- that file
      # builds minigzip.c against the IMPORT LIBRARY (`minigzip_d.exe:
      # minigzip.obj $(IMPLIB)`), which is exactly the link this step makes.
      run: |
        setlocal enabledelayedexpansion
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" (
          echo ::error::vswhere.exe was not found, so the MSVC toolset cannot be located
          exit /b 1
        )
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        if not defined VSPATH (
          echo ::error::no MSVC toolset with the C++ build tools was found
          exit /b 1
        )
        call "!VSPATH!\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        cl /nologo /W3 /O2 /I. /Fo:target\winabi\ /Fe:target\winabi\consumer.exe target\winabi\consumer.c target\release\z.dll.lib || exit /b 1
        cl /nologo /W3 /O2 /I. /Fo:target\winabi\ /Fe:target\winabi\minigzip.exe test\minigzip.c target\release\z.dll.lib || exit /b 1
        echo the unmodified test\minigzip.c compiled and linked against the import library
        copy /y target\release\z.dll target\winabi\ >nul || exit /b 1
        cd target\winabi
        consumer.exe > consumer.out 2>&1
        if errorlevel 1 (
          echo ::error::the MSVC C consumer failed against the Rust DLL
          type consumer.out
          exit /b 1
        )
        type consumer.out
        rem minigzip in FILE mode: SET_BINARY_MODE is a no-op unless WIN32 is
        rem defined, and this job passes no extra -D, so a pipe is the one place a
        rem platform difference could corrupt the stream.  file_compress unlinks
        rem its input, hence the copy.
        echo hello world> plain.txt
        copy /y plain.txt expected.txt >nul
        minigzip.exe plain.txt || exit /b 1
        if not exist plain.txt.gz (
          echo ::error::minigzip produced no .gz
          exit /b 1
        )
        minigzip.exe -d plain.txt.gz || exit /b 1
        fc /b expected.txt plain.txt >nul
        if errorlevel 1 (
          echo ::error::minigzip did not round-trip on this platform
          exit /b 1
        )
        echo minigzip round-trip byte-for-byte identical

    - name: Run test cases (the consumer bound THIS DLL)
      shell: bash
      # The origin proof.  Two independent halves: the import table names z.dll,
      # so the loader was asked for it by that name; and the version string the
      # running program printed is the contract's own, which no other zlib on the
      # machine reports.  The first without the second would not rule out some
      # other z.dll; the second without the first would not prove a dynamic link.
      run: |
        set -eu
        ZVER=$(sed -n 's/^#define ZLIB_VERSION "\(.*\)"$/\1/p' zlib.h)
        SYSROOT=$(rustc --print sysroot)
        HOST=$(rustc -vV | sed -n 's/^host: //p')
        READOBJ="$SYSROOT/lib/rustlib/$HOST/bin/llvm-readobj.exe"
        D=target/winabi
        "$READOBJ" --coff-imports "$D/consumer.exe" > "$D/coff-imports.txt"
        grep -i "z.dll" "$D/coff-imports.txt" || {
          echo "::error::consumer.exe has no import from z.dll, so it never linked against the Rust library dynamically"
          cat "$D/coff-imports.txt"
          exit 1; }
        echo "import table names z.dll"
        grep -q "zlibVersion() = $ZVER" "$D/consumer.out" || {
          echo "::error::the consumer did not report zlibVersion() as $ZVER, so the DLL that answered was not this build"
          cat "$D/consumer.out"
          exit 1; }
        grep -q "^CONSUMER OK$" "$D/consumer.out" || {
          echo "::error::the consumer did not reach its final assertion"
          cat "$D/consumer.out"
          exit 1; }
        echo "packaged PE consumer: PASS -- zlibVersion() reported $ZVER, gzopen_w and the gzgetc macro both exercised"

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: platform-abi-windows
        # Every path has a producer above: the measured export and import tables,
        # the generated consumer and its output, and the drivers MSVC built.
        path: |
          target/winabi/
        retention-days: 7


  # ---------------------------------------------------------------------------
  # 10. Miri over the safe core, sharded.
  #
  # Miri is a NIGHTLY-ONLY component, which is why this job installs nightly
  # with both `miri` and `rust-src`, and why every invocation says `+nightly`
  # explicitly: rust-toolchain.toml pins stable on purpose and does not name a
  # nightly, so the command line is the override mechanism.
  #
  # SCOPE IS `-p zlib-rs` AND MUST NOT BECOME `--workspace`.  zlib-rs is the
  # safe core: #![forbid(unsafe_code)], no_std + alloc, zero dependencies, and
  # no FFI whatsoever, which is precisely what makes it Miri-COMPATIBLE.
  # Widening this to the workspace would pull in zlib-rs-differential, whose
  # whole purpose is to call the C oracle -- and Miri cannot execute foreign
  # functions, so the job would fail for a reason that has nothing to do with
  # undefined behaviour.  The likely repair for that failure is deleting the
  # gate, so do not create the situation.  libz-rs-sys, the crate that does hold
  # raw pointers, is covered by the AddressSanitizer job below instead.
  #
  # WHAT THIS JOB DOES AND DOES NOT ESTABLISH.  Miri is an interpreter, not a
  # prover: it reports undefined behaviour on the code paths the test suite
  # actually EXECUTES, and says nothing about the paths it does not.  So the
  # claim this job supports is "no undefined behaviour was observed while
  # interpreting the zlib-rs test suite", and the coverage of that suite is the
  # coverage of the gate.  Two things narrow it further, both deliberately:
  # `cargo miri test` runs the crate's own `#[cfg(test)]` modules and its
  # `tests/` targets, so nothing outside zlib-rs is interpreted at all; and the
  # core marks its corpus-folding tests #[cfg_attr(miri, ignore = "...")] with
  # the reason spelled out, so those cells are skipped here and covered by the
  # `differential` job instead.  Do not read this job as an exhaustive analysis
  # of the core.
  #
  # ★ EVERY SHARD PASSES `--all-features`, AND THAT IS THE SUBSTANCE OF THIS
  # JOB.  zlib-rs declares `default = []`, so the single command this job used to
  # run -- `cargo +nightly miri test -p zlib-rs` -- interpreted the crate with no
  # features at all: no `std`, and with it neither the `pub mod gz` that
  # src/lib.rs gates on that feature nor one single test out of `tests/gz.rs`,
  # which gates its whole file on it; no `simd`, and with it neither vectorised
  # checksum backend; no `rust-api`, and with it none of the idiomatic surface.
  # The job named "Miri (safe core)" was interpreting a strict subset of the safe
  # core and reporting the safe core clean.
  #
  # Omitting a feature does not fail anything, which is what made that
  # invisible.  Measured on this tree: `cargo test -p zlib-rs --test gz` without
  # `std` still builds the binary and still runs it, and prints "running 0 tests"
  # then "test result: ok. 0 passed".  Green, and nothing asserted.  The coverage
  # step below is what makes that outcome unreachable from now on -- it fails on
  # any suite that ran no test at all, and it names the gz suite specifically.
  #
  # WHY IT IS SHARDED.  Miri interprets every machine instruction, and the cost
  # is dominated by a handful of unit tests that sweep whole buffers: measured
  # here, `cargo +nightly miri test -p zlib-rs --all-features` was still inside
  # its FIRST test binary after 30 minutes, having finished 39 of the 1169 unit
  # tests, with `adler32::tests::adler32_and_adler32_z_are_the_same_function`
  # alone -- seven start values across seventeen lengths of a 100 kB corpus --
  # occupying more than eight of them.  One invocation cannot finish inside a
  # job, so the run is split and the shards run in parallel.  Nothing is dropped
  # to achieve that, which is the whole point: sharding moves work between jobs,
  # narrowing what is checked would move it out of CI.
  #
  # THE UNION OF THE SHARDS IS THE WHOLE SUITE BY CONSTRUCTION, not by a list
  # somebody has to remember to update:
  #
  #   * the unit tests are split by module filter, and the last of those shards
  #     is the exact COMPLEMENT of the others -- the same seven module strings,
  #     passed as `--skip` -- so a module added tomorrow is interpreted by that
  #     shard the day it lands.  Measured rather than assumed: the seven named
  #     filters select 1007 of the 1169 unit tests and the complement selects
  #     162, and 1007 + 162 is 1169 exactly.  deflate:: is then subdivided
  #     across three rows whose union is itself exact -- 99 + 25 + 103 = 227.  A
  #     test matching two filters runs in both shards, which costs a little and
  #     hides nothing; a test matching none of them is impossible.
  #   * the integration tests are the four heaviest binaries -- gz, deflate,
  #     inflate and compress, each measured in the thousands of seconds and each
  #     given a shard of its own -- and, computed from the tree at run time
  #     rather than listed below, every other file in crates/zlib-rs/tests/.  A
  #     test file added tomorrow is interpreted by that computed shard the day it
  #     lands too.  The four exclusions are not taken on trust either: the
  #     computed shard requires each name it excludes to still have a row of its
  #     own in this file, so deleting one of those rows fails the job instead of
  #     quietly removing a binary from it.
  #
  # So adding a shard means moving work out of a complement, and there is no way
  # to add a test that quietly reaches none of them.  The filters are substrings,
  # which is why `compress::` covers `uncompress::` as well -- 23 tests and 34 --
  # and why the complement skips the identical string.
  # ---------------------------------------------------------------------------
  miri:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # PER SHARD, not for the run as a whole, and deliberately close to the
    # platform's own 360-minute job ceiling: a budget that fails an otherwise
    # green run teaches everyone to distrust the job, and the cost of
    # interpreting a given test is not something anyone can predict by reading
    # it.  Every row below carries both the number of tests it selects and their
    # native CPU cost, because Miri's cost tracks the latter closely -- so a
    # shard that starts to strain this budget can be split on evidence rather
    # than on a guess.  The remedy for a shard that no longer fits is always to
    # promote one more filter out of it into a row of its own, which costs one
    # runner and no coverage; it is never to drop a feature, a filter or a test.
    timeout-minutes: 330
    strategy:
      # One shard's failure must not hide another's: the whole point of the split
      # is that each shard covers different code.
      fail-fast: false
      matrix:
        include:
          # The unit tests, by module.  The split is by measured cost, not by
          # taste: both checksum modules sweep 100 kB corpora across seven seeds
          # and seventeen boundary lengths, and the deflate and inflate modules
          # compress and decompress for real, so each of those is a shard of its
          # own.  Test counts are from `cargo test --lib -- <filter> --list`.
          - name: Miri units, Adler-32          # 57 tests, 0.97 s native
            slug: units-adler32
            select: "--lib -- adler32::"

          - name: Miri units, CRC-32            # 82 tests, 0.44 s native
            slug: units-crc32
            select: "--lib -- crc32::"

          # deflate:: is split three ways because it is the expensive module and
          # one test inside it is the expensive test: measured natively, the
          # whole module costs 6.10 s of CPU, `deflate::tests::` costs 4.30 s of
          # that, and a single member of it --
          # `every_level_and_container_round_trips`, ten levels across three
          # container formats -- costs 3.61 s.  Miri's cost tracks that closely,
          # so the three rows are sized rather than symmetrical.  Their union is
          # `deflate::` exactly: 99 + 25 + 103 = 227, measured with `--list`.
          - name: Miri units, deflate algorithms   # 99 tests, 1.65 s native
            slug: units-deflate-algorithm
            select: "--lib -- deflate::algorithm::"

          # Measured under Miri, all features on: 1890 s -- 31.5 minutes -- for 23
          # passed and 2 ignored.  That is the heaviest unit shard, and it is an
          # order of magnitude inside the budget below, which is what makes the
          # sizing above conservative rather than optimistic.
          - name: Miri units, deflate driver       # 25 tests, 4.30 s native
            slug: units-deflate-driver
            select: "--lib -- deflate::tests::"

          - name: Miri units, deflate machinery    # 103 tests, 0.16 s native
            slug: units-deflate-machinery
            select: >-
              --lib -- deflate::
              --skip deflate::algorithm:: --skip deflate::tests::

          - name: Miri units, inflate           # 203 tests, 0.66 s native
            slug: units-inflate
            select: "--lib -- inflate::"

          - name: Miri units, gz                # 268 tests, 0.43 s native
            slug: units-gz
            select: "--lib -- gz::"

          # Two filters in one row, which libtest supports and which the
          # arithmetic confirms: 134 for `trees::` and 57 for `compress::`, 191
          # together.  Both filters are wider than their module name suggests,
          # substrings being substrings -- `compress::` also selects
          # `uncompress::`, and `trees::` also selects `inflate::inftrees::`.
          # That costs a little duplicated interpretation against the inflate row
          # and hides nothing, which is the trade this whole matrix makes.
          - name: Miri units, trees and the one-shot wrappers  # 191 tests, 1.78 s native
            slug: units-trees-wrappers
            select: "--lib -- trees:: compress::"

          # ★ THE COMPLEMENT: the same seven module strings as `--skip`, so every
          # unit test the rows above do not name lands here -- allocate, error,
          # config, read_buf and weak_slice today, and whatever is added
          # tomorrow.  162 tests, measured at 167 s under Miri, which is almost
          # entirely per-test interpreter overhead.  If it ever grows past its
          # budget the repair is to promote one more module out of it into a row
          # of its own AND add the identical string here; the two lists must stay
          # in step, and the arithmetic above is how that is checked.
          - name: Miri units, everything else      # 162 tests, 0.01 s native
            slug: units-rest
            select: >-
              --lib --
              --skip adler32:: --skip crc32:: --skip deflate:: --skip inflate::
              --skip gz:: --skip trees:: --skip compress::

          # The suite this job's `--all-features` exists for: under the default
          # feature set the binary compiles empty, still runs and still reports
          # ok, which is exactly how the gz layer went unchecked.  It therefore
          # carries the named count assertion.  Measured at 3235 s -- 54 minutes
          # -- for 69 passed and 8 ignored with every feature on.
          - name: Miri gz layer
            slug: tests-gz
            select: "--test gz"
            expect_gz: "1"

          # ★ THE HEAVY BINARIES GET ROWS OF THEIR OWN, AND WHICH ONES WAS
          # MEASURED, NOT GUESSED.  Interpreting this crate costs three to four
          # orders of magnitude more than running it, and the cost is nowhere
          # near evenly spread.  Per integration binary, under Miri with every
          # feature on, on a contended four-core box:
          #
          #     deflate  10550 s    inflate   5143 s    gz        3235 s
          #     compress  2260 s    trees     1458 s    roundtrip 1300 s
          #     crc32      241 s    adler32    158 s    config     145 s
          #     allocate   110 s    infback     84 s    error       21 s
          #
          # That is 24705 s -- 6.9 hours -- for the twelve of them, and 21470 s
          # for everything except gz, which is already past the 330-minute
          # ceiling below.  One row for the integration tests could therefore
          # never have finished.  The three heaviest after gz get a row each and
          # the remaining eight, 3517 s together, share the computed row: the
          # worst row is then deflate at 176 minutes against a 330-minute
          # timeout, and a row that does overrun names the binary that did it
          # instead of hiding it behind whichever ran first.
          - name: Miri integration, deflate
            slug: tests-deflate
            select: "--test deflate"

          - name: Miri integration, inflate
            slug: tests-inflate
            select: "--test inflate"

          - name: Miri integration, compress and uncompress wrappers
            slug: tests-compress
            select: "--test compress"

          # ★ THE COMPLEMENT, COMPUTED FROM THE TREE by the step below -- which
          # is why `select` is empty here.  It interprets every .rs file directly
          # under crates/zlib-rs/tests/ except the four that have rows of their
          # own, so a test file added later joins this row without an edit here.
          # The exclusion list is not prose: the step below reads this file and
          # requires each excluded name to still have a row, so deleting one of
          # the four rows above turns this row red rather than quietly dropping
          # that binary from the job.
          - name: Miri integration, every other target
            slug: tests-rest
            select: ""
            from_tree: "1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install nightly --profile minimal --component miri,rust-src
        cargo +nightly miri --version

    - name: Run test cases
      env:
        SELECT: ${{ matrix.select }}
        FROM_TREE: ${{ matrix.from_tree }}
      run: |
        set -euo pipefail
        mkdir -p target

        if [ -n "${FROM_TREE:-}" ]; then
          # THE TARGET LIST IS COMPUTED, NOT DECLARED.  Every .rs file directly
          # under crates/zlib-rs/tests/ is a test target -- the manifest declares
          # no [[test]] section -- so building the flags from the tree is what
          # makes a file added later part of this shard without an edit here.
          #
          # Four binaries are excluded, and only because each has a row of its
          # own.  That claim is checked rather than trusted: every excluded name
          # must still appear as a one-target `select` in this workflow, so
          # deleting one of those rows fails here instead of silently removing a
          # binary from the job.
          own_rows="gz deflate inflate compress"
          for name in $own_rows; do
            if ! grep -qF "select: \"--test $name\"" .github/workflows/rust.yml
            then
              echo "::error::tests/$name.rs is excluded from the computed shard" \
                   "but no matrix row selects it on its own -- either restore" \
                   "that row or drop $name from own_rows"
              exit 1
            fi
          done

          flags=()
          expected=()
          for path in crates/zlib-rs/tests/*.rs; do
            name=$(basename "$path" .rs)
            skip=
            for own in $own_rows; do
              if [ "$name" = "$own" ]; then
                skip=1
                break
              fi
            done
            if [ -n "$skip" ]; then
              continue
            fi
            flags+=(--test "$name")
            expected+=("tests/$name.rs")
          done
          if [ "${#flags[@]}" -eq 0 ]; then
            echo "::error::no integration test target was found under crates/zlib-rs/tests/"
            exit 1
          fi
          # Handed to the coverage step, which then requires exactly these
          # suites to have reported -- so a target that fails to build, or one
          # cargo declines to run, is a failure rather than a silence.
          echo "EXPECT_SUITES=${expected[*]}" >> "$GITHUB_ENV"
          echo "interpreting ${#expected[@]} integration targets: ${expected[*]}"
          cargo +nightly miri test -p zlib-rs --all-features "${flags[@]}" 2>&1 \
            | tee target/miri.log
        else
          echo "interpreting: $SELECT"
          # Unquoted on purpose: `select` carries several words, including the
          # `--` that separates cargo's arguments from the test harness's.
          # shellcheck disable=SC2086
          cargo +nightly miri test -p zlib-rs --all-features $SELECT 2>&1 \
            | tee target/miri.log
        fi

    - name: Run test cases (prove nothing was compiled away)
      env:
        EXPECT_GZ: ${{ matrix.expect_gz }}
      # A feature gate that compiles a test binary empty does not fail: the
      # binary still runs and still reports "ok", just with 0 passed.  That is
      # exactly how the gz layer went unchecked, and `tests/gz.rs` L1-L11 says so
      # of itself -- "a misspelled gate here is the single most likely way for
      # this suite to fail silently ... The gate is therefore verified by
      # counting".  This step is that count, moved out of the prose and into CI.
      #
      # Three rules, and each one closes a way for this job to report success
      # having checked less than it claims:
      #
      #   1. every suite the shard reported passed at least one test.  A filter
      #      that matches nothing, a feature gate that empties a binary, a
      #      module renamed out from under a `--skip` -- all of them land here.
      #   2. the gz shard reported a non-zero count from tests/gz.rs by name,
      #      because that suite is why every command above says --all-features.
      #   3. the computed shard reported exactly the suites it set out to run,
      #      neither fewer nor more.
      #
      # Doctests are exempt from rule 1 alone: whether `cargo miri test` runs
      # them is cargo-miri's business, not this gate's, and they are run natively
      # in the build-test job either way.  Ignore counts are printed rather than
      # asserted -- each `#[cfg_attr(miri, ignore)]` site in the core states its
      # reason where it stands, the gz suite's filesystem tests because Miri
      # cannot do file I/O at all and the rest because an unbounded sweep is
      # unaffordable under interpretation, each with a bounded counterpart that
      # does run -- so a growing total is visible here without this step
      # pretending to judge it.
      run: |
        set -euo pipefail
        python3 - <<'MIRI_COVERAGE'
        import os
        import re
        import sys

        with open("target/miri.log", encoding="utf-8", errors="replace") as handle:
            lines = [line.rstrip("\n") for line in handle]

        RUNNING = re.compile(r"^\s*Running (?:unittests )?(\S+)")
        DOCTESTS = re.compile(r"^\s*Doc-tests (\S+)")
        RESULT = re.compile(
            r"^\s*test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored;"
        )

        suites = []
        pending = None
        for line in lines:
            running = RUNNING.match(line)
            if running:
                pending = (running.group(1), False)
                continue
            doctests = DOCTESTS.match(line)
            if doctests:
                pending = ("doc-tests %s" % doctests.group(1), True)
                continue
            result = RESULT.match(line)
            if result:
                label, is_doc = pending or ("<result with no Running line>", False)
                suites.append((label, is_doc, result.group(1), int(result.group(2)),
                               int(result.group(3)), int(result.group(4))))
                pending = None

        problems = []
        if not suites:
            problems.append("the log holds no test result at all, so the run did not happen")

        ignored_total = 0
        for label, is_doc, status, passed, failed, ignored in suites:
            print("%-34s %-6s %5d passed  %4d failed  %4d ignored"
                  % (label, status, passed, failed, ignored))
            ignored_total += ignored
            if status != "ok" or failed:
                problems.append("%s reported %s with %d failed" % (label, status, failed))
            if passed == 0 and not is_doc:
                problems.append("%s ran no test at all, so something -- a feature gate, a "
                                "filter, a rename -- compiled or filtered it away" % label)

        if os.environ.get("EXPECT_GZ"):
            gz = [suite for suite in suites if suite[0].endswith("tests/gz.rs")]
            if not gz:
                problems.append("tests/gz.rs did not run; the gz layer is the whole reason "
                                "these commands carry --all-features")
            elif gz[0][3] == 0:
                problems.append("tests/gz.rs ran 0 tests; its #![cfg(feature = \"std\")] "
                                "gate did not take effect")
            else:
                print("tests/gz.rs: %d tests interpreted under Miri" % gz[0][3])

        expected = os.environ.get("EXPECT_SUITES", "").split()
        if expected:
            ran = [label for label, is_doc, _, _, _, _ in suites if not is_doc]
            for target in expected:
                if not any(label.endswith(target) for label in ran):
                    problems.append("%s was selected but reported no result; a test target "
                                    "of the safe core was not interpreted" % target)
            for label in ran:
                if not any(label.endswith(target) for target in expected):
                    problems.append("%s reported a result but was not among the selected "
                                    "targets" % label)
            print("selected targets: %d, all present" % len(expected))

        print("ignored under Miri: %d across %d suites; every site states its reason where "
              "it stands" % (ignored_total, len(suites)))

        if problems:
            for problem in problems:
                print("::error::%s" % problem)
            sys.exit(1)
        binaries = [suite for suite in suites if not suite[1]]
        print("Miri coverage: %d test %s ran, not one of them empty"
              % (len(binaries), "binary" if len(binaries) == 1 else "binaries"))
        MIRI_COVERAGE

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        # Per shard, because an artifact name may not repeat within a run.
        name: miri-${{ matrix.slug }}
        path: |
          target/miri.log
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 10b. Miri over the FACADE -- the crate where every raw pointer actually is.
  #
  # ★ WHY THIS JOB EXISTS, stated plainly because its absence had a measured
  # cost.  Job 10 interprets `crates/zlib-rs`, which carries
  # `#![forbid(unsafe_code)]`; job 10a interprets the differential harness.
  # Neither reaches `crates/libz-rs-sys` -- the ONE crate permitted `unsafe`, and
  # the crate that reconstructs slices from caller pointer/length pairs, hands out
  # the opaque `state` round-trip and invokes caller-supplied `zalloc`/`zfree`.
  # So the workspace's unsafe surface was the one part of it no interpreter ever
  # saw.
  #
  # Two Critical aliasing defects lived there and CI was green throughout: the
  # one-shot overlap path formed a shared reference over the caller's source
  # through the caller's own pointer while a mutable borrow of the caller's
  # destination was live, and `inflateBack` held a whole-window `&mut` across
  # every input callback.  Both are undefined behaviour, both were reproduced by
  # `cargo +nightly miri test -p libz-rs-sys --test alias_overlap` in minutes, and
  # neither could have been caught by any amount of ordinary testing: the reads
  # and writes involved are individually in bounds, so nothing crashes and every
  # answer is correct.  A green suite is not evidence about aliasing; an
  # interpreter that tracks borrows is.
  #
  # WHAT IT RUNS.  `tests/alias_overlap.rs`, which is written for this purpose:
  # each case drives MORE THAN ONE `OVERLAP_STAGE_BYTES` window of input, because
  # a single window is exactly the case a wrong design still gets right -- the
  # first copy happens before the first borrow either way, and it is the second
  # and later copies that are undefined.  It also checks the ANSWERS, not just the
  # borrows, so it cannot pass over a build that staged correctly and computed
  # nonsense.
  #
  # COST, measured on this tree rather than estimated: 15 tests, 392 seconds, zero
  # undefined behaviour.  The 60-minute budget is therefore roughly nine times the
  # observed cost, which leaves room for the file to grow without anyone having to
  # revisit this number.
  #
  # `-Zmiri-disable-isolation` is required and is not a relaxation of the
  # borrow checking this job exists for.  Isolation blocks the clock and
  # environment queries the test harness makes; the aliasing model is unaffected
  # by it, and Stacked Borrows is what is being asked for here.
  # ---------------------------------------------------------------------------
  miri-facade:
    name: Miri, C ABI facade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install nightly --profile minimal --component miri,rust-src
        cargo +nightly miri --version

    - name: Run test cases
      # CARGO_TARGET_DIR is isolated because `libz-rs-sys` is `[lib] name = "z"`
      # and therefore writes an UNHASHED `libz.rlib`: a Miri build sharing a
      # directory with an ordinary one poisons whichever ran second.  Every
      # non-default build in this workspace does the same thing for the same
      # reason.
      env:
        CARGO_TARGET_DIR: target/miri-facade
        MIRIFLAGS: -Zmiri-disable-isolation
      run: |
        set -euo pipefail
        mkdir -p target
        cargo +nightly miri test -p libz-rs-sys --test alias_overlap 2>&1 \
          | tee target/miri-facade.log

    - name: Run test cases (prove the interpreter saw the boundary)
      # The same discipline as the two Miri jobs above: a passing log is not
      # evidence unless it also shows that the tests RAN.  A filter that stops
      # matching, a target renamed, or a harness that exits before the cases would
      # each leave "0 passed" and a zero exit status, which reads as a pass.
      run: |
        set -euo pipefail
        LOG=target/miri-facade.log
        [ -s "$LOG" ] || { echo "::error::$LOG is missing or empty"; exit 1; }

        line=$(grep -E '^test result:' "$LOG" | tail -1)
        [ -n "$line" ] || { echo "::error::no test result line in $LOG"; exit 1; }
        echo "miri facade: $line"

        passed=$(printf '%s\n' "$line" | sed -E 's/.* ([0-9]+) passed.*/\1/')
        failed=$(printf '%s\n' "$line" | sed -E 's/.* ([0-9]+) failed.*/\1/')

        if [ "$failed" -ne 0 ]; then
          echo "::error::$failed interpreted test(s) failed under Miri. In this job"
          echo "::error::that most likely means UNDEFINED BEHAVIOUR at the C ABI"
          echo "::error::boundary rather than a wrong answer -- read the log for the"
          echo "::error::borrow-stack diagnostic, which names the offending pointer."
          exit 1
        fi
        if [ "$passed" -lt 15 ]; then
          echo "::error::only $passed test(s) were interpreted, and alias_overlap.rs"
          echo "::error::held 15 when this gate was written. Either a case was removed"
          echo "::error::-- which needs saying, because each one covers a distinct"
          echo "::error::entry point's staging path -- or the target was renamed and"
          echo "::error::this job no longer reaches it, in which case it is proving"
          echo "::error::nothing at all."
          exit 1
        fi
        if grep -q 'Undefined Behavior' "$LOG"; then
          echo "::error::Miri reported undefined behaviour even though the harness"
          echo "::error::reported success. Read the log."
          exit 1
        fi
        echo "miri facade: $passed interpreted test(s), no undefined behaviour"

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: miri-facade
        path: |
          target/miri-facade.log
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 10a. Miri over the DIFFERENTIAL HARNESS's own boundary.
  #
  # The job above interprets `crates/zlib-rs`, which carries
  # `#![forbid(unsafe_code)]` and therefore has no boundary to get wrong.  This
  # one interprets the harness that DOES: crates/zlib-rs-differential/src/port.rs
  # holds the gates the differential suites, the fuzz targets and the benches all
  # reach the facade through, and src/retain.rs holds the session type that keeps
  # a retained pointer's storage borrowed for as long as the library keeps the
  # pointer.  A defect there is a defect in every verification result this
  # workflow produces, which is why it is worth its own runner.
  #
  # ★ THAT THIS IS POSSIBLE AT ALL WAS MEASURED, NOT ASSUMED.  The received
  # wisdom in this repository was that nothing in the differential crate can run
  # under Miri, because the crate links a C oracle archive and Miri cannot call a
  # foreign function.  Half of that is true: `oracle::` reaches the C library and
  # is unreachable here.  The `port::` half is not -- it goes through
  # `libz_rs_sys`, which is Rust all the way down, so Miri interprets it happily.
  # Both filters below run in seconds.
  #
  # `--skip oracle::` rather than a list of module names, so a module added to
  # this crate later is interpreted without an edit here -- the same complement
  # discipline the `Miri units, everything else` row above uses.
  miri-harness:
    name: Miri differential harness boundary
    runs-on: ubuntu-latest
    # Two orders of magnitude inside this, measured: 12 s to compile and under 4 s
    # to interpret both filters.  The budget is for the day a gate is added that
    # sweeps a corpus.
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install nightly --profile minimal --component miri,rust-src
        cargo +nightly miri --version

    - name: Install packages (objcopy for the differential oracle)
      # The build script still compiles and rewrites the C archive even though
      # nothing here calls into it: it runs on the host as an ordinary build
      # script, not under the interpreter.  Without binutils the crate does not
      # build and this job fails for a reason that has nothing to do with Miri.
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y binutils

    - name: Run test cases
      # `-Zmiri-disable-isolation` because the build script's own environment
      # probing reaches the clock; nothing interpreted here touches the
      # filesystem or the network.
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
        # `[lib] name = "z"` makes cargo write an unhashed libz.rlib, so a Miri
        # build sharing target/ with a native one collides (E0514).
        CARGO_TARGET_DIR: target/miri-harness
      run: |
        set -euo pipefail
        mkdir -p target
        cargo +nightly miri test -p zlib-rs-differential --lib -- --skip oracle:: 2>&1 \
          | tee target/miri-harness.log

    - name: Run test cases (prove the interpreter saw the boundary)
      # A filter that selects nothing still reports `ok`, and that is exactly how
      # a gate like this rots: rename `port::tests` and the log below reads
      # `0 passed` in green.  Nine is what the two modules hold today, measured
      # with `--list`; the assertion is `>=` so adding a test is not a workflow
      # edit, and a DROP is what has to be justified.
      #
      # The complement is checked from the other side too: `oracle::` must still
      # be the only thing filtered out, so a module that quietly becomes
      # unreachable under Miri cannot hide inside the skip.
      run: |
        set -euo pipefail
        LOG=target/miri-harness.log
        [ -s "$LOG" ] || { echo "::error::$LOG is missing or empty"; exit 1; }

        line=$(grep -E '^test result:' "$LOG" | tail -1)
        [ -n "$line" ] || { echo "::error::no test result line in $LOG"; exit 1; }
        echo "miri harness: $line"

        passed=$(printf '%s\n' "$line" | sed -E 's/.* ([0-9]+) passed.*/\1/')
        failed=$(printf '%s\n' "$line" | sed -E 's/.* ([0-9]+) failed.*/\1/')
        filtered=$(printf '%s\n' "$line" | sed -E 's/.* ([0-9]+) filtered out.*/\1/')

        if [ "$failed" -ne 0 ]; then
          echo "::error::$failed interpreted test(s) failed under Miri"
          exit 1
        fi
        if [ "$passed" -lt 9 ]; then
          echo "::error::only $passed test(s) were interpreted, and port::+retain::" \
               "held 9 when this gate was written. Either a test was removed --" \
               "which needs saying -- or a module was renamed and the filter no" \
               "longer reaches it, in which case this job is measuring nothing."
          exit 1
        fi

        oracle=$(cargo +nightly miri test -p zlib-rs-differential --lib -- \
                   --list 2>/dev/null | grep -cE '^oracle::.*: test$' || true)
        if [ "$filtered" -ne "$oracle" ]; then
          echo "::error::$filtered test(s) were filtered out but oracle:: holds" \
               "$oracle. --skip oracle:: is meant to exclude the C-calling gates" \
               "and nothing else; something else is now being skipped, or an" \
               "oracle test has moved out of that module."
          exit 1
        fi
        echo "PASS: $passed harness tests interpreted, $filtered oracle test(s) excluded as intended"
      env:
        MIRIFLAGS: -Zmiri-disable-isolation
        CARGO_TARGET_DIR: target/miri-harness

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: miri-harness
        path: |
          target/miri-harness.log
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 11. AddressSanitizer over the C ABI facade, and over the C drivers linked
  # against it.
  #
  # This is the counterpart to the Miri job.  libz-rs-sys is the only shipped
  # crate allowed to use `unsafe` -- the dev-only differential harness has a
  # boundary of its own, in its src/oracle.rs and src/port.rs, which this job
  # also instruments because the differential suites link the facade.  The facade
  # carries #![deny(unsafe_op_in_unsafe_fn)] so that
  # each unsafe operation is individually scoped, and it is where the six
  # unavoidable unsafe site categories live: validating a caller's z_streamp,
  # rebuilding the (next_in, avail_in) and (next_out, avail_out) slices, the
  # opaque `state` round-trip, calling the caller's zalloc/zfree, C strings and
  # varargs, and writing through a caller's gz_header with the extra_max /
  # name_max / comm_max clamps.  ASan is what exercises those with real
  # pointers, which Miri cannot do.
  #
  # SCOPE, EXACTLY, because several files elsewhere describe themselves in terms
  # of this job.  FOUR things run under the sanitizer and a fifth is compiled
  # under it, in this order:
  #
  #   1. `cargo test -p libz-rs-sys` -- the facade's own unit tests, doctests and
  #      every suite under crates/libz-rs-sys/tests/.
  #   2. the same again with `-Zbuild-std`, so a fault inside a `std` routine
  #      reached from the facade is attributed rather than invisible.
  #   3. the three UNMODIFIED C drivers, compiled with -fsanitize=address and
  #      linked against an instrumented libz.a.
  #   4. `cargo test -p zlib-rs-differential` -- the dev-only harness, oracle
  #      included, which has an unsafe boundary of its own in src/oracle.rs and
  #      src/port.rs.
  #   5. `cargo bench --manifest-path benches/Cargo.toml`, first `--no-run` and
  #      then each suite with criterion's `-- --test`: the suites are compiled
  #      under instrumentation and each benchmark body is executed ONCE, which is
  #      what surfaces a fault in the harness.  They are not MEASURED under the
  #      sanitizer, because a sanitized timing is not a timing.
  #
  # The C oracle is instrumented too, not merely linked: steps 4 and 5 set
  # CFLAGS=-fsanitize=address, so the archive the differential crate's build script
  # compiles is built with the sanitizer rather than around it.
  #
  # This paragraph used to say the opposite -- "two things and nothing else", with
  # crates/zlib-rs-differential and "the three benches attached to it" listed as
  # deliberately not covered.  Both halves were wrong: step 4 has always selected
  # that crate (this job's own name says "and differential harness"), and the
  # benches are their own excluded package rather than attached to anything.
  # AAP 0.6.4.5's split is Miri over the safe core and ASan over the boundary
  # layer; scoping ASan wider than the facade honours it, since every extra target
  # here is one that drives the boundary.
  #
  # Genuinely NOT covered here: the fuzz targets, which get their own
  # instrumentation from cargo-fuzz -- it builds each one with AddressSanitizer by
  # default -- so that is per-target and belongs to the `fuzz` job.  And Miri
  # remains scoped to crates/zlib-rs alone, because it interprets Rust MIR and
  # cannot execute the compiled C oracle at all.
  #
  # RUSTDOCFLAGS IS NOT OPTIONAL HERE.  Setting only RUSTFLAGS instruments the
  # library but not the doctest binaries, because rustdoc does not read
  # RUSTFLAGS; the doctests then fail to link with undefined __asan_* symbols.
  # Measured, and fixed by setting both.
  #
  # TWO RUNS OF THE FACADE, AND THEY ARE DIFFERENT COMMANDS.  The first
  # instruments the facade against the toolchain's PRECOMPILED std: it is quick,
  # it is what a contributor wants feedback from, and everything the job is aimed
  # at -- the facade's own unsafe blocks and the caller-supplied allocator path --
  # is already covered by it.  The second is the ACCEPTANCE shape, `-Zbuild-std`,
  # which additionally rebuilds and instruments the standard library so that a
  # fault inside a `std` routine reached from the facade is attributed rather than
  # invisible; it is the command the project's own verified command set names, and
  # it is slower for exactly that reason.  Neither replaces the other, and the
  # acceptance run is not optional: dropping it would leave `std`'s allocation,
  # formatting and I/O paths -- which the gz layer uses on every call --
  # uninstrumented.  The distinction is only real if the flag differs between
  # them, which is why the first step below does NOT carry `-Zbuild-std`.
  #
  # An explicit --target is required for both, because a sanitizer must not be
  # applied to build scripts and proc-macros compiled for the host.
  # `-Zbuild-std` additionally needs the `rust-src` component, which the
  # toolchain step below installs.  Every step here sets its own
  # CARGO_TARGET_DIR: this crate is `[lib] name = "z"`, so cargo's artifact names
  # are unhashed and an instrumented build must not share a directory with an
  # ordinary one.
  # ---------------------------------------------------------------------------
  asan:
    name: AddressSanitizer (C ABI facade and differential harness)
    runs-on: ubuntu-latest
    # The differential step builds the C oracle with ASan and runs the default
    # sweeps in release: measured at roughly six minutes on a 4-core machine,
    # against about two for the facade and the three drivers.  60 leaves room.
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: |
        rustup toolchain install nightly --profile minimal --component rust-src
        cargo +nightly --version

    - name: Run test cases (facade under ASan, std as shipped)
      # ★ NO `-Zbuild-std' HERE, WHICH IS THE ONLY THING THAT MAKES THIS RUN
      # DISTINCT FROM THE NEXT ONE.  The comment block above describes two scopes
      # -- the facade alone, then the facade plus an instrumented standard library
      # -- and an earlier revision passed `-Zbuild-std' in both, so the two steps
      # ran the same command twice into two different target directories and the
      # job's stated coverage was half of what it looked like.  Instrumenting only
      # this crate's own code is the quick shape: it needs no std rebuild, it is
      # where the facade's unsafe blocks and the caller-supplied allocator path
      # live, and it is what a contributor wants feedback from first.  The
      # acceptance run below is what adds `std`.
      #
      # A target directory of its own for the same reason the next step has one: a
      # sanitized build fingerprints differently from an ordinary one, and this
      # crate is `[lib] name = "z"', so its rlib and cdylib file names carry no
      # hash and would be overwritten in a shared directory.
      env:
        CARGO_TARGET_DIR: target/asan-facade
        RUSTFLAGS: -Zsanitizer=address
        RUSTDOCFLAGS: -Zsanitizer=address
        ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
      run: |
        cargo +nightly test --locked -p libz-rs-sys \
          --target x86_64-unknown-linux-gnu

    - name: Run test cases (facade under ASan with an instrumented std)
      # AAP 0.8.6's acceptance command, verbatim, and the stage that adds what the
      # one above cannot see: with `-Zbuild-std` the standard library is rebuilt
      # under the sanitizer, so a fault inside a `std` routine reached FROM the
      # facade -- an out-of-bounds `copy_from_slice`, a misuse of `CStr`, a
      # `std::fs` path in the gz layer -- is attributed instead of silently
      # occurring in uninstrumented code.  A separate CARGO_TARGET_DIR for the
      # same E0514 reason, and because a `-Zbuild-std` build fingerprints
      # differently from the one above and would otherwise invalidate it on every
      # run.
      env:
        CARGO_TARGET_DIR: target/asan-build-std
        RUSTFLAGS: -Zsanitizer=address
        RUSTDOCFLAGS: -Zsanitizer=address
        ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
      run: |
        cargo +nightly test --locked -p libz-rs-sys -Zbuild-std \
          --target x86_64-unknown-linux-gnu

    - name: Compile source code (instrumented archive)
      # An instrumented archive for the C drivers.  A dedicated CARGO_TARGET_DIR
      # keeps the sanitized objects away from the ordinary build cache AND makes
      # the artifact path deterministic, which matters because the facade builds
      # under several feature configurations.
      env:
        CARGO_TARGET_DIR: target/asan
        RUSTFLAGS: -Zsanitizer=address
        CFLAGS: -fsanitize=address -fno-omit-frame-pointer -O1 -g
      run: |
        set -eu
        cargo +nightly build --locked -p libz-rs-sys --features libz-compat,gz \
          -Zbuild-std --target x86_64-unknown-linux-gnu
        A=target/asan/x86_64-unknown-linux-gnu/debug/libz.a
        [ -f "$A" ] || { echo "::error::$A was not produced"; exit 1; }
        echo "ASANLIB=$PWD/$A" >> "$GITHUB_ENV"

    - name: Run test cases (C drivers under ASan)
      env:
        ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:abort_on_error=1
      run: |
        # `pipefail` is what makes the minigzip round trip below an assertion
        # rather than a decoration.  Under `set -eu` alone the exit status of a
        # pipeline is the status of its LAST command, so a minigzip that aborted
        # under ASan mid-pipeline -- exactly the finding this job exists to
        # catch -- was reported as success as long as the final process in the
        # pipeline exited zero.
        set -euo pipefail

        D="$PWD/target/asan-drivers"
        rm -rf "$D"
        mkdir -p "$D"
        for driver in example minigzip infcover; do
          cc -I. -O1 -g -fsanitize=address -fno-omit-frame-pointer \
            -o "$D/${driver}_asan" "test/$driver.c" "$ASANLIB" -fsanitize=address
        done
        echo "all three drivers linked against the instrumented archive"
        "$D/example_asan" "$D/tmp.gz"
        rm -f "$D/tmp.gz"

        # THE ROUND TRIP IS COMPARED, NOT MERELY RUN.  Compressing and
        # decompressing without looking at the result checks that neither process
        # crashed and nothing else: a minigzip that emitted an empty stream, or
        # truncated it, or corrupted a byte, satisfied the old form completely.
        # So each stage writes a file, the exit status of each stage is its own,
        # and `cmp` decides whether the bytes survived.
        #
        # The payload is deliberately more than one short line.  A 12-byte
        # "hello world" fits inside a single deflate block and never exercises a
        # window refill, so it cannot distinguish a working engine from one that
        # mishandles a continuation.  This one is long enough to compress, spans
        # many blocks, and mixes highly repetitive text with incompressible
        # bytes so that both the match path and the stored-block path are taken.
        {
          for i in $(seq 1 400); do
            echo "line $i: the quick brown fox jumps over the lazy dog"
          done
          head -c 4096 /dev/urandom | base64
        } > "$D/original"
        wc -c < "$D/original"

        "$D/minigzip_asan" < "$D/original" > "$D/roundtrip.gz"
        [ -s "$D/roundtrip.gz" ] || { echo "::error::minigzip produced an empty stream"; exit 1; }
        "$D/minigzip_asan" -d < "$D/roundtrip.gz" > "$D/recovered"
        cmp "$D/original" "$D/recovered" \
          || { echo "::error::the minigzip round trip did not reproduce its input"; exit 1; }
        echo "minigzip round trip: $(wc -c < "$D/original") bytes in, \
        $(wc -c < "$D/roundtrip.gz") compressed, recovered byte for byte"

        "$D/infcover_asan"
        echo "AddressSanitizer: PASS"

    - name: Compile source code (the sanitizer build emits no warnings)
      # ★ THE ZERO-WARNING BAR, APPLIED TO THE ONE CONFIGURATION THAT USED TO BREAK
      # IT.  `crates/zlib-rs-differential/build.rs` audits every global the oracle
      # archive exports, and under `-fsanitize=address` gcc adds one ODR indicator
      # per instrumented global -- seven of them here.  The audit used to tolerate
      # any `__`-prefixed name and announce the fact with an unconditional
      # `cargo::warning`, so every sanitizer build in this job printed a warning
      # while the project claimed zero warnings everywhere.  The audit now checks
      # those names against an exact family list and records them on its own stdout
      # instead of warning, and this step is what keeps that true: it compiles the
      # exact sanitizer configuration the two steps below run, with nothing
      # executed, and fails if cargo emits a single warning line.
      #
      # `--no-run` and a `2>&1` capture rather than a bare invocation, because a
      # warning is on stderr and a step that only checks the exit status cannot see
      # one.  The same CARGO_TARGET_DIR as the steps below, so this compile is the
      # one they reuse rather than a third build of the same thing.
      env:
        CARGO_TARGET_DIR: target/asan-differential
        RUSTFLAGS: -Zsanitizer=address
        RUSTDOCFLAGS: -Zsanitizer=address
        CFLAGS: -fsanitize=address -fno-omit-frame-pointer -O1 -g
      run: |
        set -eu
        set -o pipefail
        mkdir -p target/asan-diff-logs
        LOG=target/asan-diff-logs/sanitizer-compile.log
        cargo +nightly test --locked -p zlib-rs-differential \
          --target x86_64-unknown-linux-gnu --no-run 2>&1 | tee "$LOG"
        cargo +nightly bench --locked --manifest-path benches/Cargo.toml \
          --target x86_64-unknown-linux-gnu --no-run 2>&1 | tee -a "$LOG"
        if grep -n '^warning' "$LOG"; then
          echo "::error::the sanitizer build emitted the warning(s) above.  A build-script"
          echo "::error::warning here means the oracle archive exported a global the symbol"
          echo "::error::audit in crates/zlib-rs-differential/build.rs cannot account for, or"
          echo "::error::that some other diagnostic has appeared; either way the zero-warning"
          echo "::error::bar this project states in rust/README.md is not being met."
          exit 1
        fi
        echo "sanitizer compile of the differential harness and the three benches: no warnings"

    - name: Run test cases (differential oracle under ASan)
      # SEC-01 clause 2: every remaining `unsafe` outside the boundary crate is
      # instrumented, not just the boundary crate itself.  After the harness
      # conversion the only such code left in the tree is
      # crates/zlib-rs-differential/src/oracle.rs -- the `extern "C"`
      # declarations of the renamed C oracle, which AAP 0.4.1.4 requires to live
      # there and 0.6.4.1 forbids relocating into libz-rs-sys -- plus its one
      # `unsafe fn table_slice`, which builds a slice from a pointer and a length
      # the C tables publish.  That is precisely the shape ASan checks and Miri
      # cannot, because Miri cannot execute the foreign functions on the other
      # side of those declarations.
      #
      # CFLAGS instruments the oracle itself: build.rs compiles the 15 C
      # translation units with `cc`, so without it the Rust side would be
      # sanitized and the C side it calls would not, and an over-read inside the
      # oracle -- the thing a mismatched declaration causes -- would go unseen.
      # A separate CARGO_TARGET_DIR keeps these objects out of the ordinary cache.
      #
      # `detect_leaks` is off for this step alone, and deliberately: the C oracle
      # keeps `local` state alive for the life of the process by design (the
      # `z_errmsg` table, `x2n_table`, the CRC tables), which LeakSanitizer
      # cannot distinguish from a leak at exit.  Every other ASan check --
      # out-of-bounds, use-after-free, use-after-return -- is fully in force, and
      # the allocator-discipline half of leak detection is covered far more
      # precisely by `harness::Zone`, which counts allocations and frees and
      # asserts on leaks, non-LIFO frees and rogue frees inside the tests.
      env:
        CARGO_TARGET_DIR: target/asan-differential
        RUSTFLAGS: -Zsanitizer=address
        RUSTDOCFLAGS: -Zsanitizer=address
        CFLAGS: -fsanitize=address -fno-omit-frame-pointer -O1 -g
        ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1:strict_string_checks=1
      run: >-
        cargo +nightly test --locked -p zlib-rs-differential
        --target x86_64-unknown-linux-gnu

    - name: Compile source code (benchmarks under ASan)
      # The three benches are the other consumers of the oracle, and they reach
      # it through the same declarations.  They are BUILT and their self-checks
      # run, rather than measured: a criterion measurement under ASan is
      # meaningless as a number, and the throughput gate is the `bench` job's
      # job.  What matters here is that the harness calls and the oracle calls
      # the benches make are exercised with instrumentation on.
      #
      # `--no-run` builds them; `-- --test` then runs each one in criterion's
      # test mode, a single iteration per benchmark, which is enough to execute
      # every code path the measurement would and cheap enough to belong in this
      # job.
      env:
        CARGO_TARGET_DIR: target/asan-differential
        RUSTFLAGS: -Zsanitizer=address
        CFLAGS: -fsanitize=address -fno-omit-frame-pointer -O1 -g
        ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1
      run: |
        set -euo pipefail
        cargo +nightly bench --locked --manifest-path benches/Cargo.toml \
          --target x86_64-unknown-linux-gnu --no-run
        for bench in checksum_bench inflate_bench deflate_bench; do
          echo "::group::$bench under ASan"
          cargo +nightly bench --locked --manifest-path benches/Cargo.toml \
            --target x86_64-unknown-linux-gnu --bench "$bench" -- --test
          echo "::endgroup::"
        done
        echo "AddressSanitizer over the differential oracle and the benches: PASS"

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: asan
        # ★ EVERY PATH NAMED HERE HAS A PRODUCER.  `target/asan-diff-logs/` did
        # not: no step in this job ever wrote it, so a differential or bench
        # failure uploaded the C drivers' directory and nothing about the failure
        # itself.  What the differential and bench steps actually produce lives
        # under target/asan-differential (their CARGO_TARGET_DIR), and the part
        # worth having on a failure is the C oracle's own build output -- `cc`'s
        # diagnostics for the fifteen reference translation units, which is where
        # a CFLAGS/-fsanitize mismatch shows up.  The glob covers both the host
        # build-script directory and the --target one, because a build script is
        # compiled for the host even when the crate is not.
        path: |
          target/asan-drivers/
          target/asan-differential/**/build/zlib-rs-differential-*/output
          target/asan-differential/**/build/zlib-rs-differential-*/stderr
          target/asan-facade/**/build/libz-rs-sys-*/output
          target/asan-facade/**/build/libz-rs-sys-*/stderr
        retention-days: 7


  # ---------------------------------------------------------------------------
  # 12. cargo-fuzz over the five Rust entry points, 300 seconds each -- in six
  # matrix rows, because the differential checksum target is run twice, once per
  # checksum backend.  See the comment on the sixth row.
  #
  # The budget matches fuzz.yml's existing `fuzz-seconds: 300`, deliberately, so
  # that the Rust numbers and the OSS-Fuzz numbers on the C oracle are
  # comparable.  This job does not replace fuzz.yml and fuzz.yml does not
  # replace this job: two implementations, two fuzzers.
  #
  # fuzz/ IS ITS OWN CARGO WORKSPACE.  The root Cargo.toml declares
  # `exclude = ["fuzz"]` and the fuzz crate carries its own Cargo.lock, so every
  # command here runs with `working-directory: fuzz`; a `--locked` invocation
  # from the repository root would not resolve these targets at all.  cargo-fuzz
  # itself has no `--locked` pass-through, so the lockfile is proved separately
  # with `cargo fetch --locked` before the run -- otherwise the one crate whose
  # dependencies are pinned by a committed lockfile would be the one crate that
  # never checks it.
  #
  # nightly is required for the sanitizer instrumentation libFuzzer needs.
  #
  # The gate is zero crashes and zero hangs, which is the exit status: libFuzzer
  # returns non-zero and writes a reproducer under fuzz/artifacts/ on any
  # finding, and that directory is uploaded so the input is not lost with the
  # runner.  fuzz_inflate is the most important of the five -- inflate is the
  # entry point that consumes untrusted bytes -- and must never panic, hang or
  # over-read.
  #
  # ★ THE CORPUS IS SEEDED AND CARRIED FORWARD, and without both this job is
  # weaker than its 300-second budget suggests.  libFuzzer starts from whatever is
  # in the corpus directory; with an empty one every run spends its first seconds
  # rediscovering that a zlib stream begins 0x78 0x9c, and 300 seconds from
  # nothing reaches shallower states than 300 seconds from a corpus that already
  # decodes.  Two measures:
  #
  #   * A DETERMINISTIC SEED, staged from the ten fixtures in
  #     crates/zlib-rs-differential/corpus/minimal -- the same committed files the
  #     differential suite and the benches use, so the fuzzer starts from inputs
  #     that are known to exercise stored blocks, long matches, the 32 KiB window
  #     boundary and the degenerate cases.  Committed, so every run starts from
  #     the same place whether or not a cache exists.
  #   * THE EVOLVED CORPUS IS KEPT, through actions/cache keyed per target.  The
  #     coverage libFuzzer buys with one run's 300 seconds is otherwise discarded
  #     with the runner, so every run restarts from the seed forever.  With the
  #     cache, successive runs deepen the same corpus.  `restore-keys` lets a run
  #     start from the newest previous corpus for its target even when the exact
  #     key misses, which it does on every run because the key carries the run
  #     number.  The corpus is a CACHE and never a gate input: a cold cache is
  #     normal and costs coverage, not correctness, so nothing here fails on one.
  #
  # fuzz/corpus/ and fuzz/artifacts/ are both already covered by .gitignore, so
  # neither the seed nor anything the fuzzer writes can be committed.
  # ---------------------------------------------------------------------------
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `reached` is the value the seed gate below requires at least one of this
          # target's committed seeds to report.  It is the target's own closed
          # vocabulary -- see fuzz/src/lib.rs -- and it differs by row because
          # "productive" differs: a decoder has to reach the end of a stream, the gz
          # layer has to complete a write-then-read cycle, and a checksum cannot be
          # refused at all so what matters there is a payload long enough for the
          # chunked and resumed answers to differ from the single-shot one.
          - name: Fuzz deflate
            target: fuzz_deflate
            slug: fuzz_deflate
            reached: stream_end

          - name: Fuzz inflate
            target: fuzz_inflate
            slug: fuzz_inflate
            reached: stream_end

          - name: Fuzz inflateBack
            target: fuzz_inflate_back
            slug: fuzz_inflate_back
            reached: stream_end

          - name: Fuzz gz round-trip
            target: fuzz_gz_roundtrip
            slug: fuzz_gz_roundtrip
            reached: round_trip

          - name: Fuzz checksums scalar
            target: fuzz_checksum
            slug: fuzz_checksum
            reached: compared

          # ★ THE SIMD ROW, and it is the only place the output-neutrality
          # requirement is executed rather than asserted in prose.
          #
          # fuzz_checksum's `check_simd_neutrality` compares the vectorised
          # Adler-32 and CRC-32 backends against the scalar ones directly, and it
          # is `#[cfg(feature = "simd")]` because the `Adler32Simd` and `Simd`
          # types only exist behind that feature.  `simd` is off by default in
          # both zlib-rs and libz-rs-sys, so the five rows above compile that
          # function AWAY: the requirement that the feature change speed and never
          # bytes had no executable check in CI at all, only a comment in the
          # target saying how to run one by hand.
          #
          # Same target, same 300 seconds, one extra feature.  The default row
          # stays because it is not redundant -- it is what proves the scalar
          # path, which is what ships by default -- and the two together are what
          # make the neutrality claim a measured property of every commit.
          - name: Fuzz checksums (simd)
            target: fuzz_checksum
            features: simd
            slug: fuzz_checksum_simd
            reached: compared

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      # ★ `rustfmt` AND `clippy` ARE REQUIRED COMPONENTS HERE, not conveniences.  The
      # "lint the fuzz workspace" step below runs `cargo +nightly fmt --all -- --check`
      # and `cargo +nightly clippy --all-targets -- -D warnings`, and this is the ONLY
      # place either reaches these five targets -- fuzz/ is excluded from the library
      # workspace, so the root `cargo fmt --all` and `cargo clippy --workspace` never see
      # them.  `--profile minimal` installs neither, so without naming them the step fails
      # with "'cargo-fmt' is not installed for the toolchain 'nightly'" -- reproduced
      # locally on exactly this invocation.  A runner that happens to ship a nightly
      # carrying them already would hide the omission, which is worse.
      #
      # The cargo-fuzz pin is asserted here for the same reason it is asserted in the
      # simd job: a fuzzer's harness ABI and its libFuzzer argument handling change
      # between versions, so the version that ran must be the version this workflow
      # claims ran.  `--force' makes the install authoritative when the runner image
      # already carries another cargo-fuzz, and the read-back is what covers the case
      # where the install cannot be done at all -- printing the version, which is what
      # this step used to do, proves nothing on its own.
      run: |
        set -eu
        rustup toolchain install nightly --profile minimal --component rustfmt,clippy
        CARGO_FUZZ_PIN=0.13.2
        cargo install cargo-fuzz --locked --force --version "$CARGO_FUZZ_PIN" \
          || echo "cargo install failed; the version already present is checked below"
        CARGO_FUZZ_HAVE=$(cargo fuzz --version | awk 'NR==1{print $2}')
        if [ "$CARGO_FUZZ_HAVE" != "$CARGO_FUZZ_PIN" ]; then
          echo "::error::cargo-fuzz is ${CARGO_FUZZ_HAVE:-absent} but this workflow pins" \
               "$CARGO_FUZZ_PIN; a fuzz run under another version is not the run this" \
               "job reports"
          exit 1
        fi
        echo "cargo-fuzz $CARGO_FUZZ_HAVE (pinned)"
        cargo +nightly fmt --version
        cargo +nightly clippy --version

    - name: Generate project files
      # Proves fuzz/Cargo.lock resolves with no drift, which cargo-fuzz cannot
      # be asked to do itself, and confirms the target name is one this crate
      # actually declares -- a typo would otherwise turn the gate into a
      # no-op-shaped error.
      run: |
        set -eu
        cargo +nightly fetch --locked
        mkdir -p target
        cargo +nightly fuzz list > target/targets.txt
        cat target/targets.txt
        grep -qx '${{ matrix.target }}' target/targets.txt || {
          echo "::error::${{ matrix.target }} is not a declared fuzz target"; exit 1; }
      working-directory: fuzz

    - name: Run test cases (lint the fuzz workspace)
      # THE ONLY PLACE THIS RUNS.  fuzz/ is excluded from the library
      # workspace, so the root `cargo clippy --workspace --all-targets` never
      # sees these five targets -- and they are the harnesses that consume
      # attacker-controlled input.  The lint set is declared locally in
      # fuzz/Cargo.toml, `undocumented_unsafe_blocks` included, and this step
      # is what turns those declarations into a gate.  `--all-targets` from
      # this directory reaches all five binaries.
      #
      # All five targets now carry `#![forbid(unsafe_code)]` and reach both
      # implementations through `zlib_rs_differential::{port, oracle}`, so
      # `undocumented_unsafe_blocks` is a backstop for a target added later
      # without the attribute rather than the mechanism holding the line.
      run: |
        set -eu
        cargo +nightly fmt --all -- --check
        cargo +nightly clippy --all-targets -- -D warnings

    - name: Restore the evolved corpus
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: fuzz/corpus/${{ matrix.target }}
        # The run number makes every key unique, so the exact key always misses
        # and the newest restore-key hit is what is used -- which is the documented
        # way to keep a cache that is written on every run rather than read once.
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          fuzz-corpus-${{ matrix.target }}-

    - name: Run test cases (the committed seeds match their generator)
      # fuzz/seeds/ is generated, so it can drift from the script that generates it.
      # `--check` writes nothing and fails on a seed that is missing, one that differs,
      # one this script does not account for, and -- most importantly -- a record whose
      # FIELD ORDER has moved, which silently turns every seed for that target back into
      # noise without changing a single seed byte.
      run: python3 seeds/generate.py --check
      working-directory: fuzz

    - name: Generate project files (seed the corpus)
      # TWO SEED SOURCES, and the order matters.
      #
      #   1. fuzz/seeds/${{ matrix.target }}/ -- PER-TARGET, and the reason this step
      #      was rewritten.  Every target here decodes a TYPED record through
      #      `arbitrary`, so an input file that is not a sensible encoding of that
      #      record does not fail: it decodes to a record whose windowBits is out of
      #      range or whose payload is empty, and the execution stops in the first
      #      refusal.  These files are encoded to `arbitrary`'s own rules and are known
      #      to reach real code -- the step after this one proves it every run.
      #   2. crates/zlib-rs-differential/corpus/minimal/ -- the ten committed fixtures,
      #      kept as MUTATION FODDER rather than as valid records.  Read as typed
      #      records they are nearly worthless, which is exactly the defect (1) fixes;
      #      but libFuzzer's mutators splice bytes across corpus entries, and real
      #      compressed and uncompressed data is useful material to splice from.  They
      #      cost a few hundred bytes and are not the floor any more.
      #
      # Staged rather than symlinked, because libFuzzer writes new inputs into the
      # corpus directory and must not write through into the committed files -- measured:
      # pointing it at fuzz/seeds/<target> directly left twenty-one generated inputs
      # inside the committed directory.  An existing file is left alone, so a corpus the
      # cache restored is never overwritten.  The `[ -e ]` test rather than `cp -n`:
      # recent coreutils warns that -n's behaviour is non-portable, and a warning in a
      # green log is a warning nobody reads.
      run: |
        set -eu
        TYPED="seeds/${{ matrix.target }}"
        FODDER=../crates/zlib-rs-differential/corpus/minimal
        C="corpus/${{ matrix.target }}"
        mkdir -p "$C"
        [ -d "$TYPED" ] || { echo "::error::the committed typed seeds $TYPED are missing"; exit 1; }
        [ -d "$FODDER" ] || { echo "::error::the committed fixtures $FODDER are missing"; exit 1; }
        typed=0
        for f in "$TYPED"/*.bin; do
          [ -f "$f" ] || continue
          typed=$((typed + 1))
          dest="$C/seed-$(basename "$f")"
          [ -e "$dest" ] || cp "$f" "$dest"
        done
        [ "$typed" -gt 0 ] || {
          echo "::error::$TYPED holds no .bin seeds, so this target has no typed seed at all"
          exit 1; }
        for f in "$FODDER"/*; do
          [ -f "$f" ] || continue
          dest="$C/fodder-$(basename "$f")"
          [ -e "$dest" ] || cp "$f" "$dest"
        done
        n=$(find "$C" -type f | wc -l | tr -d ' ')
        echo "corpus for ${{ matrix.target }}: $n input(s) before the run ($typed typed seed(s))"
        [ "$n" -gt 0 ] || { echo "::error::the corpus is empty even after seeding"; exit 1; }
      working-directory: fuzz

    - name: Run test cases (every committed seed is run, and one must reach real code)
      # ★ THE GATE THAT MAKES THE SEEDS MORE THAN A CLAIM.
      #
      # Each target prints one `FUZZ-REACHED ... reached=<word>` line per execution when
      # ZLIB_RS_FUZZ_REPORT is set (fuzz/src/lib.rs).  This runs every committed seed for
      # this row once, prints all of it, and requires the row's productive value --
      # `${{ matrix.reached }}` -- to appear at least once.
      #
      # What it catches is the failure `--check` cannot see: a record whose fields were
      # reordered still passes the generator's own comparison the moment the generator is
      # updated to match, but a seed built for the OLD order decodes to nothing.  Only
      # running it can tell.
      #
      # The seed files are passed INDIVIDUALLY rather than as a directory, and that is
      # required rather than tidy: libFuzzer treats a directory argument as a writable
      # corpus and fuzzes into it, which would both take 300 seconds and write generated
      # inputs into the committed tree.  Given files it runs each exactly once and writes
      # nothing.
      env:
        ZLIB_RS_FUZZ_REPORT: '1'
        FEATURES: ${{ matrix.features }}
        WANT: ${{ matrix.reached }}
      run: |
        set -euo pipefail
        mkdir -p target
        # shellcheck disable=SC2046  # deliberate: one argument per seed file
        set -- $(ls "seeds/${{ matrix.target }}"/*.bin)
        echo "running $# committed seed(s) for ${{ matrix.target }}"
        if [ -n "${FEATURES:-}" ]; then
          cargo +nightly fuzz run "${{ matrix.target }}" --features "$FEATURES" "$@" \
            2>&1 | tee target/seed-gate.log
        else
          cargo +nightly fuzz run "${{ matrix.target }}" "$@" 2>&1 | tee target/seed-gate.log
        fi

        # Two counts, and they are counted differently on purpose.
        #
        # `Executed <file> in <n> ms` is libFuzzer's own per-file line, so it is the
        # authority on whether every seed actually ran, and it must equal the number of
        # files handed over.  A seed that libfuzzer-sys refuses before the body runs --
        # it rejects any input shorter than the record's `size_hint().0` -- would be
        # missing from it.
        #
        # The report count is compared with `-ge` rather than `-eq`, and that was
        # MEASURED rather than conceded: fuzz_gz_roundtrip prints one extra line per
        # process, because libFuzzer re-executes the first unit when its leak detector
        # wants a second look, and that target opens file handles. Four other targets
        # report exactly one line per file. So the invariant that holds everywhere is "at
        # least one report per seed", and an execution that reported nothing at all is
        # what this is really guarding against.
        executed=$(grep -c '^Executed ' target/seed-gate.log || true)
        if [ "$executed" -ne "$#" ]; then
          echo "::error::$# seed(s) were handed to libFuzzer but it reported executing" \
               "$executed. A seed shorter than the record's size_hint is refused before" \
               "the target body runs, which is the usual cause."
          exit 1
        fi
        lines=$(grep -c '^FUZZ-REACHED ' target/seed-gate.log || true)
        if [ "$lines" -lt "$#" ]; then
          echo "::error::$# seed(s) ran but only $lines reported a reached= value, so at" \
               "least one execution left through a path that does not report. Every exit" \
               "from the target body must report, or this gate cannot see what a seed did."
          exit 1
        fi
        productive=$(grep -c "reached=$WANT" target/seed-gate.log || true)
        echo "seed gate: $executed seed(s) executed, $lines report(s), $productive reached '$WANT'"
        if [ "$productive" -lt 1 ]; then
          echo "::error::not one committed seed for ${{ matrix.target }} reached" \
               "'$WANT'. The corpus this row starts from therefore exercises only" \
               "refusal paths, which is the defect fuzz/seeds/ exists to prevent." \
               "Regenerate the seeds with fuzz/seeds/generate.py -- most likely the" \
               "target's input record changed shape -- and confirm the new ones report" \
               "'$WANT' before relying on this row again."
          exit 1
        fi
      working-directory: fuzz

    - name: Run Fuzzers
      env:
        FEATURES: ${{ matrix.features }}
      # The feature list is threaded through the environment rather than
      # interpolated into the command, so that a row without one produces the
      # bare invocation instead of a stray empty `--features` argument -- which
      # cargo rejects.
      run: |
        set -eu
        if [ -n "${FEATURES:-}" ]; then
          echo "running ${{ matrix.target }} with --features $FEATURES"
          cargo +nightly fuzz run ${{ matrix.target }} --features "$FEATURES" \
            -- -max_total_time=300
        else
          echo "running ${{ matrix.target }} with the default feature set"
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
        fi
      working-directory: fuzz

    - name: Run test cases (report the corpus growth)
      # Not a gate -- a fuzzer that finds no new input in 300 seconds on a mature
      # corpus is doing its job -- but the number belongs in the log, because a
      # corpus that never grows across many runs is the signal that the cache or
      # the seed has stopped working.
      run: |
        set -eu
        n=$(find "corpus/${{ matrix.target }}" -type f | wc -l | tr -d ' ')
        echo "corpus for ${{ matrix.target }}: $n input(s) after the run"
      working-directory: fuzz

    - name: Clean up scratch directories
      # fuzz_gz_roundtrip creates one private directory per process under TMPDIR and
      # CANNOT remove it on the way out: the target carries `#![forbid(unsafe_code)]` so
      # `atexit` is unavailable, statics are never dropped, and libFuzzer leaves through
      # `exit()`. It sweeps directories belonging to DEAD processes on the way *in*, which
      # bounds the accumulation on a long-lived host, but the last run of any sequence
      # always leaves its own behind. This step is the other half of that policy: the
      # runner is ephemeral so nothing here matters for correctness, but leaving the
      # cleanup implicit is how a developer's own /tmp fills up, and a workflow that
      # documents the rule is what makes the rule discoverable.
      #
      # `if: always()` because a crashing fuzz run is exactly when the directory is most
      # likely to be left behind, and the counts printed below are the evidence that the
      # in-process sweep is doing its job.
      if: always()
      run: |
        set -eu
        SCRATCH="${TMPDIR:-/tmp}"
        before=$(find "$SCRATCH" -maxdepth 1 -type d -name 'zlib-rs-fuzz-gz-*' 2>/dev/null | wc -l | tr -d ' ')
        find "$SCRATCH" -maxdepth 1 -type d -name 'zlib-rs-fuzz-gz-*' -exec rm -rf {} + 2>/dev/null || true
        after=$(find "$SCRATCH" -maxdepth 1 -type d -name 'zlib-rs-fuzz-gz-*' 2>/dev/null | wc -l | tr -d ' ')
        echo "scratch directories under $SCRATCH: $before before, $after after"

    - name: Upload Crash
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      # `slug` rather than `target`, because two rows now drive the same target
      # and an artifact name may not repeat within a workflow run.
      with:
        name: fuzz-artifacts-${{ matrix.slug }}
        path: |
          fuzz/artifacts/
          fuzz/corpus/${{ matrix.target }}/
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 13. The CMake build of the Rust library, end to end.
  #
  # README-cmake.md tells a consumer to configure with -DZLIB_BUILD_RUST=ON, and
  # the root CMakeLists.txt carries the cargo invocation, the versioned symlink
  # chain, the install rules, the generated pkg-config file and the exported
  # targets that make that work.  `cargo build` exercises none of it, so without
  # this job every one of those could break with the workflow still green.
  # ---------------------------------------------------------------------------
  cmake-rust:
    # -------------------------------------------------------------------------
    # Run end to end, in the order a consumer meets it: configure, build, ctest,
    # install, then compile and RUN a C program against the installation through
    # pkg-config, against the static archive, and through find_package.  That
    # last part is the part that matters -- a library that installs but cannot be
    # consumed has not been delivered.
    # -------------------------------------------------------------------------
    name: CMake Rust build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Install packages (Linux)
      run: cmake --version && cc --version

    - name: Generate project files
      # ZLIB_RUST_TARGET_DIR is left at its default on purpose: the nested
      # add_subdirectory fixtures in test/CMakeLists.txt forward whatever this
      # configure resolves, so the default exercises the sharing that keeps the
      # nested cargo invocations from re-probing the target triple.
      run: |
        set -eu
        cmake -S . -B build-rust \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_RUST=ON \
          -DZLIB_BUILD_TESTING=ON \
          -DCMAKE_INSTALL_PREFIX="$PWD/stage-rust"

    - name: Compile source code
      run: cmake --build build-rust --parallel 2

    - name: Run test cases
      # stdin is redirected because ctest runs nested cmake/cargo invocations and
      # a test process that inherits a consumed stdin is a genuine, if obscure,
      # source of flakiness.  The nested trees share this build's cargo directory,
      # which is what actually keeps them deterministic; this is hygiene.
      run: ctest --test-dir build-rust --output-on-failure --parallel 2 < /dev/null

    - name: Run test cases (source consumption with installation off)
      # ★ A SECOND CONFIGURE, because -DZLIB_INSTALL=OFF is a legitimate way to
      # consume this project and nothing executed it.
      #
      # test/CMakeLists.txt divides its consumers in two.  The install consumers
      # resolve a package or a descriptor out of a prefix the suite installs into, so
      # they are registered only when there is an installation to consume.  The two
      # add_subdirectory consumers do the opposite: they re-configure zlib from the
      # source tree inside a nested project and link what that produces, which has
      # nothing to do with installing -- and which AAP 0.8.3 names as the integration
      # fixture that must keep resolving ZLIB::ZLIB and ZLIB::ZLIBSTATIC to the RUST
      # artifacts.  They are therefore registered unconditionally.
      #
      # Registering them unconditionally is only half of it, and the missing half is
      # what this step guards.  The nested CMakeLists.txt they read used to be
      # configured inside `if(ZLIB_INSTALL)', so with the option off the files did not
      # exist, `-S .../add_subdirectory_test' named a missing directory, and both
      # chains failed at configure time -- measured: 0% of 2 passing, with four
      # dependents unrun.  The producers now sit above the guard, and this step is what
      # keeps them there.
      #
      # Deliberately asserts both directions: the source-consumption cases must be
      # present AND pass, and the install-consuming cases must be absent rather than
      # present-and-failing.
      run: |
        set -eu
        cmake -S . -B build-rust-noinstall \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_RUST=ON \
          -DZLIB_BUILD_TESTING=ON \
          -DZLIB_INSTALL=OFF
        cmake --build build-rust-noinstall --parallel 2

        ctest --test-dir build-rust-noinstall -N > noinstall-cases.txt
        cat noinstall-cases.txt

        # The six source-consumption cases: two configure, two build, two test.
        found=$(grep -cE 'zlib_add_subdirectory' noinstall-cases.txt || true)
        if [ "$found" -ne 6 ]; then
          echo "::error::expected the 6 add_subdirectory cases with ZLIB_INSTALL=OFF," \
               "found $found. Source consumption does not depend on installing, so" \
               "these must be registered in this configuration."
          exit 1
        fi
        # And the install consumers must not be registered, because they cannot pass.
        install_cases=$(grep -cE 'zlib_install|zlib_find_package|zlib_static_link_closure|loader_binding_installed' \
          noinstall-cases.txt || true)
        if [ "$install_cases" -ne 0 ]; then
          echo "::error::$install_cases install-consuming case(s) are registered with" \
               "ZLIB_INSTALL=OFF. Nothing is installed in this configuration, so each of" \
               "them would fail and make a legitimate configuration look broken."
          exit 1
        fi

        ctest --test-dir build-rust-noinstall --output-on-failure --parallel 2 < /dev/null

    - name: Run test cases (install and consume the installation)
      run: |
        set -eu
        cmake --install build-rust

        echo "== installed tree =="
        find stage-rust -maxdepth 3 \( -type f -o -type l \) | sort

        # The versioned symlink chain is not cosmetic.  Cargo emits only
        # libz.so; the SONAME is libz.so.1, so the loader looks for a file with
        # that exact name and, finding none, silently binds the SYSTEM zlib
        # instead.  Assert the whole chain resolves to one real file.
        for name in libz.so libz.so.1; do
          test -L "stage-rust/lib/$name" \
            || { echo "::error::stage-rust/lib/$name is not a symlink"; exit 1; }
        done
        real="$(readlink -f stage-rust/lib/libz.so)"
        echo "libz.so resolves to $real"
        case "$real" in
          *"$PWD/stage-rust/lib/"*) ;;
          *) echo "::error::libz.so resolves outside the installation: $real"
             exit 1 ;;
        esac
        readelf -d "$real" | grep -i soname

        # pkg-config must still advertise a usable -lz, including the private
        # native libraries the Rust staticlib needs.
        export PKG_CONFIG_PATH="$PWD/stage-rust/lib/pkgconfig"
        echo "== zlib.pc =="
        cat "$PKG_CONFIG_PATH/zlib.pc"
        pkg-config --exists zlib
        echo "shared cflags/libs: $(pkg-config --cflags --libs zlib)"
        echo "static libs:        $(pkg-config --static --libs zlib)"

        # ★ THE FLAGS GO INTO ARRAYS AND ARE EXPANDED QUOTED.  pkg-config answers a
        # list of shell WORDS, and an earlier revision pasted it into the two `cc'
        # command lines as a bare `$(...)' -- shellcheck SC2046 twice.  Unquoted
        # command substitution re-splits on IFS AND glob-expands, so a flag
        # containing a `*' or a directory with a space in it would have produced a
        # compiler invocation nobody wrote.  `read -r -a' does the one split that is
        # wanted, once, and `"${arr[@]}"' passes each element as exactly one
        # argument thereafter.
        #
        # There is one thing an array cannot repair, so it is asserted instead: a
        # path containing whitespace cannot be expressed through a .pc file's
        # Libs:/Cflags: lines at all without shell quoting that only `eval' would
        # honour.  Rather than appear to handle it, this fails and says so.  On a
        # hosted runner $PWD is the workspace and has none.
        case "$PWD" in
          *[[:space:]]*)
            echo "::error::the workspace path contains whitespace ($PWD), which cannot" \
                 "survive a pkg-config Libs:/Cflags: line; this gate cannot be trusted here"
            exit 1 ;;
        esac
        read -r -a ZLIB_PC_SHARED <<< "$(pkg-config --cflags --libs zlib)"
        read -r -a ZLIB_PC_STATIC_L <<< "$(pkg-config --static --libs-only-l zlib)"

        # A C consumer, compiled against the installed header and linked against
        # the installed library, must run and report the Rust library's version.
        cat > consumer.c <<'CONSUMER'
        #include <stdio.h>
        #include <string.h>
        #include "zlib.h"
        int main(void) {
            unsigned char packed[64];
            unsigned char back[64];
            uLong packed_len = (uLong)sizeof(packed);
            uLong back_len = (uLong)sizeof(back);
            const char *text = "cmake rust consumer";
            if (compress(packed, &packed_len, (const Bytef *)text,
                         (uLong)strlen(text) + 1) != Z_OK) return 1;
            if (uncompress(back, &back_len, packed, packed_len) != Z_OK) return 2;
            if (strcmp((const char *)back, text) != 0) return 3;
            printf("zlibVersion=%s roundtrip=ok compiled=%s\n",
                   zlibVersion(), ZLIB_VERSION);
            return 0;
        }
        CONSUMER

        cc -o consumer-shared consumer.c "${ZLIB_PC_SHARED[@]}" \
          -Wl,-rpath,"$PWD/stage-rust/lib"
        echo "== ldd consumer-shared =="
        ldd ./consumer-shared | grep libz
        # The whole point of the exercise: the binding must be the Rust artifact.
        ldd ./consumer-shared | grep -q "$PWD/stage-rust/lib/libz.so.1" \
          || { echo "::error::the consumer did not bind the installed Rust libz"
               exit 1; }
        ./consumer-shared

        # -lz is dropped WORD-WISE rather than by substring.  The archive is given
        # by path on this line, so the -l form of it must not also be searched for;
        # the `sed 's/-lz//'` this replaces would have edited any other flag that
        # merely contained those three characters -- `-lzstd' would have become
        # `std' -- which is exactly the class of accident an array avoids.
        ZLIB_PC_PRIVATE=()
        for zlib_pc_flag in "${ZLIB_PC_STATIC_L[@]}"; do
          if [ "$zlib_pc_flag" != "-lz" ]; then
            ZLIB_PC_PRIVATE+=("$zlib_pc_flag")
          fi
        done
        if [ "${#ZLIB_PC_PRIVATE[@]}" -eq 0 ]; then
          echo "::error::pkg-config --static --libs-only-l answered nothing but -lz, so the" \
               "native libraries a Rust staticlib needs are not being advertised"
          exit 1
        fi
        echo "static private set: ${ZLIB_PC_PRIVATE[*]}"
        cc -o consumer-static consumer.c -I stage-rust/include \
          stage-rust/lib/libz.a "${ZLIB_PC_PRIVATE[@]}"
        ./consumer-static

        # find_package against the installed config package.
        mkdir -p consume-cmake && cd consume-cmake
        cat > CMakeLists.txt <<'FINDPKG'
        cmake_minimum_required(VERSION 3.12)
        project(consume C)
        find_package(ZLIB REQUIRED CONFIG)
        add_executable(consume ../consumer.c)
        target_link_libraries(consume PRIVATE ZLIB::ZLIB)
        FINDPKG
        cmake -S . -B build -DCMAKE_PREFIX_PATH="$PWD/../stage-rust" >/dev/null
        cmake --build build --parallel 2 >/dev/null
        ./build/consume

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: cmake-rust
        path: |
          build-rust/CMakeFiles/CMakeConfigureLog.yaml
          build-rust/Testing/Temporary/LastTest.log
        retention-days: 7

  # ---------------------------------------------------------------------------
  # 14. The criterion regression gate: throughput, and per-stream memory.
  # the COMMITTED MINIMAL CORPUS.
  #
  # READ THIS BEFORE CITING THIS JOB, AND READ WHICH OF ITS TWO SHAPES YOU ARE
  # CITING.  By default it is a regression gate on the fixtures in
  # crates/zlib-rs-differential/corpus/minimal/ , and in that shape it is NOT the
  # Silesia acceptance measurement that AAP 0.8.4 names.  The two shapes are:
  #
  #   UNARMED (every ordinary push and pull request, and what the badge shows).
  #     The repository variable ZLIB_RS_SILESIA_SHA256 is unset, so the cache step
  #     below is skipped and ZLIB_RS_SILESIA_DIR names nothing.  The benches'
  #     `deflate_silesia` and `inflate_silesia` groups print an explicit skip and
  #     contribute no gated case, and every gated number comes from the committed
  #     minimal corpus.
  #   ARMED (deliberate, by a maintainer).  Setting the repository variable
  #     ZLIB_RS_SILESIA_SHA256 -- and populating the silesia-<digest> cache once,
  #     or pointing ZLIB_RS_SILESIA_DIR at a provisioned copy -- makes those two
  #     groups RUN, and the gate then reads and enforces their summaries too.
  #     ZLIB_RS_SILESIA_REQUIRED=1 additionally turns absence into a failure
  #     instead of a skip, which the refusal step below proves still works.
  #
  # WHAT NEITHER SHAPE DOES IS FETCH.  AAP 0.6.4.4 requires CI to be network-free
  # and makes the Silesia tier opt-in, fetched by a human running
  # corpus/fetch_silesia.sh with a pinned SHA-256.  Nothing here downloads a
  # corpus: the cache step is restore-only, and the only invocation of that script
  # anywhere in CI is `--verify-only`, which checks a corpus somebody else
  # provisioned and never obtains one.  So an armed run is still an off-CI
  # acquisition followed by an on-CI measurement -- while what runs unarmed is the
  # thing that catches a regression on every push.
  #
  # The two are not interchangeable and the difference is not cosmetic: the
  # committed fixtures are kilobytes, so they exercise the encoder and decoder
  # but not the cache behaviour a multi-megabyte input does.  A change that
  # passed here could still miss the AAP 0.8.4 target on Silesia.  What this job
  # guarantees is that a gated case whose ratio worsens past the limit fails the
  # build, and that a run which measured NOTHING fails too -- see the "gate that
  # measured nothing must not report success" check in the parser.
  #
  # The three bench files are explicit that they REPORT and never enforce --
  # "the pass/fail decision belongs to the criterion regression job that
  # AAP 0.4.1.6 places in .github/workflows/rust.yml" -- so THIS STEP IS THE
  # DECISION.  If it is ever softened, nothing anywhere reads the numbers.
  #
  # WHAT THIS STEP DOES AND DOES NOT DECIDE.  AAP 0.8.4 states the throughput
  # targets over the SILESIA corpus, and AAP 0.6.4.6 reads them from its
  # multi-megabyte members.  This job PROVISIONS no corpus -- CI stays
  # network-free -- so on an UNARMED run the summaries it gates are the ones
  # produced from the committed minimal corpus and the Silesia groups skip with a
  # note.  Treat a green unarmed run as the continuous-integration signal that the
  # port has not regressed against the in-process C oracle on the fixtures
  # available, NOT as the acceptance measurement AAP 0.8.4 names.
  #
  # The acceptance measurement needs the corpus to have been obtained by a human
  # running crates/zlib-rs-differential/corpus/fetch_silesia.sh with a pinned
  # SHA-256.  Once it has been, this same gate can read it: with the corpus
  # restored from the silesia-<digest> cache or named by ZLIB_RS_SILESIA_DIR, the
  # `deflate_silesia` and `inflate_silesia` groups appear in this log and their
  # summary lines are gated exactly like the minimal ones.  So the groups are
  # absent by CONFIGURATION rather than by construction, and an armed run is the
  # AAP 0.8.4 measurement taken under this gate.  Read the log: the parser prints
  # which groups it found, and no minimal-corpus case ever stands in for a Silesia
  # one.
  #
  # The limits this step enforces on what it does see: throughput within 10% of
  # the C implementation for decompression and for compression at levels 1, 6
  # and 9, and per-stream memory within 15%.
  #
  # ★ `benches/checksum_bench.rs` IS gated here, and this comment used to say it
  # was not.  Most of that suite is still an informational backend comparison
  # whose rows are read by hand -- a checksum is one scalar however it is
  # computed, so there is no output fidelity to trade against speed and neither
  # of AAP 0.8.4's two throughput targets is about it.  What is enforced is a
  # different question the throughput suites cannot answer: **is the optional
  # `simd` feature worth compiling in?**  Its `crc32_acceptance` and
  # `adler32_acceptance` groups answer it with `BACKEND` and `BACKEND-SUMMARY`
  # lines, and the gate fails this job on two conditions per backend family --
  # the feature-on backend may not be slower than the scalar path it displaces at
  # any measured length, and it must be at least 10% faster at one of them.  The
  # second condition is the one that matters: without it a backend that merely
  # forwarded to its baseline would satisfy the first perfectly and the gate would
  # certify a no-op.  A run without the feature prints both summary lines with
  # `expected=0` and is a pass, which is why the `--features simd` row of the
  # matrix below is the one that carries this verdict.
  # Both gated numbers come out of the summary lines the benches print to
  # stderr:
  #
  # ★ WHAT THIS GATE READS, AND WHY IT IS NOT JUST `over`.
  #
  # The benches print two kinds of number, and only one of them can carry a
  # verdict.  The `RATIO` lines are a self-timed diagnostic -- a couple of
  # milliseconds per side, nine paired order-alternating rounds, medians reported
  # with the worst round beside them as `ratio_hi`, no outlier rejection and no
  # confidence interval -- and both bench headers say so in as many words.  The gate
  # therefore treats every `over` on those lines as a WARNING in every tier, however
  # authoritative the group: a figure the log itself labels `self_timed=diagnostic`
  # cannot be allowed to fail a build before `authority=criterion` is consulted.
  # What the gate does enforce from those lines is the PROTOCOL that produced them --
  # `order=alternating`, `rounds=` at or above nine, `registration=alternating`, and
  # `ratio` equal to its own `port_ns / oracle_ns` -- so a log produced by a sampler
  # that timed one side to completion and then the other is refused rather than
  # gated.  The measurement the
  # performance targets name is criterion's, and criterion writes it to disk:
  # `<root>/<group>/<label>/<case>/new/estimates.json`, one file per side per case,
  # with `slope` and `mean` point estimates in nanoseconds.  So this gate decides
  # from criterion's estimates and uses the log lines to know WHICH pairs to read
  # and which of them clear the size floor.  A gate built on the self-timed
  # numbers alone would be enforcing a limit against a figure the file that prints
  # it calls indicative.
  #
  # The log lines it consumes, all anchored on the `<name>_bench: ` prefix because
  # the benches also print their own format documentation and that prose contains
  # the literal text RATIO-SUMMARY inside backticks:
  #
  # `over` counts ONLY the gated cases, so reading it is reading the limit
  # rather than an average over cases the limit was never meant for: sub-page
  # payloads are measured and printed with their own verdict but marked
  # gate=informational, because a few hundred nanoseconds of entry validation
  # and stream reset is not a bytes-per-second bound.
  # `verdict=dirty` on an ALLOC-BALANCE line means deflateEnd did not return
  # every block, a block came back out of LIFO order, or a pointer the counter
  # never handed out was freed through it -- the same class of defect
  # test/infcover.c's mem_done() looks for, here measured through the
  # instrumented zalloc high-water counter that AAP 0.6.4.6 names.
  #
  # ★ AND WHY THE STRUCTURAL CHECKS ARE THE POINT.  `over=0` is what a clean run
  # prints AND what a run that measured nothing prints.  The previous gate read
  # `over` with a default of 0, accepted any set of summary lines as long as one of
  # each kind existed, and treated every group's `over` as fatal -- so a bench
  # whose corpus failed to load passed it, while a regression in an ancillary
  # group that the performance targets say nothing about failed it.  This gate
  # therefore asserts, before it looks at a single ratio:
  #
  # NO CORPUS IS DOWNLOADED, HERE OR ANYWHERE IN THIS FILE -- and that is now a
  # property of the steps rather than a claim above them.  The Silesia corpus the
  # performance targets name is opt-in (AAP 0.6.4.4): crates/zlib-rs-differential/
  # corpus has a script for a human to run, and the benches skip their tier-2
  # groups with an explicit message and exit zero when it is absent.  This file
  # invokes that script in exactly TWO modes, `--pin-status` and `--verify-only`,
  # neither of which fetches or writes anything; it never invokes it in fetching
  # mode, and when a pinned corpus is expected and does not turn up the job FAILS
  # instead of downloading it -- on the designated release runner unconditionally,
  # and on a hosted runner as a warning, because a hosted runner's throughput
  # verdict is informational anyway.  `--pin-status` reads the committed
  # `corpus/silesia.pin`, which is what decides whether the acceptance tier is
  # armed at all; it used to be decided by an optional repository variable that
  # nobody had to set.  Provisioning happens outside the workflow.  So the tier-1
  # gate below always reads measurements of the committed minimal corpus, and the
  # tier-2 acceptance measurement of AAP 0.8.4 is taken only in the armed steps at
  # the end of this job -- announced, never silently skipped.
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmark ${{ matrix.label }}
    # ★ A SELF-HOSTED RUNNER IS REACHABLE ONLY FROM TRUSTED EVENTS, AND NEVER FROM A
    # PULL REQUEST.  This was `${{ vars.ZLIB_RS_BENCH_RUNNER || 'ubuntu-latest' }}',
    # which applies on every trigger -- so setting that repository variable to a
    # persistent machine, which is the whole reason a project sets it (a hosted
    # runner's throughput numbers are too noisy for a 10% gate), silently routed
    # PULL-REQUEST CODE onto it.  A pull request runs an arbitrary contributor's
    # benches, their build scripts and, through crates/zlib-rs-differential, their C
    # oracle sources; on an ephemeral hosted runner that costs a container, and on a
    # persistent self-hosted one it is code execution on a machine that keeps its
    # filesystem, its cargo registry cache and its credentials between jobs.
    #
    # The condition is an ALLOWLIST rather than "not a pull request", so a trigger
    # added to `on:` later does not inherit the self-hosted runner by default:
    #
    #   schedule           GitHub runs it only on the default branch
    #   workflow_dispatch  requires write access to the repository to invoke
    #   push               and only to the default branch, which is protected
    #
    # Anything else -- pull_request today, anything added tomorrow -- gets
    # ubuntu-latest.  The first step of the job asserts the outcome as well, so an
    # edit to this expression that reopened the hole would fail rather than pass
    # quietly.  A PR's numbers are then hosted-runner numbers, which is the correct
    # trade: the throughput gate's verdict is advisory on a noisy runner, and the
    # comparison is against the C oracle measured in the same process on the same
    # machine, so a shared slowdown affects both sides.
    runs-on: >-
      ${{ (github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)))
      && vars.ZLIB_RS_BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: bench-scalar
            profile: bench
            features: ''

          - label: bench-parity-scalar
            profile: bench-parity
            features: ''

          - label: bench-simd
            profile: bench
            features: '--features simd'

    # ★ THE MATRIX IS APPLIED, and until this block existed it was not.  All three
    # rows ran one identical command, so `profile` and `features` were decoration:
    # `bench-parity-scalar` measured the fat-LTO build and `bench-simd` measured the
    # scalar one, and the AAP 0.8.4 rule that a case is decided on the STRONGER of the
    # two profiles' ratios was therefore reading the same number twice.  Every bench
    # invocation below now passes `--profile ${{ matrix.profile }}` and
    # `${{ matrix.features }}`.
    #
    # ZLIB_RS_BENCH_RUST_PROFILE is the declaration the differential crate's build
    # script cross-checks and bakes in, so a log states which profile produced it.
    #
    # CRITERION_HOME is ABSOLUTE and deliberately so.  criterion resolves its default
    # output directory relative to the bench process's working directory, which is the
    # host package's directory -- `benches/` -- while every path in this job is
    # relative to the repository root.  Setting it here pins criterion, the suites'
    # own published `CRITERION root=` path and the gate below to one directory by
    # construction, instead of to three plausible ones.
    env:
      ZLIB_RS_BENCH_RUST_PROFILE: ${{ matrix.profile }}
      CRITERION_HOME: ${{ github.workspace }}/target/criterion

    steps:
    - name: Verify the runner is permitted for this event
      # ★ THE RUNNER SELECTION IS ASSERTED, NOT ASSUMED, and it runs BEFORE the
      # checkout so that no repository content has executed on the machine when the
      # decision is checked.  `runs-on` above allows a self-hosted runner for three
      # trusted events only; this turns that into a gate, so that an edit which
      # reopened the hole -- or a runner label that resolves to a self-hosted machine
      # for some other reason -- fails here instead of running a contributor's build
      # scripts on a persistent host.  `runner.environment` is `github-hosted` or
      # `self-hosted` and is supplied by the runner itself, so it cannot be spoofed
      # by the expression that chose it.
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        TRIGGERING_EVENT: ${{ github.event_name }}
      run: |
        set -eu
        echo "event=$TRIGGERING_EVENT runner=$RUNNER_ENVIRONMENT"
        case "$TRIGGERING_EVENT" in
          schedule|workflow_dispatch|push) ;;
          *)
            if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
              echo "::error::a $TRIGGERING_EVENT event is running on a" \
                   "$RUNNER_ENVIRONMENT runner; untrusted code must only reach" \
                   "ephemeral GitHub-hosted runners.  Check the runs-on expression" \
                   "on the bench job."
              exit 1
            fi ;;
        esac

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # SEC hardening: the job needs the tree, never the credential.  See the
        # `permissions` block at the top of this file.
        persist-credentials: false

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Install packages (Linux)
      # The benches measure the port against the in-process C oracle, so the
      # differential crate's build.rs needs a C compiler here too.
      run: cc --version

    - name: Generate project files (classify the runner, and decide what its numbers can decide)
      id: runner-class
      # -----------------------------------------------------------------------
      # ★ A HOSTED VM IS NOT A RELEASE GATE AT A 10% TOLERANCE, and until this
      # step existed this job pretended otherwise.
      #
      # `runs-on` resolves to `ubuntu-latest` unless the repository variable
      # ZLIB_RS_BENCH_RUNNER names something else, so the default is a shared
      # cloud VM with: no CPU pinning, no control of the frequency governor or
      # of turbo, an unknown and varying number of noisy neighbours on the
      # physical host, and no way to observe any of it.  The measured
      # consequence, on a machine of exactly that class, was two consecutive
      # runs of one unchanged binary reading 1.185 and 1.110 for the same case
      # -- a 6.8% swing with no code change at all, against a limit of 10%.
      # A gate whose noise floor is most of its tolerance does not distinguish a
      # regression from a neighbour, and calling its verdict authoritative makes
      # every green run of it evidence of nothing.
      #
      # So the verdict is now a property of the RUNNER rather than of the
      # workflow.  This step classifies the machine and publishes
      # `authoritative=true|false`, which every gating step below reads:
      #
      #   * On the designated runner -- the one ZLIB_RS_BENCH_RUNNER names, which
      #     is a repository variable and therefore settable only by someone with
      #     repository admin -- the gate FAILS the job on a throughput overrun.
      #     That machine is expected to be dedicated: one job at a time, a fixed
      #     governor, and the corpus provisioned. What "expected" means is
      #     recorded in the checks below, which report what they can actually
      #     observe rather than asserting what they cannot.
      #   * On a hosted runner the same overrun is a WARNING and the job stays
      #     green.  The numbers are still produced, still published and still
      #     read by a human; what they no longer do is fail a required check on
      #     the strength of a measurement the machine cannot make.
      #
      # This is not a way to let a regression through.  It is the difference
      # between a gate that means something and a gate that is ignored because it
      # is flaky -- and the latter is how a real regression actually gets
      # shipped.
      # -----------------------------------------------------------------------
      env:
        # ★ Through `env:`, not `${{ }}` in the body. A GitHub expression is
        # substituted TEXTUALLY before the shell parses the line, so a repository
        # variable whose value contained a quote would break out of the assignment it
        # was substituted into. An `env:` value is handed to the process as an
        # environment string and is never parsed as shell. Repository variables are
        # admin-settable rather than attacker-settable, so this is defence in depth --
        # but it costs one line and removes the class entirely.
        ZLIB_RS_BENCH_RUNNER_NAME: ${{ vars.ZLIB_RS_BENCH_RUNNER }}
        # ★ THE SAME EXPRESSION THIS JOB'S `runs-on` USES, evaluated again here so the
        # classification can be made from what was actually SELECTED rather than from
        # what is merely configured.  That distinction was the bug: the test was
        # `[ -n "$ZLIB_RS_BENCH_RUNNER_NAME" ]`, and that variable is a repository
        # variable which is nonempty on EVERY event once an admin sets it -- including
        # a pull request, where `runs-on` deliberately resolves to `ubuntu-latest`.
        # So every PR bench job announced "designated ... overruns FAIL this job" and
        # gated a 10% limit on a hosted runner measured at a 6.8% run-to-run swing,
        # which is precisely the outcome the paragraph above says it exists to prevent.
        #
        # Keep this expression identical to `runs-on`.  The consistency check below
        # is what enforces that: if the two ever disagree about which machine this is,
        # the job fails rather than guessing.
        ZLIB_RS_BENCH_RUNNER_SELECTED: >-
          ${{ (github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
          && github.ref == format('refs/heads/{0}',
          github.event.repository.default_branch)))
          && vars.ZLIB_RS_BENCH_RUNNER || 'ubuntu-latest' }}
        # What the runner says about ITSELF: `github-hosted`, `self-hosted`, or a
        # future value.  This is the third, independent axis -- a label can name
        # anything, so the label alone cannot prove the machine is not hosted.
        ZLIB_RS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ZLIB_RS_EVENT_NAME: ${{ github.event_name }}
      run: |
        set -eu
        configured=${ZLIB_RS_BENCH_RUNNER_NAME:-}
        selected=${ZLIB_RS_BENCH_RUNNER_SELECTED:-}
        environment=${ZLIB_RS_RUNNER_ENVIRONMENT:-}
        event=${ZLIB_RS_EVENT_NAME:-}
        echo "event=$event selected-runner=$selected runner.environment=$environment"
        echo "configured ZLIB_RS_BENCH_RUNNER=${configured:-(unset)}"

        # AUTHORITY REQUIRES ALL THREE, and each one rules out a different way of
        # being wrong:
        #
        #   1. the event is one the allowlist admits          -- a PR cannot claim it
        #   2. `runs-on` selected the DESIGNATED runner       -- not `ubuntu-latest`
        #   3. the runner reports itself as not github-hosted -- the label is not a
        #                                                        promise about the host
        #
        # Any one of them failing makes the numbers informational.  That is the
        # conservative direction: a machine that cannot measure to 10% must not fail a
        # required check, and a machine that can is opted into deliberately.
        authoritative=false
        reason=
        if [ -z "$configured" ]; then
          reason="ZLIB_RS_BENCH_RUNNER is unset, so there is no designated runner"
        elif [ "$selected" = "ubuntu-latest" ] || [ "$selected" != "$configured" ]; then
          reason="event '$event' selected '$selected' rather than the designated '$configured'"
        elif [ "$environment" = "github-hosted" ]; then
          reason="the selected runner reports runner.environment=github-hosted"
        elif [ -z "$environment" ]; then
          reason="runner.environment is empty, so this machine's class cannot be established"
        else
          authoritative=true
        fi

        if [ "$authoritative" = "true" ]; then
          echo "runner: designated ($selected, runner.environment=$environment) --"
          echo "runner: throughput overruns FAIL this job"
        else
          echo "::notice::this job's throughput numbers are INFORMATIONAL: an overrun is"
          echo "::notice::reported and does not fail the job, because $reason."
          echo "::notice::Set the ZLIB_RS_BENCH_RUNNER repository variable to a dedicated"
          echo "::notice::self-hosted runner and trigger this job from schedule,"
          echo "::notice::workflow_dispatch, or a push to the default branch to make it an"
          echo "::notice::authoritative gate."
        fi
        echo "authoritative=$authoritative" >> "$GITHUB_OUTPUT"

        # The consistency assertion that keeps the duplicated expression honest.  A
        # self-hosted machine reached from an event the allowlist does not admit would
        # mean `runs-on` and the `env:` expression above have drifted apart, and that
        # is the exact shape of the hole the allowlist closed -- so it fails loudly
        # rather than being absorbed into "informational".
        case "$event" in
          schedule|workflow_dispatch|push) trusted=true ;;
          *) trusted=false ;;
        esac
        if [ "$trusted" = "false" ] && [ "$environment" != "github-hosted" ] \
           && [ -n "$environment" ]; then
          echo "::error::event '$event' is not in the allowlist, yet this job is running"
          echo "::error::on a runner reporting runner.environment=$environment. The"
          echo "::error::runs-on expression and the ZLIB_RS_BENCH_RUNNER_SELECTED"
          echo "::error::expression have drifted apart, which is how untrusted code"
          echo "::error::reaches a persistent machine. Make them identical again."
          exit 1
        fi

        # ★ MEASUREMENT-ALTERING FLAGS ARE REJECTED, not merely discouraged.
        #
        # RUSTFLAGS reaches the compiler for both the port and the in-process C
        # oracle's Rust-side harness, and CARGO_BUILD_RUSTFLAGS and
        # CARGO_ENCODED_RUSTFLAGS do the same by other spellings. A `-C
        # target-cpu=native` or a `-C opt-level` arriving from the environment
        # would silently change what this job measures while every published
        # field -- profile, features, backend -- kept saying otherwise. The
        # workspace release profile and the matrix are the whole of the intended
        # configuration; anything else is refused here rather than absorbed.
        #
        # ZLIB_RS_BENCH_RUST_PROFILE and CRITERION_HOME are set by this job's own
        # `env:` block and are expected; they are not read from the outside.
        for flag in RUSTFLAGS CARGO_BUILD_RUSTFLAGS CARGO_ENCODED_RUSTFLAGS \
                    RUSTC_WRAPPER CARGO_PROFILE_BENCH_LTO \
                    CARGO_PROFILE_BENCH_CODEGEN_UNITS CARGO_PROFILE_BENCH_OPT_LEVEL; do
          eval "value=\${$flag:-}"
          if [ -n "$value" ]; then
            echo "::error::$flag is set to '$value' in this job's environment."
            echo "::error::It changes what the benchmarks measure while every published"
            echo "::error::field -- profile, features, backend -- would keep reporting the"
            echo "::error::intended configuration. Remove it: the workspace profile and the"
            echo "::error::matrix row are the whole of the configuration this job measures."
            exit 1
          fi
        done
        echo "no measurement-altering environment override is present"

        # What can actually be observed about the machine, reported rather than
        # asserted. None of it is a pass/fail condition -- a hosted runner cannot
        # satisfy most of it and the designated runner's operator, not this file,
        # is responsible for the rest -- but a log that records the governor and
        # the load it measured under is a log whose numbers can be interpreted
        # later. Every command is guarded: none of these paths exists on every
        # kernel, and this step must not fail because a sysfs file is absent.
        echo "--- what this machine is ---"
        echo "cpus: $(nproc 2>/dev/null || echo unknown)"
        echo "load: $(cat /proc/loadavg 2>/dev/null || echo unknown)"
        if [ -r /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
          echo "governor: $(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)"
        else
          echo "governor: not exposed (typical of a virtualised runner)"
        fi
        if [ -r /sys/devices/system/cpu/intel_pstate/no_turbo ]; then
          echo "intel_pstate no_turbo: $(cat /sys/devices/system/cpu/intel_pstate/no_turbo)"
        else
          echo "intel_pstate: not exposed"
        fi
        echo "taskset available: $(command -v taskset >/dev/null && echo yes || echo no)"

    - name: Generate project files (read the committed corpus pin)
      id: pin
      # -----------------------------------------------------------------------
      # ★ ARMING IS NOW A PROPERTY OF THE REPOSITORY, not of an optional variable.
      #
      # The tier-2 Silesia acceptance measurement -- the one AAP 0.8.4 actually
      # states its throughput targets against -- used to be armed only when the
      # repository variable ZLIB_RS_SILESIA_SHA256 was set. Nobody had to set it,
      # nothing reported that it was unset in a way that blocked anything, and a
      # required check could therefore go green having never measured the corpus
      # the specification names. That is not a gap in provisioning; it is a gate
      # that can be turned off by omission.
      #
      # `crates/zlib-rs-differential/corpus/silesia.pin` is the fix: a committed,
      # reviewed file carrying the approved archive's URL, digest and resource
      # bounds. `--pin-status` prints it as `key=value` and touches nothing --
      # no network, no destination, no unpacker -- so this step is safe to run
      # unconditionally, and it does, on every runner. What it publishes:
      #
      #   armed  -- whether this repository carries an approved corpus identity
      #   sha256 -- the pinned archive digest, which keys the cache below
      #
      # The repository variable is still honoured, as an OVERRIDE for a fork or a
      # mirror that pins something else. What it can no longer do is be the only
      # thing standing between a green check and an unmeasured acceptance tier.
      # -----------------------------------------------------------------------
      env:
        # As for the runner name above: an admin-settable value reaches the shell as an
        # environment string rather than as substituted text.
        ZLIB_RS_SILESIA_SHA256_OVERRIDE: ${{ vars.ZLIB_RS_SILESIA_SHA256 }}
      run: |
        set -eu
        sh crates/zlib-rs-differential/corpus/fetch_silesia.sh --pin-status \
          > "$RUNNER_TEMP/pin.txt"
        cat "$RUNNER_TEMP/pin.txt"

        pin_armed=$(sed -n 's/^armed=//p' "$RUNNER_TEMP/pin.txt")
        pin_sha256=$(sed -n 's/^sha256=//p' "$RUNNER_TEMP/pin.txt")

        # The repository variable outranks the pin, so a fork can point at its own
        # corpus without editing a committed file.
        override=${ZLIB_RS_SILESIA_SHA256_OVERRIDE:-}
        if [ -n "$override" ]; then
          echo "the repository variable ZLIB_RS_SILESIA_SHA256 overrides the pin"
          pin_sha256=$override
          pin_armed=yes
        fi

        if [ "$pin_armed" != "yes" ] || [ -z "$pin_sha256" ]; then
          echo 'armed=no' >> "$GITHUB_OUTPUT"
          echo 'sha256=' >> "$GITHUB_OUTPUT"
          echo "no corpus digest is pinned in this repository"
          exit 0
        fi

        echo "armed=yes" >> "$GITHUB_OUTPUT"
        echo "sha256=$pin_sha256" >> "$GITHUB_OUTPUT"
        echo "the approved corpus is pinned as $pin_sha256"

    - name: Generate project files (verify and self-test the benchmark gate)
      # ★ THE GATE IS A COMMITTED FILE, and until this step existed it was a heredoc.
      # `.github/scripts/bench_gate.py` used to be written into $RUNNER_TEMP by this
      # step, and the copy that was written there was three generations of parser
      # spliced together: it defined `number()` twice and referenced sixty-odd names
      # -- LINE, KEYS, EXPECTED, fail, summaries, cases, failures, balances,
      # seen_summary, csv -- that no statement in it ever bound.  The only check made
      # of it was `python3 -m py_compile`, which validates syntax and nothing else, so
      # this step passed, the gate raised NameError on its first real invocation, and
      # the AAP 0.8.4 1.10/1.15 limits went unenforced with the job green.
      #
      # A committed file can be compiled, linted, diffed, reviewed and -- decisively --
      # TESTED.  `bench_gate_selftest.py` runs the real gate against a committed
      # synthetic log and against twenty-nine deliberately broken variants of it: a
      # missing authoritative summary, an overrun, a raised limit, a truncated log, a
      # missing allocator side, a group moved out of the inventory, a perturbed
      # criterion estimate, and so on.  It runs HERE, before any measurement, and it
      # runs in every matrix row, so a gate that has stopped enforcing something fails
      # this step rather than reporting success six steps later.
      run: |
        set -eu
        python3 -m py_compile .github/scripts/bench_gate.py
        python3 -m py_compile .github/scripts/bench_gate_selftest.py
        python3 .github/scripts/bench_gate_selftest.py

    - name: Compile source code
      # The three suites live in `benches/`, which is its own excluded package --
      # criterion 0.8.2 declares rust-version 1.86 and reaches edition-2024 clap
      # manifests that cargo 1.80, this project's floor, cannot parse, so hosting
      # them inside the workspace broke `cargo +1.80 check --workspace`.
      # `--manifest-path benches/Cargo.toml` is therefore required: a bare
      # `cargo bench` from the root now finds no bench target at all and would
      # report success having measured nothing.
      run: |
        cargo bench --locked --manifest-path benches/Cargo.toml \
          --profile ${{ matrix.profile }} ${{ matrix.features }} --no-run

    - name: Run test cases
      run: |
        set -eu
        set -o pipefail
        # The gate below decides from the estimates criterion writes under
        # target/criterion, so that directory must hold THIS run's measurements
        # and nothing else.  A leftover estimates.json from an earlier run would
        # let the gate read a number that was never measured here -- exactly the
        # kind of stale-evidence pass it exists to prevent.  Nothing in this job
        # restores a cache, so this is belt and braces rather than a fix, and it
        # keeps the property true if a cache is ever added.
        rm -rf target/criterion
        mkdir -p target/bench
        cargo bench --locked --manifest-path benches/Cargo.toml \
          --profile ${{ matrix.profile }} ${{ matrix.features }} \
          2>&1 | tee target/bench/bench.log

    - name: Run test cases (gate the measurements)
      # ★ Whether a failure here FAILS the job is decided by the runner, not by
      # this line -- see the classification step near the top of this job for why
      # a hosted VM cannot carry a 10% verdict. The gate itself runs identically
      # either way and prints identically either way; what changes is whether its
      # exit status ends the job.
      #
      # `continue-on-error` rather than swallowing the status inside the script,
      # so that a hosted run still shows the step as failed in the UI and the
      # numbers are impossible to miss. The follow-up step turns that into either
      # a hard failure or a warning.
      id: gate
      continue-on-error: true
      run: python3 .github/scripts/bench_gate.py target/bench/bench.log

    - name: Run test cases (decide what the gate's verdict means here)
      run: |
        set -eu
        outcome='${{ steps.gate.outcome }}'
        authoritative='${{ steps.runner-class.outputs.authoritative }}'

        if [ "$outcome" = "success" ]; then
          echo "the benchmark gate passed"
          exit 0
        fi

        if [ "$authoritative" = "true" ]; then
          echo "::error::the benchmark gate FAILED on the designated runner, so this is a"
          echo "::error::release-blocking throughput or memory regression. The gate's own"
          echo "::error::output above names every case and every limit. Only OUTPUT-NEUTRAL"
          echo "::error::remedies are admissible, because the differential job asserts"
          echo "::error::byte-identical output."
          exit 1
        fi

        echo "::warning::the benchmark gate reported a failure on a HOSTED runner, where"
        echo "::warning::its verdict is informational: a shared cloud VM's run-to-run"
        echo "::warning::spread has been measured at 6.8% for an unchanged binary against a"
        echo "::warning::10% limit, so this may be the machine rather than the code. The"
        echo "::warning::numbers are in the step above and are worth reading. To turn this"
        echo "::warning::into a blocking gate, run this job on a dedicated runner via the"
        echo "::warning::ZLIB_RS_BENCH_RUNNER repository variable."
        exit 0

    - name: Run test cases (prove the corpus requirement actually refuses)
      # -----------------------------------------------------------------------
      # The job above measured the committed minimal corpus and legitimately
      # skipped the tier-2 Silesia groups, because AAP 0.6.4.4 requires that
      # `cargo test` and CI stay network-free and says the benches skip
      # gracefully when the corpus is absent.  That skip is the right default and
      # it is also, on its own, indistinguishable from a corpus that failed to
      # load -- which is precisely the hole this step closes.
      #
      # ZLIB_RS_SILESIA_REQUIRED arms the benches to REFUSE absence instead of
      # skipping it.  Here we arm it with the corpus deliberately absent and
      # assert the benches fail.  That is a negative test OF THE GATE ITSELF: it
      # runs on every push, needs no network, and proves that the acceptance job
      # below cannot silently degrade into a skip.  Without it, "the armed mode
      # refuses" would be an untested claim in exactly the runs where the corpus
      # is unavailable.
      # -----------------------------------------------------------------------
      run: |
        set -eu
        empty="$(mktemp -d)"
        # ★ The trap is installed on the line after the directory exists, and before
        # anything can fail in between. A GitHub-hosted runner is discarded after the
        # job so a leaked directory there costs nothing, but this job runs on a
        # DESIGNATED SELF-HOSTED runner for the release verdict (see the `runs-on`
        # expression above), and those are long-lived: one directory per push, kept
        # for the life of the machine, is a slow disk leak with no owner.
        #
        # All four signals, not just EXIT: a cancelled workflow run delivers INT or
        # TERM to the step's process group and EXIT alone does not fire for those on
        # every shell. HUP covers the runner service being restarted under the job.
        trap 'rm -rf "$empty"' EXIT HUP INT TERM
        status=0
        env ZLIB_RS_SILESIA_REQUIRED=1 ZLIB_RS_SILESIA_DIR="$empty" \
          cargo bench --locked --manifest-path benches/Cargo.toml \
          --profile ${{ matrix.profile }} ${{ matrix.features }} --bench deflate_bench -- --test \
          > target/bench/refusal.log 2>&1 || status=$?

        if [ "$status" -eq 0 ]; then
          echo "::error::the benches were armed with ZLIB_RS_SILESIA_REQUIRED=1 and an"
          echo "::error::empty corpus directory and still reported success.  The corpus"
          echo "::error::requirement is not enforced, so the acceptance job below could"
          echo "::error::skip the Silesia groups and still pass."
          exit 1
        fi

        # Refusing for the RIGHT reason: a compile error or a missing bench binary
        # would also be non-zero.
        if ! grep -q 'ZLIB_RS_SILESIA_REQUIRED is set, so the Silesia corpus is required' \
             target/bench/refusal.log; then
          echo "::error::the armed run failed, but not with the corpus refusal.  The"
          echo "::error::exit status alone does not prove the requirement fired."
          sed -n '1,40p' target/bench/refusal.log
          exit 1
        fi

        echo "the corpus requirement refuses absence (exit $status), as armed"
        grep -m1 'SILESIA verdict=' target/bench/refusal.log || true

    # -------------------------------------------------------------------------
    # Silesia acceptance.  Everything above measured the committed minimal corpus
    # and legitimately skipped the tier-2 groups; AAP 0.8.4 states the throughput
    # bar against Silesia, so the named corpus has to be measured somewhere.
    #
    # ★ NO GATE FETCHES, AND UNTIL THESE STEPS WERE REWRITTEN THIS ONE DID.  A
    # step of THIS job used to call
    # crates/zlib-rs-differential/corpus/fetch_silesia.sh in FETCHING mode on a
    # cache miss, which contradicted three statements at once: the script's own
    # header, corpus/README.md, and AAP 0.6.4.4, which makes the corpus opt-in
    # precisely "so `cargo test` and CI never require the network".  Every
    # invocation of the script in this MEASURING job is now `--verify-only`, which
    # the script documents as side-effect free and which performs no network access
    # at all; the corpus reaches it by a cache entry keyed on the pin, or from a
    # runner that already holds it and names it in ZLIB_RS_SILESIA_DIR.
    #
    # ★ AND FETCHING LIVES NOWHERE IN THIS WORKFLOW AT ALL.  A `silesia-provision`
    # job used to sit at the end of this file and fetch, on the reasoning that "the
    # distinction that matters is not 'this workflow never downloads' but 'no gate
    # depends on a download'".  That distinction is not the one AAP 0.6.4.4 and
    # 0.3.1 draw: they say the script is opt-in and never invoked by CI, which is a
    # property of the workflow rather than of the invoking job's role.  The job is
    # removed, and both sentences hold now -- no gate depends on a download AND this
    # workflow never downloads.  Provisioning is done by hand, off-workflow.
    #
    # ★ AND WHEN ARMED IT FAILS CLOSED.  The old shape could reach the acceptance
    # steps, find nothing, download nothing (or download something broken) and
    # still leave the job green, because absence was indistinguishable from "the
    # variable is unset".  Arming is now decided once, in the open, by the step
    # below; when armed, a corpus that is absent, incomplete or fails verification
    # FAILS the job, and when not armed the job says so loudly with a ::warning::
    # rather than silently reporting a pass earned on tier 1 alone.
    #
    # ★ AND ON AN ACCEPTANCE EVENT IT IS NOT OPTIONAL.  Arming used to be
    # conditional on the repository having pinned a SHA-256 and nothing more, which
    # meant the unset default -- a fresh clone, and this repository until someone
    # sets it -- produced a green run on EVERY event after measuring the committed
    # minimal corpus alone.  An acceptance gate that disarms itself by default
    # accepts everything.  The `acceptance` step below now distinguishes the two
    # kinds of event: on a `schedule` or a published `release` an unset pin FAILS
    # the job, and on a push, a pull request or a hand dispatch it is announced as
    # an omission exactly as before.
    #
    # That split is the whole of AAP 0.6.4.4's exception and no more of it: a fork
    # that has configured nothing still gets a green, network-free run, because a
    # fork runs neither this repository's schedule nor its releases.  What the
    # exception never licensed was SHIPPING without the number.
    #
    # The requirement is satisfied from OUTSIDE this workflow, which is where AAP
    # 0.6.4.4 puts it: a human runs corpus/fetch_silesia.sh on a trusted machine and
    # then either names the result in ZLIB_RS_SILESIA_DIR on a runner that holds it,
    # or populates the pin-keyed cache this job restores.  Every invocation of the
    # script here is `--pin-status` or `--verify-only`, neither of which reaches the
    # network.  The network-free refusal test above still proves, on every push, that
    # armed mode really does refuse absence rather than papering over it.
    # -------------------------------------------------------------------------
    - name: Restore cached corpus
      # Keyed on the pinned checksum, so the cache can only serve the exact corpus
      # this run demands: change the pin and the key changes with it.  There are
      # deliberately no restore-keys -- an older corpus is not a substitute for
      # the pinned one, and silently accepting one would make the measurement
      # untraceable.  A MISS is not a licence to download: the step below fails.
      id: corpus
      if: steps.pin.outputs.armed == 'yes'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/silesia
        # From the committed pin, read by the `pin` step above, so the key follows
        # the reviewed file rather than an optional variable.
        key: silesia-${{ steps.pin.outputs.sha256 }}

    - name: Run test cases (decide and announce whether tier-2 acceptance is armed)
      # One place decides, and it decides in the log.  `armed` is consumed by every
      # step below, so there is no second reading of the variable to drift from
      # this one, and the unarmed case is a ::warning:: rather than an absence:
      # "the AAP 0.8.4 Silesia number was not measured" has to be visible in the
      # checks UI, not inferred from steps that did not run.
      id: acceptance
      # ★ THE TWO REPOSITORY VARIABLES ARRIVE THROUGH `env:`, NOT SPLICED INTO THE
      # SCRIPT.  `if [ -n "${{ vars.X }}" ]` substitutes the variable's text into the
      # shell SOURCE before the shell sees it, so its content is program text: a value
      # containing a quote, a `;` or a `$(...)` becomes syntax rather than data.  A
      # repository variable is settable by anyone with repository write access and is
      # not a secret, so this is a hygiene requirement rather than a hypothetical.
      # Through `env:` the value is data in the environment and `"$VAR"` keeps it that
      # way, which is why the digest can then be pattern-checked before it is used.
      #
      # ★ AND BOTH PINS ARE REQUIRED TOGETHER, because only one of them can
      # authenticate BYTES.  fetch_silesia.sh does not retain the archive after a
      # fetch, so the archive digest cannot be re-checked on a later run at all: what
      # a subsequent acceptance run can verify is the per-member manifest.  Arming on
      # the archive digest alone therefore accepted whatever a writable cache or a
      # self-hosted directory happened to hold, with the stamp and the file names as
      # the only evidence -- and both of those are inside the very directory being
      # trusted.  So acceptance now arms on BOTH, the verify step below authenticates
      # every member against the manifest, and a repository that pins one and not the
      # other is a configuration error that FAILS rather than measuring something it
      # cannot vouch for.  Pinning neither is still a green, network-free run: AAP
      # 0.6.4.4's explicit exception for a fork that has configured nothing.
      #
      # NAMES, because two similar ones are in play.  `vars.ZLIB_RS_SILESIA_MEMBER_
      # MANIFEST` is a repository variable holding the manifest TEXT -- `<sha256>  <
      # name>' lines, sha256sum's own format.  `ZLIB_RS_SILESIA_MEMBER_SHA256` is the
      # script's environment variable and holds a PATH to such a file.  The step below
      # writes the former into $RUNNER_TEMP and points the latter at it, which is why
      # a repository variable can configure a script that reads a file.
      env:
        # ★ FROM THE `pin` STEP, NOT FROM `vars.` DIRECTLY.  This read
        # `${{ vars.ZLIB_RS_SILESIA_SHA256 }}`, which is a DIFFERENT authority from the
        # one the cache key uses: the `pin` step resolves the committed
        # corpus/silesia.pin FIRST and lets the repository variable override it, so with
        # the pin armed and the variable unset -- the normal arrangement, since the pin
        # exists precisely so nobody has to remember a variable -- this was EMPTY while
        # `steps.pin.outputs.sha256` held the real digest.  The cache was then restored
        # under `silesia-<pin digest>` while this step reasoned about `silesia-` with
        # nothing after it.  One authority, read in one place, resolved once.
        SILESIA_SHA256: ${{ steps.pin.outputs.sha256 }}
        SILESIA_MEMBER_MANIFEST: ${{ vars.ZLIB_RS_SILESIA_MEMBER_MANIFEST }}
        # Whether this event ACCEPTS the port or merely checks a change.  A schedule
        # and a published release do; a push, a pull request and a hand dispatch do
        # not.  Computed here so the branches below read one value.
        #
        # ★ THIS IS A SECOND, INDEPENDENT REASON TO FAIL CLOSED, and it is on a
        # different axis from the runner classification below.  `authoritative' asks
        # whether the machine can be believed; `MANDATORY' asks whether the run is
        # ACCEPTING the port.  Arming used to be conditional on configuration alone, so
        # with nothing configured -- the default for a fresh clone -- every run of this
        # job went green after measuring the committed minimal corpus alone.  The AAP
        # 0.8.4 <=10% throughput and <=15% memory bars are stated against Silesia and
        # AAP 0.6.4.6 reads them from Silesia by name, so a gate that silently
        # substitutes a 1.4 MB corpus of fixtures for a 200 MB one is not measuring the
        # requirement at all: an acceptance gate that disarms itself by default accepts
        # everything.  A push and a pull request keep the announced-omission behaviour,
        # so a fork that has configured nothing still gets a green, network-free run --
        # the exception AAP 0.6.4.4 does license.  What is never licensed again is
        # SHIPPING without the number.
        MANDATORY: ${{ github.event_name == 'schedule' || github.event_name == 'release' }}
      run: |
        set -eu
        armed='${{ steps.pin.outputs.armed }}'
        authoritative='${{ steps.runner-class.outputs.authoritative }}'
        provisioned=no
        if [ "${{ steps.corpus.outputs.cache-hit }}" = "true" ] \
           || [ -n "${ZLIB_RS_SILESIA_DIR:-}" ]; then
          provisioned=yes
        fi

        # ★ THE MEMBER MANIFEST, AND WHY THE REPOSITORY VARIABLE IS AN OVERRIDE RATHER
        # THAN THE SOURCE.  Only the per-member digests can be re-checked on a later
        # run: fetch_silesia.sh does not retain the archive, so the ARCHIVE digest can
        # never be recomputed from a provisioned directory, and arming on it alone
        # accepted whatever a writable cache happened to hold with the stamp and the
        # file names -- both of which live inside the very directory being trusted -- as
        # the only evidence.  The manifest closes that, and it is COMMITTED:
        # crates/zlib-rs-differential/corpus/silesia.sha256 carries all twelve member
        # digests, and the script defaults to it when ZLIB_RS_SILESIA_MEMBER_SHA256 is
        # unset.  So the byte check is armed in-tree and needs no repository
        # configuration at all.
        #
        # ZLIB_RS_SILESIA_MEMBER_MANIFEST remains supported for a repository measuring a
        # DIFFERENT archive than the committed pin names, and when it is set its SHAPE is
        # checked here rather than trusted, before it is written anywhere: a malformed
        # value would otherwise fail inside the script with a message about a member that
        # does not exist.  Every line must be sha256sum's own format -- 64 lower-case hex
        # digits, whitespace, then a name.  The separator class is spelled [[:blank:]] --
        # space and tab, exactly -- rather than with a literal tab between brackets,
        # because .github/scripts/whitespace_gate.sh forbids a literal tab anywhere in
        # this file and would be right to: a tab inside a YAML scalar is invisible in
        # review and, one indentation level out, invalid YAML.
        #
        # NAMES, because two similar ones are in play.  `vars.ZLIB_RS_SILESIA_MEMBER_
        # MANIFEST` is a repository variable holding the manifest TEXT.
        # `ZLIB_RS_SILESIA_MEMBER_SHA256` is the script's environment variable and holds
        # a PATH to such a file.  This step writes the former into $RUNNER_TEMP and
        # publishes the path, which is why a repository variable can configure a script
        # that reads a file.
        if [ -n "$SILESIA_MEMBER_MANIFEST" ]; then
          MANIFEST="$RUNNER_TEMP/silesia-members.sha256"
          printf '%s\n' "$SILESIA_MEMBER_MANIFEST" > "$MANIFEST"
          BAD=$(grep -cvE '^[0-9a-f]{64}[[:blank:]]+[^[:blank:]].*$' "$MANIFEST" || true)
          if [ "$BAD" != 0 ]; then
            echo "::error::ZLIB_RS_SILESIA_MEMBER_MANIFEST has $BAD line(s) that are not" \
                 "'<64 hex digits><whitespace><member name>' -- sha256sum's own format:"
            grep -nvE '^[0-9a-f]{64}[[:blank:]]+[^[:blank:]].*$' "$MANIFEST" >&2 || true
            exit 1
          fi
          MEMBERS=$(wc -l < "$MANIFEST" | tr -d ' ')
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "the repository variable ZLIB_RS_SILESIA_MEMBER_MANIFEST overrides the"
          echo "committed manifest with a $MEMBERS-member listing; every member's BYTES"
          echo "are verified against it."
        else
          echo "manifest=" >> "$GITHUB_OUTPUT"
          echo "no manifest override is set, so --verify-only authenticates every member"
          echo "against the committed corpus/silesia.sha256."
        fi

        if [ "$armed" = "yes" ] && [ "$provisioned" = "yes" ]; then
          echo 'armed=yes' >> "$GITHUB_OUTPUT"
          echo "tier-2 Silesia acceptance is ARMED: the repository pins a corpus digest"
          echo "and a corpus is provisioned. Absent, incomplete or unverifiable now FAILS."
          exit 0
        fi

        echo 'armed=no' >> "$GITHUB_OUTPUT"

        if [ "$armed" != "yes" ]; then
          reason='no corpus digest is pinned in this repository'
        else
          reason="the corpus pinned as ${{ steps.pin.outputs.sha256 }} is not provisioned on this runner"
        fi

        # ★ FAIL CLOSED ON THE DESIGNATED RUNNER, AND ON AN ACCEPTANCE EVENT. Those
        # are two independent conditions and either one is enough, because they answer
        # two different questions: `authoritative' asks whether this machine's numbers
        # can be believed, and `MANDATORY' asks whether this run is ACCEPTING the port.
        # A run that did not measure the corpus AAP 0.8.4 names has not performed the
        # acceptance measurement, and reporting success for it would be reporting a
        # number that was never taken.
        #
        # An ordinary push to a hosted runner is neither, and gets a warning instead. A
        # hosted runner cannot usefully hold a 202 MiB corpus and its throughput verdict
        # is informational regardless -- see the runner classification step -- so failing
        # it would block every ordinary push on a measurement that push could not have
        # made. That is the exception AAP 0.6.4.4 licenses, and it is the whole of it.
        if [ "$authoritative" = "true" ] || [ "$MANDATORY" = "true" ]; then
          if [ "$authoritative" = "true" ]; then
            why="on the DESIGNATED release runner"
          else
            why="on a ${{ github.event_name }} event, which accepts the port"
          fi
          echo "::error::tier-2 Silesia acceptance was NOT performed $why:"
          echo "::error::$reason."
          echo "::error::AAP 0.8.4 states this port's throughput and memory targets against"
          echo "::error::the Silesia corpus, and AAP 0.6.4.6 reads them from Silesia by name,"
          echo "::error::so a run that skipped it has not taken the acceptance measurement at"
          echo "::error::all. The committed minimal corpus is not a substitute and this job"
          echo "::error::will not report a pass earned on it."
          echo "::error::"
          echo "::error::To satisfy this, provision the corpus OUTSIDE this workflow --"
          echo "::error::nothing in CI fetches it, by AAP 0.6.4.4 -- and then either set"
          echo "::error::ZLIB_RS_SILESIA_DIR on a runner that holds it, or populate the"
          echo "::error::silesia-<digest> cache this job restores. Run"
          echo "::error::crates/zlib-rs-differential/corpus/fetch_silesia.sh by hand on a"
          echo "::error::trusted machine: it is opt-in precisely so that neither cargo test"
          echo "::error::nor any CI job requires the network. This job only ever invokes it"
          echo "::error::as --verify-only, the mode that fetches nothing and writes nothing."
          echo "::error::"
          echo "::error::Do NOT resolve this by removing the requirement: no other gate in"
          echo "::error::this workspace measures Silesia, so disarming it would leave the"
          echo "::error::AAP 0.8.4 bars unenforced everywhere."
          exit 1
        fi

        echo "::warning::tier-2 Silesia acceptance was NOT performed: $reason."
        echo "::warning::The AAP 0.8.4 throughput numbers reported by this job were"
        echo "::warning::measured on the committed minimal corpus only. That is expected on"
        echo "::warning::a hosted runner, where this job's verdict is informational anyway;"
        echo "::warning::on the designated release runner, and on a schedule or a release,"
        echo "::warning::the same condition FAILS the job -- so the omission cannot reach an"
        echo "::warning::accepted build."
        echo "::warning::To arm it: provision the corpus outside this workflow and re-run."
        echo "::warning::NO job here fetches it -- AAP 0.6.4.4 makes the corpus opt-in so"
        echo "::warning::that neither cargo test nor CI requires the network, and every"
        echo "::warning::invocation of crates/zlib-rs-differential/corpus/fetch_silesia.sh"
        echo "::warning::in this file is --verify-only. Run that script by hand on a trusted"
        echo "::warning::machine, then set ZLIB_RS_SILESIA_DIR or populate the cache."

    - name: Run test cases (verify the provisioned Silesia corpus, never fetch it)
      # `--verify-only` and ONLY `--verify-only`.  The script's own words for that
      # mode are "fetches nothing and writes nothing": it requires a digest even
      # here -- "verifying against nothing is not verification" -- and it checks that
      # the directory carries a well-formed stamp, that its contents are the COMPLETE
      # pinned inventory named by ZLIB_RS_SILESIA_MEMBERS, and that the stamp records
      # the URL and archive digest expected NOW.  The inventory half of that used to
      # be missing -- the mode checked only that SOMETHING other than the stamp was
      # there, so eleven of the twelve members passed while --help promised a non-zero
      # exit for an incomplete destination -- and it is the same comparison a fetch
      # applies, reading the directory with find and basename only, so the mode still
      # writes nothing and reaches no network.  Stated precisely because the script
      # states it precisely: the archive is not retained after a fetch, so its digest
      # cannot be re-computed here at all -- what CAN be re-computed is each member,
      # and this step now supplies the manifest that makes the mode do it, so the
      # stamp and the file names are corroborated by the BYTES rather than standing
      # alone.  The next step is an INDEPENDENT check of the same fact rather than the
      # only one: the benches, armed, require the complete pinned twelve by exact name
      # and refuse anything less.
      #
      # A cache miss is a provisioning failure to report, never a download to perform.
      if: steps.acceptance.outputs.armed == 'yes'
      # Every expression is bound to an environment variable here rather than pasted
      # into the script, and each is then referenced quoted.  The cache-hit output and
      # the digest are both data, and a `${{ ... }}` in a `run:` block is text
      # substituted into the program before the shell parses it.
      env:
        # The same single authority the cache key was built from, so the digest this
        # error message names is the digest that was actually looked up.  Reading
        # `vars.ZLIB_RS_SILESIA_SHA256` here printed `silesia-` with an empty digest
        # whenever the committed pin was the thing doing the arming, which sent a
        # reader looking for a cache entry that was never the one requested.
        ZLIB_RS_SILESIA_SHA256: ${{ steps.pin.outputs.sha256 }}
        ZLIB_RS_SILESIA_MEMBER_SHA256: ${{ steps.acceptance.outputs.manifest }}
        CORPUS_CACHE_HIT: ${{ steps.corpus.outputs.cache-hit }}
      run: |
        set -eu
        if [ "${CORPUS_CACHE_HIT:-}" != "true" ] \
           && [ -z "${ZLIB_RS_SILESIA_DIR:-}" ]; then
          echo "::error::tier-2 acceptance is armed, but no corpus was provisioned: the"
          echo "::error::silesia-$ZLIB_RS_SILESIA_SHA256 cache did not hit and"
          echo "::error::ZLIB_RS_SILESIA_DIR is unset. This workflow does not download the"
          echo "::error::corpus -- AAP 0.6.4.4 and fetch_silesia.sh's own header -- so"
          echo "::error::provision it outside the workflow and re-run."
          exit 1
        fi
        # ★ ZLIB_RS_SILESIA_MEMBER_SHA256 IS WHAT MAKES THIS A BYTE CHECK.  Without it
        # --verify-only reads the stamp and the file names, and both of those live
        # inside the directory being trusted -- so a corpus restored from a writable
        # cache, or sitting on a self-hosted runner between jobs, was accepted on its
        # own say-so.  With the manifest the mode hashes every member and compares it,
        # which is the only evidence available on a run that did not fetch: the archive
        # is not retained, so its digest can never be re-checked here.
        sh crates/zlib-rs-differential/corpus/fetch_silesia.sh --verify-only
        ls -l "${ZLIB_RS_SILESIA_DIR:-target/silesia}"

    - name: Run test cases (Silesia corpus, required)
      # ZLIB_RS_SILESIA_REQUIRED=1 is the whole point of this pass: if provisioning
      # produced eleven of the twelve members, or none, this refuses rather than
      # reporting a pass earned on the minimal corpus.  The minimal-corpus criterion
      # output is moved aside rather than deleted so both runs survive into the
      # failure artifact.
      if: steps.acceptance.outputs.armed == 'yes'
      env:
        ZLIB_RS_SILESIA_REQUIRED: '1'
      run: |
        set -eu
        set -o pipefail
        rm -rf target/criterion-minimal
        mv target/criterion target/criterion-minimal
        cargo bench --locked --manifest-path benches/Cargo.toml \
          --profile ${{ matrix.profile }} ${{ matrix.features }} 2>&1 \
          | tee target/bench/silesia.log

    - name: Run test cases (gate the Silesia measurements)
      # The same gate, on a log whose SILESIA line reads required=yes.  That one
      # difference removes the tier-2 exemption inside the gate, so both *_silesia
      # groups must now report expected>0 and every gated case of them is decided
      # from criterion's estimates.  The two greps assert the precondition
      # explicitly as well, so that a corpus which loaded but was not demanded
      # cannot pass as acceptance.
      if: steps.acceptance.outputs.armed == 'yes'
      run: |
        set -eu
        grep -h 'SILESIA verdict=' target/bench/silesia.log
        for suite in deflate inflate; do
          if ! grep -q "^${suite}_bench: SILESIA verdict=complete .*required=yes" \
               target/bench/silesia.log; then
            echo "::error::${suite}_bench did not report a complete, required Silesia"
            echo "::error::corpus, so this pass did not measure what it exists to measure."
            exit 1
          fi
          if grep -q "^${suite}_bench: RATIO-SUMMARY group=${suite}_silesia .* expected=0 " \
               target/bench/silesia.log; then
            echo "::error::${suite}_bench measured no Silesia case at all."
            exit 1
          fi
        done
        python3 .github/scripts/bench_gate.py target/bench/silesia.log

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      if: failure()
      with:
        name: benchmark-criterion-${{ matrix.label }}
        path: |
          target/bench/
          target/criterion/
          target/criterion-minimal/
        retention-days: 7
