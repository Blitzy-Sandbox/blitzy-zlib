name: mingw/cygwin

# The C reference implementation under the Windows Unix-alike toolchains.  C-only,
# and this is the Rust Tier-1 boundary in practice: on Windows, Tier 1 means the
# MSVC and GNU host triples the Rust project ships, which MSYS2's mingw32,
# mingw64, ucrt64, clang64 and clangarm64 environments and Cygwin do not all
# correspond to.  No row here has a Rust counterpart and none is expected to grow
# one -- the CMake option that would select the Rust library is off by default,
# and its shared path needs an ELF linker regardless.
# `.github/workflows/rust.yml` exercises the Rust workspace; nothing Rust is
# built, installed or linked here (AAP 0.4.1.6).
#
# What these rows contribute to the port is the C oracle's portability: the
# implementation they build is retained UNMODIFIED as the differential baseline
# crates/zlib-rs-differential compiles against, so a break here is a problem for
# that comparison as well as for the C library (AAP 0.2.2.4).  For a later Windows
# Rust target, win32/zlib.def is the MSVC-side analogue of the zlib.map version
# script, out of scope under the same exclusion and untouched (AAP 0.2.2.3).
on: [push, pull_request]

jobs:
  MSys:
    runs-on: ${{ matrix.os || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64, clangarm64]
        include:
          - sys: clangarm64
            os: windows-11-arm
    name: MSys - ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          make
        pacboy: >-
          toolchain:p
          cmake:p
    - name: Configure
      if: matrix.sys != 'clang64'
      run: |
        cmake -G"Unix Makefiles" \
          -S . \
          -B build \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=ON
    - name: Configure clang64
      if: matrix.sys == 'clang64'
      run: |
        CC=clang cmake -G"Unix Makefiles" \
          -S . \
          -B build \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir build -C Release

  cygwin:
    strategy:
      fail-fast: false
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
    name: Cygwin
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup cygwin
      # PINNED BY COMMIT SHA, not by `@master`.  A branch is a mutable pointer, so
      # `@master` means whoever can move it chooses what runs in a job that already
      # has this repository's tree checked out.  The SHA below is immutable and is
      # the one the upstream tags v6.1 and v6 both name (release v6, 2025-07-07),
      # so the pin is a release rather than an arbitrary commit -- refresh it from
      # https://github.com/cygwin/cygwin-install-action/releases and keep the tag in
      # the trailing comment so the next reader can tell what was pinned.
      #
      # The other `uses:` lines in this file stay on their major tags on purpose:
      # actions/checkout and msys2/setup-msys2 are not the same exposure.  The
      # first is GitHub's own action, and the second is the MSYS2 project's own,
      # both consumed as `@vN` throughout this repository's C workflows; the rule
      # applied here is that a THIRD-PARTY action tracked on a BRANCH gets a SHA,
      # which is the case `@master` created and the only one in this file.
      uses: cygwin/cygwin-install-action@3f0a3f9f988f7e96b8c18098ae05eaec175f5b52 # v6.1
      with:
        packages: >-
          cmake
          cygwin-devel
          gcc-core
          gcc-g++
          ninja
    - name: Configure
      run: |
        cmake /cygdrive/d/a/zlib/zlib \
          -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF \
          -G Ninja
    - name: Build
      run: cmake --build build --config Release -v -j1
    - name: Run tests
      run: ctest --output-on-failure --test-dir build -C Release
