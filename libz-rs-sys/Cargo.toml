# The thin C-ABI shim crate.
#
# This is the ONLY workspace member permitted to contain `unsafe` (AAP §0.6.2):
# it re-exposes the safe `zlib-rs` core through `#[repr(C)]` structs and an
# `extern "C"` / `#[unsafe(no_mangle)]` export surface that matches `zlib.h`
# byte-for-byte. At the current foundation milestone it carries the ABI *type*
# definitions ([`zstream`]); the full export surface is added in a subsequent
# milestone.
[package]
name = "libz-rs-sys"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Zlib"
description = "C-ABI (extern \"C\") drop-in shim exposing the zlib API on top of the safe zlib-rs core."
categories = ["compression", "external-ffi-bindings"]
keywords = ["zlib", "ffi", "deflate", "gzip"]

[features]
# Mirror the core `zlib-rs` feature axes across the C-ABI boundary so a consumer
# selecting features on the shim transparently propagates them to the core.
#
# * `std`  — forwards to `zlib-rs/std`. With `std` ON (the default) the shim's
#   raw-pointer translation helpers obtain `Box` from the prelude; only a
#   `--no-default-features` build activates the `#[cfg(not(feature = "std"))]`
#   `alloc` import in `translate.rs`.
# * `gz-io` — forwards to `zlib-rs/gz-io` (which itself pulls `std` + `gzip`) and
#   enables the `#[cfg(feature = "gz-io")]` gz file-I/O conversion helpers in
#   `translate.rs`. Those helpers are generic over the concrete gz state type, so
#   enabling this feature does not require the core `gz` module to be present.
#   gz-io is ON by default so the drop-in artifact exposes the full `gz*` file
#   API family (26 symbols) that `zlib.h` declares — a true zlib drop-in must
#   provide them. `--no-default-features` yields the core-only 47-symbol surface.
# * `c-variadic` — OFF by default; enables the genuinely C-variadic `gzprintf`
#   (`int gzprintf(gzFile, const char *, ...)`). DEFINING a C-variadic `extern
#   "C"` fn requires the unstable `#![feature(c_variadic)]`, so this feature is
#   NIGHTLY-ONLY: enabling it on a stable toolchain is rejected by rustc (the
#   intended compile-time guard). On the default stable build `gzprintf` is the
#   single `zlib.h` symbol that is omitted (documented in `lib.rs`); the other 72
#   symbols are fully functional. This mirrors the upstream `zlib-rs` project.
default = ["std", "gz-io"]
std = ["zlib-rs/std"]
gz-io = ["std", "zlib-rs/gz-io"]
c-variadic = []

[dependencies]
# C scalar types (`c_int`, `c_uint`, `c_ulong`, `size_t`, `off_t`, ...) used at
# the `extern "C"` boundary and by the `#[repr(C)]` ABI structs in `zstream`.
libc = "0.2"
# The safe core. The shim re-exposes its API through the C ABI; at the current
# foundation milestone it is used to anchor `zlibCompileFlags` to this crate's
# `z_off_t` (== `libc::off_t`) definition. This is an internal workspace path
# dependency, so the "minimal external dependencies" rule (FFI: `libc` only)
# still holds.
zlib-rs = { path = "../zlib-rs" }
