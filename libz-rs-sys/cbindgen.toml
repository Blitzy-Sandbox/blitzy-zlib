# =============================================================================
# cbindgen.toml — C header generation config for the `libz-rs-sys` crate
# =============================================================================
#
# PURPOSE
#   This file configures `cbindgen` (https://github.com/mozilla/cbindgen) to
#   generate a `zlib.h`-compatible C header from the `extern "C"` /
#   `#[unsafe(no_mangle)]` surface of `libz-rs-sys`. It is consumed by the
#   sibling `libz-rs-sys/build.rs`, which calls `cbindgen::Config::from_file`
#   on this file and then emits `libz-rs-sys/include/zlib.h`. The generated
#   header is diffed (at the signature level) against the canonical root
#   `zlib.h` to prove the FFI prototypes and struct layouts agree.
#
# WHAT cbindgen READS
#   cbindgen emits ONLY `pub` `#[unsafe(no_mangle)] extern "C"` functions and
#   `pub #[repr(C)]` types declared locally in this crate (`src/lib.rs`,
#   `src/zstream.rs`, `src/translate.rs`). The idiomatic, non-`#[repr(C)]`
#   types in the `zlib-rs` core are NOT `#[repr(C)]` and MUST NOT leak into the
#   C header — `[parse] parse_deps = false` enforces that boundary.
#
# GOAL
#   Signature / ABI parity with canonical `zlib.h`, NOT a byte-identical
#   reproduction. cbindgen has its own house style (comment formatting, item
#   ordering, the include-guard name); cosmetic differences are acceptable.
#   SIGNATURE differences (symbol names, parameter/return types, struct field
#   layout) are NOT acceptable and are caught by the build-time diff.
#
# CROSS-AGENT COORDINATION (read before editing)
#   * This config OWNS injection of the items cbindgen cannot synthesize from
#     `#[no_mangle]` functions — the `ZLIB_VERSION`/`ZLIB_VERNUM`/
#     `ZLIB_VER_*` version macros and the `deflateInit`/`inflateInit`/
#     `deflateInit2`/`inflateInit2`/`inflateBackInit` convenience MACROS. They
#     are injected via `after_includes` (see that section). The
#     `include/zlib.h` output is produced solely by this config + `build.rs`,
#     so these items must NOT be appended a second time elsewhere (identical
#     macro redefinition is benign in C, but duplication is avoided here).
#   * The public `Z_*` constants (`Z_OK`, `Z_NO_FLUSH`, compression levels,
#     strategies, …) are defined as `pub const` in `src/lib.rs`; cbindgen
#     emits them per the `[const]` section below (verified to render as
#     `#define`s, matching zlib's style). They are intentionally NOT injected
#     here, to avoid double definition.
#   * The `#[repr(C)]` types in `src/zstream.rs` are named EXACTLY as their C
#     counterparts (`z_stream`, `z_stream_s`, `gz_header`, `gz_header_s`,
#     `gzFile_s`, `internal_state`, `alloc_func`, `free_func`, …) so the
#     `[export.rename]` table can stay empty.
#
# FORMAT: TOML 1.0. NOTE: every bare key/value below is a *top-level* option
# and therefore MUST precede the first `[table]` header (TOML scoping rule).
# =============================================================================

# ---------------------------------------------------------------------------
# Phase 1 — Top-level output options
# ---------------------------------------------------------------------------

# License / attribution banner placed at the very top of the generated header,
# before the include guard. zlib/libpng license, mirrored from canonical
# `zlib.h`. A TOML *literal* string ('''…''') is used so nothing is escaped.
header = '''/* zlib.h -- interface of the 'zlib' general purpose compression library
   Auto-generated C ABI header for the Rust `libz-rs-sys` drop-in.

   Copyright (C) 1995-2026 Jean-loup Gailly and Mark Adler

   This software is provided 'as-is', without any express or implied
   warranty.  In no event will the authors be held liable for any damages
   arising from the use of this software. Permission is granted to anyone to
   use this software for any purpose, including commercial applications, and
   to alter it and redistribute it freely, subject to the restrictions of the
   zlib license. See the LICENSE file distributed with this crate.
*/'''

# Banner immediately after the include guard so readers know not to hand-edit.
autogen_warning = "/* DO NOT EDIT: auto-generated by cbindgen from the libz-rs-sys crate. Mirrors the canonical zlib.h C ABI. */"

# Emit a C header (NOT C++).
language = "C"

# Wrap declarations in `#ifdef __cplusplus` / `extern "C" { … }` guards so the
# header is usable from C++ TUs, matching zlib.h's C++ compatibility block.
cpp_compat = true

# Include guard for the generated header. It need NOT be byte-identical to the
# canonical `ZLIB_H`; the parity check is at the signature level, not a raw
# byte diff. A distinct name (`ZLIB_RS_H`) makes the Rust origin obvious and
# lets the generated header coexist with a system `zlib.h` if ever needed.
include_guard = "ZLIB_RS_H"

# Use the textual include guard above instead of `#pragma once`, matching
# canonical zlib.h (which uses `#ifndef ZLIB_H`).
pragma_once = false

# Cosmetic formatting only (not semantically significant).
tab_width = 4
line_length = 100

# Carry Rust doc-comments into the header as C-style (`/* … */`) comments, for
# parity with zlib.h's heavily-commented public API.
documentation = true
documentation_style = "c"

# ---------------------------------------------------------------------------
# Phase 2 — System includes (so the C scalar types in signatures resolve)
# ---------------------------------------------------------------------------

# `stddef.h` -> `size_t`; `stdarg.h` -> the variadic `gzprintf`; `stdint.h` ->
# fixed-width integer fallbacks (`uint8_t`, etc.) that cbindgen uses for the
# `Bytef`/`uInt`/`uLong`/`z_crc_t` family.
sys_includes = ["stddef.h", "stdint.h", "stdarg.h"]

# Keep cbindgen's automatic standard includes (stdbool/stdint/stdlib/stdarg)
# in addition to `sys_includes`. Harmless redundancy; guarantees every type
# referenced in a prototype has a declaration.
no_includes = false

# Raw C block injected immediately after the `#include` lines and INSIDE the
# include guard. It carries the items cbindgen CANNOT synthesize from
# `#[no_mangle]` functions:
#   * the `ZLIB_VERSION` / `ZLIB_VERNUM` / `ZLIB_VER_*` version macros, and
#   * the `deflateInit` / `inflateInit` / `deflateInit2` / `inflateInit2` /
#     `inflateBackInit` convenience MACROS that forward to the underscore
#     functions (`deflateInit_`, …) passing `ZLIB_VERSION` and
#     `(int)sizeof(z_stream)` exactly as canonical zlib.h does.
#
# WHY `after_includes` (and not `trailer`): cbindgen places `trailer` content
# AFTER the include-guard `#endif` (outside the guard), which would re-define
# these macros on every include. `after_includes` lands INSIDE the guard,
# matching zlib.h's near-top placement of the version macros and keeping the
# whole header double-include-safe. The convenience macros are plain text
# substitution, so defining them before the `z_stream` typedef that they name
# is valid C (the names are only resolved at expansion sites in user code).
# The macro `deflateInit` (no trailing underscore) does NOT collide with the
# generated `extern "C"` function `deflateInit_` (with underscore).
#
# A TOML *literal* string ('''…''') is used so the C line-continuation
# backslashes pass through verbatim without any TOML escaping.
after_includes = '''

/* ----- Items cbindgen cannot synthesize from #[no_mangle] functions ----- */
/* Library version, mirrored byte-for-byte from canonical zlib.h.           */
#define ZLIB_VERSION "1.3.2.1-motley"
#define ZLIB_VERNUM 0x1321
#define ZLIB_VER_MAJOR 1
#define ZLIB_VER_MINOR 3
#define ZLIB_VER_REVISION 2
#define ZLIB_VER_SUBREVISION 1

/* For compatibility with versions < 1.0.2 */
#define zlib_version zlibVersion()

/* Convenience init macros: check the zlib version and the compiler's view of
   z_stream, forwarding to the underscore entry points. */
#define deflateInit(strm, level) \
        deflateInit_((strm), (level), ZLIB_VERSION, (int)sizeof(z_stream))
#define inflateInit(strm) \
        inflateInit_((strm), ZLIB_VERSION, (int)sizeof(z_stream))
#define deflateInit2(strm, level, method, windowBits, memLevel, strategy) \
        deflateInit2_((strm),(level),(method),(windowBits),(memLevel),\
                      (strategy), ZLIB_VERSION, (int)sizeof(z_stream))
#define inflateInit2(strm, windowBits) \
        inflateInit2_((strm), (windowBits), ZLIB_VERSION, \
                      (int)sizeof(z_stream))
#define inflateBackInit(strm, windowBits, window) \
        inflateBackInit_((strm), (windowBits), (window), \
                         ZLIB_VERSION, (int)sizeof(z_stream))'''

# ---------------------------------------------------------------------------
# Phase 3 — [export]: what to emit and how it is named
# ---------------------------------------------------------------------------
[export]
# NO name prefixing: the emitted C symbols must be the EXACT zlib names
# (`deflate`, `inflate`, `z_stream`, `gzopen`, …) for a true drop-in ABI.
prefix = ""

# Emit the full range of item kinds so structs (`z_stream`, `gz_header`,
# `gzFile_s`), typedefs (`alloc_func`, `free_func`, `in_func`, `out_func`,
# `z_streamp`, `gz_headerp`, `gzFile`, `Bytef`, `uInt`, `uLong`, …), the opaque
# `internal_state`, all `#[no_mangle]` functions, and the exported `pub const`
# constants all appear. Order matters only cosmetically (see `[fn] sort_by`).
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]

# Map any Rust type name that differs from its C counterpart to the exact C
# identifier. Intentionally EMPTY: `src/zstream.rs` names its `#[repr(C)]`
# types exactly as the C names, so no renames are required. (Kept as an
# explicit, documented anchor for future additions.)
[export.rename]

# ---------------------------------------------------------------------------
# Phase 4 — [fn] / [struct] / [enum] / [const] styling (match zlib.h)
# ---------------------------------------------------------------------------
[fn]
# Let cbindgen choose horizontal vs. vertical argument layout per signature.
args = "auto"
# zlib's public API does not use `__attribute__((warn_unused_result))`; emit no
# must-use annotation (empty string == no annotation).
must_use = ""
# Preserve source declaration order rather than alphabetizing, so the generated
# header's ordering stays close to the hand-ordered canonical zlib.h and the
# signature diff is easier to read.
sort_by = "none"

[struct]
# Plain C structs: no synthesized equality operator and no constructor. Fields
# are emitted in Rust declaration order, which (because the types are
# `#[repr(C)]`) MUST match the canonical C field layout exactly.
derive_eq = false
derive_constructor = false

[enum]
# Do not prefix enum variant names with the enum name, and do not rewrite
# variant casing. NOTE: the zlib public constants (`Z_OK`, `Z_NO_FLUSH`, …) are
# `#define`s in canonical zlib.h, not C enums; they are modeled as Rust
# `pub const` and emitted via the `[const]` section below, so these `[enum]`
# settings mostly guard any genuine `#[repr(C)]` enums the FFI may expose.
prefix_with_name = false
rename_variants = "None"

[const]
# Representation of exported `pub const` items. With these settings cbindgen
# 0.29.4 emits simple integer constants as `#define NAME value` (verified),
# which matches canonical zlib.h's `#define`-based constant style. (`static
# const` is only used for constants that cannot be expressed as a macro.)
allow_static_const = true
allow_constexpr = false

# ---------------------------------------------------------------------------
# Phase 5 — [parse]: scope of Rust code cbindgen reads
# ---------------------------------------------------------------------------
[parse]
# Do NOT descend into dependency crates. The C-ABI `#[repr(C)]` types and
# `extern "C"` functions are ALL defined locally in `libz-rs-sys`
# (`src/zstream.rs`, `src/lib.rs`). The `zlib-rs` core's idiomatic (non-repr-C)
# types must never leak into the C header.
parse_deps = false
# Do not delete the output directory before generating.
clean = false
# Empty include/exclude keeps cbindgen scoped to this crate's own modules.
include = []
exclude = []

# ---------------------------------------------------------------------------
# Phase 6 — [defines]: Cargo feature -> C `#ifdef` mapping
# ---------------------------------------------------------------------------
[defines]
# Items gated in Rust by `#[cfg(feature = "gz-io")]` (the gz file-I/O API:
# `gzopen`, `gzread`, `gzprintf`, `gzclose`, …) are wrapped in the generated
# header by `#if defined(WITH_GZFILEOP) … #endif`. This mirrors canonical
# zlib.h's `#ifndef Z_SOLO` gating of the gz section and keeps the generated
# header consistent with how `src/lib.rs` conditionally exports those symbols.
"feature = gz-io" = "WITH_GZFILEOP"
