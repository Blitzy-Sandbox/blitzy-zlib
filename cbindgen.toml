# cbindgen.toml — C-header generation configuration for the `zlib-rs` crate.
#
# Purpose
# -------
# `build.rs` invokes cbindgen (v0.28.0) with this configuration to regenerate a
# C header that is the equivalent of the upstream hand-written `zlib.h`, derived
# from the Rust FFI surface in `src/ffi.rs`. The header lets C consumers link the
# crate's `cdylib`/`staticlib` artifacts as a drop-in replacement for `libz`.
#
# The exported symbol set the generated header must declare mirrors `zlib.map`
# (14 version nodes) and the public functions of `zlib.h`: the `deflate*`,
# `inflate*`, `inflateBack*`, `crc32*`, `adler32*`, `compress*`/`uncompress*`,
# `*_combine`/`*_combine64`/`*_z`, and `gz*` families, operating over the
# `#[repr(C)]` `z_stream`/`gz_header` structures and the `Z_*` integer constants.
#
# This file is build tooling, not a runtime dependency declaration. Its single
# job is to keep the published C ABI byte-compatible — at the symbol level — with
# `src/ffi.rs`, so the ABI never drifts from the Rust source.
#
# Invocation (run from the crate root, where Cargo.toml defines `[lib] name =
# "zlib_rs"`), after `src/ffi.rs` exists:
#
#     cbindgen --config cbindgen.toml --crate zlib-rs --output <out>.h
#
# All keys below are validated against the cbindgen 0.28.0 schema, which sets
# `#[serde(deny_unknown_fields)]` on every table — unknown keys are a hard error.

# ----------------------------------------------------------------------------
# Language & top matter
# ----------------------------------------------------------------------------

# Emit C (not C++). The crate's public ABI is a C ABI.
language = "C"

# Declare structs/enums/unions in typedef style (`typedef struct { ... } Name;`)
# instead of tagged style, matching classic zlib conventions such as `z_stream`.
style = "type"

# Wrap declarations in `#ifdef __cplusplus extern "C" { ... }` guards so the
# generated C header is also usable from C++ translation units.
cpp_compat = true

# Use a classic zlib-style include guard (matching `#ifndef ZLIB_H` in zlib.h)
# rather than `#pragma once`. Exactly one guard mechanism is selected.
include_guard = "ZLIB_RS_H"

# Emit a comment recording the cbindgen version used to generate the header.
include_version = true

# Map Rust `usize`/`isize` to C `size_t`/`ptrdiff_t` (not `uintptr_t`/`intptr_t`).
# `size_t` is the correct, idiomatic C type for buffer-length parameters, and
# enabling this also makes cbindgen automatically `#include <stddef.h>`.
usize_is_size_t = true

# Cosmetic formatting of the generated header.
line_length = 100
tab_width = 4

# Carry Rust `///` doc comments into the header as C comments. `c99` selects
# `//` line comments, which are valid under `-std=c11` and avoid the premature
# `*/` termination hazard of block comments when doc text contains `*/`.
documentation = true
documentation_style = "c99"
documentation_length = "full"

# Banner emitted at the very top of the generated header. Per project policy we
# do NOT inline the full LICENSE text here — a one-line SPDX identifier plus a
# brief attribution and a do-not-edit notice is sufficient and unambiguous.
header = """
/* SPDX-License-Identifier: Zlib */
/*
 * zlib-rs — C application binary interface for the pure-Rust rewrite of the
 * zlib general purpose compression library (RFC 1950 / 1951 / 1952).
 *
 * This header is the regenerated equivalent of the upstream hand-written
 * `zlib.h`. It is produced automatically by cbindgen from the Rust FFI surface
 * in `src/ffi.rs`, so the published C ABI always tracks the Rust source and the
 * exported symbol set defined in `zlib.map`. DO NOT EDIT MANUALLY.
 *
 * Copyright (C) 1995-2026 Jean-loup Gailly and Mark Adler. zlib license.
 */"""

# Repeated at major sections of the header to deter manual edits.
autogen_warning = "/* Generated by cbindgen from zlib-rs/src/ffi.rs. DO NOT EDIT MANUALLY. */"

# ----------------------------------------------------------------------------
# [layout] — memory layout of #[repr(C)] types
# ----------------------------------------------------------------------------
# `z_stream`, `gz_header`, and `Code` are plain `#[repr(C)]` types (they use
# neither `#[repr(packed)]` nor `#[repr(align(N))]`), so cbindgen reproduces
# their field order and natural packing automatically — which is exactly what
# C-ABI compatibility requires. The `packed`/`aligned_n` annotation macros are
# therefore intentionally left unset; setting them would risk emitting
# references to preprocessor macros that the generated header never defines.
[layout]

# ----------------------------------------------------------------------------
# [parse] — what cbindgen reads
# ----------------------------------------------------------------------------
[parse]
# Parse only this crate (`zlib-rs`, lib `zlib_rs`); do not descend into
# dependencies. The entire public C ABI is defined within `src/ffi.rs` (plus the
# `pub` constants/types it re-exports), so dependency parsing is unnecessary.
parse_deps = false

# Note: macro expansion (`[parse.expand]`) is deliberately NOT enabled. The FFI
# surface is written as plain `#[no_mangle] pub extern "C"` items rather than
# macro-generated code, and `cargo expand` would require a nightly toolchain.
# The header is generated against the crate's default feature set
# (std + gzip + gz-io + simd); any `#[cfg(feature = "...")]`-gated FFI item is
# emitted unconditionally (cbindgen has no `[defines]` mapping to gate it on),
# which is the desired behavior for a drop-in `libz` built with default features.

# ----------------------------------------------------------------------------
# [export] — which items become C declarations
# ----------------------------------------------------------------------------
[export]
# Emit every kind of public item so the full zlib surface appears in the header:
#   - functions : the `#[no_mangle] pub extern "C"` shims (deflate, inflate,
#                 crc32, adler32, compress2, uncompress2, gzopen, inflateBack, …)
#   - structs   : `#[repr(C)]` z_stream, gz_header, Code
#   - typedefs  : the C type aliases (z_streamp, gzFile, Bytef, uInt, uLong,
#                 voidpf, …)
#   - constants : the `Z_*` flush/level/strategy/return-code values (emitted as
#                 `#define`s in C mode)
#   - enums / unions / globals / opaque : included for completeness so nothing
#                 reachable from the FFI surface is dropped; `opaque` in
#                 particular covers any forward-declared opaque state type.
item_types = ["constants", "globals", "enums", "structs", "unions", "typedefs", "opaque", "functions"]

# `exclude` — items cbindgen must NOT emit (it would emit them incorrectly).
#
# `gzprintf` is the sole exclusion. It is exported from `src/ffi.rs` as a
# C-*variadic* symbol (`int gzprintf(gzFile, const char *format, ...)`), but the
# Rust side cannot express the trailing `...` in a stable `extern "C"` signature
# (the `c_variadic` feature is unstable), so the export is a naked tail-branch
# whose declared Rust signature is the non-variadic `(gzFile, *const c_char)`.
# Left to its own devices cbindgen would therefore emit `int gzprintf(gzFile,
# const char *);` — missing the `, ...` a C caller needs — and, because the
# export is defined once per supported `target_arch`, could emit it more than
# once. `build.rs` instead injects the single correct variadic declaration
# immediately after `gzvprintf` during its header post-processing step, so the
# header always carries the exact C prototype. Excluding it here makes that the
# one deterministic source of the `gzprintf` declaration.
exclude = ["gzprintf"]

# `include` (force-emit specific items by name) is intentionally left empty.
# cbindgen emits functions, constants, and globals wholesale, but emits *types*
# only when they are reachable from an exported function/global/constant. Every
# public type of the zlib C API — z_stream, gz_header, and the Bytef / uInt /
# uLong / voidpf / z_streamp / gzFile aliases and the alloc_func / free_func
# callbacks — is referenced by an exported function signature, so all are emitted
# automatically. Purely internal types that no exported function references (for
# example the inflate decode-table `Code`) are correctly omitted, exactly as the
# upstream hand-written `zlib.h` omits them.

# No symbol renaming and no name prefix: the exported C names must match the
# canonical zlib API exactly (`deflate`, `inflate`, `deflateInit_`,
# `inflateInit2_`, `crc32`, `adler32`, `compress2`, `uncompress`, the
# `*_combine`/`*_z` variants, the `gz*` family, …) for binary drop-in
# compatibility. The `prefix` and `rename` rules are intentionally left empty.
