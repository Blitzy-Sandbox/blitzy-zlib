# cbindgen.toml — C-header generation configuration for the `zlib-rs` crate.
# ============================================================================
#
# PURPOSE
#   This file configures cbindgen (v0.28.0), which `build.rs` invokes to
#   generate a C header from the crate's FFI surface in `src/ffi.rs`. The
#   generated header is the regenerated, machine-checked equivalent of the
#   hand-written upstream `zlib.h`: the exported symbol names and signatures
#   match the canonical zlib C API exactly (see `zlib.map`), so the crate's
#   `cdylib`/`staticlib` artifacts can serve as a binary-compatible drop-in
#   replacement for `libz` (AAP §0.3.3, §0.6.2).
#
#   Because the header is produced from the Rust source, the published C ABI
#   can never silently drift from `src/ffi.rs`: any change to an exported
#   `#[no_mangle] pub extern "C"` function or `#[repr(C)]` type is reflected
#   in the next header regeneration.
#
# SCOPE
#   This is build tooling, not a runtime dependency declaration. cbindgen is a
#   `[build-dependencies]` entry in `Cargo.toml`; nothing here is linked into
#   the shipping artifact.
#
# INVOCATION (performed by build.rs, equivalently on the command line):
#   cbindgen --config cbindgen.toml --crate zlib-rs --output <OUT_DIR>/zlib_rs.h
#   The target crate (`zlib-rs`, library name `zlib_rs`) is selected with the
#   `--crate` flag / `CARGO_PKG_NAME`; cbindgen does not take a crate-name key
#   in this file.
#
# Every option below is a valid cbindgen 0.28.0 key. cbindgen deserializes this
# file with `#[serde(deny_unknown_fields)]`, so unknown keys are a hard error;
# the settings here are deliberately limited to documented, supported options.
# ============================================================================

# --- Output language --------------------------------------------------------
# Emit C (not C++). The header is a drop-in for the C `zlib.h`.
language = "C"

# Wrap the declarations in `extern "C" { ... }` guards behind
# `#ifdef __cplusplus`, so the C header is equally usable from C++ translation
# units without name-mangling surprises.
cpp_compat = true

# --- Header guard -----------------------------------------------------------
# Use a classic include guard (`#ifndef ZLIB_RS_H / #define ZLIB_RS_H / #endif`)
# rather than `#pragma once`, matching the traditional zlib header style and
# maximizing portability across C toolchains. (Exactly one guard mechanism is
# selected; `pragma_once` is intentionally left unset/false.)
include_guard = "ZLIB_RS_H"

# --- Top-of-file banner -----------------------------------------------------
# A short license/attribution banner. The full zlib license text is NOT inlined
# (it lives in LICENSE); only the SPDX identifier and a generated-file note are
# emitted, so the banner stays compact and unambiguous.
header = """
/* zlib-rs — C API (drop-in libz replacement)
 * SPDX-License-Identifier: Zlib
 *
 * Generated by cbindgen from zlib-rs/src/ffi.rs. The exported symbol names and
 * signatures mirror the canonical zlib C API (zlib.h / zlib.map) so the crate
 * is binary-compatible with libz. Do not edit by hand — regenerate instead.
 */"""

# An explicit autogeneration warning placed in the output so no one mistakes
# the generated header for a hand-maintained source file.
autogen_warning = "/* Generated by cbindgen from zlib-rs/src/ffi.rs. DO NOT EDIT MANUALLY. */"

# Include the binding crate's version in the autogeneration banner for
# traceability between a shipped header and the crate revision that produced it.
include_version = true

# --- Declaration style ------------------------------------------------------
# Emit typedef-style declarations for structs/enums (e.g. `typedef struct { … }
# z_stream;`) instead of bare `struct`/tag forms. This matches the zlib C
# convention where types such as `z_stream`, `gz_header`, and `Code` are used
# by their typedef names throughout the API.
style = "type"

# --- Cosmetic code style ----------------------------------------------------
# Purely affects formatting of the generated header; no effect on the ABI.
line_length = 100
tab_width = 4

# Carry the Rust `///` doc comments on the exported FFI items into the C header,
# reproducing zlib.h's well-documented feel. `c` selects classic `/* … */` block
# comments (C89-compatible), matching the upstream zlib.h comment style and
# keeping the header usable even by pre-C99 / `-ansi` consumers.
documentation = true
documentation_style = "c"

# Map Rust `usize`/`isize` to C `size_t`/`ptrdiff_t` so width-sensitive aliases
# like `z_size_t` come out as `size_t` (matches zconf.h's `z_size_t` typedef).
usize_is_size_t = true

# ============================================================================
# [parse] — how the Rust crate is read
# ============================================================================
[parse]
# Parse ONLY this crate's sources; do not descend into dependency crates
# (crc32fast, cfg-if, …). The public C ABI is defined entirely by `src/ffi.rs`,
# so dependency parsing is unnecessary and would only add noise.
parse_deps = false
#
# NOTE on feature gating and macro expansion:
#   The FFI shims in `src/ffi.rs` are written as plain `#[no_mangle] pub extern
#   "C"` functions over `#[repr(C)]` types — they are NOT generated by macros,
#   so cbindgen's `[parse.expand]` (which shells out to a nightly `cargo
#   expand`) is intentionally NOT enabled. The exported FFI surface is gated
#   behind the optional `capi` feature in Cargo.toml; `build.rs` invokes
#   cbindgen only when that feature is requested (it checks `CARGO_FEATURE_CAPI`,
#   or the `ZLIB_RS_GENERATE_HEADER` env override), so the header is generated
#   from a `capi`-enabled build in which the full C API (including the
#   gzip/file-I/O `gz*` family) is compiled in. Consequently the generated
#   header declares the complete canonical zlib symbol set.

# ============================================================================
# [defines] — intentionally OMITTED (see rationale)
# ============================================================================
# No `[defines]` table is active. This is a deliberate choice for a drop-in
# `libz`: the header is generated during a DEFAULT-FEATURE build, so the shipped
# `cdylib`/`staticlib` already contains every default-feature symbol. Declaring
# those symbols UNCONDITIONALLY makes the header match the ABI of the artifact it
# ships beside — a C consumer sees exactly the symbols that exist in the binary.
#
# If `src/ffi.rs` `#[cfg(feature = "…")]`-gates any exported item, cbindgen will
# print an informational "Missing `[defines]` entry for `feature = …`" warning
# and then emit that item without a guard. That warning is benign (the build
# still succeeds) and the unconditional emission is exactly the behavior we want.
#
# Should a conditionally-guarded header ever be required (e.g. to mirror zlib's
# own `#ifndef Z_SOLO` gating for a no-I/O build), uncomment and adapt a mapping
# such as the following, which wraps each feature-gated item in the matching
# C preprocessor guard (and also silences the warning above):
#
#   [defines]
#   "feature = std"    = "ZLIBRS_WITH_STD"
#   "feature = gzip"   = "ZLIBRS_WITH_GZIP"
#   "feature = gz-io"  = "ZLIBRS_WITH_GZ_IO"
#   "feature = no-std" = "Z_SOLO"
#   "feature = simd"   = "ZLIBRS_WITH_SIMD"

# ============================================================================
# [export] — which items become C declarations
# ============================================================================
[export]
# Restrict generation to the item kinds that make up the public C API:
#   functions  → the `#[no_mangle] extern "C"` zlib entry points
#                (deflate, inflate, crc32, adler32, compress2, uncompress2,
#                 inflateBack, the gz* family, the *_z / *_combine variants, …)
#   structs    → the `#[repr(C)]` records (z_stream, gz_header, Code)
#   enums      → any `#[repr(C)]` enums exposed at the boundary
#   typedefs   → the C type aliases (z_streamp, gzFile, Bytef, uInt, uLong,
#                voidpf, alloc_func/free_func function-pointer types, …)
#   constants  → the Z_* constants (flush/level/strategy/method/return codes),
#                emitted as `#define`s in C mode so C callers can use them.
item_types = ["functions", "structs", "enums", "typedefs", "constants"]

# No explicit include/exclude allow-lists: with `parse_deps = false`, every
# eligible public item from this crate is exported, which is exactly the
# canonical zlib symbol set enumerated in `zlib.map`.
include = []
exclude = []

# NOTE: no `prefix` is set here. Symbol names MUST match the zlib C API byte
# for byte (the whole point of the drop-in), so cbindgen must not add any
# namespace prefix to exported identifiers.

# ----------------------------------------------------------------------------
# [export.rename] — identifier renaming map
# ----------------------------------------------------------------------------
# Intentionally EMPTY. The generated C names must equal the zlib names exactly
# (`deflate`, `inflate`, `deflateInit_`, `inflateInit2_`, `crc32`, `adler32`,
# `compress2`, `uncompress2`, `gzopen`, `inflateBack`, …). Adding any rule here
# would break binary/source compatibility with libz, so no renames are defined.
[export.rename]

# ============================================================================
# [layout] — type layout annotations
# ============================================================================
# Intentionally EMPTY. cbindgen lays out `#[repr(C)]` types with C-compatible
# field order and natural packing automatically, which is precisely what the
# zlib structs (`z_stream`, `gz_header`, `Code`) require. The only keys this
# table accepts are `packed`/`aligned_n` (custom macros for `#[repr(packed)]` /
# `#[repr(align(N))]`); zlib uses neither, so both are deliberately left unset.
[layout]
