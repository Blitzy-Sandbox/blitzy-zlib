# cbindgen configuration for the C ABI facade crate, `crates/libz-rs-sys`.
#
#  WHAT THIS FILE IS FOR
#  `zlib.h` and `zconf.h` are the immutable public contract of this library.
#  Every program that links `libz` was compiled against them, so a single
#  changed signature, struct layout or constant silently breaks binaries that
#  are never going to be recompiled.  Protecting that contract is not left to
#  code review; it is to be enforced by four independent mechanical gates:
#
#    1. compile-time layout assertions  crates/libz-rs-sys/src/layout_assertions.rs
#    2. the cbindgen header diff        THIS FILE
#    3. the `nm` symbol-parity diff     crates/libz-rs-sys/tests/symbol_parity.rs
#    4. the C89 -> gnu2x compile sweep  .github/workflows/c-std.yml
#
#  STATE OF THOSE GATES AT THIS CHECKPOINT.  Only gate 4 exists and runs today:
#  `.github/workflows/c-std.yml` is an in-tree workflow and it already proves
#  that the unchanged `zlib.h` compiles from C89 through gnu2x.  Gates 1 and 3
#  name files that have not been written yet, and gate 2 -- this file's own gate
#  -- cannot run either, because the facade crate root
#  `crates/libz-rs-sys/src/lib.rs` does not exist, so cbindgen has no crate to
#  read and `cargo metadata` cannot even load the workspace.  Everything below
#  is therefore the SPECIFICATION the gate must satisfy once the facade lands,
#  not a record of a passing run.  Statements of the form "verified" or
#  "reproduced" are marked where they were established against cbindgen 0.29.4
#  itself (its `Config` schema, its emitted syntax, the two `zconf.h` compile
#  failures) rather than against a facade that does not yet exist.
#
#  This file drives gate 2.  It tells cbindgen how to render the facade crate's
#  exported surface as a C header so that header can be compared against the
#  in-tree `zlib.h`.  Generating that artifact is one command:
#
#    cbindgen --config cbindgen.toml --crate libz-rs-sys --output generated_zlib.h
#
#  A bare `diff -u zlib.h generated_zlib.h` is a USEFUL EYEBALL, NOT THE GATE --
#  see "READ THIS BEFORE WRITING OR CHANGING THE CI GATE" below for why its
#  output can never be empty and what the gate has to do instead.
#
#  `generated_zlib.h` is scratch.  `.gitignore` has an anchored `/generated_zlib.h`
#  rule precisely so it can never be committed: a second header sitting beside
#  the real one would be indistinguishable from the public contract.
#
#  THE ONE THING THIS FILE MUST NEVER BE USED FOR
#  Regenerating `zlib.h`.  `zlib.h` is READ-ONLY.  It is not derived from the
#  Rust sources, the Rust sources are validated against it.  Never point
#  `--output` at `zlib.h`, `zconf.h`, `test/`, `examples/` or any install
#  directory.  If the diff shows a difference, the Rust facade is what changes.
#
#  READ THIS BEFORE WRITING OR CHANGING THE CI GATE
#  ------------------------------------------------
#  A verbatim `diff -u zlib.h generated_zlib.h` is NOT empty and never will be,
#  so it must never be wired up as the pass/fail check.  Run it by hand to read
#  the differences; make the GATE the normalised comparison specified under
#  "NORMALISATION RULES THE GATE MUST IMPLEMENT" below, which is the only form of
#  the comparison that can legitimately pass.
#
#  The gate is a SIGNATURE-AND-CONSTANT gate: it must fail on any divergence in a
#  public signature -- a changed parameter type, a changed return type, a missing
#  function, an extra function -- or in the value of any integer constant that
#  crosses into the artifact, and must tolerate exactly the structural categories
#  enumerated under "ACCEPTED DIVERGENCES" below, and nothing else.
#
#  Each category below was derived from cbindgen 0.29.4's own behaviour and
#  schema -- its emitted syntax, its `Config` definition, and, for D3, two
#  reproduced compile failures -- rather than from a facade, which does not exist
#  yet.  None of them is speculative about the generator; none of them is a
#  record of a completed end-to-end run either.  Anything a diff hunk shows that
#  is not on that list is a real defect: fix the facade, do not extend the list.
#
#  ACCEPTED DIVERGENCES  (structural; each one normalised away by the gate)
#  D1. Declaration decoration.  `zlib.h` writes every prototype as
#        ZEXTERN <ret> ZEXPORT <name>(<args>);
#      (and `ZEXPORTVA` for the variadic `gzvprintf`).  `ZEXTERN`, `ZEXPORT`,
#      `ZEXPORTVA`, `FAR` and `z_const` are `zconf.h` macros.  cbindgen emits
#      none of them: `[fn] prefix` could prepend `ZEXTERN`, but there is no
#      hook for the `ZEXPORT` slot between the return type and the name, and
#      prepending `ZEXTERN` alone would leave the artifact uncompilable unless
#      it also included `zconf.h` -- which D3 shows it cannot.  The gate strips
#      all five tokens from the reference side.
#
#  D2. Struct tag names.  `style = "type"` emits
#      `typedef struct { ... } z_stream;`, whereas `zlib.h` names the tags:
#      `typedef struct z_stream_s { ... } z_stream;`, likewise `gz_header_s`.
#      `struct gzFile_s` is the mirror image -- `zlib.h` declares it as a bare
#      tag with no typedef, the generated header as a typedef.  Layout, field
#      order and field types are identical in every case, and those are what
#      `layout_assertions.rs` and `tests/abi_layout.rs` will verify once the
#      facade lands; the tag spellings carry no ABI weight.  The gate compares
#      struct FIELDS, not the typedef/tag form.
#
#  D3. Includes.  `zlib.h` includes exactly one header, conditionally:
#      `#ifdef ZLIB_BUILD` -> `<zconf.h>`, `#else` -> `"zconf.h"`.  cbindgen
#      cannot express a conditional include, and -- verified, not assumed -- it
#      MUST NOT emit that include at all:
#        * the facade declares the portability aliases (`Byte`, `Bytef`, `uInt`,
#          `uLong`, `voidpf`, `voidp`, `voidpc`, `z_crc_t`, `z_size_t`) so that
#          signatures read in zlib's own spellings, and cbindgen therefore
#          emits typedefs for them.  Those collide head-on with `zconf.h`:
#          gcc reports `conflicting types for 'Byte'` because `zconf.h` says
#          `unsigned char` where cbindgen says `uint8_t`.
#        * worse, `z_off_t` and `z_off64_t` are `#define`s in `zconf.h`, not
#          typedefs, so `typedef int64_t z_off_t;` macro-expands to
#          `typedef int64_t long long;` -- `two or more data types in
#          declaration specifiers`.
#        * suppressing the typedefs with `[export] exclude` does not work
#          either: cbindgen then cannot resolve the names it still has to
#          reference and aborts with `Can't find uLong` and exit status 101.
#      So the artifact is deliberately SELF-CONTAINED: `no_includes = true`
#      plus the three system headers its own typedefs need.  The gate ignores
#      `#include` lines and the portability typedef block.
#
#  D4. Preprocessor macros.  `zlib.h` carries `ZLIB_VERSION "1.3.2.1-motley"`,
#      `ZLIB_VERNUM 0x1321`, `ZLIB_VER_MAJOR/MINOR/REVISION/SUBREVISION`, the
#      flush and status constants, `Z_NULL`, the `deflateInit`/`inflateInit`
#      convenience macros, the `gzgetc` macro and the `Z_PREFIX` / `Z_WANT64`
#      renaming machinery.  A Rust `pub const` becomes a `#define`, so integer
#      constants do come across, but function-like macros and the string
#      version do not, and cbindgen has no way to reproduce the conditional
#      `#define` blocks.
#
#      SO THE GATE SPLITS THEM, and its advertised scope is exactly this split
#      rather than "the whole header":
#        * INTEGER OBJECT-LIKE MACROS ARE IN SCOPE and are compared by value
#          (rule 10).  These are the ones a `pub const` in the facade can drift
#          from -- `Z_NO_FLUSH` .. `Z_TREES`, `Z_OK` .. `Z_VERSION_ERROR`,
#          `Z_DEFLATED`, the strategy and data-type constants, `ZLIB_VERNUM`,
#          `ZLIB_VER_*` and `Z_NULL` -- so leaving them out would leave the one
#          macro category that CAN drift unguarded.
#        * FUNCTION-LIKE MACROS, THE STRING VERSION AND THE CONDITIONAL
#          `#define` BLOCKS ARE OUT OF SCOPE for this gate.  `deflateInit`,
#          `deflateInit2`, `inflateInit`, `inflateInit2`, `inflateBackInit`,
#          `gzgetc`, and the `Z_PREFIX` / `Z_WANT64` / `Z_LARGE64` renaming
#          blocks exist only in the immutable `zlib.h`; there is no Rust item
#          they could disagree with, and cbindgen cannot emit them at all.
#          What covers them instead is gate 4, the C89 -> gnu2x compile sweep
#          over the UNCHANGED header, plus `test/example.c` relinked against the
#          Rust library -- it drives `deflateInit` (L181), `inflateInit` (L222)
#          and `gzgetc` (L141) through the macros, so a macro that stopped
#          agreeing with the exported `_` forms would fail it -- and, once it is
#          written, `tests/c_api_parity.rs`.  Neither the relink nor that test
#          runs today.
#        * `ZLIB_VERSION`, the string, is likewise out of scope here and is to be
#          checked by comparing `zlibVersion()`'s return value against the
#          header literal -- the check `test/example.c` makes before anything
#          else, and which `tests/c_api_parity.rs` is to mirror.
#
#      Do not widen this gate to "the full header contract" in prose without
#      widening rule 10 to match: an over-claimed scope is worse than a narrow
#      one, because it stops anyone from adding the check that is missing.
#
#  D5. Large-file duplicate declarations.  `zlib.h` declares `gzopen`,
#      `gzseek`, `gztell`, `gzoffset`, `adler32_combine`, `crc32_combine` and
#      `crc32_combine_gen` more than once, under `Z_LARGE64`, `Z_WANT64`,
#      `!Z_LARGE64`, `Z_SOLO` and `Z_PREFIX_SET`.  `zlib.h` holds 119 `ZEXTERN`
#      declaration sites in total, naming 101 distinct functions, of which 95
#      sites are unconditional and name 94 functions (`gzprintf` is declared
#      twice).  Which spelling a caller resolves
#      depends on ITS OWN `_FILE_OFFSET_BITS` / `_LARGEFILE64_SOURCE`, so BOTH
#      the plain and the `*64` families must be exported, and they are -- but
#      cbindgen emits each `#[no_mangle]` function exactly once,
#      unconditionally.
#
#      The trap here, and it is a real one: the duplicates are NOT textually
#      identical, so "de-duplicate by name" is ambiguous and silently picks a
#      winner.  `gzseek64` takes `z_off64_t` under `Z_LARGE64` but `z_off_t`
#      under `Z_WANT64 && !Z_LARGE64`; likewise `gztell64` and `gzoffset64`.
#      The gate must therefore RESOLVE the reference header under one declared
#      configuration rather than de-duplicate textually.  The configuration to
#      declare is the reference build's own: `-D_LARGEFILE64_SOURCE=1` and NOT
#      `-D_FILE_OFFSET_BITS=64`, which yields `Z_LARGE64` defined, `Z_WANT64`
#      undefined, and every one of the 14 large-file names declared exactly
#      once -- 7 `*64` in terms of `z_off64_t` and 7 plain in terms of
#      `z_off_t`.  Verified by preprocessing `zlib.h` with that single flag.
#
#  D6. Feature gating.  Items behind `#[cfg(feature = "...")]` are wrapped in
#      `#if defined(...)` using the `[defines]` map at the bottom of this file.
#      `zlib.h` gates the same functions differently -- the gz family sits
#      inside `#ifndef Z_SOLO`, `gzvprintf` additionally inside
#      `#if defined(STDC) || defined(Z_HAVE_STDARG_H)`, `gzopen_w` inside
#      `#if defined(_WIN32) && !defined(Z_SOLO)`.  cbindgen can only emit
#      positive `defined(X)` tests, so the conditions are spelled differently
#      even where they mean the same thing.  Both the standalone compile check
#      and the gate must therefore define the feature macros of the
#      configuration the header was generated from; with the default feature
#      set that is `-DZLIB_RS_LIBZ_COMPAT -DZLIB_RS_GZ`.
#
#  D7. Declaration order.  `sort_by = "Name"` alphabetises prototypes and
#      constants.  `zlib.h` orders them thematically and interleaves deflate
#      with inflate, which no module layout in the facade can reproduce.
#      Sorting is chosen deliberately: it makes the artifact byte-stable under
#      any future reorganisation of the facade's modules, so a diff hunk always
#      means a real change.  The gate sorts both sides.
#
#  D8. Comment text.  `documentation = true` carries the facade's `///` doc
#      comments across (see the "documented public API" requirement), rendered
#      as `/* ... */`.  They are not, and are not meant to be, a transcription
#      of `zlib.h`'s prose.  The gate strips comments before comparing.
#
#  D9. Trailing `#endif` labels.  cbindgen hard-codes `#endif  // __cplusplus`
#      (clike.rs) where `zlib.h` writes a bare `#endif`, and writes
#      `#endif  /* ZLIB_H */` with two spaces where `zlib.h` uses one.  An
#      `#endif` carrying trailing tokens is a constraint violation in C89, so
#      the standalone compile check needs `-Wno-endif-labels` at `-std=c89`;
#      `-std=c99` and later are unaffected.  Verified on gcc 15 at `-std=c89`:
#      the `//` sequence on the `#endif` LINE draws only `-Wendif-labels` (a
#      `//` sequence inside CODE is a hard error there, which is why
#      `documentation_style = "c"` below is not negotiable).
#
#  D10. `linkage` scaffolding.  cbindgen brackets the prototypes with
#      `#ifdef __cplusplus` / `extern "C" {` / `}` in the same way `zlib.h`
#      does, but around a different span (prototypes only, rather than the
#      whole body).  The gate strips the `extern "C" {` and `}` tokens.
#
#  D11. `gzprintf` and `gzvprintf` are absent from the GENERATED HEADER, and
#      that is a cbindgen fact rather than a missing export.  Both symbols are
#      IMPLEMENTED and both are EXPORTED; they are simply not implemented in
#      Rust, so cbindgen has no Rust item to render.
#
#      `gzprintf` is C variadic (zlib.h L1549) and `gzvprintf` takes a `va_list`
#      (zlib.h L2047).  Defining either in Rust needs `c_variadic`, which is
#      UNSTABLE on the toolchain this workspace pins -- verified: rustc 1.97.1
#      stable rejects a variadic `extern "C" fn` with E0658, and the feature
#      only became stable on 1.99.0-nightly.  cbindgen can therefore see no
#      Rust item to emit for them.  Both names are a DECLARED, ENUMERATED
#      exception in the header gate -- and the exception list must be exactly
#      these two, so that a genuinely missing export cannot hide behind it.
#      When the pinned toolchain reaches a release with `c_variadic` stable,
#      delete this entry and require both names in Pass A.  Keep C1 and C2
#      regardless: they test something the header diff never can.
#
#  WHICH GATE OWNS WHAT
#  --------------------
#  Two of the four mechanical gates look at the same library and it is easy to
#  assume each covers the other's blind spot.  Neither does, so the boundary is
#  written down:
#
#    * THIS gate owns SHAPE.  For every name in the contract set it compares
#      the return type, the parameter types, the struct fields and the constant
#      values.  It cannot see whether a symbol is actually exported, because it
#      reads source-derived text and never opens the built library.
#    * The `nm` gate (`crates/libz-rs-sys/tests/symbol_parity.rs`, and the four
#      comparisons in `Makefile.in`'s `rust-test`) owns the SYMBOL SET -- every
#      contract name present, nothing extra, the 16 `zlib.map` version nodes
#      present, the `local:` set hidden.  It cannot see a single type.
#
#  Consequences worth stating, because both are ways a reviewer could believe
#  something is checked when it is not:
#    * An EXTRA constant in the generated header is not a contract violation
#      and this gate does not fail on one.  `generated_zlib.h` is scratch, is
#      never installed and is on `.gitignore`, so a `#define` in it reaches no
#      consumer.  Extra exported SYMBOLS are a different matter entirely and
#      are a hard failure -- in the `nm` gate.  Today the facade emits seven
#      such extras, all of them `crates/libz-rs-sys/src/panic_guard.rs`
#      recovery values (`ADLER32_EMPTY`, `COMBINE_INVALID`, `CRC32_EMPTY`,
#      `GZ_ERROR`, `GZ_NOTHING_WRITTEN`, `GZ_NO_ITEMS`, `GZ_TRUE`); the gate
#      reports them as a notice so they stay visible.
#    * A name MISSING from the generated side is a failure in Pass A and in
#      Pass B, subject only to the enumerated exceptions each pass names.
#
#      BE PRECISE ABOUT WHAT COVERS THEM INSTEAD, because it is less than it
#      sounds.  The `nm` symbol-parity gate can only establish that symbols
#      named `gzprintf` and `gzvprintf` are EXPORTED; it says nothing about
#      whether either one honours the C variadic / `va_list` calling convention,
#      because `nm` never calls anything.  Defining them at all on the declared
#      MSRV is an OPEN ARCHITECTURE QUESTION, recorded as such in
#      `crates/zlib-rs/src/gz/printf.rs`: there is no stable-Rust mechanism for
#      it at 1.80, so it needs either an MSRV-compatible shim that is proved by
#      an actual call from C, or an explicit, documented decision.  Until one of
#      those lands, treat these two as UNRESOLVED rather than as covered
#      elsewhere, and do not let this entry read as though a substitute gate
#      already discharges them.
#
#  NORMALISATION RULES THE GATE MUST IMPLEMENT
#  -------------------------------------------
#  This is the SPECIFICATION of the comparison, and it is what has to be
#  implemented -- in `.github/workflows/rust.yml`, which does not exist yet --
#  before any command in this file can be described as a gate that passes.  Ten
#  rules, in this order:
#
#  PASS A -- SIGNATURES, STRUCTS AND TYPEDEFS
#  Validated against this configuration; reduces the comparison to ZERO
#  mismatches, ZERO missing and ZERO extra prototypes across the whole surface:
#
#    A1. strip `/* ... */` and `//` comments                           (D8)
#    A2. resolve the preprocessor rather than deleting `#` lines by hand.
#       Preprocess each side under its own DECLARED configuration:
#         reference : -D_LARGEFILE64_SOURCE=1
#         generated : -DZLIB_RS_LIBZ_COMPAT -DZLIB_RS_GZ
#       That is what makes D5 unambiguous and D3/D6/D9 disappear.  It is also
#       what destroys the macros, which is Pass B's subject.
#    A3. drop the `extern "C" {` and `}` linkage tokens                (D10)
#    A4. delete the tokens ZEXTERN, ZEXPORT, ZEXPORTVA, FAR, z_const   (D1)
#    A5. key each prototype by function name                           (D5,D7)
#    A6. drop parameter NAMES -- `zlib.h` omits them throughout the
#       large-file block (`adler32_combine(uLong, uLong, z_off_t)`) and
#       supplies them elsewhere, so they cannot be compared
#    A7. canonicalise bare `unsigned` to `unsigned int` and bare
#       `signed` to `int` -- `zlib.h` writes `gzread(gzFile, voidp,
#       unsigned)` where cbindgen writes `unsigned int`
#    A8. resolve the `zconf.h` typedef chain, so that alias-equivalent
#       spellings compare equal.  This rule is NOT optional: `zlib.h`
#       declares `inflateBackInit_`'s window as `unsigned char FAR *`
#       while the facade spells the same type `Bytef *`, and without
#       resolution that reads as a signature change.  The chain is
#         Bytef -> Byte -> unsigned char      uIntf -> uInt -> unsigned int
#         uLongf -> uLong -> unsigned long    z_crc_t -> Z_U4 (unsigned)
#         z_size_t -> size_t                  charf -> char, intf -> int
#         voidpf, voidp -> void *             voidpc -> const void *
#         z_off_t, z_off64_t -> off_t, off64_t (both 64-bit under Z_LARGE64)
#         z_streamp -> z_stream *             gz_headerp -> gz_header *
#         gzFile -> struct gzFile_s *
#    A9. restrict the comparison to the zlib API name set.  Rule A2 has a
#       side effect: `zconf.h` includes `<unistd.h>` when
#       `Z_HAVE_UNISTD_H` is set, so preprocessing the reference header
#       drags in roughly 119 libc prototypes (`read`, `write`, `lseek`,
#       `getpid`, ...).  Filter both sides to the names `zlib.h` declares
#       with `ZEXTERN` -- 96 distinct functions, counted as clippy.toml
#       explains -- or equivalently to the `zlib.map` global set.
#   10. compare the INTEGER OBJECT-LIKE MACROS by value, per D4.  Collect
#       them from each preprocessed side (`gcc -dM -E` over the same
#       configuration rule 2 declares), keep only the names `zlib.h`
#       defines to an integer constant expression, evaluate both sides and
#       require equality.  Function-like macros, `ZLIB_VERSION` and the
#       conditional renaming blocks are excluded here by D4 and are covered
#       by the mechanisms D4 names.
#
#  After rules 1-10, compare the two name -> normalised-signature maps and the
#  two name -> integer-value maps.  A name present on one side only (D11
#  excepted), a name mapped to different signature text, or a constant with a
#  different value, is a FAILURE.
#
#  EXPECTED SHAPE OF A PASSING RUN, so that the implementation has a target to
#  aim at.  On this platform the reference side resolves 95 of the 96 declared
#  prototypes (`gzopen_w` is `_WIN32`-only) -- that number is measured from
#  `zlib.h` alone and is therefore solid.  A complete facade should then generate
#  93: the same 95 less the two D11 names.  The 2-name difference must be exactly
#  `gzprintf` and `gzvprintf`, with no signature mismatches, no constant
#  mismatches and no extra exports.  Nothing here has been observed end to end
#  yet, because the facade crate root does not exist; treat the 93 as the
#  requirement and re-derive it from the first real run.
#
#  MAINTENANCE NOTES
#  * Pinned tool: cbindgen 0.29.4.  Every key below was checked against that
#    version's `Config` definition.  0.29.x sets `#[serde(deny_unknown_fields)]`
#    on all of its config structs, so a misspelled key is a hard parse error
#    rather than a silent no-op -- but a key that is merely WRONG still yields a
#    plausible-looking, incorrect header, so change nothing here casually.
#  * Bumping cbindgen may change the incidental formatting D2/D9/D10 describe.
#    Re-verify those categories before accepting a new version.
#  * The authoritative surface is `zlib.h` itself.

#  cbindgen writes `header` verbatim BEFORE the include guard -- the same slot
#  `zlib.h` uses for its licence block.  This banner is the only decoration the
#  artifact carries, and it earns its place: `generated_zlib.h` is a header that
#  looks exactly like a public contract, and the one thing that must never
#  happen is for someone to install it, commit it, or edit it in the belief that
#  it is one.  `autogen_warning` is deliberately NOT used -- it lands INSIDE the
#  include guard, in the middle of the region the gate compares, whereas a
#  banner ahead of the guard is a fixed prefix the gate skips trivially.
header = '''
/* =========================================================================
 * generated_zlib.h -- GENERATED VERIFICATION ARTIFACT.  DO NOT USE.
 *
 * Produced by cbindgen from crates/libz-rs-sys to be diffed against the
 * immutable zlib.h.  It is NOT the public contract, it is NOT installed, it
 * is NOT committed (see /generated_zlib.h in .gitignore) and it is NOT
 * hand-edited.  zlib.h is read-only and is never regenerated from this.
 *
 * Regenerate with:
 *   cbindgen --config cbindgen.toml --crate libz-rs-sys --output generated_zlib.h
 *
 * The header guard below is ZLIB_H on purpose, so that including this file
 * and the real zlib.h in the same translation unit cannot double-declare the
 * API.  That also means this file SHADOWS zlib.h: never place it on an
 * include path that a real build searches.
 * ========================================================================= */'''



# C, never C++.  The reference it is compared against is a header that has
# compiled as C89 since 1995.
#
# Note what this does NOT claim: the generated artifact is not strictly
# conforming ISO C89.  It pulls in `<stdint.h>` and uses its fixed-width
# typedefs (both C99 additions, see `sys_includes` below), and cbindgen labels
# its own `#endif` with a `//` comment (D9).  The requirement on it is only that
# it be ACCEPTED by this project's C89-mode compile check -- `-std=c89` plus
# `-Wno-endif-labels`, verified on gcc 15 -- which is enough for the artifact's
# purpose, since it is a verification scratch file that is never installed and
# never compiled by a consumer.  The immutable `zlib.h` is the file that has to
# stay strictly C89, and gate 4 (`.github/workflows/c-std.yml`) is what holds it
# to that.
language = "C"

# Reproduces `#ifndef ZLIB_H` / `#define ZLIB_H` / `#endif` exactly as zlib.h
# L31-32 and its final line, so the artifact is guard-compatible with the real
# header rather than co-includable with it.  See D9 for the `#endif` label.
include_guard = "ZLIB_H"

# `#ifdef __cplusplus` / `extern "C" {` around the prototypes, matching
# zlib.h L40-42.  Without it every C++ consumer of the generated header would
# mangle the symbol names.  See D10 for the span difference.
cpp_compat = true

# Emits `typedef struct { ... } z_stream;` -- a typedef without a tag.  See D2:
# the ABI is identical, only the tag spelling is lost.
style = "type"

# Alphabetical, deterministic ordering.  See D7 for why this is a feature and
# not a compromise.
sort_by = "Name"

# 80 columns and 4-space indentation, following zlib.h's own house style.
line_length = 80
tab_width = 4

# LF only.  The C sources, `zlib.h` and every file in this workspace are LF;
# a CRLF artifact would make the diff useless on the very first line.
line_endings = "LF"

# `struct z_stream {` rather than a brace on the following line -- zlib.h's
# style, and the style the C sources use throughout.
braces = "SameLine"

#  Renders Rust `usize`/`isize` as `size_t`/`ptrdiff_t` instead of
#  `uintptr_t`/`intptr_t`.  This is correct and required, because `z_size_t` is
#  `size_t` on every STDC platform (zconf.h L265) and the `_z` entry points
#  (`compressBound_z`, `deflateBound_z`, `compress_z`, `compress2_z`,
#  `uncompress_z`, `uncompress2_z`) plus `adler32_z`, `crc32_z`, `gzfread` and
#  `gzfwrite` are all declared in terms of it.  Left at the default the
#  artifact would say `typedef uintptr_t z_size_t;` and diverge from zconf.h
#  for no reason.
#
#  It does NOT, and cannot, affect `uLong`.  This matters enormously: `uLong`
#  is `unsigned long` (zconf.h L406) -- 8 bytes on LP64 but 4 on LLP64 Windows
#  -- and conflating it with `size_t` would corrupt `total_in`, `total_out`,
#  `adler` and every checksum return value on one platform family or the other.
#  Verified in cbindgen's own `ir/ty.rs`: this flag is consulted only for
#  `IntKind::Size`, while `core::ffi::c_ulong` resolves to `IntKind::Long` and
#  renders as `unsigned long` unconditionally.  The facade must accordingly
#  spell `uLong` as `core::ffi::c_ulong` and never as `u64`, `usize` or any
#  other fixed-width type; that requirement lives in the facade, and this flag
#  neither helps nor hinders it.
usize_is_size_t = true

#  Suppress cbindgen's automatic include block and state the dependencies
#  exactly.  See D3 for the full reasoning, including the two compile failures
#  that rule out `includes = ["zconf.h"]` and the cbindgen abort that rules out
#  working around them with `[export] exclude`.
#
#  Left on, the automatic block would add `<stdbool.h>` and `<stdlib.h>`, which
#  nothing in the zlib surface needs, and would duplicate any entry repeated in
#  `sys_includes`.
#
#  The three below are the complete set the artifact's own declarations require:
#    stdarg.h  `va_list`, for gzvprintf (zlib.h L2047)
#    stddef.h  `size_t`, reached through `usize_is_size_t` above
#    stdint.h  `uint8_t`/`uint32_t`/`int64_t`, behind Bytef, z_crc_t, z_off64_t
#
#  `<stdint.h>` and `<stdarg.h>`'s `va_list` spelling are why the artifact is
#  C89-ACCEPTED rather than C89-conforming; see the note on `language` above.
#  The reference `zlib.h` needs neither header and is unaffected.
no_includes = true
sys_includes = ["stdarg.h", "stddef.h", "stdint.h"]

#  The facade documents every public item, and the generated header is where
#  that documentation becomes externally visible, so it is carried across in
#  full.  `"c"` gives `/* ... */`, the only comment form valid in C89 and the
#  form zlib.h uses; `"doxy"` would inject `\brief`-style markup that has no
#  counterpart in the reference header.  The gate strips comments (D8), so this
#  costs the comparison nothing.
documentation = true
documentation_style = "c"
documentation_length = "full"

#  Each of these would inject a line that changes when nothing about the API
#  changed -- a package version, a cbindgen version -- turning every routine
#  version bump into a spurious diff hunk.  The banner in `header` already
#  records what the artifact is, and it is fixed text.
package_version = false
include_version = false

# `#pragma once` is not C89 and not what zlib.h does; `include_guard` above is
# the portable form and the one that matches.
pragma_once = false

[export]

# No prefix.  Required: the exported names ARE the zlib names, and a prefix
# would rename every one of them at once. `Z_PREFIX` renaming is a caller-side
# `#define` game played inside zconf.h and must not be baked in here.
prefix = ""

# Every item kind, stated explicitly rather than left to the default empty
# filter, so that adding a kind to the facade can never silently drop it from
# the artifact and thus from the gate.  `"opaque"` is cbindgen's spelling for
# opaque items -- relevant to `struct internal_state`, which zlib.h L88
# forward-declares as an incomplete type and never defines.
item_types = [
    "constants",
    "globals",
    "enums",
    "structs",
    "unions",
    "typedefs",
    "opaque",
    "functions",
]

#  Understand the mechanism before adding an entry.  This table is an exact,
#  case-sensitive lookup on an item's own name, applied to typedefs, structs,
#  unions, enums, opaque items, constants and type references.  It is NOT
#  applied to primitives: cbindgen resolves `c_uint` to `unsigned int`, `u8` to
#  `uint8_t` and `c_ulong` to `unsigned long` before any renaming happens.  The
#  mechanism that will put zlib's spellings into the artifact is therefore the
#  facade's own aliases -- `pub type uInt = c_uint;` and friends, to be declared
#  in `crates/libz-rs-sys/src/types.rs` -- and this table is the safety net that
#  keeps the artifact correct if any of those items is ever spelled
#  idiomatically instead.
#
#  Why a safety net is warranted: the C spellings (`z_stream`, `gz_header`,
#  `gzFile_s`, `uInt`, `uLong`, ...) are only legal Rust identifiers under the
#  facade's `#![allow(non_camel_case_types)]`, which exists solely to permit
#  them while the crate is built with `deny(clippy::all, clippy::pedantic)`.
#  Remove that one attribute -- an entirely plausible future "cleanup" -- and
#  rustc's own `non_camel_case_types` suggestion renames every ABI type to
#  UpperCamelCase.  Every key below is exactly that suggestion, obtained by
#  compiling the 26 C type names as Rust items and reading back the
#  `help: convert the identifier to upper camel case` text, so the table is
#  derived and reproducible rather than guessed.  Note what that exercise ruled
#  out as well as in: the suggestion for `z_streamp` is `ZStreamp` and NOT
#  `ZStreamP`, for `voidp` it is `Voidp` and NOT `VoidP`, and `Byte` and `Bytef`
#  draw no warning at all, so no entry exists for them.
#
#  The `*_s` keys map to the TAG spellings `z_stream_s` and `gz_header_s`, not
#  to the typedef names, so no two keys can ever produce the same C name.
#
#  An entry whose key matches no item is inert: the lookup simply misses, with
#  no warning and no output change.  An entry that fires unexpectedly cannot
#  hide, because two items renamed to one C name produce a duplicate typedef
#  that the standalone compile check rejects.
#
#  Every value below is the spelling `zlib.h` or `zconf.h` requires, cited.
[export.rename]

# zlib.h L90-110 / L112 -- the stream, its struct tag and its pointer alias.
"ZStream" = "z_stream"
"ZStreamS" = "z_stream_s"
"ZStreamp" = "z_streamp"

# zlib.h L88 / L100 -- the opaque state. `z_stream.state` is declared
# `struct internal_state FAR *`, so this name is part of the struct's rendered
# form even though the type itself is never defined.
"InternalState" = "internal_state"

# zlib.h L85-86 -- the caller-supplied allocator pair.
"AllocFunc" = "alloc_func"
"FreeFunc" = "free_func"

# zlib.h L118-133 / L135 -- the gzip header, its tag and its pointer alias.
"GzHeader" = "gz_header"
"GzHeaderS" = "gz_header_s"
"GzHeaderp" = "gz_headerp"

# zlib.h L1354 / L1957-1961 -- the semi-opaque gzip file handle and the
# abbreviated struct the `gzgetc` macro dereferences in CALLER code, which is
# why its first three fields are ABI and not an implementation detail.
"GzFile" = "gzFile"
"GzFileS" = "gzFile_s"

# zconf.h L403-427 -- the portability typedefs. `Byte` and `Bytef` are already
# valid UpperCamelCase and so are never renamed; they need no entry.
"UInt" = "uInt"
"ULong" = "uLong"
"UIntf" = "uIntf"
"ULongf" = "uLongf"
"Charf" = "charf"
"Intf" = "intf"
"Voidp" = "voidp"
"Voidpc" = "voidpc"
"Voidpf" = "voidpf"

# zconf.h L255-267, L440-444, L495-531 -- width- and offset-dependent types.
# `z_off_t` and `z_off64_t` are `#define`s on the C side, which is one of the
# reasons the artifact cannot include zconf.h (D3).
"ZCrcT" = "z_crc_t"
"ZSizeT" = "z_size_t"
"ZOffT" = "z_off_t"
"ZOff64T" = "z_off64_t"

# zlib.h L2042 -- `gzopen_w(const wchar_t *path, const char *mode)`. Rust has
# no `wchar_t` primitive and cbindgen knows no such name, so the facade has to
# declare the alias itself for the Windows-only entry point to render with the
# spelling the contract uses; this entry keeps that alias correct if it is ever
# named idiomatically.
"WcharT" = "wchar_t"

[parse]

# The facade is to own every `#[repr(C)]` ABI type the artifact needs, in
# `src/types.rs`, and the only other crate in its dependency graph is the
# `#![forbid(unsafe_code)]` core, which by design exports no C types at all.  Parsing dependencies would
# therefore add nothing and would risk dragging a core type into the public
# header, so it stays off.  It also keeps the run fast and hermetic: no
# `cargo metadata` walk, no network, no build of anything.
parse_deps = false

[fn]

# One prototype per line, always.  With `"auto"` cbindgen wraps anything over
# `line_length` into a vertical, paren-aligned block, which looks more like
# zlib.h but forces the gate to reassemble multi-line declarations before it
# can compare them.  Horizontal makes the artifact a flat list of one-line
# prototypes -- the cleanest possible input for a normalised, sorted
# comparison -- at the cost of some long lines in a file no human maintains.
args = "horizontal"

# Alphabetical, for the reasons in D7. Stated here as well as at the top level
# because this is the setting that orders the function block itself.
sort_by = "Name"

# NOT set, deliberately:
#   prefix / postfix  -- see D1. `prefix` would emit `ZEXTERN`, but there is no
#                        hook for the `ZEXPORT` slot, and `ZEXTERN` is a
#                        zconf.h macro that would be undefined in a
#                        self-contained artifact (D3).  Half the decoration,
#                        plus a header that will not compile, is strictly worse
#                        than none.
#   must_use / deprecated / deprecated_with_note / no_return
#                     -- zlib.h annotates nothing. Adding attributes would
#                        invent API surface the contract does not have.
#   rename_args       -- parameter names are dropped by the gate (rule 6) and
#                        renaming them would only obscure the facade's own
#                        naming.
#   swift_name_macro  -- not a Swift consumer.


#  zlib.h is a 1995-era C89 header. Every generator convenience below would add
#  something it does not have, so all of them are pinned off rather than left
#  to a default that a future cbindgen release might flip.  "Plain" here means
#  "adds no construct the reference lacks"; it is not a claim that the artifact
#  as a whole is conforming C89 -- see the note on `language` above for the two
#  places it is not.

[struct]

# No synthesised constructors or comparison operators. These are C++ emissions
# and `language = "C"` already suppresses them; pinning them makes that
# explicit for `z_stream`, `gz_header` and `gzFile_s`, whose exact rendered
# field list is the thing being verified (D2).
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false
derive_ostream = false

[enum]

# The zlib surface has no C enums -- flush modes, status codes and strategies
# are all `#define`d integers (zlib.h L172-L206). These settings therefore
# describe a case that should not arise, and are pinned so that if a future
# facade change does introduce an enum it cannot silently arrive decorated with
# name-prefixed variants or a synthetic sentinel that the contract lacks.
prefix_with_name = false
add_sentinel = false
derive_helper_methods = false
enum_class = false

[const]

# Rust `pub const` items become plain `#define`s, which is exactly the form
# zlib.h uses for `Z_NO_FLUSH`, `Z_OK`, `Z_DEFLATED`, `Z_NULL` and the rest
# (D4). `static const` and `constexpr` are C++ forms and are refused.
allow_static_const = false
allow_constexpr = false
sort_by = "Name"

[macro_expansion]

# No `bitflags!` expansion. Nothing in the facade uses it, and generated
# flag-type scaffolding is precisely the sort of Rust idiom that has no place
# in this header.
bitflags = false

#  Any item behind a `cfg` is emitted inside `#if defined(<value>)`. A `cfg`
#  with no entry here makes cbindgen print
#  `WARN: Missing [defines] entry for ...` and then drop the condition, so the
#  item silently becomes unconditional -- a warning the zero-warning bar
#  forbids and a behaviour the gate must not be exposed to. Every `cfg` the
#  facade can plausibly carry is therefore mapped, including the ones that
#  currently gate nothing.
#
#  Key grammar, from cbindgen's `DefineKey::load`: `"name = value"` for
#  `#[cfg(name = "value")]` with the value UNQUOTED, or a bare `"name"` for
#  `#[cfg(name)]`. Whitespace around `=` is trimmed.
#
#  Consequence for consumers of the artifact, restated because it is easy to
#  trip over (D6): with the crate's default features the header must be
#  preprocessed with `-DZLIB_RS_LIBZ_COMPAT -DZLIB_RS_GZ` or the gz family and,
#  depending on how the facade gates its modules, the entire exported surface
#  will be invisible -- and a gate that compares nothing passes.

[defines]

# The four features declared by crates/libz-rs-sys/Cargo.toml. `libz-compat`
# and `gz` are default-on; `simd` and `libc` are default-off and gate no
# exported item today, but are mapped so that adding one cannot introduce a
# warning.
"feature = libz-compat" = "ZLIB_RS_LIBZ_COMPAT"
"feature = gz" = "ZLIB_RS_GZ"
"feature = simd" = "ZLIB_RS_SIMD"
"feature = libc" = "ZLIB_RS_LIBC"

# Windows-only items, chief among them `gzopen_w` (zlib.h L2042), which the
# reference header gates on `#if defined(_WIN32) && !defined(Z_SOLO)`. All
# three spellings a facade might write are mapped onto `_WIN32`, so the
# generated condition agrees with the reference one on the half cbindgen is
# able to express.
"windows" = "_WIN32"
"target_family = windows" = "_WIN32"
"target_os = windows" = "_WIN32"

#  language = "C++"        The contract is C. C++ consumers are served by
#                          `cpp_compat` above, exactly as zlib.h serves them.
#  namespace / namespaces / using_namespaces
#                          C++-only, and namespacing the API would break every
#                          existing caller. `[export] prefix` is empty for the
#                          same reason.
#  includes                See D3: emitting `#include "zconf.h"` makes the
#                          artifact fail to compile.
#  after_includes / trailer / autogen_warning
#                          Free-text injected inside the region the gate
#                          compares. The `header` banner sits outside it and
#                          does the same job without the cost.
#  [layout] packed / aligned_n
#                          The ABI types are plain `#[repr(C)]`; no packing or
#                          forced alignment exists to annotate, and inventing
#                          an annotation would misdescribe the layout that
#                          `layout_assertions.rs` is to pin.
#  [ptr] non_null_attribute / nullable_attribute
#                          zlib's contract is that a NULL stream returns
#                          `Z_STREAM_ERROR` rather than being undefined, so
#                          nullability annotations would contradict it.
#  [parse] expand          Requires a nightly `rustc -Zunpretty=expanded` run.
#                          The facade uses no macros that need expanding, and
#                          the header gate must work on stable.
#  [cython]                Not a Cython consumer.
