# ============================================================================
# Cargo manifest for `zlib-rs` — a memory-safe Rust rewrite of zlib.
# ============================================================================
#
# This is the foundational manifest of the C→Rust rewrite of the zlib
# general-purpose lossless data-compression library. Every other file in the
# crate (src/*, tests/*, benches/*, build.rs) depends on the package name,
# edition, feature set, and dependency graph declared here.
#
# Derived from the C baseline's build descriptors:
#   * CMakeLists.txt — project name / version (1.3.2.1) / description /
#     homepage, and the shared+static library build options that map to the
#     `crate-type = ["lib", "cdylib", "staticlib"]` triple below.
#   * zlib.h         — version constants (ZLIB_VERSION "1.3.2.1-motley",
#     ZLIB_VERNUM 0x1321). NOTE: the FULL 4-part runtime version string and
#     ZLIB_VERNUM are reported by the FFI `zlibVersion()` / `ZLIB_VERSION` in
#     `src/` — Cargo SemVer cannot encode a 4-component version, so the crate
#     `version` below is the 3-part `1.3.2` mirror.
#
# The crate is materialized in-tree at the repository root alongside (and
# ultimately replacing) the C baseline (AAP §0.1.1, §0.3.1).

[package]
name = "zlib-rs"
# 3-part SemVer mirroring the C baseline `1.3.2.1`. The full runtime string
# "1.3.2.1-motley" and ZLIB_VERNUM 0x1321 are surfaced by the FFI layer in src/,
# not here (Cargo SemVer has no 4th component).
version = "1.3.2"
edition = "2024"
# Rust 2024 edition was stabilized in Rust 1.85.0; that is the crate's MSRV
# (AAP §0.3.3 / §0.5.1).
rust-version = "1.85.0"
description = "A safe-Rust rewrite of the zlib general-purpose lossless data-compression library, byte-compatible with C zlib and exposing a drop-in C ABI."
homepage = "https://zlib.net/"
repository = "https://github.com/Blitzy-Sandbox/blitzy-zlib"
# SPDX identifier for the zlib/libpng license carried verbatim in `LICENSE`.
# The zlib license is a standard SPDX expression, so the single `license` field
# is sufficient and authoritative; `license-file` is intentionally omitted to
# avoid Cargo's "only one of `license` or `license-file` is necessary" warning
# (which otherwise prints on every cargo invocation). The verbatim `LICENSE`
# file is still shipped in the package and remains the canonical license text.
license = "Zlib"
readme = "README.md"
keywords = ["compression", "zlib", "deflate", "gzip", "crc32"]
categories = ["compression", "no-std", "api-bindings"]
# Build script generates the CRC-32 tables at build time (mirroring the
# upstream generation of crc32.h) and invokes cbindgen to emit the C header.
build = "build.rs"
authors = [
    "Jean-loup Gailly <jloup@gzip.org>",
    "Mark Adler <madler@alumni.caltech.edu>",
    "Blitzy <agent@blitzy.com>",
]
# Keep `cargo package` lean: drop the legacy C platform-packaging trees and
# large binary docs that are not part of the Rust crate. Patterns are anchored
# to the package root and only affect packaging/publishing (not builds).
exclude = [
    "/contrib",
    "/win32",
    "/amiga",
    "/msdos",
    "/os400",
    "/qnx",
    "/watcom",
    "*.pdf",
]

# ----------------------------------------------------------------------------
# [lib] — produce the Rust rlib PLUS the C-linkable cdylib/staticlib so the
# crate is a binary-level drop-in for libz (AAP §0.3.1, §0.3.3, §0.5.1).
# The cdylib (.so/.dylib/.dll) and staticlib (.a) carry the
# `#[no_mangle] extern "C"` symbols defined in `src/ffi.rs`.
# ----------------------------------------------------------------------------
[lib]
name = "zlib_rs"
crate-type = ["lib", "cdylib", "staticlib"]

# ----------------------------------------------------------------------------
# [features] — Cargo features replace the C preprocessor conditionals
# (AAP §0.5.2). The `no-std` feature is MUTUALLY EXCLUSIVE with `std`; Cargo
# cannot hard-enforce that, so `src/lib.rs` carries a `compile_error!` guard
# when both are enabled.
# ----------------------------------------------------------------------------
[features]
default = ["std", "gzip", "gz-io", "simd"]
# Heap + `std::io`; the default C build.
std = []
# `#ifdef GZIP` — gzip wrapper-format support in deflate/inflate.
gzip = []
# gzip FILE-I/O layer; implies `std` + `gzip`
# (replaces `#ifndef NO_GZCOMPRESS` / `NO_GZIP`).
gz-io = ["std", "gzip"]
# `Z_SOLO` bare-metal build — mutually exclusive with `std` (enforced in src/lib.rs).
no-std = []
# SIMD-accelerated CRC-32 via the optional `crc32fast` dependency.
simd = ["dep:crc32fast"]
# Gates the `#[no_mangle] extern "C"` drop-in C-ABI surface (`src/ffi.rs`).
#
# When enabled, the crate exports the canonical zlib C symbols (`deflate`,
# `inflate`, `crc32`, `adler32`, `compress2`, `uncompress`, …) so the
# `cdylib`/`staticlib` artifacts act as a binary-level replacement for `libz`.
# The `build.rs` script also keys cbindgen C-header generation off this feature
# (it checks `CARGO_FEATURE_CAPI`). It is left OFF by default — and in
# particular for `cargo test` — because those canonical symbol names would
# otherwise collide at link time with the bundled C zlib pulled in by the
# `flate2` dev-dependency's `zlib` backend.
#
# MSRV / toolchain note: this OPTIONAL feature raises the build requirements
# above the crate's default-feature MSRV (Rust 1.85). The variadic `gzprintf` /
# `gzvprintf` drop-in symbols are exported as `#[unsafe(naked)]` trampolines
# (stabilized in Rust 1.88) that tail-call a tiny C shim (`csrc/gzprintf.c`,
# compiled by the `cc` build-dependency), because stable Rust cannot express C
# variadics. Building with `--features capi` therefore requires Rust >= 1.88
# and a C compiler. The default, pure-Rust library is unaffected and still
# builds on Rust 1.85. (AAP §0.3.1 elevates the C-ABI drop-in to a prompt-
# mandated, additive deliverable; AAP §0.7.2's "zero C dependency" applies to
# the shipped pure-Rust artifact, not this opt-in C-ABI bridge.)
capi = []

# ----------------------------------------------------------------------------
# [dependencies] — runtime. Kept deliberately MINIMAL: C zlib has zero external
# dependencies, so the shipped crate must too. Only these two are permitted
# (AAP §0.5.1, §0.5.2); the shipped artifact carries ZERO C dependency.
# ----------------------------------------------------------------------------
[dependencies]
# SIMD-accelerated CRC-32 (IEEE) backing `src/checksum/crc32.rs`; `no_std`-capable
# (hence `default-features = false`); pulled in only by the `simd` feature.
crc32fast = { version = "1.5.0", optional = true, default-features = false }
# Ergonomic `cfg` branching for feature/arch gates.
cfg-if = "1.0.0"

# ----------------------------------------------------------------------------
# [build-dependencies] — build-time only; never linked into the shipped crate.
# ----------------------------------------------------------------------------
[build-dependencies]
# Invoked by `build.rs` to generate the C header (zlib.h-equivalent) from the
# `#[no_mangle] extern "C"` signatures and `#[repr(C)]` types in `src/ffi.rs`.
cbindgen = "0.28.0"
# Compiles the variadic `gzprintf`/`gzvprintf` C shim (`csrc/gzprintf.c`) into
# the `cdylib`/`staticlib` drop-in. `build.rs` only invokes it when BOTH the
# `capi` and `gz-io` features are active (checked at runtime via the
# `CARGO_FEATURE_*` env vars), so the default pure-Rust build compiles and
# links NO C — the shipped Rust crate stays free of any C dependency (AAP
# §0.7.2). `cc` itself is a build-time tool (it merely drives the system
# C compiler); it is never linked into the library artifact.
cc = "1.2"

# ----------------------------------------------------------------------------
# [dev-dependencies] — test/bench only; never linked into the shipped artifact.
# ----------------------------------------------------------------------------
[dev-dependencies]
# Statistical benchmarking harness for `benches/*` (performance gates AAP §0.3.3).
criterion = "0.5.1"
# Reference ORACLE: the `zlib` feature selects flate2's canonical C-zlib backend
# (libz-sys), used by `tests/interop.rs` for byte-for-byte interop validation.
# This is the ONLY place C zlib appears, and it is strictly DEV-ONLY.
#
# Symbol-collision note for the `src/ffi.rs` author: this backend exports the
# canonical C symbols (`deflate`, `inflate`, `crc32`, …) which can clash at
# test-link time with the crate's own `#[no_mangle]` exports. Those exports are
# therefore gated behind the `capi` feature declared above (enabled for the
# cdylib/staticlib drop-in, disabled for `cargo test`), so the default test
# build links cleanly against this backend. `capi` is OFF by default.
flate2 = { version = "1.1.1", features = ["zlib"] }
# Property-based round-trip testing.
quickcheck = "1.0.3"
# Randomized test-data generation.
rand = "0.9.0"

# ----------------------------------------------------------------------------
# [[bench]] — criterion harnesses (AAP §0.3.1, §0.4.1). `harness = false` is
# required so criterion provides its own `main`. Sources live in `benches/`.
#
# CHECKPOINT NOTE: the benchmark sources (`benches/deflate_bench.rs`,
# `benches/inflate_bench.rs`, `benches/checksum_bench.rs`) are produced together
# with the compression engine in the next checkpoint. Cargo validates that every
# declared target file exists while *parsing* the manifest, so declaring these
# `[[bench]]` targets now — before their source files land — makes the manifest
# unparseable and breaks `cargo build`, `cargo clippy --all-targets`, and
# `cargo bench --no-run` for the whole crate. They are therefore commented out
# until the bench sources exist, at which point the three blocks below are
# re-enabled verbatim.
# ----------------------------------------------------------------------------
# [[bench]]
# name = "deflate_bench"
# harness = false
#
# [[bench]]
# name = "inflate_bench"
# harness = false
#
# [[bench]]
# name = "checksum_bench"
# harness = false

# ----------------------------------------------------------------------------
# [profile.release] — tuned for throughput/footprint parity with C zlib
# (performance gates AAP §0.3.3: ≥80% compression, ≥ decompression, ≤ memory).
# `panic = "abort"` is appropriate for the cdylib drop-in; the test profile
# keeps unwinding, and the `bench` profile inherits these release settings.
# ----------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
