[package]
name = "zlib-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Pure-Rust rewrite of the zlib compression library (DEFLATE/zlib/gzip) with a C-compatible FFI"
license = "Zlib"
repository = "https://github.com/Blitzy-Sandbox/blitzy-zlib"
keywords = ["zlib", "deflate", "gzip", "compression", "crc32"]

# Produces the Rust rlib plus the C-linkable cdylib (.so) and staticlib (.a)
# required for the drop-in `libz` replacement described in the migration plan.
[lib]
name = "zlib_rs"
crate-type = ["lib", "cdylib", "staticlib"]

# Cargo features replace the C preprocessor conditionals (GZIP, NO_GZCOMPRESS,
# Z_SOLO) and the SIMD/platform-detection paths.
[features]
default = ["std", "gzip", "gz-io", "simd"]
std = []
gzip = []
gz-io = ["std", "gzip"]
no-std = []
simd = ["dep:crc32fast"]

[dependencies]
# Ergonomic conditional compilation (replaces C #if/#ifdef chains).
cfg-if = "1.0.0"
# SIMD-accelerated CRC-32 (IEEE); gated behind the `simd` feature; no_std-capable.
crc32fast = { version = "1.5.0", optional = true, default-features = false }

[dev-dependencies]
# Statistical benchmarking harness for the performance gates.
criterion = "0.5.1"
# Reference oracle for byte-identical interop validation against canonical zlib.
flate2 = "1.1.1"
# Property-based round-trip testing.
quickcheck = "1.0.3"
# Randomized test-data generation.
rand = "0.9.0"
