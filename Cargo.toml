# Cargo manifest for `zlib-rs` — an idiomatic, memory-safe Rust reimplementation
# of zlib (`1.3.2.1-motley`) with a C-compatible FFI drop-in layer.
#
# Replaces the C project's CMake/autotools build. The crate emits a Rust
# library plus `cdylib`/`staticlib` artifacts so it can serve both Rust
# consumers and C consumers requiring a drop-in shared or static object.

[package]
name = "zlib-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Zlib"
description = "Idiomatic, memory-safe Rust reimplementation of zlib (DEFLATE / zlib / gzip) with a C-compatible FFI drop-in layer"
readme = "README.md"
repository = "https://github.com/blitzy/zlib-rs"
keywords = ["zlib", "deflate", "gzip", "compression", "ffi"]
categories = ["compression", "api-bindings", "no-std"]
build = "build.rs"

[lib]
# `zlib_rs` (underscore) is the linked artifact name: `libzlib_rs.{so,a}`.
name = "zlib_rs"
# `lib` for Rust consumers; `cdylib`/`staticlib` for the C drop-in.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# SIMD-accelerated CRC-32 backing `checksum::crc32` (pulled in only by `simd`).
crc32fast = { version = "1.5.0", optional = true }
# Ergonomic multi-branch conditional compilation (mirrors C `#if`/`#ifdef`).
cfg-if = "1.0.4"

[dev-dependencies]
# Statistical benchmarking harness for `benches/*.rs`.
criterion = "0.5.1"
# Reference DEFLATE implementation for interop/round-trip cross-checks. Pinned
# to the pure-Rust `miniz_oxide` backend so tests require no C toolchain.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# Property-based round-trip testing.
quickcheck = "1.1.0"
# Randomized test-data generation.
rand = "0.9.2"

[features]
# The default build is a full, std-backed zlib replacement.
default = ["std", "gzip", "gz-io", "simd"]
# Standard-library build (filesystem, panic guards via `catch_unwind`).
std = []
# gzip framing within deflate/inflate (maps C `#ifdef GZIP`).
gzip = []
# gzip file-I/O layer (`gz*` API). Fundamentally needs the filesystem, so it
# implies `std`; it also implies `gzip` since it emits/consumes gzip streams.
gz-io = ["std", "gzip"]
# SIMD-accelerated CRC-32 hot path via `crc32fast`.
simd = ["dep:crc32fast"]
# C variadic `gzprintf`/`gzvprintf` shims. These require the unstable
# `c_variadic` language feature and therefore a nightly toolchain; disabled by
# default so the crate builds on stable.
c-variadic = []
# Optional stricter inflate distance validation (maps the C `INFLATE_STRICT`
# compile-time switch). Off by default so the default build stays byte-exact
# with reference zlib; enable only to reject out-of-window distances early.
inflate_strict = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
