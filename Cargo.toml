[package]
name = "zlib-rs"
version = "1.3.2"
edition = "2024"
rust-version = "1.85.0"
authors = [
    "Jean-loup Gailly <jloup@gzip.org>",
    "Mark Adler <madler@alumni.caltech.edu>",
]
description = "A pure Rust implementation of the zlib compression library"
license = "Zlib"
repository = "https://github.com/madler/zlib"
documentation = "https://docs.rs/zlib-rs"
readme = "README.md"
keywords = ["compression", "zlib", "deflate", "gzip", "inflate"]
categories = ["compression", "no-std"]
exclude = [
    "amiga/**",
    "contrib/**",
    "doc/**",
    "examples/**",
    "os400/**",
    "test/**",
    "watcom/**",
    "win32/**",
    ".github/**",
    "*.c",
    "*.h",
    "CMakeLists.txt",
    "Makefile",
    "Makefile.in",
    "configure",
    "zlib.map",
    "zlib.pc.cmakein",
    "treebuild.xml",
    ".cmake-format.yaml",
    "README-cmake.md",
]

[lib]
name = "zlib_rs"
path = "src/lib.rs"

[features]
default = ["std", "gzip", "gz-io", "simd"]
std = []
gzip = []
gz-io = ["std", "gzip"]
no-std = []
simd = ["crc32fast"]

[dependencies]
crc32fast = { version = "1.5.0", optional = true }
cfg-if = "1.0.0"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
rand = "0.9.0"
flate2 = "1.1.1"
quickcheck = "1.0.3"

[[bench]]
name = "deflate_bench"
harness = false

[[bench]]
name = "inflate_bench"
harness = false

[[bench]]
name = "checksum_bench"
harness = false

[profile.release]
opt-level = 3
lto = true

[profile.bench]
inherits = "release"
