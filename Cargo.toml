# zlib — Cargo workspace root.
#
# A VIRTUAL manifest: it declares no [package], owns no source file and no build
# target.  Its job is to define the workspace the memory-safe Rust
# reimplementation of zlib is built from and to hold the settings every member
# inherits, so that they cannot drift apart.
#
# Layering:
#
#   crates/zlib-rs               The safe core.  Carries #![forbid(unsafe_code)]
#                                and #![no_std] + `extern crate alloc`, and has an
#                                EMPTY [dependencies] table.  All algorithmic
#                                logic lives here: deflate, trees (Huffman),
#                                inflate (with inftrees and inffast folded in),
#                                infback, adler32, crc32, the gzip file layer and
#                                the one-shot wrappers.
#
#    crates/libz-rs-sys           The C ABI facade.  The ONLY crate permitted to
#                                 use `unsafe`, and the only crate that exports
#                                 symbols.  `[lib] name = "z"` with
#                                 crate-type = ["cdylib", "staticlib", "rlib"]
#                                 makes Cargo write target/<profile>/libz.so and
#                                 libz.a, and its build script writes a
#                                 README-cargo-artifacts.txt beside them saying
#                                 which of them may be installed.  Measured on
#                                 those artifacts: SONAME libz.so.1 and 96
#                                 exported function symbols.  They are the BASE of
#                                 the drop-in rather than the finished article --
#                                 the 16 symbol-version nodes and the two
#                                 C-variadic gz entry points come from the
#                                 packaging relink, `make rust`, for reasons
#                                 set out in crates/libz-rs-sys/Cargo.toml.
#                                 The versioned names libz.so.1 and
#                                 libz.so.1.3.2.1-motley are deliberately NOT
#                                 staged beside the cargo output: a build script
#                                 runs before the link, so its copies were left
#                                 dangling by `cargo check', by any failed build
#                                 and by `cargo clean -p' -- and a dangling
#                                 libz.so.1 on a loader path falls through to the
#                                 system libz exactly as if it were absent, while
#                                 its presence put this incomplete library under
#                                 the as/ar/nm/rustc that were building it.  They
#                                 exist once, in what `make rust' stages.
#
#   crates/zlib-rs-differential  Dev-only oracle harness.  Its build script
#                                compiles the in-tree C translation units with `cc`
#                                into a test-only static archive so that the Rust
#                                encoder's output can be diffed byte for byte
#                                against the reference implementation in a single
#                                process.  It is never a dependency of either
#                                shipped crate, which is what keeps
#                                `cargo build --release` free of any C compiler.
#
# The C sources in this directory are retained and unmodified; they serve only as
# the algorithmic oracle.  zlib.h, zconf.h and zlib.map are the immutable public
# contract and are never edited, generated or overwritten by the Rust build.
#
#  Build and verification entry points.  Note the package selection: the two
#  shipped crates are named explicitly, because `--workspace` and a bare
#  `cargo build` also reach crates/zlib-rs-differential, whose build script
#  compiles the in-tree C sources and therefore needs a C toolchain.  The
#  `default-members` key below makes a bare `cargo build` select the shipped pair
#  on its own; the `-p` forms are spelled out anyway so a command copied out of
#  this file keeps working if that key is ever changed.
#
#    cargo build --release -p zlib-rs -p libz-rs-sys          # the shipped pair
#    cargo build --release -p libz-rs-sys --features libz-compat
#                                                             # C-ABI library
#    cargo test --release -p zlib-rs -p libz-rs-sys
#    cargo clippy -p zlib-rs -p libz-rs-sys --all-targets -- -D warnings
#    cargo fmt -p zlib-rs -p libz-rs-sys -- --check
#    cargo deny check                                         # see deny.toml
#
#  `--features libz-compat` is package-scoped on purpose, and the exact cargo
#  behaviour is worth knowing rather than guessing at.  With more than one package
#  selected -- which is what `default-members` and `--workspace` both give --
#  cargo applies the flag to whichever selected packages declare the feature and
#  silently ignores it for the rest, so the unqualified form works but hides which
#  crate is actually being configured.  With a single package selected that does
#  not declare it, the same flag is a hard error: `cargo build -p zlib-rs
#  --features libz-compat` fails with "the package 'zlib-rs' does not contain this
#  feature: libz-compat".  Writing `-p libz-rs-sys` says what is meant and is
#  valid either way.
#
#  WHICH OF THOSE ARTIFACTS IS INSTALLABLE.  The second command produces two
#  libraries and they are not equivalent.  `target/release/libz.a` IS the
#  installable static library: it defines all 95 functions `zlib.h` declares,
#  because `crates/libz-rs-sys/build.rs` compiles that crate's two C translation
#  units -- `csrc/gzprintf_shim.c` for the variadic `gzprintf`/`gzvprintf` and
#  `csrc/inftrees_shim.c` for `inflate_table`'s `codetype` prototype, none of which
#  stable Rust can declare -- and rustc merges their archive into it.
#
#  `target/release/libz.so` is NOT, and no cargo argument can make it so.  rustc
#  attaches its own anonymous version script to every cdylib link, and that single
#  mechanism accounts for the entire difference: `zlib.map` cannot be layered on
#  top (so none of the reference library's 16 symbol-version nodes), a symbol the C
#  units define gets no dynamic entry at all (so no `gzprintf`, no `gzvprintf`),
#  and the `_zlib_rs_*` helpers `zlib.map` hides through `_*` are visible.
#  Measured with `nm -D --defined-only --extern-only`: 96 dynamic globals against
#  the reference library's 111, and zero version nodes.
#
#  The installable SHARED library is relinked from that same complete `libz.a`
#  under `zlib.map`, with a symbol-parity gate against `zlib.h` and `zlib.map`
#  themselves -- and against the C library's own table when one has been built -- by:
#
#    make rust                                                # stage the drop-in
#    make rust-test                                           # link + run the C drivers
#    make rust-symbols                                        # diff against a built C libz
#
#  One table states all of this, in `crates/libz-rs-sys/src/lib.rs`; anything here
#  or elsewhere that disagrees with it is the thing that is wrong.
#
#  `./configure` is NOT a prerequisite for those three.  `Makefile.in` composes the
#  shared-object link from its own RUSTLDSHARED and RUSTSHAREDFLAG defaults and
#  names the staged library from the ZLIB_VERSION in zlib.h, so the SONAME, the
#  versioned chain and the 16 version nodes are all correct on an unconfigured tree;
#  the checked-in placeholder `Makefile` therefore FORWARDS these targets instead of
#  refusing them.  What `./configure` adds is the C oracle build, which
#  `make rust-symbols` compares against.

#
# Companion configuration, all of which lives beside this file and is expected to
# stay consistent with it: rust-toolchain.toml (channel), clippy.toml (`msrv` —
# must equal `rust-version` below), .rustfmt.toml (`edition` — must equal `edition`
# below), deny.toml (licence allow-list — must contain the `license` below) and
# cbindgen.toml (generates the header that is diffed against zlib.h).

[workspace]

# A virtual manifest defaults to `resolver = "1"`, and cargo warns about that as
# soon as any member is on edition 2021:
#
#   warning: virtual workspace defaulting to `resolver = "1"` despite one or more
#            workspace members being on edition 2021 ...
#
# That single warning is enough to fail the zero-warnings quality gate, so the key
# is stated explicitly rather than left to the default.
resolver = "2"

# Exactly the three crates of the Rust implementation.  Deliberately NOT listed
# here:
#   * `fuzz`     — excluded below; it is a cargo-fuzz crate with its own
#                  dependencies and its own profile requirements.
#   * `benches`  — a bare directory of bench sources, not a package.  A virtual
#                  manifest cannot own bench targets, so benches/*.rs belongs to
#                  crates/zlib-rs-differential, which takes `criterion` as a
#                  dev-dependency and is the correct host because every benchmark
#                  measures the Rust implementation against the C oracle that
#                  crate builds.  The directory is absent, and so are the matching
#                  [[bench]] entries: an entry naming a missing file breaks every
#                  cargo invocation that enumerates targets, so the entries belong
#                  in the same change as the files.  Do not add a fourth member
#                  for it, and do not move the directory once it exists.
members = [
    "crates/zlib-rs",
    "crates/libz-rs-sys",
    "crates/zlib-rs-differential",
]

# The two crates that actually ship, and therefore what a bare `cargo build`,
# `cargo test`, `cargo clippy` or `cargo fmt` operates on when no `-p` is given.
#
# Without this key cargo defaults to every member, which drags in
# crates/zlib-rs-differential — and that crate's build script compiles the 15
# in-tree C translation units with `cc`.  A plain `cargo build --release` would
# then require a C compiler, which directly contradicts the design rule that the
# differential harness is dev-only and never a dependency of a shipped artifact.
# Selecting it must stay an explicit act: `cargo test -p zlib-rs-differential`,
# or `--workspace` when the C oracle is genuinely wanted.
default-members = [
    "crates/zlib-rs",
    "crates/libz-rs-sys",
]

# `fuzz/` is a cargo-fuzz crate.  Excluding it keeps `libfuzzer-sys` and
# `arbitrary` out of the shipped lock graph (they are fuzzing tooling, not
# library dependencies) and stops `cargo build --workspace` from trying to build
# fuzz targets, which only link against the libFuzzer runtime that
# `cargo fuzz run` supplies.  Verified: neither crate appears in this
# workspace's Cargo.lock, and `cargo build --workspace` compiles only the three
# members above.
#
# One thing `exclude` does NOT do, and it matters when writing fuzz/Cargo.toml:
# it keeps the package out of THIS workspace but does not stop cargo from
# walking further up the directory tree looking for another one.  fuzz/Cargo.toml
# must therefore carry its own (empty) `[workspace]` table so that it is a
# workspace root in its own right; otherwise `cd fuzz && cargo ...` can be
# adopted by whatever manifest happens to sit above the repository.  With that
# table in place the fuzz crate resolves independently and keeps its own lock
# file (verified: libfuzzer-sys 0.4.13 and arbitrary 1.4.2 resolve there and
# nowhere else).
#
# Being a separate graph means it needs its own reproducibility and audit
# machinery rather than inheriting this workspace's.  Both are committed:
#
#   fuzz/Cargo.lock   19 entries, exact-pinned direct versions.  A lockfile in
#                     one workspace says nothing about another, so the shipped
#                     Cargo.lock next to this file does NOT pin the fuzz graph.
#   fuzz/deny.toml    the fuzz graph's cargo-deny policy.  It has to be a
#                     separate file: the graph requires an `NCSA` allowance for
#                     libfuzzer-sys's vendored libFuzzer, and granting that in
#                     the root deny.toml would permit NCSA code into the shipped
#                     graph, which is the opposite of what that file is for.
#
# Both are read with `--locked`, which is what makes them binding:
#
#     cargo fuzz build --                                   # honours the lock
#     cargo deny --locked --manifest-path fuzz/Cargo.toml \
#                --config fuzz/deny.toml check
exclude = ["fuzz"]

# Shared package metadata.  Member crates opt in per field with
# `<field>.workspace = true`.

[workspace.package]

# THIS IS THE CARGO PACKAGE VERSION.  IT IS NOT THE zlib VERSION.
#
# `ZLIB_VERSION` is "1.3.2.1-motley" and `ZLIB_VERNUM` is 0x1321 (zlib.h L44-L45).
# Cargo cannot express that: a four-component version is not valid semver and cargo
# rejects it outright —
#
#   error: unexpected character '.' after patch version number
#
# — so the closest valid semver, 1.3.2, is used here and the true C identity is
# recorded verbatim in [workspace.metadata.zlib] below.
#
# CONSEQUENCE, AND IT IS A HARD RULE:
#
#   `zlibVersion()`, the `ZLIB_VERSION` string the init entry points compare
#   against, and the shared-object file name MUST NEVER be derived from
#   `CARGO_PKG_VERSION` or from any other Cargo-provided version.  The single
#   source of truth for all three is zlib.h.  Read it there.
#
#   BE PRECISE ABOUT WHAT THE INIT FUNCTIONS ACTUALLY COMPARE, because it is not
#   the whole string and the difference decides what a wrong value breaks.
#   `deflateInit2_` (deflate.c L394-L395), `inflateInit2_` (inflate.c
#   L178-L179) and `inflateBackInit_` (infback.c L30-L31) each apply the same
#   three-part test and return `Z_VERSION_ERROR` unless all three hold:
#
#     1. `version != Z_NULL`;
#     2. `version[0] == ZLIB_VERSION[0]` — the FIRST CHARACTER ONLY, i.e. the
#        major version digit.  Nothing compares the remaining characters;
#     3. `stream_size == sizeof(z_stream)`, the caller's own `sizeof` as it was
#        compiled, which is what catches a struct-layout mismatch.
#
#   So substituting Cargo's "1.3.2" for "1.3.2.1-motley" would NOT by itself
#   trip predicate 2 — both start with '1'.  It would instead make
#   `zlibVersion()` return a string that disagrees with the header, which
#   test/example.c reports before it does anything else (zlib.h L224-L229
#   documents that comparison as the caller's own check), and would break every
#   consumer that compares the two itself.  Predicate 2 is the one that fires on
#   a real major-version mismatch; predicate 3 is why `sizeof(z_stream)` is
#   pinned by compile-time assertions in the facade.
#
#   The soname chain (libz.so.1.3.2.1-motley <- libz.so.1 <- libz.so) likewise
#   comes from `configure`, which scrapes `ZLIB_VERSION` out of zlib.h; it does
#   not come from Cargo either.
version = "1.3.2"

# From LICENSE: "(C) 1995-2026 Jean-loup Gailly and Mark Adler".
authors = [
    "Jean-loup Gailly <jloup@gzip.org>",
    "Mark Adler <madler@alumni.caltech.edu>",
]

# Edition 2021 is not a preference, it is the only valid choice at this MSRV:
# edition 2024 requires rustc >= 1.85 and cargo rejects the combination —
#   error: rust-version 1.80 is incompatible with the version (1.85.0)
#          required by the specified edition (2024)
edition = "2021"

# Keep in lockstep with `msrv` in clippy.toml, or clippy's version-aware lints stop
# agreeing with the declared floor.
rust-version = "1.80"

# SPDX identifier for the zlib/libpng licence carried in LICENSE.  The same
# identifier is used independently by BUILD.bazel
# (@rules_license//licenses/spdx:Zlib) and by zlib.pc.in ("License: Zlib"), and it
# must remain in the allow-list in deny.toml.
license = "Zlib"

description = "Memory-safe Rust reimplementation of the zlib compression library, ABI-compatible with libz"
homepage = "https://zlib.net/"
keywords = ["zlib", "deflate", "gzip", "compression", "ffi"]
categories = ["compression", "no-std", "external-ffi-bindings", "api-bindings"]

# These crates are components of the zlib source distribution; they are not
# published to crates.io.  Inherited by members with `publish.workspace = true`.
publish = false

# C identity of the library being reimplemented.
#
# Cargo ignores [workspace.metadata]; it exists so that the facts Cargo's own
# fields cannot express are recorded in one machine-readable place instead of being
# re-derived (or, worse, guessed) by each build and CI step.  Every value below is
# transcribed from the in-tree C sources.  None of it may be inferred from this
# manifest's `version` field, and none of it is a substitute for reading the header:
# code that needs the version string reads zlib.h.

[workspace.metadata.zlib]
# zlib.h L44-L49 — the verbatim public version identity.
c_version = "1.3.2.1-motley"
c_vernum = "0x1321"
c_ver_major = 1
c_ver_minor = 3
c_ver_revision = 2
c_ver_subrevision = 1
c_version_source = "zlib.h"

# CMakeLists.txt L6 records the same release as a four-component CMake version,
# which is likewise not valid semver.
cmake_project_version = "1.3.2.1"

# Commit of the C implementation used as the algorithmic oracle.
c_baseline_commit = "09a1572"

# Artifact names the Rust build must reproduce so that existing consumers keep
# linking and loading without being recompiled.  `configure` derives the
# versioned name by scraping ZLIB_VERSION from zlib.h; Makefile.in L46-L49 holds
# the pre-substitution defaults, and SHAREDLIBV's default there is stale, which
# is why `Makefile.in`'s `rust` target scrapes zlib.h itself rather than
# trusting it.  The symlink chain is mandatory WHERE THE LIBRARY IS INSTALLED: the
# SONAME is libz.so.1, so a directory that holds only libz.so makes the dynamic
# loader fall back to the system libz.so.1 — drop-in tests then pass while
# silently exercising the C library.  `Makefile.in`'s `rust' target stages it, and
# it is the only step that may: it runs AFTER the link, whereas a build script runs
# before it and can only create links to a file that does not exist yet.  Hence
# `make rust-test` asserting the binding with `ldd` rather than inferring it, and
# hence the names below being the PACKAGED artifact's names, not cargo's.
shared_library = "libz.so.1.3.2.1-motley"
soname = "libz.so.1"
shared_library_symlinks = ["libz.so.1", "libz.so"]
static_library = "libz.a"

# The immutable contract.  zlib.map is consumed by the linker as
# --version-script; it is never edited.
public_headers = ["zlib.h", "zconf.h"]
version_script = "zlib.map"

# ABI parity baseline.  These three numbers are measured from the REFERENCE C
# shared library with `nm -D --defined-only --extern-only`: 95 function symbols
# (type T) plus the 16 symbol-version nodes (type A) declared in zlib.map.  They
# are the target the Rust library has to match, recorded here so the parity diff
# has a fixed baseline to compare against.  They describe the C library, not the
# Rust one: only `make rust-symbols` measures the Rust side, and nothing runs it
# automatically.
exported_symbols = 111
exported_functions = 95
symbol_version_nodes = 16

# Shared dependency versions, declared here so member crates cannot drift; each
# member opts in with `<name> = { workspace = true }`.  Every requirement is an
# exact, registry-resolved version — no wildcards, no "latest", and no git or
# alternate-registry sources (deny.toml rejects both).
#
#  Note that NOTHING here is a runtime dependency of the shipped library:
#  crates/zlib-rs keeps an empty [dependencies] table and crates/libz-rs-sys
#  depends only on zlib-rs.  Both facts are readable straight out of those two
#  manifests; `cargo tree -p zlib-rs` is the command that will show it once the
#  workspace loads, which it does not yet (see the entry-point note at the top of
#  this file).
#
# Deliberately absent:
#   * `libfuzzer-sys`, `arbitrary` — they belong to the excluded fuzz/ crate.
#   * `cbindgen`, `cargo-fuzz`, `cargo-deny` — command-line tools, installed with
#     `cargo install --locked`, never manifest dependencies.
#   * `criterion`, `libc` — declared by the AAP but not yet used by any target.
#     The long note in the table below records why each is withheld and exactly
#     what brings it back; criterion's absence is also what keeps the declared
#     1.80 MSRV resolvable, so read it before adding either.

[workspace.dependencies]
# The safe core, consumed by the facade and by the differential harness.  Cargo
# resolves it through `path`; the `version` key is carried alongside because
# deny.toml sets `bans.wildcards = "deny"`, and cargo-deny classifies a path
# dependency with no version requirement as a wildcard.  Keep it equal to
# `workspace.package.version` above — cargo checks the two agree, so a drift is
# caught at resolve time rather than silently.  Any member crate adding another
# internal path dependency should pair it with a `version` key for the same reason.
zlib-rs = { path = "crates/zlib-rs", version = "1.3.2" }

# Build-dependency of crates/zlib-rs-differential ONLY.  Compiles the in-tree C
# translation units into the test-only oracle archive.  It must never appear in the
# [dependencies] or [build-dependencies] of a shipped crate.
cc = "1.4.0"

# DELIBERATELY ABSENT: criterion, and libc.
#
# criterion 0.8.2 (AAP §0.5.1.3) is the pinned harness for the three benchmark
# suites AAP §0.3.1 places at `benches/`.  That directory does not exist, no
# `[[bench]]` target is declared anywhere in the workspace, and no source file
# names the crate -- so the edge would gate nothing while imposing a real cost,
# and it is not declared until the suites land.  The cost is not hypothetical, it
# is the reason this entry is a comment:
#
#   criterion 0.8.2 declares `rust-version = "1.86"` and reaches clap 4.6.5,
#   whose clap_builder/clap_lex declare `edition = "2024"`.  Cargo 1.80 cannot
#   parse an edition-2024 manifest, so ANY command that resolves the whole
#   workspace dev graph -- `cargo +1.80 metadata`, `cargo +1.80 check --tests`,
#   `--all-targets` -- fails outright:
#     error: failed to download `clap_builder v4.6.5` … the package requires the
#            Cargo feature called `edition2024`, but that feature is not
#            stabilized in this version of Cargo (1.80.1)
#   With the edge present the workspace advertised `rust-version = "1.80"` while
#   being unresolvable by that very toolchain.  It also duplicated `syn` (2.x for
#   the older proc-macro graph, 3.x for the newer one) in the committed lock.
#
# WHERE THE SUITES MUST LAND, so the 1.80 promise stays true.  criterion's floor
# is a property of criterion, not something this workspace can wish away, so the
# benchmark package must NOT inherit `[workspace.package] rust-version`.  Either
# of these is correct; the second matches what `fuzz/` already does:
#
#   1. a workspace member that sets its own `rust-version = "1.86"` (and does not
#      write `rust-version.workspace = true`), carrying `criterion = "0.8.2"` in
#      its `[dev-dependencies]` and the `[[bench]]` entries; or
#   2. a package listed in `exclude` above, with its own Cargo.lock and its own
#      deny.toml, exactly as `fuzz/` is isolated today.
#
# Either way the MSRV gate keeps naming the shipped packages explicitly --
#   cargo +1.80 check --locked -p zlib-rs -p libz-rs-sys --all-features --all-targets
#   cargo +1.80 rustc --locked -p libz-rs-sys --all-features -- -D warnings
# -- because 1.80 is a promise that the two crates that SHIP compile on that
# compiler, and criterion reaches neither of them.  Clippy is not part of that gate:
# clippy 1.80 denies 28 things clippy 1.97 does not, all lint drift rather than code
# defects.  `crates/zlib-rs-differential/Cargo.toml` records the measured list.
#
# libc 0.2.189 (AAP §0.5.1.3) was an OPTIONAL dependency of crates/libz-rs-sys,
# for the case where "a platform type or a raw syscall in the gz layer cannot be
# expressed with std::fs / std::io".  No such case arose: the gz layer is written
# entirely against `std::fs`/`std::io` and every C type in the ABI surface comes
# from `core::ffi`.  The note in `crates/libz-rs-sys/Cargo.toml` `[features]`
# records the exact two lines that bring it back, pinned to the `0.2` line,
# should a target ever need it.

# Lints.  Member crates opt in with:
#
#     [lints]
#     workspace = true
#
# Workspace lint tables require cargo 1.74 or newer, which the 1.80 MSRV
# guarantees.  Everything is set to `deny` rather than `forbid` on purpose: `deny`
# can still be relaxed by a narrowly scoped `#[allow(...)]` — for example
# `#![allow(clippy::unwrap_used, clippy::indexing_slicing)]` inside a `#[cfg(test)]`
# module, or an `#[allow(clippy::cast_possible_truncation)]` carrying a comment that
# explains why a narrowing cast is correct — whereas `forbid` cannot be overridden
# anywhere.
#
# TWO LINTS ARE DELIBERATELY ABSENT FROM THIS TABLE.  Do not add them:
#
#   * `unsafe_code`.  Unsafe policy is per-crate, and it has to be, because the two
#     crates need opposite settings: crates/zlib-rs carries
#     #![forbid(unsafe_code)] in its own source, while crates/libz-rs-sys
#     legitimately requires `unsafe` at the FFI boundary — validating raw
#     `z_streamp` pointers, rebuilding the (next_in, avail_in) and
#     (next_out, avail_out) slices, round-tripping the opaque `state` pointer,
#     calling the caller-supplied zalloc/zfree, handling C strings and varargs, and
#     writing through a caller's gz_header.  That crate instead carries
#     #![deny(unsafe_op_in_unsafe_fn)] so every unsafe operation is individually
#     scoped and individually justified by a `// SAFETY:` comment.  A
#     workspace-level forbid would break the facade outright.
#
#   * `missing_docs`.  It belongs on the idiomatic surface, so crates/zlib-rs
#     carries #![deny(missing_docs)] in its own source.  Applied workspace-wide it
#     would also fire across the facade's `#[no_mangle]` shims, whose documentation
#     is zlib.h.

[workspace.lints.rust]
# Every member of `future_incompatible` is already warn-or-higher by default
# (checked against `rustc -W help`: the group promotes nothing), so declaring it
# only makes the policy explicit and inheritable.  The negative priority lets a
# member relax a single lint out of the group without switching the group off.
future_incompatible = { level = "warn", priority = -1 }

# The `unused` GROUP is deliberately NOT declared here, and this is not an
# oversight.  Twenty-one of its twenty-three members (unused_imports,
# unused_variables, unused_mut, dead_code, unreachable_code, unused_must_use,
# path_statements, ...) are already warn-by-default and are therefore already errors
# under `-D warnings`; declaring the group would add nothing except promoting its
# only two allow-by-default members, `unused_extern_crates` and
# `unused_macro_rules`.  Promoting `unused_extern_crates` is actively wrong for this
# workspace: crates/zlib-rs is #![no_std] and reaches the allocator through
# `extern crate alloc;`, which is the required spelling in edition 2021, and the
# lint fires on exactly that declaration in any configuration whose feature set
# happens not to touch an `alloc` item.  It is allow-by-default upstream for that
# reason and is left alone.  The useful half of that promotion is taken explicitly
# instead, below.
unused_macro_rules = "warn"

# Allow-by-default hygiene lints, each promoted on purpose.
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

# `unreachable_pub` was considered and rejected: it fires on the facade's
# `#[no_mangle] pub extern "C" fn` exports, which live in private modules and are
# reachable only through the dynamic symbol table, not through the crate root.  The
# version script in zlib.map is what governs visibility there.

[workspace.lints.clippy]
# The two groups the quality bar names explicitly.  `priority = -1` makes them rank
# below the individual entries below, which is what lets a specific lint be
# tightened (or, in a member crate, relaxed) without fighting the group.
#
# `clippy::pedantic` already denies the cast family (cast_possible_truncation,
# cast_sign_loss, cast_precision_loss, ...).  That is intentional and is left as-is:
# this implementation reproduces C integer arithmetic, so each narrowing cast is a
# deliberate decision and deserves a local `#[allow(...)]` with a comment stating
# why it is in range.  Blanket-allowing the cast family here would erase exactly the
# review signal that matters most.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# The panic family.  A compression library is linked into processes that must not
# die on malformed input, and every exported entry point is `extern "C"` (never
# `extern "C-unwind"`), so a panic that escaped would abort the caller's process
# rather than unwind.  Library code therefore returns `ReturnCode` instead of
# panicking, and these lints keep it that way.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"

# Every `unsafe` block must state the invariant that discharges it, in a `// SAFETY:`
# comment the compiler can see.  AAP 0.7.1(a) requires that "every block bears a
# `// SAFETY:` comment naming its invariant", and this is the mechanical half of that
# rule: crates/zlib-rs carries #![forbid(unsafe_code)] so nothing can fire there, and
# crates/libz-rs-sys is the one crate where blocks legitimately exist -- roughly three
# hundred of them across the FFI boundary and its tests.  Reviewing that many by eye is
# not a control; this is.
#
# It applies to TEST code as well as library code, deliberately: a test that drives raw
# pointers across the C ABI is exactly where an unstated assumption hides, and this
# crate's own tests construct hostile inputs on purpose.  Where the same call is
# repeated many times the invariant is stated once on a helper -- a named call gate --
# that owns the single unsafe block, rather than copied onto every call site.
#
# It is a `restriction`-group lint, so neither `clippy::all` nor `clippy::pedantic`
# enables it and it has to be named here.  Declared at the WORKSPACE level rather than
# as a crate attribute for two reasons: the facade's own crate root documents that lint
# levels live in this file and must not be restated per crate, and a crate attribute
# would not reach the integration-test crates under crates/*/tests, which are separate
# compilation units with their own roots.
#
# Placement matters when writing a block, and the rule is worth knowing before the
# build tells you: clippy accepts the comment directly above the block, or above the
# *statement* the block is the whole initialiser of.  A comment above an enclosing `if`,
# `for` or `match`, or above an `assert_eq!` whose argument happens to contain the
# block, does NOT count -- bind the expression to a `let` and comment that instead.
# Every site in this workspace has been written that way; do not answer a new report by
# adding an `#[allow]`.
undocumented_unsafe_blocks = "deny"

# `clippy::arithmetic_side_effects` is deliberately NOT enabled.  Every hash update,
# window slide, bit-buffer accumulation and code-length computation in the reference
# implementation is plain integer arithmetic; denying it would require wrapping
# essentially every function in checked-arithmetic helpers and would obscure rather
# than clarify the correspondence with the C source that the byte-identical-output
# requirement depends on.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# `panic = "abort"` is belt-and-braces for the shipped cdylib: unwinding must never
# cross the FFI boundary into a C caller.
#
# Be aware of the nuance — cargo IGNORES `panic` for test and bench targets, so
# `cargo test --workspace --release` still links an unwinding harness: rustc
# receives -C opt-level=3 -C lto=fat -C codegen-units=1 for bench targets but no
# -C panic.  The guarantee therefore rests on every exported function being declared
# `extern "C"` and on the facade's panic guard, not on this key.  Do not "fix" the
# nuance by deleting this line, and do not try to add `panic` to [profile.test] or
# [profile.bench] — cargo will not honour it there.
panic = "abort"

# Benchmarks must be measured against the same code generation as the shipped
# library, otherwise the "within 10% of C zlib" throughput gates measure the wrong
# binary.  Cargo's built-in `bench` profile already inherits `release`, so
# `inherits` is stated explicitly only to pin that relationship in the manifest and
# to give bench-specific settings an obvious home.  `panic` is deliberately absent,
# per the note above.
[profile.bench]
inherits = "release"

# Note on codegen flags: `-Cllvm-args=-enable-dfa-jump-thread` measurably helps
# small-chunk throughput and is output-neutral, but it is an LLVM-internal flag, so
# it stays an opt-in RUSTFLAGS lever for performance runs rather than a committed
# default that would break a non-LLVM toolchain.
